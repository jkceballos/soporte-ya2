als.format(t.fechaLimite, 'd MMM, h:mm a')}\">Límite\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/a>\n    \u003c/div>\n\n    \u003cnav class=\"mt-4\" th:if=\"${pagina.totalPages > 1}\" aria-label=\"Páginas\">\n      \u003cul class=\"pagination justify-content-center\">\n        \u003cli class=\"page-item\" th:classappend=\"${pagina.first} ? 'disabled'\">\n          \u003ca class=\"page-link\" th:href=\"@{/tickets(pagina=${pagina.number - 1})}\">Anterior\u003c/a>\n        \u003c/li>\n        \u003cli class=\"page-item\" th:each=\"i : ${#numbers.sequence(0, pagina.totalPages - 1)}\"\n            th:classappend=\"${i == pagina.number} ? 'active'\">\n          \u003ca class=\"page-link\" th:href=\"@{/tickets(pagina=${i})}\" th:text=\"${i + 1}\">1\u003c/a>\n        \u003c/li>\n        \u003cli class=\"page-item\" th:classappend=\"${pagina.last} ? 'disabled'\">\n          \u003ca class=\"page-link\" th:href=\"@{/tickets(pagina=${pagina.number + 1})}\">Siguiente\u003c/a>\n        \u003c/li>\n      \u003c/ul>\n    \u003c/nav>\n  \u003c/main>\n\n  \u003cth:block th:replace=\"~{fragmentos :: pie}\">\u003c/th:block>\n\u003c/body>\n\u003c/html>"},{"ruta":"src/main/resources/templates/tickets/nuevo.html","modo":"nuevo","nota":"","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead th:replace=\"~{fragmentos :: head('Nuevo ticket')}\">\u003c/head>\n\u003cbody>\n  \u003cnav th:replace=\"~{fragmentos :: menu('tickets')}\">\u003c/nav>\n\n  \u003cmain class=\"container hoja my-4\">\n    \u003ch1 class=\"h3 mb-4\">Reportar una falla\u003c/h1>\n\n    \u003cform th:action=\"@{/tickets}\" th:object=\"${ticket}\" method=\"post\" novalidate class=\"card card-body shadow-sm\">\n      \u003cdiv class=\"alert alert-danger\" th:if=\"${#fields.hasGlobalErrors()}\">\n        \u003cp class=\"mb-0\" th:each=\"e : ${#fields.globalErrors()}\" th:text=\"${e}\">Error\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"mb-3\">\n        \u003clabel for=\"asunto\" class=\"form-label\">Asunto\u003c/label>\n        \u003cinput type=\"text\" th:field=\"*{asunto}\" class=\"form-control\" th:errorclass=\"is-invalid\"\n               placeholder=\"Ej.: El computador no enciende\">\n        \u003cdiv class=\"invalid-feedback\" th:errors=\"*{asunto}\">Error\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"row\">\n        \u003cdiv class=\"col-md-7 mb-3\">\n          \u003clabel for=\"categoriaId\" class=\"form-label\">Categoría\u003c/label>\n          \u003cselect th:field=\"*{categoriaId}\" class=\"form-select\" th:errorclass=\"is-invalid\">\n            \u003coption value=\"\">Elija la categoría…\u003c/option>\n            \u003coption th:each=\"c : ${categorias}\" th:value=\"${c.id}\" th:text=\"${c.texto}\">Hardware\u003c/option>\n          \u003c/select>\n          \u003cdiv class=\"invalid-feedback\" th:errors=\"*{categoriaId}\">Error\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"col-md-5 mb-3\">\n          \u003clabel for=\"prioridad\" class=\"form-label\">Prioridad\u003c/label>\n          \u003cselect th:field=\"*{prioridad}\" class=\"form-select\" th:errorclass=\"is-invalid\">\n            \u003coption th:each=\"p : ${prioridades}\" th:value=\"${p}\"\n                    th:text=\"|${p.etiqueta} · hasta ${p.horasLimite} h|\">Media · hasta 24 h\u003c/option>\n          \u003c/select>\n          \u003cdiv class=\"invalid-feedback\" th:errors=\"*{prioridad}\">Error\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"mb-3\">\n        \u003clabel for=\"descripcion\" class=\"form-label\">Descripción\u003c/label>\n        \u003ctextarea th:field=\"*{descripcion}\" rows=\"5\" class=\"form-control\" th:errorclass=\"is-invalid\"\n                  placeholder=\"¿Qué pasa? ¿Desde cuándo? ¿Qué mensaje aparece?\">\u003c/textarea>\n        \u003cdiv class=\"invalid-feedback\" th:errors=\"*{descripcion}\">Error\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"d-flex gap-2\">\n        \u003cbutton type=\"submit\" class=\"btn btn-primary\">Crear ticket\u003c/button>\n        \u003ca class=\"btn btn-outline-secondary\" th:href=\"@{/tickets}\">Cancelar\u003c/a>\n      \u003c/div>\n    \u003c/form>\n  \u003c/main>\n\n  \u003cth:block th:replace=\"~{fragmentos :: pie}\">\u003c/th:block>\n\u003c/body>\n\u003c/html>"},{"ruta":"src/main/resources/templates/tickets/detalle.html","modo":"nuevo","nota":"`th:with` calcula si «yo» soy el solicitante, el técnico o personal de TI, y muestra solo las acciones que me corresponden.","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead th:replace=\"~{fragmentos :: head(${t.codigo})}\">\u003c/head>\n\u003cbody>\n  \u003cnav th:replace=\"~{fragmentos :: menu('tickets')}\">\u003c/nav>\n\n  \u003c!-- Variables de ayuda: ¿quién soy frente a este ticket? -->\n  \u003cmain class=\"container hoja my-4\"\n        th:with=\"soySolicitante=${yo.email == t.solicitanteEmail},\n                 soyTecnico=${yo.email == t.tecnicoEmail},\n                 soyPersonal=${yo.rol.name() != 'SOLICITANTE'}\">\n    \u003cdiv th:replace=\"~{fragmentos :: mensajes}\">\u003c/div>\n\n    \u003cdiv class=\"d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2\">\n      \u003cdiv>\n        \u003cspan class=\"text-muted\" th:text=\"${t.codigo}\">SY-00001\u003c/span>\n        \u003ch1 class=\"h3\" th:text=\"${t.asunto}\">El computador no enciende\u003c/h1>\n      \u003c/div>\n      \u003cdiv>\n        \u003cspan th:replace=\"~{fragmentos :: estado(${t.estado})}\">\u003c/span>\n        \u003cspan th:replace=\"~{fragmentos :: prioridad(${t.prioridad})}\">\u003c/span>\n        \u003cspan th:if=\"${t.vencido}\" class=\"badge text-bg-danger\">Vencido\u003c/span>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card card-body mb-3\">\n      \u003cp class=\"mb-3\" style=\"white-space: pre-line\" th:text=\"${t.descripcion}\">Descripción\u003c/p>\n      \u003cdl class=\"row small mb-0\">\n        \u003cdt class=\"col-sm-4\">Solicitante\u003c/dt>\u003cdd class=\"col-sm-8\" th:text=\"|${t.solicitante} · ${t.area}|\">Ana\u003c/dd>\n        \u003cdt class=\"col-sm-4\">Categoría\u003c/dt>\u003cdd class=\"col-sm-8\" th:text=\"${t.categoria}\">Hardware\u003c/dd>\n        \u003cdt class=\"col-sm-4\">Técnico\u003c/dt>\u003cdd class=\"col-sm-8\" th:text=\"${t.tecnico} ?: 'Sin asignar'\">Carlos\u003c/dd>\n        \u003cdt class=\"col-sm-4\">Creado\u003c/dt>\u003cdd class=\"col-sm-8\" th:text=\"${#temporals.format(t.fechaCreacion, 'd MMM yyyy, h:mm a')}\">fecha\u003c/dd>\n        \u003cdt class=\"col-sm-4\">Fecha límite\u003c/dt>\u003cdd class=\"col-sm-8\" th:text=\"${#temporals.format(t.fechaLimite, 'd MMM yyyy, h:mm a')}\">fecha\u003c/dd>\n      \u003c/dl>\n    \u003c/div>\n\n    \u003c!-- Acciones del solicitante -->\n    \u003cdiv class=\"d-flex flex-wrap gap-2 mb-3\" th:if=\"${soySolicitante}\">\n      \u003cform th:if=\"${t.estado.name() == 'RESUELTO'}\" th:action=\"@{/tickets/{id}/cerrar(id=${t.id})}\" method=\"post\">\n        \u003cbutton type=\"submit\" class=\"btn btn-success\">Confirmar que quedó resuelto\u003c/button>\n      \u003c/form>\n      \u003cform th:if=\"${t.estado.name() == 'ABIERTO'}\" th:action=\"@{/tickets/{id}/cancelar(id=${t.id})}\" method=\"post\">\n        \u003cbutton type=\"submit\" class=\"btn btn-outline-secondary\">Cancelar el ticket\u003c/button>\n      \u003c/form>\n    \u003c/div>\n\n    \u003c!-- Reabrir: el solicitante dice que no quedó bien -->\n    \u003cform th:if=\"${soySolicitante and t.estado.name() == 'RESUELTO'}\" th:action=\"@{/tickets/{id}/reabrir(id=${t.id})}\"\n          th:object=\"${reapertura}\" method=\"post\" novalidate class=\"card card-body mb-3\">\n      \u003clabel for=\"reaperturaTexto\" class=\"form-label fw-semibold\">¿No quedó bien? Cuéntenos qué pasa\u003c/label>\n      \u003ctextarea id=\"reaperturaTexto\" th:field=\"*{texto}\" rows=\"2\" class=\"form-control\" th:errorclass=\"is-invalid\">\u003c/textarea>\n      \u003cdiv class=\"invalid-feedback\" th:errors=\"*{texto}\">Error\u003c/div>\n      \u003cbutton type=\"submit\" class=\"btn btn-outline-danger mt-2 align-self-start\">Reabrir\u003c/button>\n    \u003c/form>\n\n    \u003c!-- Resolver: solo el técnico asignado -->\n    \u003cform th:if=\"${soyTecnico and t.estado.name() == 'EN_CURSO'}\" th:action=\"@{/tickets/{id}/resolver(id=${t.id})}\"\n          th:object=\"${resolucion}\" method=\"post\" novalidate class=\"card card-body mb-3 border-success\">\n      \u003clabel for=\"resolucionTexto\" class=\"form-label fw-semibold\">Solución aplicada\u003c/label>\n      \u003ctextarea id=\"resolucionTexto\" th:field=\"*{texto}\" rows=\"3\" class=\"form-control\" th:errorclass=\"is-invalid\">\u003c/textarea>\n      \u003cdiv class=\"invalid-feedback\" th:errors=\"*{texto}\">Error\u003c/div>\n      \u003cbutton type=\"submit\" class=\"btn btn-success mt-2 align-self-start\">Marcar como resuelto\u003c/button>\n    \u003c/form>\n\n    \u003ch2 class=\"h5 mt-4\">Seguimiento\u003c/h2>\n    \u003cdiv class=\"vstack gap-2 mb-3\">\n      \u003cdiv class=\"card card-body comentario py-2\" th:each=\"c : ${t.comentarios}\"\n           th:classappend=\"${c.sistema} ? 'sistema' : (${c.interno} ? 'interno' : '')\">\n        \u003cdiv class=\"small text-muted\">\n          \u003cb th:text=\"${c.autor}\">Carlos Ruiz\u003c/b> · \u003cspan th:text=\"${c.rol}\">Técnico\u003c/span> ·\n          \u003cspan th:text=\"${#temporals.format(c.fecha, 'd MMM, h:mm a')}\">fecha\u003c/span>\n          \u003cspan th:if=\"${c.interno}\" class=\"badge text-bg-warning\">Nota interna\u003c/span>\n        \u003c/div>\n        \u003cdiv style=\"white-space: pre-line\" th:text=\"${c.texto}\">Comentario\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- Comentar -->\n    \u003cform th:unless=\"${t.estado.esFinal()}\" th:action=\"@{/tickets/{id}/comentarios(id=${t.id})}\"\n          th:object=\"${comentario}\" method=\"post\" novalidate class=\"card card-body\">\n      \u003clabel for=\"comentarioTexto\" class=\"form-label fw-semibold\">Agregar un comentario\u003c/label>\n      \u003ctextarea id=\"comentarioTexto\" th:field=\"*{texto}\" rows=\"3\" class=\"form-control\" th:errorclass=\"is-invalid\">\u003c/textarea>\n      \u003cdiv class=\"invalid-feedback\" th:errors=\"*{texto}\">Error\u003c/div>\n      \u003cdiv class=\"form-check mt-2\" th:if=\"${soyPersonal}\">\n        \u003cinput type=\"checkbox\" th:field=\"*{interno}\" class=\"form-check-input\">\n        \u003clabel class=\"form-check-label\" th:for=\"${#ids.prev('interno')}\">Nota interna (no la ve el solicitante)\u003c/label>\n      \u003c/div>\n      \u003cbutton type=\"submit\" class=\"btn btn-primary mt-2 align-self-start\">Comentar\u003c/button>\n    \u003c/form>\n  \u003c/main>\n\n  \u003cth:block th:replace=\"~{fragmentos :: pie}\">\u003c/th:block>\n\u003c/body>\n\u003c/html>"}],"listo":"Ana crea un ticket, lo ve en su lista y en su detalle con el historial."},{"t":"El tablero y la prueba de concurrencia","min":25,"archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/controller/TableroController.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.controller;\n\nimport org.springframework.orm.ObjectOptimisticLockingFailureException;\nimport org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.servlet.mvc.support.RedirectAttributes;\n\nimport jakarta.servlet.http.HttpSession;\n\nimport co.edu.sena.adso.soporteya.config.SesionDemo;\nimport co.edu.sena.adso.soporteya.dto.TicketResumenDTO;\nimport co.edu.sena.adso.soporteya.service.NegocioException;\nimport co.edu.sena.adso.soporteya.service.TicketService;\n\n// El tablero de la mesa de ayuda: los técnicos toman tickets desde aquí\n@Controller\npublic class TableroController {\n\n    private final TicketService tickets;\n    private final SesionDemo demo;\n\n    public TableroController(TicketService tickets, SesionDemo demo) {\n        this.tickets = tickets;\n        this.demo = demo;\n    }\n\n    @GetMapping(\"/tablero\")\n    public String tablero(Model model) {\n        model.addAttribute(\"tablero\", tickets.tablero());\n        return \"tablero\";\n    }\n\n    @PostMapping(\"/tablero/{id}/tomar\")\n    public String tomar(@PathVariable(\"id\") Long id, HttpSession sesion, RedirectAttributes flash) {\n        try {\n            TicketResumenDTO t = tickets.tomar(id, demo.email(sesion));\n            flash.addFlashAttribute(\"ok\", \"Usted tomó el ticket \" + t.codigo());\n        } catch (NegocioException e) {\n            flash.addFlashAttribute(\"error\", e.getMessage());\n        } catch (ObjectOptimisticLockingFailureException e) {\n            // @Version: otro técnico lo tomó en el mismo instante\n            flash.addFlashAttribute(\"error\", \"Otro técnico tomó ese ticket al mismo tiempo. Elija otro.\");\n        }\n        return \"redirect:/tablero\";\n    }\n}"},{"ruta":"src/main/resources/templates/tablero.html","modo":"nuevo","nota":"","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead th:replace=\"~{fragmentos :: head('Tablero')}\">\u003c/head>\n\u003cbody>\n  \u003cnav th:replace=\"~{fragmentos :: menu('tablero')}\">\u003c/nav>\n\n  \u003cmain class=\"container-fluid px-lg-5 my-4\">\n    \u003cdiv th:replace=\"~{fragmentos :: mensajes}\">\u003c/div>\n    \u003ch1 class=\"h3 mb-3\">Tablero de la mesa de ayuda\u003c/h1>\n\n    \u003cdiv class=\"row g-3\">\n      \u003c!-- La misma columna tres veces, con distintos datos: el fragmento «columna» de fragmentos.html -->\n      \u003cdiv class=\"col-lg-4\" th:replace=\"~{fragmentos :: columna('Abiertos', ${tablero.abiertos}, true)}\">\u003c/div>\n      \u003cdiv class=\"col-lg-4\" th:replace=\"~{fragmentos :: columna('En curso', ${tablero.enCurso}, false)}\">\u003c/div>\n      \u003cdiv class=\"col-lg-4\" th:replace=\"~{fragmentos :: columna('Resueltos sin confirmar', ${tablero.resueltos}, false)}\">\u003c/div>\n    \u003c/div>\n  \u003c/main>\n\n\n  \u003cth:block th:replace=\"~{fragmentos :: pie}\">\u003c/th:block>\n\u003c/body>\n\u003c/html>"}],"despues":[["nota","clave","**Pruebe `@Version` con dos navegadores.** En una ventana normal actúe como Carlos y en una ventana privada como Mateo (cada ventana tiene su propia sesión). Abra el tablero en las dos. Tome el ticket «El computador no enciende» en la ventana de Carlos y, sin recargar, presione «Tomar» en la de Mateo. Debe ver «ya no está abierto». Si logra presionar los dos al mismo tiempo, verá «Otro técnico tomó ese ticket al mismo tiempo»."]],"listo":"el tablero muestra tres columnas y un técnico puede tomar un ticket de su especialidad."},{"t":"Administración: categorías, usuarios e indicadores","min":45,"archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/controller/CategoriaAdminController.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.controller;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\nimport org.springframework.validation.BindingResult;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.ModelAttribute;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.servlet.mvc.support.RedirectAttributes;\n\nimport jakarta.validation.Valid;\n\nimport co.edu.sena.adso.soporteya.dto.CategoriaDTO;\nimport co.edu.sena.adso.soporteya.dto.CategoriaForm;\nimport co.edu.sena.adso.soporteya.service.CategoriaService;\nimport co.edu.sena.adso.soporteya.service.NegocioException;\n\n@Controller\n@RequestMapping(\"/admin/categorias\")\npublic class CategoriaAdminController {\n\n    private final CategoriaService categorias;\n\n    public CategoriaAdminController(CategoriaService categorias) {\n        this.categorias = categorias;\n    }\n\n    @GetMapping\n    public String listar(Model model) {\n        model.addAttribute(\"categorias\", categorias.todas());\n        return \"admin/categorias\";\n    }\n\n    @GetMapping(\"/nueva\")\n    public String nueva(Model model) {\n        model.addAttribute(\"categoria\", new CategoriaForm());\n        return \"admin/categoria-form\";\n    }\n\n    @GetMapping(\"/{id}/editar\")\n    public String editar(@PathVariable(\"id\") Long id, Model model) {\n        model.addAttribute(\"categoria\", categorias.formulario(id));\n        return \"admin/categoria-form\";\n    }\n\n    @PostMapping\n    public String guardar(@Valid @ModelAttribute(\"categoria\") CategoriaForm categoria, BindingResult resultado,\n                          RedirectAttributes flash) {\n        if (resultado.hasErrors()) {\n            return \"admin/categoria-form\";\n        }\n        try {\n            CategoriaDTO guardada = categorias.guardar(categoria);\n            flash.addFlashAttribute(\"ok\", \"Categoría «\" + guardada.nombre() + \"» guardada\");\n            return \"redirect:/admin/categorias\";\n        } catch (NegocioException e) {\n            Formularios.rechazar(resultado, e);\n            return \"admin/categoria-form\";\n        }\n    }\n\n    @PostMapping(\"/{id}/estado\")\n    public String cambiarEstado(@PathVariable(\"id\") Long id, RedirectAttributes flash) {\n        CategoriaDTO c = categorias.cambiarEstado(id);\n        flash.addFlashAttribute(\"ok\", \"«\" + c.nombre() + \"» quedó \" + (c.activa() ? \"activa\" : \"inactiva\"));\n        return \"redirect:/admin/categorias\";\n    }\n}"},{"ruta":"src/main/resources/templates/admin/categorias.html","modo":"nuevo","nota":"","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead th:replace=\"~{fragmentos :: head('Categorías')}\">\u003c/head>\n\u003cbody>\n  \u003cnav th:replace=\"~{fragmentos :: menu('categorias')}\">\u003c/nav>\n\n  \u003cmain class=\"container my-4\">\n    \u003cdiv th:replace=\"~{fragmentos :: mensajes}\">\u003c/div>\n    \u003cdiv class=\"d-flex justify-content-between align-items-center mb-3\">\n      \u003ch1 class=\"h3 mb-0\">Categorías\u003c/h1>\n      \u003ca class=\"btn btn-primary\" th:href=\"@{/admin/categorias/nueva}\">Nueva categoría\u003c/a>\n    \u003c/div>\n\n    \u003cdiv class=\"table-responsive\">\n      \u003ctable class=\"table table-hover align-middle bg-white\">\n        \u003cthead class=\"table-light\">\u003ctr>\u003cth>Nombre\u003c/th>\u003cth>Descripción\u003c/th>\u003cth>Estado\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr th:each=\"c : ${categorias}\" th:classappend=\"${!c.activa} ? 'text-muted'\">\n            \u003ctd class=\"fw-semibold\" th:text=\"${c.nombre}\">Hardware\u003c/td>\n            \u003ctd th:text=\"${c.descripcion}\">Descripción\u003c/td>\n            \u003ctd>\u003cspan class=\"badge\" th:classappend=\"${c.activa} ? 'text-bg-success' : 'text-bg-secondary'\"\n                      th:text=\"${c.activa} ? 'Activa' : 'Inactiva'\">Activa\u003c/span>\u003c/td>\n            \u003ctd class=\"text-end text-nowrap\">\n              \u003ca class=\"btn btn-sm btn-outline-primary\" th:href=\"@{/admin/categorias/{id}/editar(id=${c.id})}\">Editar\u003c/a>\n              \u003cform th:action=\"@{/admin/categorias/{id}/estado(id=${c.id})}\" method=\"post\" class=\"d-inline\">\n                \u003cbutton type=\"submit\" class=\"btn btn-sm btn-outline-secondary\" th:text=\"${c.activa} ? 'Desactivar' : 'Activar'\">Desactivar\u003c/button>\n              \u003c/form>\n            \u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n  \u003c/main>\n\n  \u003cth:block th:replace=\"~{fragmentos :: pie}\">\u003c/th:block>\n\u003c/body>\n\u003c/html>"},{"ruta":"src/main/resources/templates/admin/categoria-form.html","modo":"nuevo","nota":"","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead th:replace=\"~{fragmentos :: head('Categoría')}\">\u003c/head>\n\u003cbody>\n  \u003cnav th:replace=\"~{fragmentos :: menu('categorias')}\">\u003c/nav>\n\n  \u003cmain class=\"container hoja my-4\">\n    \u003ch1 class=\"h3 mb-4\" th:text=\"${categoria.esNuevo()} ? 'Nueva categoría' : 'Editar categoría'\">Nueva categoría\u003c/h1>\n\n    \u003cform th:action=\"@{/admin/categorias}\" th:object=\"${categoria}\" method=\"post\" novalidate class=\"card card-body shadow-sm\">\n      \u003cinput type=\"hidden\" th:field=\"*{id}\">\n      \u003cdiv class=\"mb-3\">\n        \u003clabel for=\"nombre\" class=\"form-label\">Nombre\u003c/label>\n        \u003cinput type=\"text\" th:field=\"*{nombre}\" class=\"form-control\" th:errorclass=\"is-invalid\">\n        \u003cdiv class=\"invalid-feedback\" th:errors=\"*{nombre}\">Error\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"mb-3\">\n        \u003clabel for=\"descripcion\" class=\"form-label\">Descripción\u003c/label>\n        \u003ctextarea th:field=\"*{descripcion}\" rows=\"2\" class=\"form-control\" th:errorclass=\"is-invalid\">\u003c/textarea>\n        \u003cdiv class=\"invalid-feedback\" th:errors=\"*{descripcion}\">Error\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"d-flex gap-2\">\n        \u003cbutton type=\"submit\" class=\"btn btn-primary\">Guardar\u003c/button>\n        \u003ca class=\"btn btn-outline-secondary\" th:href=\"@{/admin/categorias}\">Cancelar\u003c/a>\n      \u003c/div>\n    \u003c/form>\n  \u003c/main>\n\n  \u003cth:block th:replace=\"~{fragmentos :: pie}\">\u003c/th:block>\n\u003c/body>\n\u003c/html>"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/controller/UsuarioAdminController.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.controller;\n\nimport java.util.List;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\nimport org.springframework.validation.BindingResult;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.ModelAttribute;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.servlet.mvc.support.RedirectAttributes;\n\nimport jakarta.validation.Valid;\n\nimport co.edu.sena.adso.soporteya.dto.OpcionDTO;\nimport co.edu.sena.adso.soporteya.dto.UsuarioDTO;\nimport co.edu.sena.adso.soporteya.dto.UsuarioForm;\nimport co.edu.sena.adso.soporteya.model.Rol;\nimport co.edu.sena.adso.soporteya.service.CategoriaService;\nimport co.edu.sena.adso.soporteya.service.NegocioException;\nimport co.edu.sena.adso.soporteya.service.UsuarioService;\n\n@Controller\n@RequestMapping(\"/admin/usuarios\")\npublic class UsuarioAdminController {\n\n    private final UsuarioService usuarios;\n    private final CategoriaService categorias;\n\n    public UsuarioAdminController(UsuarioService usuarios, CategoriaService categorias) {\n        this.usuarios = usuarios;\n        this.categorias = categorias;\n    }\n\n    @ModelAttribute(\"areas\")\n    public List\u003cOpcionDTO> areas() {\n        return usuarios.areas();\n    }\n\n    @ModelAttribute(\"categorias\")\n    public List\u003cOpcionDTO> categorias() {\n        return categorias.opciones();\n    }\n\n    @ModelAttribute(\"roles\")\n    public Rol[] roles() {\n        return Rol.values();\n    }\n\n    @GetMapping\n    public String listar(Model model) {\n        model.addAttribute(\"usuarios\", usuarios.todos());\n        return \"admin/usuarios\";\n    }\n\n    @GetMapping(\"/nuevo\")\n    public String nuevo(Model model) {\n        model.addAttribute(\"usuario\", new UsuarioForm());\n        return \"admin/usuario-form\";\n    }\n\n    @GetMapping(\"/{id}/editar\")\n    public String editar(@PathVariable(\"id\") Long id, Model model) {\n        model.addAttribute(\"usuario\", usuarios.formulario(id));\n        return \"admin/usuario-form\";\n    }\n\n    @PostMapping\n    public String guardar(@Valid @ModelAttribute(\"usuario\") UsuarioForm usuario, BindingResult resultado,\n                          RedirectAttributes flash) {\n        if (resultado.hasErrors()) {\n            return \"admin/usuario-form\";\n        }\n        try {\n            UsuarioDTO guardado = usuarios.guardar(usuario);\n            flash.addFlashAttribute(\"ok\", \"Usuario «\" + guardado.nombreCompleto() + \"» guardado\");\n            return \"redirect:/admin/usuarios\";\n        } catch (NegocioException e) {\n            Formularios.rechazar(resultado, e);\n            return \"admin/usuario-form\";\n        }\n    }\n\n    @PostMapping(\"/{id}/estado\")\n    public String cambiarEstado(@PathVariable(\"id\") Long id, RedirectAttributes flash) {\n        UsuarioDTO u = usuarios.cambiarEstado(id);\n        flash.addFlashAttribute(\"ok\", \"«\" + u.nombreCompleto() + \"» quedó \" + (u.activo() ? \"activo\" : \"inactivo\"));\n        return \"redirect:/admin/usuarios\";\n    }\n}"},{"ruta":"src/main/resources/templates/admin/usuarios.html","modo":"nuevo","nota":"","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead th:replace=\"~{fragmentos :: head('Usuarios')}\">\u003c/head>\n\u003cbody>\n  \u003cnav th:replace=\"~{fragmentos :: menu('usuarios')}\">\u003c/nav>\n\n  \u003cmain class=\"container my-4\">\n    \u003cdiv th:replace=\"~{fragmentos :: mensajes}\">\u003c/div>\n    \u003cdiv class=\"d-flex justify-content-between align-items-center mb-3\">\n      \u003ch1 class=\"h3 mb-0\">Usuarios\u003c/h1>\n      \u003ca class=\"btn btn-primary\" th:href=\"@{/admin/usuarios/nuevo}\">Nuevo usuario\u003c/a>\n    \u003c/div>\n\n    \u003cdiv class=\"table-responsive\">\n      \u003ctable class=\"table table-hover align-middle bg-white\">\n        \u003cthead class=\"table-light\">\u003ctr>\u003cth>Nombre\u003c/th>\u003cth>Correo\u003c/th>\u003cth>Rol\u003c/th>\u003cth>Área\u003c/th>\u003cth>Especialidades\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr th:each=\"u : ${usuarios}\" th:classappend=\"${!u.activo} ? 'text-muted'\">\n            \u003ctd class=\"fw-semibold\" th:text=\"${u.nombreCompleto}\">Carlos Ruiz\u003c/td>\n            \u003ctd th:text=\"${u.email}\">carlos@soporteya.co\u003c/td>\n            \u003ctd th:text=\"${u.rol.etiqueta}\">Técnico\u003c/td>\n            \u003ctd th:text=\"${u.area}\">Tecnología\u003c/td>\n            \u003ctd class=\"small\" th:text=\"${u.especialidades}\">Hardware, Impresoras\u003c/td>\n            \u003ctd class=\"text-end text-nowrap\">\n              \u003ca class=\"btn btn-sm btn-outline-primary\" th:href=\"@{/admin/usuarios/{id}/editar(id=${u.id})}\">Editar\u003c/a>\n              \u003cform th:action=\"@{/admin/usuarios/{id}/estado(id=${u.id})}\" method=\"post\" class=\"d-inline\">\n                \u003cbutton type=\"submit\" class=\"btn btn-sm btn-outline-secondary\" th:text=\"${u.activo} ? 'Desactivar' : 'Activar'\">Desactivar\u003c/button>\n              \u003c/form>\n            \u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n  \u003c/main>\n\n  \u003cth:block th:replace=\"~{fragmentos :: pie}\">\u003c/th:block>\n\u003c/body>\n\u003c/html>"},{"ruta":"src/main/resources/templates/admin/usuario-form.html","modo":"nuevo","nota":"Las especialidades son casillas: la relación muchos a muchos en la pantalla.","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead th:replace=\"~{fragmentos :: head('Usuario')}\">\u003c/head>\n\u003cbody>\n  \u003cnav th:replace=\"~{fragmentos :: menu('usuarios')}\">\u003c/nav>\n\n  \u003cmain class=\"container hoja my-4\">\n    \u003ch1 class=\"h3 mb-4\" th:text=\"${usuario.esNuevo()} ? 'Nuevo usuario' : 'Editar usuario'\">Nuevo usuario\u003c/h1>\n\n    \u003cform th:action=\"@{/admin/usuarios}\" th:object=\"${usuario}\" method=\"post\" novalidate class=\"card card-body shadow-sm\">\n      \u003cinput type=\"hidden\" th:field=\"*{id}\">\n\n      \u003cdiv class=\"row\">\n        \u003cdiv class=\"col-md-6 mb-3\">\n          \u003clabel for=\"nombreCompleto\" class=\"form-label\">Nombre completo\u003c/label>\n          \u003cinput type=\"text\" th:field=\"*{nombreCompleto}\" class=\"form-control\" th:errorclass=\"is-invalid\">\n          \u003cdiv class=\"invalid-feedback\" th:errors=\"*{nombreCompleto}\">Error\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"col-md-6 mb-3\">\n          \u003clabel for=\"email\" class=\"form-label\">Correo\u003c/label>\n          \u003cinput type=\"email\" th:field=\"*{email}\" class=\"form-control\" th:errorclass=\"is-invalid\">\n          \u003cdiv class=\"invalid-feedback\" th:errors=\"*{email}\">Error\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"row\">\n        \u003cdiv class=\"col-md-6 mb-3\">\n          \u003clabel for=\"rol\" class=\"form-label\">Rol\u003c/label>\n          \u003cselect th:field=\"*{rol}\" class=\"form-select\" th:errorclass=\"is-invalid\">\n            \u003coption th:each=\"r : ${roles}\" th:value=\"${r}\" th:text=\"${r.etiqueta}\">Solicitante\u003c/option>\n          \u003c/select>\n          \u003cdiv class=\"invalid-feedback\" th:errors=\"*{rol}\">Error\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"col-md-6 mb-3\">\n          \u003clabel for=\"areaId\" class=\"form-label\">Área\u003c/label>\n          \u003cselect th:field=\"*{areaId}\" class=\"form-select\" th:errorclass=\"is-invalid\">\n            \u003coption value=\"\">Elija el área…\u003c/option>\n            \u003coption th:each=\"a : ${areas}\" th:value=\"${a.id}\" th:text=\"${a.texto}\">Contabilidad\u003c/option>\n          \u003c/select>\n          \u003cdiv class=\"invalid-feedback\" th:errors=\"*{areaId}\">Error\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003c!-- Muchos a muchos: una casilla por categoría. th:field marca las que ya tiene. -->\n      \u003cfieldset class=\"mb-3\">\n        \u003clegend class=\"form-label fs-6\">Especialidades \u003cspan class=\"text-muted small\">(solo técnicos)\u003c/span>\u003c/legend>\n        \u003cdiv class=\"form-check form-check-inline\" th:each=\"c : ${categorias}\">\n          \u003cinput type=\"checkbox\" class=\"form-check-input\" th:field=\"*{especialidades}\" th:value=\"${c.id}\">\n          \u003clabel class=\"form-check-label\" th:for=\"${#ids.prev('especialidades')}\" th:text=\"${c.texto}\">Hardware\u003c/label>\n        \u003c/div>\n        \u003cdiv class=\"text-danger small\" th:if=\"${#fields.hasErrors('especialidades')}\" th:errors=\"*{especialidades}\">Error\u003c/div>\n      \u003c/fieldset>\n\n      \u003cdiv class=\"d-flex gap-2\">\n        \u003cbutton type=\"submit\" class=\"btn btn-primary\">Guardar\u003c/button>\n        \u003ca class=\"btn btn-outline-secondary\" th:href=\"@{/admin/usuarios}\">Cancelar\u003c/a>\n      \u003c/div>\n    \u003c/form>\n  \u003c/main>\n\n  \u003cth:block th:replace=\"~{fragmentos :: pie}\">\u003c/th:block>\n\u003c/body>\n\u003c/html>"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/controller/IndicadoresController.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.controller;\n\nimport java.time.YearMonth;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.RequestParam;\n\nimport co.edu.sena.adso.soporteya.service.TicketService;\n\n// Indicadores para la coordinación: estados, cumplimiento por técnico y vencidos\n@Controller\npublic class IndicadoresController {\n\n    private final TicketService tickets;\n\n    public IndicadoresController(TicketService tickets) {\n        this.tickets = tickets;\n    }\n\n    // GET /admin/indicadores?mes=2026-12\n    @GetMapping(\"/admin/indicadores\")\n    public String indicadores(@RequestParam(name = \"mes\", required = false) YearMonth mes, Model model) {\n        YearMonth elegido = mes == null ? YearMonth.now() : mes;\n        model.addAttribute(\"mes\", elegido);\n        model.addAttribute(\"conteos\", tickets.conteoPorEstado());\n        model.addAttribute(\"indicadores\", tickets.indicadores(elegido));\n        model.addAttribute(\"vencidos\", tickets.vencidos());\n        return \"admin/indicadores\";\n    }\n}"},{"ruta":"src/main/resources/templates/admin/indicadores.html","modo":"nuevo","nota":"","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead th:replace=\"~{fragmentos :: head('Indicadores')}\">\u003c/head>\n\u003cbody>\n  \u003cnav th:replace=\"~{fragmentos :: menu('indicadores')}\">\u003c/nav>\n\n  \u003cmain class=\"container my-4\">\n    \u003cdiv class=\"d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3\">\n      \u003ch1 class=\"h3 mb-0\">Indicadores\u003c/h1>\n      \u003c!-- Formulario GET: solo elige el mes, no guarda nada -->\n      \u003cform th:action=\"@{/admin/indicadores}\" method=\"get\" class=\"d-flex gap-2\">\n        \u003clabel for=\"mes\" class=\"visually-hidden\">Mes\u003c/label>\n        \u003cinput type=\"month\" id=\"mes\" name=\"mes\" class=\"form-control\" th:value=\"${mes}\">\n        \u003cbutton type=\"submit\" class=\"btn btn-outline-primary\">Ver\u003c/button>\n      \u003c/form>\n    \u003c/div>\n\n    \u003cdiv class=\"row g-3 mb-4\">\n      \u003cdiv class=\"col-6 col-md\" th:each=\"c : ${conteos}\">\n        \u003cdiv class=\"card card-body text-center\">\n          \u003cdiv class=\"display-6 fw-bold\" th:text=\"${c.cantidad}\">3\u003c/div>\n          \u003cspan th:replace=\"~{fragmentos :: estado(${c.estado})}\">\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003ch2 class=\"h5\">Cumplimiento por técnico · \u003cspan th:text=\"${mes}\">2026-12\u003c/span>\u003c/h2>\n    \u003cp class=\"text-muted\" th:if=\"${#lists.isEmpty(indicadores)}\">No hay tickets resueltos en este mes.\u003c/p>\n    \u003cdiv class=\"table-responsive\" th:unless=\"${#lists.isEmpty(indicadores)}\">\n      \u003ctable class=\"table align-middle bg-white\">\n        \u003cthead class=\"table-light\">\u003ctr>\u003cth>Técnico\u003c/th>\u003cth class=\"text-center\">Resueltos\u003c/th>\u003cth class=\"text-center\">Fuera de tiempo\u003c/th>\u003cth style=\"width: 35%\">Cumplimiento\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr th:each=\"i : ${indicadores}\">\n            \u003ctd th:text=\"${i.tecnico}\">Carlos Ruiz\u003c/td>\n            \u003ctd class=\"text-center\" th:text=\"${i.resueltos}\">5\u003c/td>\n            \u003ctd class=\"text-center\" th:text=\"${i.fueraDeTiempo}\">1\u003c/td>\n            \u003ctd>\n              \u003cdiv class=\"progress\" role=\"progressbar\" th:aria-valuenow=\"${i.cumplimiento()}\" aria-valuemin=\"0\" aria-valuemax=\"100\">\n                \u003cdiv class=\"progress-bar\" th:style=\"'width: ' + ${i.cumplimiento()} + '%'\"\n                     th:classappend=\"${i.cumplimiento() \u003c 80} ? 'bg-danger' : 'bg-success'\"\n                     th:text=\"${i.cumplimiento()} + '%'\">80%\u003c/div>\n              \u003c/div>\n            \u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n\n    \u003ch2 class=\"h5 mt-4\">Tickets vencidos\u003c/h2>\n    \u003cp class=\"text-muted\" th:if=\"${#lists.isEmpty(vencidos)}\">Ningún ticket pendiente ha pasado su fecha límite.\u003c/p>\n    \u003cul class=\"list-group\" th:unless=\"${#lists.isEmpty(vencidos)}\">\n      \u003cli class=\"list-group-item d-flex justify-content-between\" th:each=\"t : ${vencidos}\">\n        \u003ca th:href=\"@{/tickets/{id}(id=${t.id})}\" th:text=\"|${t.codigo} · ${t.asunto}|\">SY-00001 · Asunto\u003c/a>\n        \u003cspan class=\"text-danger small\" th:text=\"${#temporals.format(t.fechaLimite, 'd MMM, h:mm a')}\">fecha\u003c/span>\n      \u003c/li>\n    \u003c/ul>\n  \u003c/main>\n\n  \u003cth:block th:replace=\"~{fragmentos :: pie}\">\u003c/th:block>\n\u003c/body>\n\u003c/html>"}],"listo":"la coordinadora crea un técnico con dos especialidades y ve los indicadores del mes."}],"verificar":[["Ana crea un ticket vacío","Mensajes en español bajo asunto, categoría y descripción"],["Ana repite el asunto de un ticket suyo pendiente","«Ya tiene un ticket pendiente con ese asunto» bajo el asunto (negocio)"],["Ana crea un ticket válido y recarga con F5","Una sola vez en su lista: Post/Redirect/Get"],["Diana intenta tomar un ticket de Impresoras","Mensaje rojo en el tablero: «No tiene la especialidad Impresoras»"],["Carlos resuelve con «ok»","«Describa la solución (mínimo 10 caracteres)» bajo el campo"],["Ana reabre un ticket resuelto","Vuelve a «En curso» y el historial muestra el motivo"],["Laura crea un técnico sin especialidades","«Marque al menos una especialidad para el técnico»"],["Dos ventanas toman el mismo ticket","Solo una lo logra"]],"quiz":[{"p":"¿Dónde va la regla «no se repite un ticket pendiente con el mismo asunto»?","op":["En una anotación `@Unique` de TicketForm","En el servicio, porque necesita consultar la base de datos","En el HTML con `required`","En la entidad con `@Column(unique = true)`"],"ok":1,"exp":"Es una regla de negocio: depende de otros datos (los tickets pendientes del solicitante). Además, la API también debe cumplirla."},{"p":"Un formulario POST tiene errores de validación. ¿Qué debe devolver el controlador?","op":["`redirect:` a la misma página","La misma vista, para mostrar los errores con lo que el usuario escribió","Una página de error 400","Un JSON con los errores"],"ok":1,"exp":"Con un redirect se perderían los errores y lo escrito. La redirección es solo para el éxito."},{"p":"¿Para qué sirve un método anotado con `@ModelAttribute(\"categorias\")` en un controlador?","op":["Valida las categorías","Pone la lista en el modelo antes de cada petición del controlador","Guarda las categorías en la sesión","Crea la tabla de categorías"],"ok":1,"exp":"Así las opciones del `\u003cselect>` están también cuando el POST vuelve a mostrar el formulario con errores."},{"p":"¿Qué problema tiene el selector «Actuar como»?","op":["Ninguno, es la forma correcta de manejar usuarios","Que cualquiera puede hacerse pasar por otro usuario","Que no funciona en el celular","Que no guarda nada"],"ok":1,"exp":"Sin autenticación, el sistema cree lo que el usuario le dice. La Unidad 3 lo reemplaza por login real."}],"ahora":["El equipo tiene un solo `fragmentos.html` con cabecera, menú, mensajes y pie, y todas las páginas lo usan.","Mi módulo tiene lista y formulario (crear y editar) de su entidad principal.","Mi formulario es una clase propia con al menos tres anotaciones y mensajes en español.","Mi regla de negocio muestra su error junto al campo, no como una página de error.","Si mi entidad tiene una relación, se elige con `\u003cselect>` (o casillas si es muchos a muchos).","Después de guardar hay redirect con mensaje flash. Mi PR «feat: vistas del módulo … (U2)» está fusionado antes de la demo."],"errores":[["`Neither BindingResult nor plain target object for bean name 'ticket'`","El nombre de `th:object` no coincide con el del modelo","Use el mismo nombre en `@ModelAttribute(\"ticket\")` y en `${ticket}`"],["Página de error 400 al enviar el formulario","`BindingResult` no está justo después del objeto con `@Valid`","Muévalo a la posición siguiente"],["La lista de categorías sale vacía al volver con errores","Las opciones solo se pusieron en el GET","Método con `@ModelAttribute(\"categorias\")`"],["`Error resolving template [fragmentos]`","El archivo no está en `templates/` o el nombre del fragmento no coincide","Revise `th:fragment` y `~{fragmentos :: nombre}`"],["`EL1007E: Property or field 'rol' cannot be found on null`","La vista usa `yo` y no se creó `VistaComun`","Cree `VistaComun` (paso 3)"],["Las fechas salen en inglés","Falta fijar el idioma","`spring.web.locale=es_CO` y `spring.web.locale-resolver=fixed`"]]},{"id":"u3","num":"3","titulo":"Seguridad","sesiones":"Sesiones 9 a 12 · 30 de noviembre al 3 de diciembre","rap":"593108 · Codificar el software de acuerdo con el diseño establecido","resumen":"Se acabó «Actuar como». SoporteYa ahora sabe quién es cada persona: inicia sesión con contraseña cifrada con BCrypt, cada rol ve solo lo suyo, un solicitante no puede abrir los tickets de otro y las notas internas no salen del equipo de TI.","objetivos":["Explicar autenticación, autorización y los riesgos del OWASP Top 10 que afectan a SoporteYa.","Guardar contraseñas con BCrypt y autenticar usuarios de PostgreSQL con Spring Security.","Proteger rutas por rol, métodos con `@PreAuthorize` y datos con control de acceso horizontal.","Mostrar en las vistas solo lo que cada rol puede hacer, sin confundir ocultar con proteger."],"teoria":[{"t":"Las tres preguntas de la seguridad","b":[["tabla",["Principio","Pregunta","En SoporteYa"],[["Confidencialidad","¿Solo lo ve quien debe?","Ana no lee los tickets de Jorge ni las notas internas"],["Integridad","¿Solo lo cambia quien debe?","Solo el técnico asignado resuelve; nadie altera la contraseña de otro"],["Disponibilidad","¿Está cuando se necesita?","La mesa de ayuda funciona aunque haya muchos tickets (Unidades 5 y 6)"]]],["tabla",["","Autenticación","Autorización"],[["Pregunta","¿Quién es usted?","¿Qué puede hacer?"],["Cómo","Correo y contraseña, o Google","Roles, reglas por ruta, `@PreAuthorize`, dueño del dato"],["Si falla","Vuelve al login (401)","Acceso denegado (403)"]]]]},{"t":"OWASP Top 10 aplicado","b":["OWASP publica los riesgos más frecuentes de las aplicaciones web. Estos son los que tocan a SoporteYa:",["tabla",["Riesgo","Cómo se vería aquí","Cómo lo evitamos"],[["A01 · Control de acceso roto","Ana cambia `/tickets/4` por `/tickets/5` y lee el ticket de Jorge","Control horizontal en el servicio: si no es suyo, 403"],["A02 · Fallas criptográficas","Contraseñas legibles en la tabla `usuario`","Hash BCrypt; HTTPS en la nube (Unidad 6)"],["A03 · Inyección","Un asunto con SQL o con `\u003cscript>`","JPA con parámetros; Thymeleaf escapa el texto con `th:text`"],["A05 · Mala configuración","Contraseñas en el repositorio, errores con detalles internos","Variables de entorno; `include-stacktrace=never` en producción"],["A07 · Fallas de autenticación","Contraseñas como «123», sesión que nunca vence","Mínimo 8 caracteres con letras y números; sesión de 30 minutos"]]]]},{"t":"Contraseñas: hash, no cifrado","b":["Una contraseña **cifrada** se puede descifrar con la clave. Una contraseña con **hash** no: se guarda el resultado de una función de un solo sentido, y al iniciar sesión se calcula el hash de lo que el usuario escribió y se comparan.",["code","Lo que queda en la columna password","$2a$10$xnr1kIDQJXIZEU06EKYrzeE/GT3gRVZP6RQ/L/Je1b9w.9xc0kxtG\n │   │  └─ sal aleatoria + hash\n │   └──── costo: 2^10 rondas (lento a propósito)\n └──────── versión de BCrypt"],"BCrypt agrega una **sal** aleatoria: dos usuarios con la misma contraseña tienen hashes distintos. Y es **lento a propósito**: probar millones de contraseñas tarda años."]},{"t":"Sesión, cookies y CSRF","b":["Después del login, el servidor crea una **sesión** y el navegador guarda una cookie `JSESSIONID` que envía en cada petición. Por eso no hay que escribir la contraseña en cada página.",["nota","ojo","**CSRF (falsificación de petición).** Una página maliciosa puede tener un formulario oculto que envía `POST /tablero/7/tomar` a SoporteYa. Como el navegador agrega la cookie solo, el servidor creería que fue usted. La defensa: cada formulario lleva un **código secreto** que la página maliciosa no conoce. Thymeleaf lo agrega solo en todo formulario con `th:action`."],"Por eso **cerrar sesión es un POST**, no un enlace, y todas las acciones que cambian datos (tomar, cerrar, desactivar) son formularios POST."]},{"t":"La cadena de filtros de Spring Security","b":["Spring Security es una cadena de filtros que revisa cada petición **antes** de que llegue al controlador. Se configura con un `SecurityFilterChain`:",["code","SeguridadConfig.java (resumen)",".authorizeHttpRequests(acceso -> acceso\n    .requestMatchers(\"/\", \"/login\", \"/registro\", \"/css/**\").permitAll()\n    .requestMatchers(\"/admin/**\").hasRole(\"COORDINADOR\")\n    .requestMatchers(\"/tablero/**\").hasAnyRole(\"TECNICO\", \"COORDINADOR\")\n    .anyRequest().authenticated())\n.formLogin(login -> login.loginPage(\"/login\").usernameParameter(\"email\"))"],["nota","clave","El orden importa: Spring usa la **primera** regla que coincide. Las rutas específicas van primero y `anyRequest()` siempre al final."]]},{"t":"Tres niveles de autorización","b":[["tabla",["Nivel","Pregunta","Dónde","Ejemplo"],[["Por ruta","¿Este rol puede entrar a esta dirección?","`SecurityFilterChain`","`/admin/**` solo COORDINADOR"],["Por método","¿Este rol puede ejecutar esta operación?","`@PreAuthorize` en el servicio","`tomar` solo TECNICO, aunque se llame desde otra ruta o desde la API"],["Por dato (horizontal)","¿Este registro es suyo?","Código en el servicio","Un solicitante solo ve sus tickets"]]],["nota","ojo","**Ocultar no es proteger.** `sec:authorize` en la vista esconde el botón «Usuarios» a Ana, pero si ella escribe `/admin/usuarios` en la barra de direcciones, lo que la detiene es la regla de la cadena de filtros y el `@PreAuthorize`. Las vistas mejoran la experiencia; el servidor da la seguridad."]]},{"t":"Ley 1581 de 2012: datos personales","b":["SoporteYa guarda nombres, correos y el área de trabajo de los funcionarios: son **datos personales**. La ley exige informar para qué se usan (el registro lo dice), pedir solo los necesarios, protegerlos (contraseñas con hash, acceso por rol) y permitir consultarlos o corregirlos."]}],"pasos":[{"t":"Las dependencias","min":5,"cmd":[["pom.xml · dentro de \u003cdependencies>","\u003cdependency>\n    \u003cgroupId>org.springframework.boot\u003c/groupId>\n    \u003cartifactId>spring-boot-starter-security\u003c/artifactId>\n\u003c/dependency>\n\u003cdependency>\n    \u003cgroupId>org.thymeleaf.extras\u003c/groupId>\n    \u003cartifactId>thymeleaf-extras-springsecurity6\u003c/artifactId>\n\u003c/dependency>"]],"despues":["Arranque la aplicación sin cambiar nada más: todas las páginas piden usuario y contraseña con la página de login por defecto. Spring Security protege todo desde que se agrega."],"listo":"la aplicación pide login en cualquier página.","archivos":[]},{"t":"Borrar la sesión de mentiras","min":5,"intro":"Borre `config/SesionDemo.java`, `controller/DemoController.java` y `config/DemoConsola.java` (sus servicios ahora exigen un usuario autenticado). Desde aquí, el usuario lo dice Spring Security.","archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/controller/VistaComun.java","modo":"reemplazar","nota":"«yo» sale de `Authentication`, el usuario que inició sesión. Sin sesión, es `null`.","lang":"java","codigo":"package co.edu.sena.adso.soporteya.controller;\n\nimport org.springframework.security.authentication.AnonymousAuthenticationToken;\nimport org.springframework.security.core.Authentication;\nimport org.springframework.stereotype.Controller;\nimport org.springframework.web.bind.annotation.ControllerAdvice;\nimport org.springframework.web.bind.annotation.ModelAttribute;\n\nimport co.edu.sena.adso.soporteya.dto.UsuarioDTO;\nimport co.edu.sena.adso.soporteya.service.UsuarioService;\n\n// Agrega a TODAS las vistas el usuario que inició sesión («yo»). Si nadie ha iniciado sesión, es null.\n@ControllerAdvice(annotations = Controller.class)\npublic class VistaComun {\n\n    private final UsuarioService usuarios;\n\n    public VistaComun(UsuarioService usuarios) {\n        this.usuarios = usuarios;\n    }\n\n    @ModelAttribute(\"yo\")\n    public UsuarioDTO yo(Authentication autenticacion) {\n        if (autenticacion == null || autenticacion instanceof AnonymousAuthenticationToken) {\n            return null;\n        }\n        return usuarios.porEmail(autenticacion.getName());\n    }\n}"}],"listo":"no queda ninguna referencia a `SesionDemo` en el proyecto."},{"t":"La configuración de seguridad","min":25,"archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/config/SeguridadConfig.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.config;\n\nimport org.springframework.context.annotation.Bean;\nimport org.springframework.context.annotation.Configuration;\nimport org.springframework.security.config.annotation.method.configuration.EnableMethodSecurity;\nimport org.springframework.security.config.annotation.web.builders.HttpSecurity;\nimport org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder;\nimport org.springframework.security.crypto.password.PasswordEncoder;\nimport org.springframework.security.web.SecurityFilterChain;\n\n@Configuration\n@EnableMethodSecurity   // activa @PreAuthorize en los servicios\npublic class SeguridadConfig {\n\n    // Las contraseñas se guardan como hash BCrypt: no se pueden «descifrar»\n    @Bean\n    public PasswordEncoder passwordEncoder() {\n        return new BCryptPasswordEncoder();\n    }\n\n    @Bean\n    public SecurityFilterChain web(HttpSecurity http) throws Exception {\n        http\n            .authorizeHttpRequests(acceso -> acceso\n                // Públicas: portada, login, registro y archivos estáticos\n                .requestMatchers(\"/\", \"/login\", \"/registro\", \"/css/**\", \"/js/**\", \"/error\").permitAll()\n                // Por rol: la regla más específica va primero\n                .requestMatchers(\"/admin/**\").hasRole(\"COORDINADOR\")\n                .requestMatchers(\"/tablero/**\").hasAnyRole(\"TECNICO\", \"COORDINADOR\")\n                // Todo lo demás: basta con haber iniciado sesión\n                .anyRequest().authenticated())\n            .formLogin(login -> login\n                .loginPage(\"/login\")              // nuestra página, no la de Spring\n                .usernameParameter(\"email\")       // el campo del formulario se llama email\n                .defaultSuccessUrl(\"/\", false)\n                .permitAll())\n            .logout(salida -> salida\n                .logoutSuccessUrl(\"/login?salio\")\n                .permitAll())\n            .exceptionHandling(errores -> errores\n                .accessDeniedPage(\"/acceso-denegado\"));\n        return http.build();\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/service/UsuarioDetallesService.java","modo":"nuevo","nota":"Spring lo llama en cada login. `.disabled(!activo)`: un usuario desactivado no entra.","lang":"java","codigo":"package co.edu.sena.adso.soporteya.service;\n\nimport org.springframework.security.core.userdetails.User;\nimport org.springframework.security.core.userdetails.UserDetails;\nimport org.springframework.security.core.userdetails.UserDetailsService;\nimport org.springframework.security.core.userdetails.UsernameNotFoundException;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport co.edu.sena.adso.soporteya.model.Usuario;\nimport co.edu.sena.adso.soporteya.repository.UsuarioRepository;\n\n// Spring Security llama a este servicio en cada inicio de sesión para buscar al usuario\n@Service\npublic class UsuarioDetallesService implements UserDetailsService {\n\n    private final UsuarioRepository usuarios;\n\n    public UsuarioDetallesService(UsuarioRepository usuarios) {\n        this.usuarios = usuarios;\n    }\n\n    @Override\n    @Transactional(readOnly = true)\n    public UserDetails loadUserByUsername(String email) throws UsernameNotFoundException {\n        Usuario usuario = usuarios.findByEmail(email.trim().toLowerCase())\n                .filter(u -> u.getPassword() != null)\n                .orElseThrow(() -> new UsernameNotFoundException(\"Usuario o contraseña incorrectos\"));\n        return User.withUsername(usuario.getEmail())\n                .password(usuario.getPassword())          // el hash BCrypt guardado\n                .roles(usuario.getRol().name())           // ROLE_SOLICITANTE, ROLE_TECNICO…\n                .disabled(!usuario.isActivo())            // un usuario desactivado no entra\n                .build();\n    }\n}"},{"ruta":"src/main/resources/application.properties","modo":"reemplazar","nota":"","lang":"props","codigo":"spring.application.name=soporteya\nspring.thymeleaf.cache=false\n\n# PostgreSQL. La contraseña NO se escribe aquí: llega por la variable DB_PASSWORD\nspring.datasource.url=jdbc:postgresql://localhost:5432/soporteya\nspring.datasource.username=adso\nspring.datasource.password=${DB_PASSWORD}\n\nspring.jpa.hibernate.ddl-auto=update\nspring.jpa.show-sql=true\nspring.jpa.open-in-view=false\n\n# Unidad 2 · idioma fijo: fechas y mensajes en español de Colombia\nspring.web.locale=es_CO\nspring.web.locale-resolver=fixed\n\n# Unidad 3 · solo los correos de la empresa pueden registrarse\nsoporteya.dominio-correo=soporteya.co\n# La sesión expira tras 30 minutos sin actividad\nserver.servlet.session.timeout=30m"}],"listo":"la aplicación arranca (todavía falta la página de login)."},{"t":"Login, registro y acceso denegado","min":40,"archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/dto/RegistroForm.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.dto;\n\nimport jakarta.validation.constraints.Email;\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.NotNull;\nimport jakarta.validation.constraints.Pattern;\nimport jakarta.validation.constraints.Size;\n\n// Registro de un funcionario como solicitante\npublic class RegistroForm {\n\n    @NotBlank(message = \"Escriba su nombre completo\")\n    @Size(max = 120, message = \"Máximo 120 caracteres\")\n    private String nombreCompleto;\n\n    @NotBlank(message = \"Escriba su correo\")\n    @Email(message = \"Escriba un correo válido\")\n    private String email;\n\n    @NotNull(message = \"Elija su área\")\n    private Long areaId;\n\n    @NotBlank(message = \"Escriba una contraseña\")\n    @Size(min = 8, max = 72, message = \"Entre 8 y 72 caracteres\")\n    @Pattern(regexp = \"^(?=.*[A-Za-z])(?=.*\\\\d).*$\", message = \"Debe tener al menos una letra y un número\")\n    private String password;\n\n    @NotBlank(message = \"Repita la contraseña\")\n    private String confirmacion;\n\n    public String getNombreCompleto() {\n        return nombreCompleto;\n    }\n\n    public void setNombreCompleto(String nombreCompleto) {\n        this.nombreCompleto = nombreCompleto;\n    }\n\n    public String getEmail() {\n        return email;\n    }\n\n    public void setEmail(String email) {\n        this.email = email;\n    }\n\n    public Long getAreaId() {\n        return areaId;\n    }\n\n    public void setAreaId(Long areaId) {\n        this.areaId = areaId;\n    }\n\n    public String getPassword() {\n        return password;\n    }\n\n    public void setPassword(String password) {\n        this.password = password;\n    }\n\n    public String getConfirmacion() {\n        return confirmacion;\n    }\n\n    public void setConfirmacion(String confirmacion) {\n        this.confirmacion = confirmacion;\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/service/UsuarioService.java","modo":"reemplazar","nota":"Nuevo `registrar`: solo correos de la empresa, contraseña confirmada y guardada con `encoder.encode`. La creación de usuarios desde administración ahora exige contraseña inicial.","lang":"java","codigo":"package co.edu.sena.adso.soporteya.service;\n\nimport java.util.HashSet;\nimport java.util.List;\n\nimport org.springframework.beans.factory.annotation.Value;\nimport org.springframework.security.access.prepost.PreAuthorize;\nimport org.springframework.security.crypto.password.PasswordEncoder;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport co.edu.sena.adso.soporteya.dto.OpcionDTO;\nimport co.edu.sena.adso.soporteya.dto.RegistroForm;\nimport co.edu.sena.adso.soporteya.dto.UsuarioDTO;\nimport co.edu.sena.adso.soporteya.dto.UsuarioForm;\nimport co.edu.sena.adso.soporteya.model.Area;\nimport co.edu.sena.adso.soporteya.model.Categoria;\nimport co.edu.sena.adso.soporteya.model.Rol;\nimport co.edu.sena.adso.soporteya.model.Usuario;\nimport co.edu.sena.adso.soporteya.repository.AreaRepository;\nimport co.edu.sena.adso.soporteya.repository.CategoriaRepository;\nimport co.edu.sena.adso.soporteya.repository.UsuarioRepository;\n\n@Service\n@Transactional(readOnly = true)\npublic class UsuarioService {\n\n    private final UsuarioRepository usuarios;\n    private final AreaRepository areas;\n    private final CategoriaRepository categorias;\n    private final PasswordEncoder encoder;\n    private final String dominio;\n\n    public UsuarioService(UsuarioRepository usuarios, AreaRepository areas, CategoriaRepository categorias,\n                          PasswordEncoder encoder, @Value(\"${soporteya.dominio-correo}\") String dominio) {\n        this.usuarios = usuarios;\n        this.areas = areas;\n        this.categorias = categorias;\n        this.encoder = encoder;\n        this.dominio = dominio;\n    }\n\n    // Unidad 3 · cualquier funcionario puede registrarse como SOLICITANTE, solo con el correo de la empresa\n    @Transactional\n    public UsuarioDTO registrar(RegistroForm form) {\n        String email = form.getEmail().trim().toLowerCase();\n        if (!email.endsWith(\"@\" + dominio)) {\n            throw new NegocioException(\"email\", \"Use su correo de la empresa (@\" + dominio + \")\");\n        }\n        if (usuarios.existsByEmailIgnoreCase(email)) {\n            throw new NegocioException(\"email\", \"Ya hay una cuenta con ese correo\");\n        }\n        if (!form.getPassword().equals(form.getConfirmacion())) {\n            throw new NegocioException(\"confirmacion\", \"Las contraseñas no coinciden\");\n        }\n        Area area = areas.findById(form.getAreaId())\n                .orElseThrow(() -> new NegocioException(\"areaId\", \"El área elegida no existe\"));\n        Usuario nuevo = new Usuario(form.getNombreCompleto().trim(), email, Rol.SOLICITANTE, area);\n        nuevo.setPassword(encoder.encode(form.getPassword()));     // nunca en texto plano\n        return UsuarioDTO.from(usuarios.save(nuevo));\n    }\n\n    public UsuarioDTO porEmail(String email) {\n        return usuarios.findByEmail(email).map(UsuarioDTO::from)\n                .orElseThrow(() -> new NegocioException(\"No existe el usuario \" + email));\n    }\n\n    @PreAuthorize(\"hasRole('COORDINADOR')\")\n    public List\u003cUsuarioDTO> todos() {\n        return usuarios.findAllByOrderByRolAscNombreCompletoAsc().stream().map(UsuarioDTO::from).toList();\n    }\n\n    public List\u003cOpcionDTO> areas() {\n        return areas.findAllByOrderByNombreAsc().stream().map(a -> new OpcionDTO(a.getId(), a.getNombre())).toList();\n    }\n\n    @PreAuthorize(\"hasRole('COORDINADOR')\")\n    public UsuarioForm formulario(Long id) {\n        return UsuarioForm.desde(buscar(id));\n    }\n\n    @Transactional\n    @PreAuthorize(\"hasRole('COORDINADOR')\")\n    public UsuarioDTO guardar(UsuarioForm form) {\n        String email = form.getEmail().trim().toLowerCase();\n        Usuario usuario = form.esNuevo() ? null : buscar(form.getId());\n        boolean emailCambio = usuario == null || !usuario.getEmail().equalsIgnoreCase(email);\n        if (emailCambio && usuarios.existsByEmailIgnoreCase(email)) {\n            throw new NegocioException(\"email\", \"Ya hay un usuario con el correo \" + email);\n        }\n        // Regla: un técnico necesita al menos una especialidad\n        if (form.getRol() == Rol.TECNICO && form.getEspecialidades().isEmpty()) {\n            throw new NegocioException(\"especialidades\", \"Marque al menos una especialidad para el técnico\");\n        }\n        Area area = areas.findById(form.getAreaId())\n                .orElseThrow(() -> new NegocioException(\"areaId\", \"El área elegida no existe\"));\n\n        boolean sinPassword = form.getPassword() == null || form.getPassword().isBlank();\n        if (usuario == null && sinPassword) {\n            throw new NegocioException(\"password\", \"Asigne una contraseña inicial\");\n        }\n        if (!sinPassword && form.getPassword().length() \u003c 8) {\n            throw new NegocioException(\"password\", \"Mínimo 8 caracteres\");\n        }\n        if (usuario == null) {\n            usuario = new Usuario(form.getNombreCompleto().trim(), email, form.getRol(), area);\n        } else {\n            usuario.setNombreCompleto(form.getNombreCompleto().trim());\n            usuario.setEmail(email);\n            usuario.setRol(form.getRol());\n            usuario.setArea(area);\n        }\n        if (!sinPassword) {\n            usuario.setPassword(encoder.encode(form.getPassword()));\n        }\n        // Muchos a muchos: se reemplaza el conjunto por las categorías marcadas\n        usuario.getEspecialidades().clear();\n        if (form.getRol() == Rol.TECNICO) {\n            usuario.getEspecialidades().addAll(new HashSet\u003cCategoria>(categorias.findAllById(form.getEspecialidades())));\n        }\n        return UsuarioDTO.from(usuarios.save(usuario));\n    }\n\n    @Transactional\n    @PreAuthorize(\"hasRole('COORDINADOR')\")\n    public UsuarioDTO cambiarEstado(Long id) {\n        Usuario usuario = buscar(id);\n        usuario.setActivo(!usuario.isActivo());\n        return UsuarioDTO.from(usuario);\n    }\n\n    private Usuario buscar(Long id) {\n        return usuarios.findById(id).orElseThrow(() -> new NegocioException(\"No existe el usuario \" + id));\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/dto/UsuarioForm.java","modo":"reemplazar","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.dto;\n\nimport java.util.HashSet;\nimport java.util.Set;\n\nimport jakarta.validation.constraints.Email;\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.NotNull;\nimport jakarta.validation.constraints.Size;\n\nimport co.edu.sena.adso.soporteya.model.Categoria;\nimport co.edu.sena.adso.soporteya.model.Rol;\nimport co.edu.sena.adso.soporteya.model.Usuario;\n\n// Formulario de usuarios. La relación muchos a muchos llega como un conjunto de ids de las casillas marcadas.\npublic class UsuarioForm {\n\n    private Long id;\n\n    @NotBlank(message = \"Escriba el nombre completo\")\n    @Size(max = 120, message = \"Máximo 120 caracteres\")\n    private String nombreCompleto;\n\n    @NotBlank(message = \"Escriba el correo\")\n    @Email(message = \"Escriba un correo válido\")\n    private String email;\n\n    @NotNull(message = \"Elija el rol\")\n    private Rol rol = Rol.SOLICITANTE;\n\n    @NotNull(message = \"Elija el área\")\n    private Long areaId;\n\n    private Set\u003cLong> especialidades = new HashSet\u003c>();\n\n    // Unidad 3 · obligatoria al crear; si se deja vacía al editar, se conserva la actual\n    @Size(max = 72, message = \"Máximo 72 caracteres\")\n    private String password;\n\n    public static UsuarioForm desde(Usuario u) {\n        UsuarioForm f = new UsuarioForm();\n        f.id = u.getId();\n        f.nombreCompleto = u.getNombreCompleto();\n        f.email = u.getEmail();\n        f.rol = u.getRol();\n        f.areaId = u.getArea() == null ? null : u.getArea().getId();\n        u.getEspecialidades().stream().map(Categoria::getId).forEach(f.especialidades::add);\n        return f;\n    }\n\n    public boolean esNuevo() {\n        return id == null;\n    }\n\n    public Long getId() {\n        return id;\n    }\n\n    public void setId(Long id) {\n        this.id = id;\n    }\n\n    public String getNombreCompleto() {\n        return nombreCompleto;\n    }\n\n    public void setNombreCompleto(String nombreCompleto) {\n        this.nombreCompleto = nombreCompleto;\n    }\n\n    public String getEmail() {\n        return email;\n    }\n\n    public void setEmail(String email) {\n        this.email = email;\n    }\n\n    public Rol getRol() {\n        return rol;\n    }\n\n    public void setRol(Rol rol) {\n        this.rol = rol;\n    }\n\n    public Long getAreaId() {\n        return areaId;\n    }\n\n    public void setAreaId(Long areaId) {\n        this.areaId = areaId;\n    }\n\n    public String getPassword() {\n        return password;\n    }\n\n    public void setPassword(String password) {\n        this.password = password;\n    }\n\n    public Set\u003cLong> getEspecialidades() {\n        return especialidades;\n    }\n\n    public void setEspecialidades(Set\u003cLong> especialidades) {\n        this.especialidades = especialidades;\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/controller/CuentaController.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.controller;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\nimport org.springframework.validation.BindingResult;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.ModelAttribute;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.servlet.mvc.support.RedirectAttributes;\n\nimport jakarta.validation.Valid;\n\nimport co.edu.sena.adso.soporteya.dto.RegistroForm;\nimport co.edu.sena.adso.soporteya.service.NegocioException;\nimport co.edu.sena.adso.soporteya.service.UsuarioService;\n\n// Iniciar sesión, registrarse y la página de acceso denegado\n@Controller\npublic class CuentaController {\n\n    private final UsuarioService usuarios;\n\n    public CuentaController(UsuarioService usuarios) {\n        this.usuarios = usuarios;\n    }\n\n    // El POST /login lo atiende Spring Security; aquí solo mostramos la página\n    @GetMapping(\"/login\")\n    public String login() {\n        return \"cuenta/login\";\n    }\n\n    @GetMapping(\"/registro\")\n    public String registro(Model model) {\n        model.addAttribute(\"registro\", new RegistroForm());\n        model.addAttribute(\"areas\", usuarios.areas());\n        return \"cuenta/registro\";\n    }\n\n    @PostMapping(\"/registro\")\n    public String registrar(@Valid @ModelAttribute(\"registro\") RegistroForm registro, BindingResult resultado,\n                            Model model, RedirectAttributes flash) {\n        if (!resultado.hasErrors()) {\n            try {\n                usuarios.registrar(registro);\n                flash.addFlashAttribute(\"ok\", \"Cuenta creada. Ya puede iniciar sesión.\");\n                return \"redirect:/login\";\n            } catch (NegocioException e) {\n                Formularios.rechazar(resultado, e);\n            }\n        }\n        model.addAttribute(\"areas\", usuarios.areas());\n        return \"cuenta/registro\";\n    }\n\n    @GetMapping(\"/acceso-denegado\")\n    public String accesoDenegado() {\n        return \"cuenta/acceso-denegado\";\n    }\n}"},{"ruta":"src/main/resources/templates/cuenta/login.html","modo":"nuevo","nota":"","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead th:replace=\"~{fragmentos :: head('Ingresar')}\">\u003c/head>\n\u003cbody>\n  \u003cnav th:replace=\"~{fragmentos :: menu('login')}\">\u003c/nav>\n\n  \u003cmain class=\"container my-5\" style=\"max-width: 420px\">\n    \u003ch1 class=\"h3 mb-4 text-center\">Ingresar a SoporteYa\u003c/h1>\n    \u003cdiv th:replace=\"~{fragmentos :: mensajes}\">\u003c/div>\n\n    \u003c!-- Spring Security agrega ?error o ?salio a la dirección -->\n    \u003cdiv class=\"alert alert-danger\" th:if=\"${param.error}\">Correo o contraseña incorrectos, o la cuenta está desactivada.\u003c/div>\n    \u003cdiv class=\"alert alert-info\" th:if=\"${param.salio}\">Cerró sesión. ¡Hasta pronto!\u003c/div>\n\n    \u003c!-- POST /login lo procesa Spring Security. th:action agrega el código CSRF oculto. -->\n    \u003cform th:action=\"@{/login}\" method=\"post\" class=\"card card-body shadow-sm\">\n      \u003cdiv class=\"mb-3\">\n        \u003clabel for=\"email\" class=\"form-label\">Correo\u003c/label>\n        \u003cinput type=\"email\" id=\"email\" name=\"email\" class=\"form-control\" autocomplete=\"username\" required autofocus>\n      \u003c/div>\n      \u003cdiv class=\"mb-3\">\n        \u003clabel for=\"password\" class=\"form-label\">Contraseña\u003c/label>\n        \u003cinput type=\"password\" id=\"password\" name=\"password\" class=\"form-control\" autocomplete=\"current-password\" required>\n      \u003c/div>\n      \u003cbutton type=\"submit\" class=\"btn btn-primary w-100\">Ingresar\u003c/button>\n    \u003c/form>\n    \u003cp class=\"text-center mt-3\">¿No tiene cuenta? \u003ca th:href=\"@{/registro}\">Regístrese\u003c/a>\u003c/p>\n  \u003c/main>\n\n  \u003cth:block th:replace=\"~{fragmentos :: pie}\">\u003c/th:block>\n\u003c/body>\n\u003c/html>"},{"ruta":"src/main/resources/templates/cuenta/registro.html","modo":"nuevo","nota":"","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead th:replace=\"~{fragmentos :: head('Registro')}\">\u003c/head>\n\u003cbody>\n  \u003cnav th:replace=\"~{fragmentos :: menu('registro')}\">\u003c/nav>\n\n  \u003cmain class=\"container my-5\" style=\"max-width: 560px\">\n    \u003ch1 class=\"h3 mb-1\">Crear una cuenta\u003c/h1>\n    \u003cp class=\"text-muted mb-4\">Para funcionarios de la empresa. Use su correo corporativo.\u003c/p>\n\n    \u003cform th:action=\"@{/registro}\" th:object=\"${registro}\" method=\"post\" novalidate class=\"card card-body shadow-sm\">\n      \u003cdiv class=\"mb-3\">\n        \u003clabel for=\"nombreCompleto\" class=\"form-label\">Nombre completo\u003c/label>\n        \u003cinput type=\"text\" th:field=\"*{nombreCompleto}\" class=\"form-control\" th:errorclass=\"is-invalid\">\n        \u003cdiv class=\"invalid-feedback\" th:errors=\"*{nombreCompleto}\">Error\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"mb-3\">\n        \u003clabel for=\"email\" class=\"form-label\">Correo corporativo\u003c/label>\n        \u003cinput type=\"email\" th:field=\"*{email}\" class=\"form-control\" th:errorclass=\"is-invalid\" autocomplete=\"username\">\n        \u003cdiv class=\"invalid-feedback\" th:errors=\"*{email}\">Error\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"mb-3\">\n        \u003clabel for=\"areaId\" class=\"form-label\">Área\u003c/label>\n        \u003cselect th:field=\"*{areaId}\" class=\"form-select\" th:errorclass=\"is-invalid\">\n          \u003coption value=\"\">Elija su área…\u003c/option>\n          \u003coption th:each=\"a : ${areas}\" th:value=\"${a.id}\" th:text=\"${a.texto}\">Contabilidad\u003c/option>\n        \u003c/select>\n        \u003cdiv class=\"invalid-feedback\" th:errors=\"*{areaId}\">Error\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cdiv class=\"col-md-6 mb-3\">\n          \u003clabel for=\"password\" class=\"form-label\">Contraseña\u003c/label>\n          \u003cinput type=\"password\" th:field=\"*{password}\" class=\"form-control\" th:errorclass=\"is-invalid\" autocomplete=\"new-password\">\n          \u003cdiv class=\"invalid-feedback\" th:errors=\"*{password}\">Error\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"col-md-6 mb-3\">\n          \u003clabel for=\"confirmacion\" class=\"form-label\">Repítala\u003c/label>\n          \u003cinput type=\"password\" th:field=\"*{confirmacion}\" class=\"form-control\" th:errorclass=\"is-invalid\" autocomplete=\"new-password\">\n          \u003cdiv class=\"invalid-feedback\" th:errors=\"*{confirmacion}\">Error\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"form-text mb-3\">\n        Sus datos se tratan según la Ley 1581 de 2012 y solo se usan para atender sus solicitudes de soporte.\n      \u003c/div>\n      \u003cbutton type=\"submit\" class=\"btn btn-primary\">Crear cuenta\u003c/button>\n    \u003c/form>\n  \u003c/main>\n\n  \u003cth:block th:replace=\"~{fragmentos :: pie}\">\u003c/th:block>\n\u003c/body>\n\u003c/html>"},{"ruta":"src/main/resources/templates/cuenta/acceso-denegado.html","modo":"nuevo","nota":"","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead th:replace=\"~{fragmentos :: head('Acceso denegado')}\">\u003c/head>\n\u003cbody>\n  \u003cnav th:replace=\"~{fragmentos :: menu('')}\">\u003c/nav>\n\n  \u003cmain class=\"container my-5 text-center\" style=\"max-width: 560px\">\n    \u003cp class=\"display-1 fw-bold text-danger\">403\u003c/p>\n    \u003ch1 class=\"h3\">No tiene permiso para ver esta página\u003c/h1>\n    \u003cp class=\"text-muted\">Si cree que es un error, comuníquese con la coordinación de la mesa de ayuda.\u003c/p>\n    \u003ca class=\"btn btn-primary\" th:href=\"@{/}\">Volver al inicio\u003c/a>\n  \u003c/main>\n\n  \u003cth:block th:replace=\"~{fragmentos :: pie}\">\u003c/th:block>\n\u003c/body>\n\u003c/html>"}],"listo":"se ve la página de login propia de SoporteYa."},{"t":"El usuario real en los controladores","min":15,"intro":"Donde antes decía `HttpSession sesion` y `demo.email(sesion)`, ahora dice `Principal yo` y `yo.getName()`: el correo de quien inició sesión.","archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/controller/TicketController.java","modo":"reemplazar","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.controller;\n\nimport java.security.Principal;\nimport java.util.List;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\nimport org.springframework.validation.BindingResult;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.ModelAttribute;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RequestParam;\nimport org.springframework.web.servlet.mvc.support.RedirectAttributes;\n\nimport jakarta.validation.Valid;\n\nimport co.edu.sena.adso.soporteya.dto.OpcionDTO;\nimport co.edu.sena.adso.soporteya.dto.TextoForm;\nimport co.edu.sena.adso.soporteya.dto.TicketForm;\nimport co.edu.sena.adso.soporteya.dto.TicketResumenDTO;\nimport co.edu.sena.adso.soporteya.model.Prioridad;\nimport co.edu.sena.adso.soporteya.service.CategoriaService;\nimport co.edu.sena.adso.soporteya.service.NegocioException;\nimport co.edu.sena.adso.soporteya.service.TicketService;\n\n@Controller\n@RequestMapping(\"/tickets\")\npublic class TicketController {\n\n    private final TicketService tickets;\n    private final CategoriaService categorias;\n\n    public TicketController(TicketService tickets, CategoriaService categorias) {\n        this.tickets = tickets;\n        this.categorias = categorias;\n    }\n\n    @ModelAttribute(\"categorias\")\n    public List\u003cOpcionDTO> categorias() {\n        return categorias.opciones();\n    }\n\n    @ModelAttribute(\"prioridades\")\n    public Prioridad[] prioridades() {\n        return Prioridad.values();\n    }\n\n    // Mis tickets, por páginas\n    @GetMapping\n    public String misTickets(@RequestParam(name = \"pagina\", defaultValue = \"0\") int pagina,\n                             Principal yo, Model model) {\n        model.addAttribute(\"pagina\", tickets.misTickets(yo.getName(), pagina));\n        return \"tickets/lista\";\n    }\n\n    @GetMapping(\"/nuevo\")\n    public String nuevo(Model model) {\n        model.addAttribute(\"ticket\", new TicketForm());\n        return \"tickets/nuevo\";\n    }\n\n    @PostMapping\n    public String crear(@Valid @ModelAttribute(\"ticket\") TicketForm ticket, BindingResult resultado,\n                        Principal yo, RedirectAttributes flash) {\n        if (resultado.hasErrors()) {\n            return \"tickets/nuevo\";\n        }\n        try {\n            TicketResumenDTO creado = tickets.crear(ticket.aNuevoTicket(), yo.getName());\n            flash.addFlashAttribute(\"ok\", \"Ticket \" + creado.codigo() + \" creado. Fecha límite de atención: \"\n                    + creado.fechaLimite().toLocalDate());\n            return \"redirect:/tickets/\" + creado.id();\n        } catch (NegocioException e) {\n            Formularios.rechazar(resultado, e);\n            return \"tickets/nuevo\";\n        }\n    }\n\n    @GetMapping(\"/{id}\")\n    public String detalle(@PathVariable(\"id\") Long id, Principal yo, Model model) {\n        prepararDetalle(id, yo, model);\n        return \"tickets/detalle\";\n    }\n\n    @PostMapping(\"/{id}/comentarios\")\n    public String comentar(@PathVariable(\"id\") Long id, @Valid @ModelAttribute(\"comentario\") TextoForm form,\n                           BindingResult resultado, Principal yo, Model model, RedirectAttributes flash) {\n        if (!resultado.hasErrors()) {\n            try {\n                tickets.comentar(id, yo.getName(), form.getTexto(), form.isInterno());\n                flash.addFlashAttribute(\"ok\", \"Comentario agregado\");\n                return \"redirect:/tickets/\" + id;\n            } catch (NegocioException e) {\n                Formularios.rechazar(resultado, e);\n            }\n        }\n        prepararDetalle(id, yo, model);\n        return \"tickets/detalle\";\n    }\n\n    @PostMapping(\"/{id}/resolver\")\n    public String resolver(@PathVariable(\"id\") Long id, @Valid @ModelAttribute(\"resolucion\") TextoForm form,\n                           BindingResult resultado, Principal yo, Model model, RedirectAttributes flash) {\n        if (!resultado.hasErrors()) {\n            try {\n                tickets.resolver(id, yo.getName(), form.getTexto());\n                flash.addFlashAttribute(\"ok\", \"Ticket resuelto. Queda pendiente la confirmación del solicitante.\");\n                return \"redirect:/tickets/\" + id;\n            } catch (NegocioException e) {\n                Formularios.rechazar(resultado, e);\n            }\n        }\n        prepararDetalle(id, yo, model);\n        return \"tickets/detalle\";\n    }\n\n    @PostMapping(\"/{id}/reabrir\")\n    public String reabrir(@PathVariable(\"id\") Long id, @Valid @ModelAttribute(\"reapertura\") TextoForm form,\n                          BindingResult resultado, Principal yo, Model model, RedirectAttributes flash) {\n        if (!resultado.hasErrors()) {\n            try {\n                tickets.reabrir(id, yo.getName(), form.getTexto());\n                flash.addFlashAttribute(\"ok\", \"Ticket reabierto: vuelve al técnico\");\n                return \"redirect:/tickets/\" + id;\n            } catch (NegocioException e) {\n                Formularios.rechazar(resultado, e);\n            }\n        }\n        prepararDetalle(id, yo, model);\n        return \"tickets/detalle\";\n    }\n\n    @PostMapping(\"/{id}/cerrar\")\n    public String cerrar(@PathVariable(\"id\") Long id, Principal yo, RedirectAttributes flash) {\n        try {\n            tickets.cerrar(id, yo.getName());\n            flash.
