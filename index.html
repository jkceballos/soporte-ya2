<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía SoporteYa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Manual de obra de una mesa de ayuda: índice fijo a la izquierda (cajón en el celular), un capítulo a la vez, código siempre sobre azul noche */
:root {
  --fondo: #f2f5f8; --hoja: #ffffff; --tinta: #16202b; --tinta-2: #536170; --linea: #d5dde6;
  --marca: #1d3557; --marca-2: #2a4a72; --sobre-marca: #eef3f9;
  --turquesa: #1f7f74; --turquesa-suave: #e1f2ef; --ambar: #b07800; --ambar-suave: #fbf1d7; --coral: #c2492e; --coral-suave: #fbe7e1;
  --codigo: #0f1b2b; --codigo-tinta: #e6edf5; --enfoque: #e0a100;
  --display: "Bricolage Grotesque", "Arial Narrow", Arial, sans-serif;
  --texto: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --fondo: #0e141b; --hoja: #151e28; --tinta: #e3eaf2; --tinta-2: #9fb0c2; --linea: #2a3747;
  --marca: #10223a; --marca-2: #1c3555; --sobre-marca: #e3ecf7;
  --turquesa: #5cc9b9; --turquesa-suave: #12302c; --ambar: #f0c15a; --ambar-suave: #33280f; --coral: #ff9a80; --coral-suave: #3a1c15;
  --codigo: #0a121d; --codigo-tinta: #e6edf5; --enfoque: #f0c15a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --fondo: #0e141b; --hoja: #151e28; --tinta: #e3eaf2; --tinta-2: #9fb0c2; --linea: #2a3747;
  --marca: #10223a; --marca-2: #1c3555; --sobre-marca: #e3ecf7;
  --turquesa: #5cc9b9; --turquesa-suave: #12302c; --ambar: #f0c15a; --ambar-suave: #33280f; --coral: #ff9a80; --coral-suave: #3a1c15;
  --codigo: #0a121d; --codigo-tinta: #e6edf5; --enfoque: #f0c15a; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--fondo); color: var(--tinta); font-family: var(--texto); font-size: 16px; line-height: 1.6; }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--turquesa); }
code { font-family: var(--mono); font-size: .85em; background: var(--fondo); border: 1px solid var(--linea); border-radius: 4px; padding: 0 .3em; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--enfoque); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- barra superior ---------- */
.barra { position: sticky; top: 0; z-index: 20; background: var(--marca); color: var(--sobre-marca); padding-top: env(safe-area-inset-top, 0px); }
.barra-in { display: flex; align-items: center; gap: 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.barra h1 { font-size: 1.15rem; font-weight: 800; white-space: nowrap; }
.barra h1 a { color: inherit; text-decoration: none; }
.barra h1 span { color: #e9c46a; }
.avance { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; justify-content: flex-end; }
.avance-barra { flex: 0 1 220px; height: 8px; background: var(--marca-2); border-radius: 8px; overflow: hidden; }
.avance-barra i { display: block; height: 100%; width: 0; background: #e9c46a; transition: width .4s ease; }
.avance b { font-size: .82rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.boton-indice { display: none; border: 1.5px solid #ffffff55; background: transparent; color: inherit; border-radius: 8px; padding: 6px 10px; font-weight: 700; cursor: pointer; }

/* ---------- estructura ---------- */
.marco { display: grid; grid-template-columns: 280px minmax(0, 1fr); }
.indice { position: sticky; top: 52px; align-self: start; height: calc(100vh - 52px); overflow-y: auto; padding: 20px 14px 40px; border-right: 1px solid var(--linea); background: var(--hoja); }
.indice ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.indice a { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: var(--tinta); }
.indice a:hover { background: var(--fondo); }
.indice a[aria-current="page"] { background: var(--turquesa-suave); }
.indice .n { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--marca); color: var(--sobre-marca); font-family: var(--display); font-weight: 800; }
.indice a[aria-current="page"] .n { background: var(--turquesa); color: var(--hoja); }
.indice b { display: block; font-size: .92rem; line-height: 1.25; }
.indice small { display: block; color: var(--tinta-2); font-size: .76rem; font-variant-numeric: tabular-nums; }
.indice .mini { height: 4px; background: var(--linea); border-radius: 4px; margin-top: 4px; overflow: hidden; }
.indice .mini i { display: block; height: 100%; background: var(--turquesa); }
.indice .pie-indice { margin-top: 18px; padding: 12px 10px 0; border-top: 1px solid var(--linea); display: grid; gap: 8px; font-size: .82rem; color: var(--tinta-2); }
.velo { display: none; }

main { min-width: 0; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 80px max(16px, env(safe-area-inset-left, 0px)); }
.vista { max-width: 860px; margin: 0 auto; display: grid; gap: 34px; }
.vista > *, .seccion > *, .cuerpo-paso > * { min-width: 0; }

@media (max-width: 960px) {
  .marco { grid-template-columns: minmax(0, 1fr); }
  .boton-indice { display: inline-block; }
  .indice { position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: min(320px, 86vw); height: 100%; transform: translateX(-105%); transition: transform .25s ease; padding-top: calc(20px + env(safe-area-inset-top, 0px)); box-shadow: 0 0 40px #0005; }
  .indice.abierto { transform: none; }
  .velo.abierto { display: block; position: fixed; inset: 0; z-index: 25; background: #0007; }
  .avance-barra { flex-basis: 90px; }
}

/* ---------- cabecera de capítulo ---------- */
.cabecera { display: grid; gap: 12px; }
.antetitulo { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--turquesa); }
.cabecera h2 { font-size: clamp(1.9rem, 6vw, 2.8rem); font-weight: 800; }
.cabecera .resumen { font-size: 1.1rem; max-width: 66ch; }
.rap { font-size: .85rem; color: var(--tinta-2); }
.objetivos { margin: 0; padding: 14px 18px 14px 36px; background: var(--hoja); border: 1px solid var(--linea); border-radius: 12px; display: grid; gap: 4px; }
.objetivos-titulo { font-weight: 700; font-size: .9rem; }
.saltos { display: flex; flex-wrap: wrap; gap: 6px; }
.saltos button { border: 1.5px solid var(--linea); background: var(--hoja); border-radius: 20px; padding: 5px 12px; font-size: .86rem; font-weight: 700; cursor: pointer; }
.saltos button:hover { border-color: var(--turquesa); color: var(--turquesa); }

/* ---------- secciones ---------- */
.seccion { display: grid; gap: 16px; scroll-margin-top: 70px; }
.seccion > h3 { font-size: 1.55rem; font-weight: 800; display: flex; align-items: baseline; gap: 10px; padding-bottom: 6px; border-bottom: 3px solid var(--marca); }
.seccion > h3 small { font-family: var(--texto); font-size: .8rem; font-weight: 700; color: var(--tinta-2); letter-spacing: .06em; text-transform: uppercase; }
.tema { display: grid; gap: 12px; background: var(--hoja); border: 1px solid var(--linea); border-radius: 14px; padding: 18px; }
.tema h4 { font-size: 1.2rem; }
.tema > p, .tema li { max-width: 70ch; }
.tema ul, .tema ol, .cuerpo-paso ul, .cuerpo-paso ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }

.tbl { overflow-x: auto; border: 1px solid var(--linea); border-radius: 10px; background: var(--hoja); }
.tbl table { border-collapse: collapse; width: 100%; font-size: .9rem; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--linea); vertical-align: top; }
.tbl th { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); background: var(--fondo); }
.tbl tr:last-child td { border-bottom: 0; }

.nota { border-radius: 10px; padding: 12px 14px; border-left: 5px solid; }
.nota.clave { background: var(--turquesa-suave); border-color: var(--turquesa); }
.nota.ojo { background: var(--coral-suave); border-color: var(--coral); }
.nota.pista { background: var(--ambar-suave); border-color: var(--ambar); }
.nota .et { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
.nota.clave .et { color: var(--turquesa); } .nota.ojo .et { color: var(--coral); } .nota.pista .et { color: var(--ambar); }

figure { margin: 0; background: var(--hoja); border: 1px solid var(--linea); border-radius: 12px; padding: 12px; overflow-x: auto; }
figure svg { display: block; width: 100%; min-width: 520px; height: auto; }
figcaption { font-size: .82rem; color: var(--tinta-2); margin-top: 6px; }
.svg-caja { fill: var(--hoja); stroke: var(--marca-2); stroke-width: 1.5; }
.svg-caja.fuerte { fill: var(--marca); stroke: var(--marca); }
.svg-caja.turq { fill: var(--turquesa-suave); stroke: var(--turquesa); }
.svg-caja.coral { fill: var(--coral-suave); stroke: var(--coral); }
.svg-caja.gris { fill: var(--fondo); stroke: var(--linea); stroke-dasharray: 5 4; }
.svg-t { fill: var(--tinta); font-family: var(--texto); font-size: 13px; }
.svg-t.b { font-weight: 700; font-family: var(--display); font-size: 14px; }
.svg-t.claro { fill: var(--sobre-marca); }
.svg-t.chico { font-size: 11px; fill: var(--tinta-2); }
.svg-t.mono { font-family: var(--mono); font-size: 11px; }
.svg-l { stroke: var(--tinta-2); stroke-width: 1.6; fill: none; }
.svg-flecha { fill: var(--tinta-2); }

/* ---------- código ---------- */
.codigo { border-radius: 10px; overflow: hidden; background: var(--codigo); }
.codigo-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px 6px 12px; background: #ffffff10; color: #b7c7d9; font-family: var(--mono); font-size: .76rem; }
.codigo-cab span { overflow-wrap: anywhere; }
.copiar { border: 1px solid #ffffff40; background: transparent; color: #e6edf5; border-radius: 6px; padding: 3px 10px; font-size: .78rem; font-weight: 700; cursor: pointer; white-space: nowrap; font-family: var(--texto); }
.copiar:hover { background: #ffffff18; }
pre { margin: 0; padding: 12px 14px; color: var(--codigo-tinta); font-family: var(--mono); font-size: .8rem; line-height: 1.55; overflow-x: auto; white-space: pre; tab-size: 4; }
.tk-c { color: #7d93ab; font-style: italic; }
.tk-s { color: #a5d6a7; }
.tk-k { color: #ffb86b; }
.tk-a { color: #e9c46a; }
.tk-t { color: #8cc8ff; }
.tk-n { color: #f4a3c0; }
.tk-v { color: #ffd479; }
.tk-th { color: #5ee0c8; }

.archivo { border: 1px solid var(--linea); border-radius: 12px; overflow: hidden; background: var(--hoja); }
.archivo-cab { display: grid; gap: 4px; padding: 10px 12px; }
.archivo-ruta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-family: var(--mono); font-size: .82rem; font-weight: 600; overflow-wrap: anywhere; }
.archivo-ruta span.r { min-width: 0; overflow-wrap: anywhere; }
.insignia { font-family: var(--texto); font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
.insignia.nuevo { background: var(--turquesa-suave); color: var(--turquesa); border: 1px solid var(--turquesa); }
.insignia.reemplazar { background: var(--ambar-suave); color: var(--ambar); border: 1px solid var(--ambar); }
.archivo-nota { font-size: .9rem; color: var(--tinta-2); }
.archivo details > summary { cursor: pointer; padding: 8px 12px; font-size: .86rem; font-weight: 700; color: var(--turquesa); border-top: 1px solid var(--linea); list-style: none; }
.archivo details > summary::-webkit-details-marker { display: none; }
.archivo details > summary::before { content: '▸ '; }
.archivo details[open] > summary::before { content: '▾ '; }
.archivo .codigo { border-radius: 0; }

/* ---------- pasos ---------- */
.pasos-lista { display: grid; gap: 10px; }
.paso { background: var(--hoja); border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; }
.paso.hecho { border-color: var(--turquesa); }
.paso.opcional { border-style: dashed; }
.paso > summary { list-style: none; cursor: pointer; padding: 14px; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.paso > summary::-webkit-details-marker { display: none; }
.paso .num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--marca); color: var(--sobre-marca); font-weight: 700; font-variant-numeric: tabular-nums; }
.paso.hecho .num { background: var(--turquesa); color: var(--hoja); }
.paso .tit b { display: block; line-height: 1.25; }
.paso .tit small { color: var(--tinta-2); font-size: .82rem; }
.paso .min { font-size: .8rem; color: var(--tinta-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cuerpo-paso { padding: 0 14px 16px; display: grid; gap: 14px; }
.listo { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; background: var(--turquesa-suave); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.listo input, .lista-chequeo input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--turquesa); }

/* ---------- verificar, autoevaluación, ahora usted, errores ---------- */
.lista-chequeo { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.lista-chequeo label { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: start; background: var(--hoja); border: 1px solid var(--linea); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.lista-chequeo label:has(input:checked) { border-color: var(--turquesa); background: var(--turquesa-suave); }
.pregunta { background: var(--hoja); border: 1px solid var(--linea); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.pregunta .enunciado { font-weight: 700; }
.opciones { display: grid; gap: 6px; }
.opciones button { text-align: left; border: 1.5px solid var(--linea); background: var(--fondo); border-radius: 10px; padding: 9px 12px; cursor: pointer; }
.opciones button:hover:not(:disabled) { border-color: var(--turquesa); }
.opciones button.bien { border-color: var(--turquesa); background: var(--turquesa-suave); font-weight: 700; }
.opciones button.mal { border-color: var(--coral); background: var(--coral-suave); }
.opciones button:disabled { cursor: default; }
.explicacion { font-size: .94rem; padding: 10px 12px; border-radius: 10px; background: var(--fondo); }
.puntaje { font-weight: 700; color: var(--turquesa); font-variant-numeric: tabular-nums; }
.reintentar { border: 1.5px solid var(--linea); background: var(--hoja); border-radius: 8px; padding: 5px 12px; font-weight: 700; cursor: pointer; }
.error { background: var(--hoja); border: 1px solid var(--linea); border-left: 5px solid var(--coral); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.error code.sintoma { color: var(--coral); background: transparent; border: 0; padding: 0; font-weight: 600; }

.navega { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--linea); }
.navega a { display: grid; gap: 2px; text-decoration: none; padding: 10px 14px; border: 1.5px solid var(--linea); border-radius: 12px; background: var(--hoja); color: var(--tinta); max-width: 48%; }
.navega a small { color: var(--tinta-2); font-size: .78rem; }
.navega a.sig { margin-left: auto; text-align: right; }

/* ---------- inicio ---------- */
.portada { background: var(--marca); color: var(--sobre-marca); border-radius: 18px; padding: clamp(20px, 5vw, 36px); display: grid; gap: 12px; }
.portada .antetitulo { color: #e9c46a; }
.portada h2 { font-size: clamp(2rem, 7vw, 3.2rem); font-weight: 800; }
.portada p { max-width: 62ch; font-size: 1.08rem; }
.boton { display: inline-block; border-radius: 10px; padding: 10px 16px; font-weight: 700; text-decoration: none; border: 1.5px solid; }
.boton.claro { background: #e9c46a; border-color: #e9c46a; color: #16202b; }
.tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.tarjeta { background: var(--hoja); border: 1px solid var(--linea); border-radius: 12px; padding: 14px; display: grid; gap: 6px; align-content: start; }
.tarjeta p { color: var(--tinta-2); font-size: .94rem; }
.tarjeta small { color: var(--turquesa); font-weight: 700; font-size: .8rem; }
.mapa { display: grid; gap: 8px; }
.mapa a { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; background: var(--hoja); border: 1px solid var(--linea); border-radius: 12px; text-decoration: none; color: var(--tinta); }
.mapa a:hover { border-color: var(--turquesa); }
.mapa .n { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; background: var(--marca); color: var(--sobre-marca); font-family: var(--display); font-weight: 800; font-size: 1.2rem; }
.mapa b { display: block; }
.mapa small { color: var(--tinta-2); font-size: .84rem; }
.mapa .pct { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--turquesa); }
.momentos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; counter-reset: m; }
.momentos div { background: var(--hoja); border: 1px solid var(--linea); border-radius: 12px; padding: 12px; display: grid; gap: 4px; }
.momentos b::before { counter-increment: m; content: counter(m) " · "; color: var(--turquesa); }
.momentos p { font-size: .9rem; color: var(--tinta-2); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="barra">
  <div class="barra-in">
    <button type="button" class="boton-indice" id="abrirIndice" aria-controls="indice" aria-expanded="false">☰ Capítulos</button>
    <h1><a href="#inicio">Soporte<span>Ya</span> · guía</a></h1>
    <div class="avance" aria-label="Avance total"><div class="avance-barra"><i id="avanceTotal"></i></div><b id="avanceTexto">0 %</b></div>
  </div>
</header>
<div class="marco">
  <nav class="indice" id="indice" aria-label="Capítulos"></nav>
  <div class="velo" id="velo"></div>
  <main id="app"></main>
</div>

<script>
'use strict';
const D = {"capitulos":[{"id":"u0","num":"0","titulo":"Trabajar como un equipo real","sesiones":"Sesiones 1 y 2 · 18 y 19 de noviembre","rap":"593108 · Codificar el software de acuerdo con el diseño establecido","resumen":"SoporteYa nace como un repositorio en GitHub, un tablero con historias de usuario y un proyecto Spring Boot vacío que ya arranca. Desde aquí, todo cambio entra por una rama y un pull request.","objetivos":["Organizar el trabajo con un Scrum ligero: roles, sprint, reunión diaria y tablero.","Escribir historias de usuario con criterios de aceptación verificables.","Trabajar con GitHub Flow: rama, commits pequeños, pull request, revisión y fusión.","Crear el proyecto base con la estructura por capas que usaremos hasta el final."],"teoria":[{"t":"¿Por qué un equipo necesita un método?","b":["Cuatro personas que programan sin acuerdos chocan siempre en lo mismo: dos hacen la misma tarea y nadie hace la otra, el código de uno rompe el del otro, alguien borra cambios ajenos y el cliente ve el resultado cuando ya es tarde para corregir.","Un **método** es un conjunto pequeño de acuerdos que evita esos choques. En el curso usamos dos: **Scrum ligero** para organizar *qué* se hace y *cuándo*, y **GitHub Flow** para organizar *cómo* entra el código al proyecto."]},{"t":"Scrum ligero","b":["Scrum construye el producto en ciclos cortos llamados **sprints**. Al final de cada uno hay algo que funciona y que el cliente puede ver.",["tabla",["En Scrum","En este curso"],[["Dueño del producto: decide qué se construye y en qué orden","El instructor, que hace de cliente"],["Equipo de desarrollo","Su equipo del proyecto formativo"],["Sprint","Una unidad de esta guía (de 1 a 4 sesiones)"],["Reunión diaria","Los primeros 10 minutos de cada sesión: ¿qué hice?, ¿qué haré?, ¿qué me bloquea?"],["Backlog del producto","El tablero de GitHub Projects con todas las historias"],["Revisión del sprint","La demo del MVP (27 de noviembre) y la sustentación (15 de diciembre)"],["Retrospectiva","15 minutos al cerrar cada unidad: qué funcionó, qué mejorar y una acción"]]],["nota","clave","**Definición de terminado.** Una historia está terminada cuando compila y arranca, cumple sus criterios de aceptación, respeta las capas (controlador → servicio → repositorio), no tiene contraseñas en el código y tiene un pull request revisado y fusionado."]]},{"t":"Historias de usuario","b":["Una historia describe una necesidad desde el punto de vista de quien la tiene. Se escribe en tres partes y se acompaña de **criterios de aceptación** que se pueden comprobar con un sí o un no.",["code","HU04 · Tomar un ticket","Como técnico\nquiero tomar un ticket abierto de mi especialidad\npara que el solicitante sepa quién lo atiende.\n\nCriterios de aceptación\n- Dado un ticket ABIERTO de Hardware y un técnico de Hardware,\n  cuando lo toma, entonces queda EN CURSO y a su nombre.\n- Dado un ticket que ya tomó otro técnico,\n  cuando intento tomarlo, entonces veo «ya no está abierto».\n- Dado un ticket de Impresoras y un técnico sin esa especialidad,\n  cuando intento tomarlo, entonces veo «No tiene la especialidad»."],"Los criterios con la forma **Dado… cuando… entonces…** se convierten después, casi palabra por palabra, en reglas del servicio y en casos de prueba."]},{"t":"Git en tres zonas","b":[["tabla",["Zona","Qué hay","Cómo se pasa a la siguiente"],[["Su carpeta","Los archivos que está editando","`git add` los prepara"],["Preparación (staging)","Lo que irá en el próximo commit","`git commit` los guarda en la historia"],["Repositorio local","La historia completa en su computador","`git push` la sube a GitHub"],["GitHub","La copia que comparte el equipo","`git pull` trae lo de los demás"]]],"Los mensajes de commit siguen la convención **Conventional Commits**: un tipo, dos puntos y qué cambió en presente. Así el historial se lee como una lista de tareas.",["tabla",["Tipo","Cuándo","Ejemplo"],[["`feat`","Una funcionalidad nueva","feat: tablero de tickets pendientes"],["`fix`","Corrige un error","fix: el técnico sin especialidad podía tomar tickets"],["`docs`","Solo documentación","docs: instrucciones de Docker en el README"],["`chore`","Configuración o mantenimiento","chore: proyecto base con Spring Boot"],["`refactor`","Mejora el código sin cambiar lo que hace","refactor: reglas de estado en EstadoTicket"]]]]},{"t":"GitHub Flow","b":["`main` siempre funciona. Nadie trabaja directamente en ella: cada tarea vive en una **rama** que termina en un **pull request** (PR) que otra persona revisa antes de fusionar.",["pasos",["Actualice main: `git switch main` y `git pull`","Cree su rama: `git switch -c feature/HU04-tomar-ticket`","Haga commits pequeños con mensajes claros","Suba la rama: `git push -u origin feature/HU04-tomar-ticket`","Abra el PR con la plantilla y pida revisión","El revisor comenta, usted corrige, y cuando hay aprobación se fusiona y se borra la rama"]],["nota","pista","**Colaborador o fork.** En el proyecto formativo todos son **colaboradores** del mismo repositorio y cada uno trabaja en su rama. En el código abierto, cada persona hace un **fork** (una copia en su cuenta) y propone cambios al original con un PR."],["nota","ojo","**Conflicto.** Si dos ramas cambian la misma línea, Git no adivina cuál dejar: marca el archivo con `\u003c\u003c\u003c\u003c\u003c\u003c\u003c`, `=======` y `>>>>>>>`. Usted elige el resultado, borra las marcas, hace `git add` y `git commit`. Los conflictos se evitan con ramas cortas y archivos propios para cada módulo."]]},{"t":"La arquitectura por capas de SoporteYa","b":["El proyecto tendrá la misma forma desde el primer día. Cada capa solo habla con la de abajo:",["code","Paquetes de co.edu.sena.adso.soporteya","controller   recibe la petición, elige la vista o responde JSON\n    ↓\nservice      reglas de negocio y transacciones\n    ↓\nrepository   consultas a la base de datos (Spring Data JPA)\n    ↓\nmodel        entidades: las tablas y sus relaciones\n\ndto          objetos que viajan entre capas: formularios y respuestas\nconfig       seguridad, datos iniciales y otros ajustes"],"Esta separación es la que permite, por ejemplo, que en la Unidad 4 una API con token use **los mismos servicios** que las páginas web, sin repetir una sola regla."]}],"pasos":[{"t":"El repositorio y sus plantillas","min":20,"quien":"Cada aprendiz, en su propia cuenta","intro":"Cree en **su** cuenta de GitHub un repositorio **público** llamado `soporteya` con un README. SoporteYa es su práctica individual: no agregue colaboradores. Después cree estos tres archivos con **Add file → Create new file**; son las mismas plantillas que usará después en el proyecto formativo.","archivos":[{"ruta":".github/pull_request_template.md","modo":"nuevo","nota":"","lang":"md","codigo":"## Qué cambia\n\n\u003c!-- Una o dos frases -->\n\n## Historia de usuario\n\nCloses #\n\n## Cómo probarlo\n\n1.\n2.\n\n## Lista de chequeo\n\n- [ ] Compila y arranca sin errores\n- [ ] Cumple los criterios de aceptación de la historia\n- [ ] Respeta las capas: controlador → servicio → repositorio\n- [ ] No hay contraseñas ni datos sensibles en el código"},{"ruta":".github/ISSUE_TEMPLATE/historia-de-usuario.md","modo":"nuevo","nota":"","lang":"md","codigo":"---\nname: Historia de usuario\nabout: Una necesidad de un usuario de SoporteYa\nlabels: historia\n---\n\n**Como** (rol)\n**quiero** (acción)\n**para** (beneficio)\n\n### Criterios de aceptación\n\n- [ ] Dado … cuando … entonces …\n- [ ] Dado … cuando … entonces …\n\n### Prioridad\n\nMVP / Posterior"},{"ruta":".gitignore","modo":"nuevo","nota":"","lang":"props","codigo":"target/\n.idea/\n.vscode/\n*.log\n.env"}],"despues":[["nota","clave","Proteja `main`: **Settings → Rules → Rulesets → New branch ruleset**, objetivo *Include default branch*, con **Require a pull request before merging** y **Block force pushes**. En *Required approvals* deje **0**: trabaja solo y GitHub no deja aprobar el PR propio. Así todo entra por PR, aunque usted mismo lo fusione. En el proyecto formativo, con equipo, sí se exige 1 aprobación."]],"listo":"un `git push` directo a `main` es rechazado por GitHub."},{"t":"El tablero con las historias de SoporteYa","min":30,"quien":"Cada aprendiz","intro":"En su repositorio, cree las etiquetas `historia`, `U1` a `U6` y `mvp`. Luego un issue por historia con la plantilla, y el tablero en **Projects → New project → Board** con las columnas Backlog, Por hacer, En curso, En revisión y Hecho.","antes":[["tabla",["Código","Como…","quiero…","Unidad"],[["HU01","solicitante","reportar una falla eligiendo categoría y prioridad","U1–U2 · mvp"],["HU02","solicitante","ver mis tickets y en qué estado están","U1–U2 · mvp"],["HU03","técnico","ver el tablero de tickets pendientes, los más urgentes primero","U1–U2 · U4"],["HU04","técnico","tomar un ticket abierto de mi especialidad","U1–U2 · mvp"],["HU05","técnico","registrar la solución y marcar el ticket como resuelto","U2 · mvp"],["HU06","solicitante","confirmar la solución o reabrir el ticket","U2"],["HU07","todos","comentar un ticket; el personal de TI deja notas internas","U2–U3"],["HU08","coordinador","gestionar las categorías de fallas","U2"],["HU09","coordinador","gestionar usuarios, roles y especialidades","U2–U3"],["HU10","coordinador","ver el cumplimiento de tiempos por técnico","U1–U2"],["HU11","funcionario","registrarme e iniciar sesión con mi correo de la empresa","U3"],["HU12","pantalla de TI","consultar los pendientes por API con un token","U4"],["HU13","funcionario","ingresar con mi cuenta de Google (opcional)","U3"]]]],"listo":"las 13 historias están en el tablero con su unidad y su etiqueta.","archivos":[]},{"t":"El proyecto base","min":40,"quien":"Cada aprendiz","intro":"En la terminal: `git switch -c chore/proyecto-base`. En [start.spring.io](https://start.spring.io) genere el proyecto con estos datos y copie su contenido en la carpeta del repositorio.","antes":[["tabla",["Pregunta","Respuesta"],[["Project / Language","Maven · Java"],["Spring Boot","La versión 4.x estable que le ofrezca"],["Group / Artifact","`co.edu.sena.adso` / `soporteya`"],["Java","21"],["Dependencias","Spring Web, Thymeleaf, Spring Data JPA, PostgreSQL Driver, Validation, Spring Boot DevTools"]]],["nota","pista","En Spring Boot 4 el iniciador web se llama `spring-boot-starter-webmvc` (antes `spring-boot-starter-web`). Initializr lo pone solo; si copia un `pom.xml` viejo, cámbielo."]],"archivos":[{"ruta":"pom.xml","modo":"reemplazar","nota":"Compare con el suyo: deben estar las mismas dependencias.","lang":"html","codigo":"\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\u003cproject xmlns=\"http://maven.apache.org/POM/4.0.0\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n         xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd\">\n    \u003cmodelVersion>4.0.0\u003c/modelVersion>\n\n    \u003c!-- Use la versión 4.x estable que le ofrezca Spring Initializr -->\n    \u003cparent>\n        \u003cgroupId>org.springframework.boot\u003c/groupId>\n        \u003cartifactId>spring-boot-starter-parent\u003c/artifactId>\n        \u003cversion>4.1.0\u003c/version>\n        \u003crelativePath/>\n    \u003c/parent>\n\n    \u003cgroupId>co.edu.sena.adso\u003c/groupId>\n    \u003cartifactId>soporteya\u003c/artifactId>\n    \u003cversion>0.0.1-SNAPSHOT\u003c/version>\n    \u003cname>soporteya\u003c/name>\n    \u003cdescription>Mesa de ayuda de TI · proyecto guía ADSO\u003c/description>\n\n    \u003cproperties>\n        \u003cjava.version>21\u003c/java.version>\n    \u003c/properties>\n\n    \u003cdependencies>\n        \u003cdependency>\n            \u003cgroupId>org.springframework.boot\u003c/groupId>\n            \u003cartifactId>spring-boot-starter-webmvc\u003c/artifactId>\n        \u003c/dependency>\n        \u003cdependency>\n            \u003cgroupId>org.springframework.boot\u003c/groupId>\n            \u003cartifactId>spring-boot-starter-thymeleaf\u003c/artifactId>\n        \u003c/dependency>\n        \u003cdependency>\n            \u003cgroupId>org.springframework.boot\u003c/groupId>\n            \u003cartifactId>spring-boot-starter-data-jpa\u003c/artifactId>\n        \u003c/dependency>\n        \u003cdependency>\n            \u003cgroupId>org.springframework.boot\u003c/groupId>\n            \u003cartifactId>spring-boot-starter-validation\u003c/artifactId>\n        \u003c/dependency>\n        \u003cdependency>\n            \u003cgroupId>org.postgresql\u003c/groupId>\n            \u003cartifactId>postgresql\u003c/artifactId>\n            \u003cscope>runtime\u003c/scope>\n        \u003c/dependency>\n        \u003cdependency>\n            \u003cgroupId>org.springframework.boot\u003c/groupId>\n            \u003cartifactId>spring-boot-devtools\u003c/artifactId>\n            \u003cscope>runtime\u003c/scope>\n            \u003coptional>true\u003c/optional>\n        \u003c/dependency>\n        \u003cdependency>\n            \u003cgroupId>org.springframework.boot\u003c/groupId>\n            \u003cartifactId>spring-boot-starter-webmvc-test\u003c/artifactId>\n            \u003cscope>test\u003c/scope>\n        \u003c/dependency>\n    \u003c/dependencies>\n\n    \u003cbuild>\n        \u003cplugins>\n            \u003cplugin>\n                \u003cgroupId>org.springframework.boot\u003c/groupId>\n                \u003cartifactId>spring-boot-maven-plugin\u003c/artifactId>\n            \u003c/plugin>\n        \u003c/plugins>\n    \u003c/build>\n\u003c/project>"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/SoporteYaApplication.java","modo":"nuevo","nota":"Initializr lo crea como SoporteyaApplication; puede dejar ese nombre.","lang":"java","codigo":"package co.edu.sena.adso.soporteya;\n\nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\n@SpringBootApplication\npublic class SoporteYaApplication {\n\n    public static void main(String[] args) {\n        SpringApplication.run(SoporteYaApplication.class, args);\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/model/package-info.java","modo":"nuevo","nota":"Cree uno igual en controller, service, repository, dto y config, cambiando la descripción. Así Git guarda las carpetas aunque estén vacías.","lang":"java","codigo":"/**\n * Entidades JPA: las tablas del sistema y sus relaciones.\n */\npackage co.edu.sena.adso.soporteya.model;"},{"ruta":"src/main/resources/application.properties","modo":"reemplazar","nota":"","lang":"props","codigo":"spring.application.name=soporteya\nspring.thymeleaf.cache=false\n\n# PostgreSQL. La contraseña NO se escribe aquí: llega por la variable DB_PASSWORD\nspring.datasource.url=jdbc:postgresql://localhost:5432/soporteya\nspring.datasource.username=adso\nspring.datasource.password=${DB_PASSWORD}\n\nspring.jpa.hibernate.ddl-auto=update\nspring.jpa.show-sql=true\nspring.jpa.open-in-view=false"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/controller/InicioController.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.controller;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.web.bind.annotation.GetMapping;\n\n@Controller\npublic class InicioController {\n\n    @GetMapping(\"/\")\n    public String inicio() {\n        return \"index\";\n    }\n}"},{"ruta":"src/main/resources/templates/index.html","modo":"nuevo","nota":"","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>SoporteYa · Mesa de ayuda\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css\">\n  \u003clink rel=\"stylesheet\" th:href=\"@{/css/soporteya.css}\">\n\u003c/head>\n\u003cbody>\n  \u003cheader class=\"portada py-5\">\n    \u003cdiv class=\"container\">\n      \u003cp class=\"text-uppercase small mb-2\">Mesa de ayuda de TI\u003c/p>\n      \u003ch1 class=\"display-5 fw-bold\">SoporteYa\u003c/h1>\n      \u003cp class=\"lead mb-0\">Reporte la falla, siga su ticket y sepa quién lo está atendiendo.\u003c/p>\n    \u003c/div>\n  \u003c/header>\n  \u003cmain class=\"container my-5\">\n    \u003cdiv class=\"row g-3\">\n      \u003cdiv class=\"col-md-4\">\u003cdiv class=\"card card-body h-100\">\u003ch2 class=\"h5\">Solicitantes\u003c/h2>\u003cp class=\"mb-0\">Crean tickets y siguen su estado.\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"col-md-4\">\u003cdiv class=\"card card-body h-100\">\u003ch2 class=\"h5\">Técnicos\u003c/h2>\u003cp class=\"mb-0\">Toman los tickets de su especialidad y los resuelven.\u003c/p>\u003c/div>\u003c/div>\n      \u003cdiv class=\"col-md-4\">\u003cdiv class=\"card card-body h-100\">\u003ch2 class=\"h5\">Coordinación\u003c/h2>\u003cp class=\"mb-0\">Administra categorías y usuarios, y mide los tiempos.\u003c/p>\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/main>\n\u003c/body>\n\u003c/html>"},{"ruta":"src/main/resources/static/css/soporteya.css","modo":"nuevo","nota":"","lang":"css","codigo":"/* SoporteYa · colores de la marca */\n:root {\n  --sy-azul: #1d3557;\n  --sy-turquesa: #2a9d8f;\n  --sy-ambar: #e9c46a;\n  --sy-rojo: #e76f51;\n}\n\n.portada {\n  background: linear-gradient(135deg, var(--sy-azul), var(--sy-turquesa));\n  color: #fff;\n}"},{"ruta":"README.md","modo":"reemplazar","nota":"","lang":"md","codigo":"# SoporteYa · Mesa de ayuda de TI\n\nProyecto guía del programa ADSO (SENA, ficha 3230489). Los funcionarios de una empresa reportan fallas de tecnología y los técnicos las atienden con tiempos de respuesta medidos.\n\n## Cómo ejecutarlo\n\n```bash\nsudo -u postgres psql -c \"CREATE DATABASE soporteya OWNER adso;\"\nDB_PASSWORD=su_clave ./mvnw spring-boot:run\n```\n\nAbra http://localhost:8080\n\n## Equipo\n\n| Integrante | Rol en Scrum | Módulo |\n|---|---|---|\n| (nombre) | Dueño del producto | Tickets |\n| (nombre) | Scrum Master | Tablero técnico |\n| (nombre) | Desarrollo | Administración |"}],"listo":"el proyecto compila con `./mvnw compile`."},{"t":"La base de datos y el primer arranque","min":15,"quien":"Cada aprendiz","cmd":[["Terminal","sudo -u postgres psql -c \"CREATE DATABASE soporteya OWNER adso;\"\nDB_PASSWORD=su_clave ./mvnw spring-boot:run"]],"despues":["Abra `http://localhost:8080`: debe ver la portada azul de SoporteYa con las tres tarjetas.",["nota","ojo","La contraseña **nunca** se escribe en `application.properties`: el repositorio es público y cualquiera la leería. Llega por la variable de entorno `DB_PASSWORD`. En la Unidad 5 todas las claves se manejan así."]],"listo":"la portada se ve en `http://localhost:8080`.","archivos":[]},{"t":"El primer pull request","min":15,"quien":"Cada aprendiz","cmd":[["Terminal","git add .\ngit commit -m \"chore: proyecto base de SoporteYa\"\ngit push -u origin chore/proyecto-base"]],"despues":["En GitHub, **Compare & pull request** y complete la plantilla. Antes de fusionar, haga su propia revisión: abra la pestaña **Files changed** y recorra la lista de chequeo de la plantilla. Luego **Merge pull request**, borre la rama y en la terminal: `git switch main` y `git pull`. Repita este ciclo (rama, PR, revisión, merge) en cada unidad."],"listo":"el proyecto base está en `main` y entró por un PR.","archivos":[]}],"verificar":[["`main` rechaza un push directo","Settings → Rules muestra el ruleset activo"],["El tablero de su repositorio tiene las 13 historias","Cada una con etiqueta de unidad; las del MVP con `mvp`"],["`http://localhost:8080` muestra la portada","Con Bootstrap y los colores de SoporteYa"],["El historial tiene un commit `chore:` que entró por PR","`git log --oneline` y la pestaña Pull requests"]],"quiz":[{"p":"¿Qué hace un **Dueño del producto** en Scrum?","op":["Escribe la mayor parte del código","Decide qué se construye y en qué orden","Revisa todos los pull request","Convoca la reunión diaria"],"ok":1,"exp":"El Dueño del producto ordena el backlog según lo que más valor da al cliente. En el curso ese papel lo cumple el instructor."},{"p":"¿Cuál es el mejor criterio de aceptación?","op":["El tablero debe ser rápido","El sistema debe ser fácil de usar","Dado un ticket que ya tomó otro técnico, cuando intento tomarlo, entonces veo «ya no está abierto»","El técnico debe poder trabajar cómodo"],"ok":2,"exp":"Un criterio se puede comprobar con un sí o un no. «Rápido» o «fácil» no se pueden verificar sin una medida."},{"p":"¿Qué mensaje de commit sigue Conventional Commits?","op":["cambios varios","feat: tablero de tickets pendientes","Arreglé lo del login por fin","FEAT TABLERO"],"ok":1,"exp":"Tipo en minúscula, dos puntos y qué cambia, en presente y en pocas palabras."},{"p":"¿Por qué la contraseña de la base de datos llega por `${DB_PASSWORD}`?","op":["Porque Spring no acepta contraseñas en los archivos","Porque el repositorio es público y cualquiera podría leerla","Para que la aplicación arranque más rápido","Porque PostgreSQL lo exige"],"ok":1,"exp":"Todo lo que se sube a un repositorio público es visible para cualquiera, incluso si después se borra: queda en el historial."}],"ahora":["El repositorio del proyecto formativo es público, con las plantillas y `main` protegida.","Todas las historias de su proyecto están en el tablero, con criterios de aceptación verificables.","Cada integrante es dueño de un módulo (una o dos entidades con sus historias).","El proyecto base del equipo tiene los paquetes por capas y arranca en todos los computadores.","Cada integrante abrió su rama `feature/\u003cmodulo>` y su primer PR en borrador."],"errores":[["`! [remote rejected] main -> main (push declined due to repository rule violations)`","Intentó subir directo a `main`, que está protegida","Cree una rama, súbala y abra un PR"],["`password authentication failed for user \"adso\"`","La variable `DB_PASSWORD` no coincide con la clave del usuario en PostgreSQL","Revise la clave o cámbiela con `ALTER USER adso PASSWORD '…'`"],["`Could not resolve placeholder 'DB_PASSWORD'`","Ejecutó sin la variable de entorno","`DB_PASSWORD=su_clave ./mvnw spring-boot:run`"],["Los `package-info.java` no aparecen en GitHub","Git no guarda carpetas vacías y el archivo no se agregó","`git status` y `git add` de la carpeta"]]},{"id":"u1","num":"1","titulo":"Persistencia avanzada","sesiones":"Sesiones 3 a 5 · 20 al 24 de noviembre","rap":"593108 · Codificar el software · 593107 · Construir la base de datos","resumen":"SoporteYa gana su modelo: siete entidades relacionadas, consultas que escribe Spring, un reporte con JPQL y un ciclo de vida del ticket que se cumple completo o no se cumple. Todavía sin páginas: lo probamos en la consola y en psql.","objetivos":["Mapear relaciones uno a muchos, muchos a uno y muchos a muchos, y elegir el lado dueño.","Distinguir composición (cascade) de asociación, y carga perezosa de carga ansiosa.","Escribir consultas derivadas, JPQL con `join fetch`, proyecciones a DTO y paginación.","Proteger una regla de negocio con `@Transactional` y evitar cambios simultáneos con `@Version`."],"teoria":[{"t":"El modelo de SoporteYa","b":[["svg","modelo"],["tabla",["Relación","Tipo","Lado dueño (tiene la columna)"],[["Usuario → Área","Muchos a uno","`usuario.area_id`"],["Ticket → Usuario (solicitante y técnico)","Dos muchos a uno hacia la misma tabla","`ticket.solicitante_id`, `ticket.tecnico_id`"],["Ticket → Categoría","Muchos a uno","`ticket.categoria_id`"],["Ticket ↔ Comentario","Uno a muchos, **composición**","`comentario.ticket_id`"],["Usuario ↔ Categoría (especialidades)","Muchos a muchos","Tabla intermedia `usuario_categoria`"]]]]},{"t":"De la llave foránea a la anotación","b":["En SQL, `ticket` guarda el número `categoria_id`. En Java no guardamos el número: guardamos el **objeto** `Categoria`, y JPA traduce.",["code","Ticket.java · lado dueño","@ManyToOne(fetch = FetchType.LAZY, optional = false)\n@JoinColumn(name = \"categoria_id\")\nprivate Categoria categoria;"],["code","Ticket.java · lado inverso de Comentario","@OneToMany(mappedBy = \"ticket\", cascade = CascadeType.ALL, orphanRemoval = true)\n@OrderBy(\"fecha ASC\")\nprivate List\u003cComentario> comentarios = new ArrayList\u003c>();"],["ul",["**Lado dueño:** el que tiene la columna (`@ManyToOne` + `@JoinColumn`). Lo que usted asigne ahí es lo que se guarda.","**`mappedBy`:** «esta relación ya la maneja el atributo `ticket` de Comentario». No crea columnas. Sin él, JPA inventa una tabla extra.","**Sincronice los dos lados** con un método: `agregarComentario` agrega a la lista *y* asigna el ticket al comentario."]]]},{"t":"Muchos a muchos: las especialidades","b":["Un técnico atiende varias categorías y una categoría tiene varios técnicos. En SQL eso exige una tabla intermedia; `@JoinTable` le pone nombre.",["code","Usuario.java","@ManyToMany\n@JoinTable(name = \"usuario_categoria\",\n        joinColumns = @JoinColumn(name = \"usuario_id\"),\n        inverseJoinColumns = @JoinColumn(name = \"categoria_id\"))\nprivate Set\u003cCategoria> especialidades = new HashSet\u003c>();"],"Es **unidireccional**: desde `Categoria` no necesitamos la lista de técnicos, así que no la declaramos. Se usa `Set` y no `List` para que no haya duplicados.",["nota","pista","Si la relación muchos a muchos necesitara datos propios (por ejemplo, el nivel de experiencia del técnico en cada categoría), la tabla intermedia se convierte en una entidad con dos `@ManyToOne`."]]},{"t":"Carga perezosa y cascada","b":[["tabla",["Anotación","Por defecto","En SoporteYa"],[["`@ManyToOne`","EAGER (trae siempre)","**LAZY**"],["`@OneToMany`","LAZY","LAZY"],["`@ManyToMany`","LAZY","LAZY"]]],"Regla del curso: **toda relación es LAZY** y cuando una pantalla necesita datos relacionados, se piden en la consulta (`@EntityGraph` o `join fetch`).",["tabla",["","Composición","Asociación"],[["Ejemplo","Ticket → Comentario","Ticket → Categoría"],["¿El hijo existe sin el padre?","No","Sí"],["Anotación","`cascade = ALL, orphanRemoval = true`","Sin cascade"],["Efecto","Guardar el ticket guarda sus comentarios","Cada uno se guarda con su repositorio"]]]]},{"t":"Un enum con comportamiento: el ciclo de vida","b":[["svg","estados"],"El estado de un ticket no es un texto libre: es un `enum` guardado como texto (`@Enumerated(EnumType.STRING)`) que además **sabe a qué estados puede pasar**. La regla vive en el modelo, en un solo lugar.",["code","EstadoTicket.java","public boolean puedePasarA(EstadoTicket nuevo) {\n    return switch (this) {\n        case ABIERTO -> nuevo == EN_CURSO || nuevo == CANCELADO;\n        case EN_CURSO -> nuevo == RESUELTO;\n        case RESUELTO -> nuevo == CERRADO || nuevo == EN_CURSO;\n        case CERRADO, CANCELADO -> false;\n    };\n}"],["nota","ojo","Nunca use `EnumType.ORDINAL` (el valor por defecto): guarda 0, 1, 2… y si alguien reordena el enum, los datos viejos cambian de significado."]]},{"t":"Consultas: derivadas, JPQL y proyecciones","b":[["tabla",["Método del repositorio","Qué hace"],[["`findBySolicitanteEmailOrderByFechaCreacionDesc(email, pageable)`","Navega la relación (`solicitante.email`), ordena y pagina"],["`findByEstadoInOrderByFechaLimiteAsc(estados)`","`In`: el estado está en un conjunto. Los más urgentes primero"],["`existsBySolicitanteIdAndAsuntoIgnoreCaseAndEstadoIn(…)`","Responde sí o no, sin traer filas"],["`countBySolicitanteEmailAndEstadoIn(…)`","Cuenta sin traer filas"]]],"Cuando el nombre se vuelve ilegible, o hay agregaciones, se escribe **JPQL** con `@Query`. JPQL usa **entidades y atributos** (`Ticket`, `t.tecnico`), no tablas.",["code","TicketRepository.java · proyección a un record","select new co.edu.sena.adso.soporteya.dto.IndicadorTecnicoDTO(\n    u.nombreCompleto,\n    count(t),\n    sum(case when t.fechaResolucion > t.fechaLimite then 1 else 0 end))\nfrom Ticket t\njoin t.tecnico u\nwhere t.fechaResolucion >= :desde and t.fechaResolucion \u003c :hasta\ngroup by u.nombreCompleto"],["nota","clave","**El problema N+1.** Mostrar 20 tickets con su categoría puede hacer 1 consulta para los tickets y 20 más, una por categoría. `@EntityGraph(attributePaths = {\"categoria\", \"tecnico\"})` o `join fetch` lo resuelven con una sola consulta."]]},{"t":"Transacciones: todo o nada","b":["Tomar un ticket son tres cambios: asignar el técnico, cambiar el estado y dejar un comentario en el historial. Si el tercero falla, los dos primeros no pueden quedar guardados.",["ul",["`@Transactional` en el método del **servicio**: o se confirma todo (COMMIT) o se deshace todo (ROLLBACK).","Una `RuntimeException` (como `NegocioException`) que sale del método **deshace** la transacción.","`@Transactional(readOnly = true)` en la clase: las consultas van en transacciones de solo lectura, más livianas.","**Dirty checking:** un ticket leído dentro de la transacción se actualiza solo al confirmar. No hace falta `save()`."]]]},{"t":"Dos técnicos, el mismo ticket","b":["Carlos y Mateo ven el mismo ticket abierto y presionan «Tomar» en el mismo segundo. Sin control, los dos quedarían asignados (el segundo pisaría al primero). Con `@Version`, Hibernate agrega a cada `UPDATE` la condición `where version = ?`.",["code","Lo que pasa en la base de datos","Carlos  lee el ticket 7 · version = 3\nMateo   lee el ticket 7 · version = 3\nCarlos  update ticket set tecnico_id = 2, version = 4 where id = 7 and version = 3   ✔ 1 fila\nMateo   update ticket set tecnico_id = 4, version = 4 where id = 7 and version = 3   ✖ 0 filas\n        → ObjectOptimisticLockingFailureException: «otro técnico lo tomó al mismo tiempo»"],"Se llama **bloqueo optimista**: no bloquea a nadie mientras lee, solo detecta el choque al escribir. En la Unidad 2 lo probará con dos navegadores."]}],"pasos":[{"t":"Los enums del dominio","min":15,"intro":"En el paquete `model`. Cada uno trae una `etiqueta` para mostrar en las páginas (Unidad 2).","archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/model/Rol.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.model;\n\npublic enum Rol {\n    SOLICITANTE(\"Solicitante\"),   // reporta fallas y sigue sus tickets\n    TECNICO(\"Técnico\"),           // toma y resuelve tickets de sus especialidades\n    COORDINADOR(\"Coordinador\");   // administra categorías y usuarios, y mide los tiempos\n\n    private final String etiqueta;\n\n    Rol(String etiqueta) {\n        this.etiqueta = etiqueta;\n    }\n\n    public String getEtiqueta() {\n        return etiqueta;\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/model/Prioridad.java","modo":"nuevo","nota":"Cada prioridad sabe cuántas horas tiene la mesa de ayuda para resolver: es el acuerdo de nivel de servicio (ANS).","lang":"java","codigo":"package co.edu.sena.adso.soporteya.model;\n\n// Cada prioridad trae su tiempo máximo de solución (acuerdo de nivel de servicio, ANS)\npublic enum Prioridad {\n    BAJA(\"Baja\", 72),\n    MEDIA(\"Media\", 24),\n    ALTA(\"Alta\", 8),\n    CRITICA(\"Crítica\", 4);\n\n    private final String etiqueta;\n    private final int horasLimite;\n\n    Prioridad(String etiqueta, int horasLimite) {\n        this.etiqueta = etiqueta;\n        this.horasLimite = horasLimite;\n    }\n\n    public String getEtiqueta() {\n        return etiqueta;\n    }\n\n    public int getHorasLimite() {\n        return horasLimite;\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/model/EstadoTicket.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.model;\n\nimport java.util.Set;\n\n// El ciclo de vida de un ticket. Cada estado sabe a cuáles puede pasar.\n//\n//  ABIERTO ──tomar──▶ EN_CURSO ──resolver──▶ RESUELTO ──cerrar──▶ CERRADO\n//     │                   ▲                      │\n//     └──cancelar──▶ CANCELADO                   └──reabrir──┘\npublic enum EstadoTicket {\n    ABIERTO(\"Abierto\"),\n    EN_CURSO(\"En curso\"),\n    RESUELTO(\"Resuelto\"),\n    CERRADO(\"Cerrado\"),\n    CANCELADO(\"Cancelado\");\n\n    private final String etiqueta;   // el texto que ve el usuario\n\n    EstadoTicket(String etiqueta) {\n        this.etiqueta = etiqueta;\n    }\n\n    public String getEtiqueta() {\n        return etiqueta;\n    }\n\n    public boolean puedePasarA(EstadoTicket nuevo) {\n        return switch (this) {\n            case ABIERTO -> nuevo == EN_CURSO || nuevo == CANCELADO;\n            case EN_CURSO -> nuevo == RESUELTO;\n            case RESUELTO -> nuevo == CERRADO || nuevo == EN_CURSO;\n            case CERRADO, CANCELADO -> false;\n        };\n    }\n\n    // Estados en los que el ticket sigue pendiente para la mesa de ayuda\n    public static Set\u003cEstadoTicket> pendientes() {\n        return Set.of(ABIERTO, EN_CURSO);\n    }\n\n    public boolean esFinal() {\n        return this == CERRADO || this == CANCELADO;\n    }\n}"}],"listo":"los tres enums compilan."},{"t":"Área y Categoría","min":10,"archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/model/Area.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.model;\n\nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\nimport jakarta.persistence.GeneratedValue;\nimport jakarta.persistence.GenerationType;\nimport jakarta.persistence.Id;\n\n// Dependencia de la empresa donde trabaja un usuario: Contabilidad, Talento Humano…\n@Entity\npublic class Area {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false, unique = true, length = 80)\n    private String nombre;\n\n    protected Area() {\n    }\n\n    public Area(String nombre) {\n        this.nombre = nombre;\n    }\n\n    public Long getId() {\n        return id;\n    }\n\n    public String getNombre() {\n        return nombre;\n    }\n\n    public void setNombre(String nombre) {\n        this.nombre = nombre;\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/model/Categoria.java","modo":"nuevo","nota":"`activa`: una categoría no se borra porque tiene tickets; se desactiva.","lang":"java","codigo":"package co.edu.sena.adso.soporteya.model;\n\nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\nimport jakarta.persistence.GeneratedValue;\nimport jakarta.persistence.GenerationType;\nimport jakarta.persistence.Id;\n\n// Tipo de falla: Hardware, Software, Red, Impresoras, Accesos…\n@Entity\npublic class Categoria {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false, unique = true, length = 60)\n    private String nombre;\n\n    @Column(length = 250)\n    private String descripcion;\n\n    private boolean activa = true;\n\n    protected Categoria() {\n    }\n\n    public Categoria(String nombre, String descripcion) {\n        this.nombre = nombre;\n        this.descripcion = descripcion;\n    }\n\n    public Long getId() {\n        return id;\n    }\n\n    public String getNombre() {\n        return nombre;\n    }\n\n    public void setNombre(String nombre) {\n        this.nombre = nombre;\n    }\n\n    public String getDescripcion() {\n        return descripcion;\n    }\n\n    public void setDescripcion(String descripcion) {\n        this.descripcion = descripcion;\n    }\n\n    public boolean isActiva() {\n        return activa;\n    }\n\n    public void setActiva(boolean activa) {\n        this.activa = activa;\n    }\n}"}],"listo":"las dos entidades compilan."},{"t":"Usuario: muchos a uno y muchos a muchos","min":20,"archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/model/Usuario.java","modo":"nuevo","nota":"`password` queda vacía hasta la Unidad 3. El método `atiende(categoria)` es una regla del modelo: ¿este técnico sabe de esto?","lang":"java","codigo":"package co.edu.sena.adso.soporteya.model;\n\nimport java.util.HashSet;\nimport java.util.Set;\n\nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\nimport jakarta.persistence.EnumType;\nimport jakarta.persistence.Enumerated;\nimport jakarta.persistence.FetchType;\nimport jakarta.persistence.GeneratedValue;\nimport jakarta.persistence.GenerationType;\nimport jakarta.persistence.Id;\nimport jakarta.persistence.JoinColumn;\nimport jakarta.persistence.JoinTable;\nimport jakarta.persistence.ManyToMany;\nimport jakarta.persistence.ManyToOne;\n\n@Entity\npublic class Usuario {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false, length = 120)\n    private String nombreCompleto;\n\n    @Column(nullable = false, unique = true, length = 120)\n    private String email;\n\n    // Se llena en la Unidad 3 con un hash BCrypt. Nunca la contraseña en texto plano.\n    @Column(length = 100)\n    private String password;\n\n    @Enumerated(EnumType.STRING)\n    @Column(nullable = false, length = 20)\n    private Rol rol;\n\n    private boolean activo = true;\n\n    // Muchos usuarios trabajan en un área\n    @ManyToOne(fetch = FetchType.LAZY)\n    @JoinColumn(name = \"area_id\")\n    private Area area;\n\n    // Muchos a muchos: un técnico atiende varias categorías y una categoría tiene varios técnicos.\n    // Unidireccional: desde Categoria no necesitamos la lista de técnicos.\n    @ManyToMany\n    @JoinTable(name = \"usuario_categoria\",\n            joinColumns = @JoinColumn(name = \"usuario_id\"),\n            inverseJoinColumns = @JoinColumn(name = \"categoria_id\"))\n    private Set\u003cCategoria> especialidades = new HashSet\u003c>();\n\n    protected Usuario() {\n    }\n\n    public Usuario(String nombreCompleto, String email, Rol rol, Area area) {\n        this.nombreCompleto = nombreCompleto;\n        this.email = email;\n        this.rol = rol;\n        this.area = area;\n    }\n\n    // ¿Este técnico puede atender tickets de esa categoría?\n    public boolean atiende(Categoria categoria) {\n        return especialidades.stream().anyMatch(c -> c.getId().equals(categoria.getId()));\n    }\n\n    public Long getId() {\n        return id;\n    }\n\n    public String getNombreCompleto() {\n        return nombreCompleto;\n    }\n\n    public void setNombreCompleto(String nombreCompleto) {\n        this.nombreCompleto = nombreCompleto;\n    }\n\n    public String getEmail() {\n        return email;\n    }\n\n    public void setEmail(String email) {\n        this.email = email;\n    }\n\n    public String getPassword() {\n        return password;\n    }\n\n    public void setPassword(String password) {\n        this.password = password;\n    }\n\n    public Rol getRol() {\n        return rol;\n    }\n\n    public void setRol(Rol rol) {\n        this.rol = rol;\n    }\n\n    public boolean isActivo() {\n        return activo;\n    }\n\n    public void setActivo(boolean activo) {\n        this.activo = activo;\n    }\n\n    public Area getArea() {\n        return area;\n    }\n\n    public void setArea(Area area) {\n        this.area = area;\n    }\n\n    public Set\u003cCategoria> getEspecialidades() {\n        return especialidades;\n    }\n}"}],"listo":"Usuario compila."},{"t":"Ticket y Comentario","min":30,"intro":"El corazón del sistema. Fíjese en las dos relaciones hacia `Usuario`, la composición con `Comentario`, el `@Version` y el método `cambiarEstado`, que valida la transición y deja constancia en el historial.","archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/model/Ticket.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.model;\n\nimport java.time.LocalDateTime;\nimport java.util.ArrayList;\nimport java.util.List;\n\nimport jakarta.persistence.CascadeType;\nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\nimport jakarta.persistence.EnumType;\nimport jakarta.persistence.Enumerated;\nimport jakarta.persistence.FetchType;\nimport jakarta.persistence.GeneratedValue;\nimport jakarta.persistence.GenerationType;\nimport jakarta.persistence.Id;\nimport jakarta.persistence.JoinColumn;\nimport jakarta.persistence.ManyToOne;\nimport jakarta.persistence.OneToMany;\nimport jakarta.persistence.OrderBy;\nimport jakarta.persistence.Version;\n\n@Entity\npublic class Ticket {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false, length = 120)\n    private String asunto;\n\n    @Column(nullable = false, length = 2000)\n    private String descripcion;\n\n    @Enumerated(EnumType.STRING)\n    @Column(nullable = false, length = 20)\n    private Prioridad prioridad;\n\n    @Enumerated(EnumType.STRING)\n    @Column(nullable = false, length = 20)\n    private EstadoTicket estado = EstadoTicket.ABIERTO;\n\n    @Column(nullable = false)\n    private LocalDateTime fechaCreacion;\n\n    @Column(nullable = false)\n    private LocalDateTime fechaLimite;\n\n    private LocalDateTime fechaResolucion;\n\n    @ManyToOne(fetch = FetchType.LAZY, optional = false)\n    @JoinColumn(name = \"solicitante_id\")\n    private Usuario solicitante;\n\n    // Opcional: un ticket ABIERTO todavía no tiene técnico\n    @ManyToOne(fetch = FetchType.LAZY)\n    @JoinColumn(name = \"tecnico_id\")\n    private Usuario tecnico;\n\n    @ManyToOne(fetch = FetchType.LAZY, optional = false)\n    @JoinColumn(name = \"categoria_id\")\n    private Categoria categoria;\n\n    // Composición: un comentario no existe sin su ticket\n    @OneToMany(mappedBy = \"ticket\", cascade = CascadeType.ALL, orphanRemoval = true)\n    @OrderBy(\"fecha ASC\")\n    private List\u003cComentario> comentarios = new ArrayList\u003c>();\n\n    // Bloqueo optimista: si dos técnicos toman el mismo ticket a la vez, el segundo falla\n    @Version\n    private Long version;\n\n    protected Ticket() {\n    }\n\n    // Un ticket nuevo calcula su fecha límite según la prioridad\n    public Ticket(String asunto, String descripcion, Prioridad prioridad, Usuario solicitante, Categoria categoria) {\n        this.asunto = asunto;\n        this.descripcion = descripcion;\n        this.prioridad = prioridad;\n        this.solicitante = solicitante;\n        this.categoria = categoria;\n        this.fechaCreacion = LocalDateTime.now();\n        this.fechaLimite = fechaCreacion.plusHours(prioridad.getHorasLimite());\n    }\n\n    // Código para mostrar al usuario: SY-00042\n    public String getCodigo() {\n        return id == null ? \"SY-nuevo\" : String.format(\"SY-%05d\", id);\n    }\n\n    public boolean isVencido() {\n        return !estado.esFinal() && estado != EstadoTicket.RESUELTO && LocalDateTime.now().isAfter(fechaLimite);\n    }\n\n    // Toda transición pasa por aquí: valida el cambio y deja constancia en los comentarios\n    public void cambiarEstado(EstadoTicket nuevo, Usuario autor, String nota) {\n        if (!estado.puedePasarA(nuevo)) {\n            throw new IllegalStateException(\"Un ticket \" + estado + \" no puede pasar a \" + nuevo);\n        }\n        String texto = \"Estado: \" + estado + \" → \" + nuevo + (nota == null || nota.isBlank() ? \"\" : \". \" + nota);\n        this.estado = nuevo;\n        if (nuevo == EstadoTicket.RESUELTO) {\n            fechaResolucion = LocalDateTime.now();\n        } else if (nuevo == EstadoTicket.EN_CURSO) {\n            fechaResolucion = null;     // si se reabre, se borra la resolución anterior\n        }\n        agregarComentario(new Comentario(texto, autor, false));\n    }\n\n    // Sincroniza los dos lados de la relación\n    public void agregarComentario(Comentario comentario) {\n        comentarios.add(comentario);\n        comentario.setTicket(this);\n    }\n\n    public Long getId() {\n        return id;\n    }\n\n    public String getAsunto() {\n        return asunto;\n    }\n\n    public String getDescripcion() {\n        return descripcion;\n    }\n\n    public Prioridad getPrioridad() {\n        return prioridad;\n    }\n\n    public EstadoTicket getEstado() {\n        return estado;\n    }\n\n    public LocalDateTime getFechaCreacion() {\n        return fechaCreacion;\n    }\n\n    public LocalDateTime getFechaLimite() {\n        return fechaLimite;\n    }\n\n    public LocalDateTime getFechaResolucion() {\n        return fechaResolucion;\n    }\n\n    public Usuario getSolicitante() {\n        return solicitante;\n    }\n\n    public Usuario getTecnico() {\n        return tecnico;\n    }\n\n    public void setTecnico(Usuario tecnico) {\n        this.tecnico = tecnico;\n    }\n\n    public Categoria getCategoria() {\n        return categoria;\n    }\n\n    public List\u003cComentario> getComentarios() {\n        return comentarios;\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/model/Comentario.java","modo":"nuevo","nota":"`setTicket` no es público: solo `Ticket.agregarComentario` lo usa, para que los dos lados siempre queden sincronizados.","lang":"java","codigo":"package co.edu.sena.adso.soporteya.model;\n\nimport java.time.LocalDateTime;\n\nimport jakarta.persistence.Column;\nimport jakarta.persistence.Entity;\nimport jakarta.persistence.FetchType;\nimport jakarta.persistence.GeneratedValue;\nimport jakarta.persistence.GenerationType;\nimport jakarta.persistence.Id;\nimport jakarta.persistence.JoinColumn;\nimport jakarta.persistence.ManyToOne;\n\n@Entity\npublic class Comentario {\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n    private Long id;\n\n    @Column(nullable = false, length = 2000)\n    private String texto;\n\n    @Column(nullable = false)\n    private LocalDateTime fecha;\n\n    // Una nota interna solo la ven técnicos y coordinación (Unidad 3)\n    private boolean interno;\n\n    @ManyToOne(fetch = FetchType.LAZY, optional = false)\n    @JoinColumn(name = \"autor_id\")\n    private Usuario autor;\n\n    @ManyToOne(fetch = FetchType.LAZY, optional = false)\n    @JoinColumn(name = \"ticket_id\")\n    private Ticket ticket;\n\n    protected Comentario() {\n    }\n\n    public Comentario(String texto, Usuario autor, boolean interno) {\n        this.texto = texto;\n        this.autor = autor;\n        this.interno = interno;\n        this.fecha = LocalDateTime.now();\n    }\n\n    public Long getId() {\n        return id;\n    }\n\n    public String getTexto() {\n        return texto;\n    }\n\n    public LocalDateTime getFecha() {\n        return fecha;\n    }\n\n    public boolean isInterno() {\n        return interno;\n    }\n\n    public Usuario getAutor() {\n        return autor;\n    }\n\n    public Ticket getTicket() {\n        return ticket;\n    }\n\n    void setTicket(Ticket ticket) {\n        this.ticket = ticket;\n    }\n}"}],"listo":"el paquete `model` compila con siete clases."},{"t":"Los repositorios","min":25,"archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/repository/AreaRepository.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.repository;\n\nimport java.util.List;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\n\nimport co.edu.sena.adso.soporteya.model.Area;\n\npublic interface AreaRepository extends JpaRepository\u003cArea, Long> {\n\n    List\u003cArea> findAllByOrderByNombreAsc();\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/repository/CategoriaRepository.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.repository;\n\nimport java.util.List;\n\nimport org.springframework.data.jpa.repository.JpaRepository;\n\nimport co.edu.sena.adso.soporteya.model.Categoria;\n\npublic interface CategoriaRepository extends JpaRepository\u003cCategoria, Long> {\n\n    List\u003cCategoria> findAllByOrderByNombreAsc();\n\n    List\u003cCategoria> findByActivaTrueOrderByNombreAsc();\n\n    boolean existsByNombreIgnoreCase(String nombre);\n\n    boolean existsByNombreIgnoreCaseAndIdNot(String nombre, Long id);\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/repository/UsuarioRepository.java","modo":"nuevo","nota":"`findByEmail` trae las especialidades en la misma consulta: se necesitan para saber qué puede tomar el técnico.","lang":"java","codigo":"package co.edu.sena.adso.soporteya.repository;\n\nimport java.util.List;\nimport java.util.Optional;\n\nimport org.springframework.data.jpa.repository.EntityGraph;\nimport org.springframework.data.jpa.repository.JpaRepository;\n\nimport co.edu.sena.adso.soporteya.model.Rol;\nimport co.edu.sena.adso.soporteya.model.Usuario;\n\npublic interface UsuarioRepository extends JpaRepository\u003cUsuario, Long> {\n\n    // Trae también las especialidades: se necesitan para saber qué tickets puede tomar\n    @EntityGraph(attributePaths = \"especialidades\")\n    Optional\u003cUsuario> findByEmail(String email);\n\n    boolean existsByEmailIgnoreCase(String email);\n\n    @EntityGraph(attributePaths = \"area\")\n    List\u003cUsuario> findAllByOrderByRolAscNombreCompletoAsc();\n\n    List\u003cUsuario> findByRolAndActivoTrueOrderByNombreCompletoAsc(Rol rol);\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/repository/TicketRepository.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.repository;\n\nimport java.time.LocalDateTime;\nimport java.util.Collection;\nimport java.util.List;\n\nimport org.springframework.data.domain.Page;\nimport org.springframework.data.domain.Pageable;\nimport org.springframework.data.jpa.repository.EntityGraph;\nimport org.springframework.data.jpa.repository.JpaRepository;\nimport org.springframework.data.jpa.repository.Query;\nimport org.springframework.data.repository.query.Param;\n\nimport co.edu.sena.adso.soporteya.dto.ConteoEstadoDTO;\nimport co.edu.sena.adso.soporteya.dto.IndicadorTecnicoDTO;\nimport co.edu.sena.adso.soporteya.model.EstadoTicket;\nimport co.edu.sena.adso.soporteya.model.Ticket;\n\npublic interface TicketRepository extends JpaRepository\u003cTicket, Long> {\n\n    // «Mis tickets» del solicitante, por páginas. @EntityGraph evita N+1 al mostrar categoría y técnico.\n    @EntityGraph(attributePaths = {\"categoria\", \"tecnico\", \"solicitante\"})\n    Page\u003cTicket> findBySolicitanteEmailOrderByFechaCreacionDesc(String email, Pageable pageable);\n\n    // Tablero de la mesa de ayuda: los más urgentes (fecha límite más cercana) primero\n    @EntityGraph(attributePaths = {\"categoria\", \"tecnico\", \"solicitante\"})\n    List\u003cTicket> findByEstadoInOrderByFechaLimiteAsc(Collection\u003cEstadoTicket> estados);\n\n    // Regla de negocio: no repetir un ticket pendiente con el mismo asunto\n    boolean existsBySolicitanteIdAndAsuntoIgnoreCaseAndEstadoIn(Long solicitanteId, String asunto,\n                                                               Collection\u003cEstadoTicket> estados);\n\n    long countBySolicitanteEmailAndEstadoIn(String email, Collection\u003cEstadoTicket> estados);\n\n    // Proyección: cuántos tickets hay en cada estado\n    @Query(\"\"\"\n            select new co.edu.sena.adso.soporteya.dto.ConteoEstadoDTO(t.estado, count(t))\n            from Ticket t\n            group by t.estado\n            order by t.estado\n            \"\"\")\n    List\u003cConteoEstadoDTO> conteoPorEstado();\n\n    // Indicadores por técnico: resueltos y cuántos se resolvieron después de la fecha límite\n    @Query(\"\"\"\n            select new co.edu.sena.adso.soporteya.dto.IndicadorTecnicoDTO(\n                u.nombreCompleto,\n                count(t),\n                sum(case when t.fechaResolucion > t.fechaLimite then 1 else 0 end))\n            from Ticket t\n            join t.tecnico u\n            where t.fechaResolucion >= :desde and t.fechaResolucion \u003c :hasta\n            group by u.nombreCompleto\n            order by count(t) desc\n            \"\"\")\n    List\u003cIndicadorTecnicoDTO> indicadoresEntre(@Param(\"desde\") LocalDateTime desde,\n                                               @Param(\"hasta\") LocalDateTime hasta);\n\n    // Tickets pendientes que ya pasaron su fecha límite. join fetch: todo en una consulta.\n    @Query(\"\"\"\n            select t from Ticket t\n            join fetch t.categoria\n            join fetch t.solicitante\n            left join fetch t.tecnico\n            where t.estado in :estados and t.fechaLimite \u003c :ahora\n            order by t.fechaLimite\n            \"\"\")\n    List\u003cTicket> vencidos(@Param(\"estados\") Collection\u003cEstadoTicket> estados, @Param(\"ahora\") LocalDateTime ahora);\n}"}],"antes":["Los repositorios devuelven DTO en las consultas con `select new`. Cree primero esos records (paso siguiente) o el proyecto no compilará; puede hacer los dos pasos seguidos."],"listo":"la aplicación arranca sin *No property found*."},{"t":"Los DTO","min":10,"intro":"En el paquete `dto`. Nunca se entrega una entidad a una vista o a la API: se entrega un DTO armado dentro de la transacción.","archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/dto/ConteoEstadoDTO.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.dto;\n\nimport co.edu.sena.adso.soporteya.model.EstadoTicket;\n\npublic record ConteoEstadoDTO(EstadoTicket estado, Long cantidad) {\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/dto/IndicadorTecnicoDTO.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.dto;\n\n// Lo arma la consulta JPQL TicketRepository.indicadoresEntre\npublic record IndicadorTecnicoDTO(String tecnico, Long resueltos, Long fueraDeTiempo) {\n\n    public long aTiempo() {\n        return resueltos - fueraDeTiempo;\n    }\n\n    // Porcentaje de cumplimiento del acuerdo de nivel de servicio (ANS)\n    public int cumplimiento() {\n        return resueltos == 0 ? 100 : (int) (aTiempo() * 100 / resueltos);\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/dto/TicketResumenDTO.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.dto;\n\nimport java.time.LocalDateTime;\n\nimport co.edu.sena.adso.soporteya.model.EstadoTicket;\nimport co.edu.sena.adso.soporteya.model.Prioridad;\nimport co.edu.sena.adso.soporteya.model.Ticket;\n\n// Lo que muestran las listas y el tablero. Nunca se entrega la entidad a la vista.\npublic record TicketResumenDTO(Long id, String codigo, String asunto, EstadoTicket estado, Prioridad prioridad,\n                               String categoria, String solicitante, String tecnico,\n                               LocalDateTime fechaCreacion, LocalDateTime fechaLimite, boolean vencido) {\n\n    public static TicketResumenDTO from(Ticket t) {\n        return new TicketResumenDTO(t.getId(), t.getCodigo(), t.getAsunto(), t.getEstado(), t.getPrioridad(),\n                t.getCategoria().getNombre(), t.getSolicitante().getNombreCompleto(),\n                t.getTecnico() == null ? null : t.getTecnico().getNombreCompleto(),\n                t.getFechaCreacion(), t.getFechaLimite(), t.isVencido());\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/dto/NuevoTicket.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.dto;\n\nimport co.edu.sena.adso.soporteya.model.Prioridad;\n\n// Los datos que se necesitan para crear un ticket\npublic record NuevoTicket(String asunto, String descripcion, Prioridad prioridad, Long categoriaId) {\n}"}],"listo":"el paquete `dto` compila."},{"t":"El servicio con las reglas de negocio","min":35,"archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/service/NegocioException.java","modo":"nuevo","nota":"El parámetro `campo` se usará en la Unidad 2 para mostrar el error junto al campo del formulario.","lang":"java","codigo":"package co.edu.sena.adso.soporteya.service;\n\n// Una regla de negocio no se cumplió. Es RuntimeException: si sale de un método\n// @Transactional, la transacción se deshace. «campo» (opcional) dice en qué campo\n// de un formulario mostrar el error; lo usaremos en la Unidad 2.\npublic class NegocioException extends RuntimeException {\n\n    private final String campo;\n\n    public NegocioException(String mensaje) {\n        this(null, mensaje);\n    }\n\n    public NegocioException(String campo, String mensaje) {\n        super(mensaje);\n        this.campo = campo;\n    }\n\n    public String getCampo() {\n        return campo;\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/service/TicketService.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.service;\n\nimport java.time.LocalDateTime;\nimport java.time.YearMonth;\nimport java.util.List;\n\nimport org.springframework.data.domain.Page;\nimport org.springframework.data.domain.PageRequest;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport co.edu.sena.adso.soporteya.dto.ConteoEstadoDTO;\nimport co.edu.sena.adso.soporteya.dto.IndicadorTecnicoDTO;\nimport co.edu.sena.adso.soporteya.dto.NuevoTicket;\nimport co.edu.sena.adso.soporteya.dto.TicketResumenDTO;\nimport co.edu.sena.adso.soporteya.model.Categoria;\nimport co.edu.sena.adso.soporteya.model.EstadoTicket;\nimport co.edu.sena.adso.soporteya.model.Rol;\nimport co.edu.sena.adso.soporteya.model.Ticket;\nimport co.edu.sena.adso.soporteya.model.Usuario;\nimport co.edu.sena.adso.soporteya.repository.CategoriaRepository;\nimport co.edu.sena.adso.soporteya.repository.TicketRepository;\nimport co.edu.sena.adso.soporteya.repository.UsuarioRepository;\n\n@Service\n@Transactional(readOnly = true)\npublic class TicketService {\n\n    private static final int TAMANO_PAGINA = 10;\n\n    private final TicketRepository tickets;\n    private final UsuarioRepository usuarios;\n    private final CategoriaRepository categorias;\n\n    public TicketService(TicketRepository tickets, UsuarioRepository usuarios, CategoriaRepository categorias) {\n        this.tickets = tickets;\n        this.usuarios = usuarios;\n        this.categorias = categorias;\n    }\n\n    // ---------- consultas ----------\n\n    public Page\u003cTicketResumenDTO> misTickets(String email, int pagina) {\n        return tickets.findBySolicitanteEmailOrderByFechaCreacionDesc(email, PageRequest.of(pagina, TAMANO_PAGINA))\n                .map(TicketResumenDTO::from);\n    }\n\n    public List\u003cTicketResumenDTO> pendientes() {\n        return tickets.findByEstadoInOrderByFechaLimiteAsc(EstadoTicket.pendientes()).stream()\n                .map(TicketResumenDTO::from)\n                .toList();\n    }\n\n    public List\u003cConteoEstadoDTO> conteoPorEstado() {\n        return tickets.conteoPorEstado();\n    }\n\n    public List\u003cIndicadorTecnicoDTO> indicadores(YearMonth mes) {\n        LocalDateTime desde = mes.atDay(1).atStartOfDay();\n        return tickets.indicadoresEntre(desde, desde.plusMonths(1));\n    }\n\n    public List\u003cTicketResumenDTO> vencidos() {\n        return tickets.vencidos(EstadoTicket.pendientes(), LocalDateTime.now()).stream()\n                .map(TicketResumenDTO::from)\n                .toList();\n    }\n\n    // ---------- operaciones: cada una es una transacción completa ----------\n\n    @Transactional\n    public TicketResumenDTO crear(NuevoTicket datos, String emailSolicitante) {\n        Usuario solicitante = usuario(emailSolicitante);\n        Categoria categoria = categorias.findById(datos.categoriaId())\n                .filter(Categoria::isActiva)\n                .orElseThrow(() -> new NegocioException(\"categoriaId\", \"La categoría elegida no existe o está inactiva\"));\n\n        String asunto = datos.asunto().trim();\n        if (tickets.existsBySolicitanteIdAndAsuntoIgnoreCaseAndEstadoIn(solicitante.getId(), asunto, EstadoTicket.pendientes())) {\n            throw new NegocioException(\"asunto\", \"Ya tiene un ticket pendiente con ese asunto\");\n        }\n        Ticket ticket = new Ticket(asunto, datos.descripcion().trim(), datos.prioridad(), solicitante, categoria);\n        return TicketResumenDTO.from(tickets.save(ticket));\n    }\n\n    // Un téc
