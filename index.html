addFlashAttribute(\"ok\", \"Gracias por confirmar. El ticket quedó cerrado.\");\n        } catch (NegocioException e) {\n            flash.addFlashAttribute(\"error\", e.getMessage());\n        }\n        return \"redirect:/tickets/\" + id;\n    }\n\n    @PostMapping(\"/{id}/cancelar\")\n    public String cancelar(@PathVariable(\"id\") Long id, Principal yo, RedirectAttributes flash) {\n        try {\n            tickets.cancelar(id, yo.getName());\n            flash.addFlashAttribute(\"ok\", \"Ticket cancelado\");\n        } catch (NegocioException e) {\n            flash.addFlashAttribute(\"error\", e.getMessage());\n        }\n        return \"redirect:/tickets/\" + id;\n    }\n\n    // La página tiene tres formularios; con errores, se conserva el que falló y se crean los demás vacíos\n    private void prepararDetalle(Long id, Principal yo, Model model) {\n        model.addAttribute(\"t\", tickets.detalle(id, yo.getName()));   // control de acceso horizontal\n        for (String nombre : List.of(\"comentario\", \"resolucion\", \"reapertura\")) {\n            if (!model.containsAttribute(nombre)) {\n                model.addAttribute(nombre, new TextoForm());\n            }\n        }\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/controller/TableroController.java","modo":"reemplazar","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.controller;\n\nimport java.security.Principal;\n\nimport org.springframework.orm.ObjectOptimisticLockingFailureException;\nimport org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.servlet.mvc.support.RedirectAttributes;\n\n\nimport co.edu.sena.adso.soporteya.dto.TicketResumenDTO;\nimport co.edu.sena.adso.soporteya.service.NegocioException;\nimport co.edu.sena.adso.soporteya.service.TicketService;\n\n// El tablero de la mesa de ayuda: los técnicos toman tickets desde aquí\n@Controller\npublic class TableroController {\n\n    private final TicketService tickets;\n\n    public TableroController(TicketService tickets) {\n        this.tickets = tickets;\n    }\n\n    @GetMapping(\"/tablero\")\n    public String tablero(Model model) {\n        model.addAttribute(\"tablero\", tickets.tablero());\n        return \"tablero\";\n    }\n\n    @PostMapping(\"/tablero/{id}/tomar\")\n    public String tomar(@PathVariable(\"id\") Long id, Principal yo, RedirectAttributes flash) {\n        try {\n            TicketResumenDTO t = tickets.tomar(id, yo.getName());\n            flash.addFlashAttribute(\"ok\", \"Usted tomó el ticket \" + t.codigo());\n        } catch (NegocioException e) {\n            flash.addFlashAttribute(\"error\", e.getMessage());\n        } catch (ObjectOptimisticLockingFailureException e) {\n            // @Version: otro técnico lo tomó en el mismo instante\n            flash.addFlashAttribute(\"error\", \"Otro técnico tomó ese ticket al mismo tiempo. Elija otro.\");\n        }\n        return \"redirect:/tablero\";\n    }\n}"}],"listo":"el proyecto compila sin `SesionDemo`."},{"t":"Permisos en los servicios y control horizontal","min":30,"archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/service/TicketService.java","modo":"reemplazar","nota":"`detalle` recibe el correo: un solicitante que pide un ticket ajeno recibe `AccessDeniedException` (403), y las notas internas se filtran para él.","lang":"java","codigo":"package co.edu.sena.adso.soporteya.service;\n\nimport java.time.LocalDateTime;\nimport java.time.YearMonth;\nimport java.util.List;\nimport java.util.Set;\n\nimport org.springframework.data.domain.Page;\nimport org.springframework.data.domain.PageRequest;\nimport org.springframework.security.access.AccessDeniedException;\nimport org.springframework.security.access.prepost.PreAuthorize;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport co.edu.sena.adso.soporteya.dto.ComentarioDTO;\nimport co.edu.sena.adso.soporteya.dto.ConteoEstadoDTO;\nimport co.edu.sena.adso.soporteya.dto.IndicadorTecnicoDTO;\nimport co.edu.sena.adso.soporteya.dto.NuevoTicket;\nimport co.edu.sena.adso.soporteya.dto.TableroDTO;\nimport co.edu.sena.adso.soporteya.dto.TicketDetalleDTO;\nimport co.edu.sena.adso.soporteya.dto.TicketResumenDTO;\nimport co.edu.sena.adso.soporteya.model.Categoria;\nimport co.edu.sena.adso.soporteya.model.Comentario;\nimport co.edu.sena.adso.soporteya.model.EstadoTicket;\nimport co.edu.sena.adso.soporteya.model.Rol;\nimport co.edu.sena.adso.soporteya.model.Ticket;\nimport co.edu.sena.adso.soporteya.model.Usuario;\nimport co.edu.sena.adso.soporteya.repository.CategoriaRepository;\nimport co.edu.sena.adso.soporteya.repository.TicketRepository;\nimport co.edu.sena.adso.soporteya.repository.UsuarioRepository;\n\n@Service\n@Transactional(readOnly = true)\npublic class TicketService {\n\n    private static final int TAMANO_PAGINA = 10;\n\n    private final TicketRepository tickets;\n    private final UsuarioRepository usuarios;\n    private final CategoriaRepository categorias;\n\n    public TicketService(TicketRepository tickets, UsuarioRepository usuarios, CategoriaRepository categorias) {\n        this.tickets = tickets;\n        this.usuarios = usuarios;\n        this.categorias = categorias;\n    }\n\n    // ---------- consultas ----------\n\n    public Page\u003cTicketResumenDTO> misTickets(String email, int pagina) {\n        return tickets.findBySolicitanteEmailOrderByFechaCreacionDesc(email, PageRequest.of(pagina, TAMANO_PAGINA))\n                .map(TicketResumenDTO::from);\n    }\n\n    public List\u003cTicketResumenDTO> pendientes() {\n        return tickets.findByEstadoInOrderByFechaLimiteAsc(EstadoTicket.pendientes()).stream()\n                .map(TicketResumenDTO::from)\n                .toList();\n    }\n\n    // Unidad 2 · las tres columnas del tablero\n    @PreAuthorize(\"hasAnyRole('TECNICO', 'COORDINADOR')\")\n    public TableroDTO tablero() {\n        List\u003cTicketResumenDTO> todos = tickets.findByEstadoInOrderByFechaLimiteAsc(\n                        Set.of(EstadoTicket.ABIERTO, EstadoTicket.EN_CURSO, EstadoTicket.RESUELTO)).stream()\n                .map(TicketResumenDTO::from)\n                .toList();\n        return new TableroDTO(\n                todos.stream().filter(t -> t.estado() == EstadoTicket.ABIERTO).toList(),\n                todos.stream().filter(t -> t.estado() == EstadoTicket.EN_CURSO).toList(),\n                todos.stream().filter(t -> t.estado() == EstadoTicket.RESUELTO).toList());\n    }\n\n    // Unidad 3 · control de acceso HORIZONTAL: un solicitante solo ve SUS tickets,\n    // y nunca las notas internas. Técnicos y coordinación ven todo.\n    public TicketDetalleDTO detalle(Long id, String email) {\n        Ticket ticket = buscar(id);\n        Usuario yo = usuario(email);\n        boolean esPersonal = yo.getRol() != Rol.SOLICITANTE;\n        if (!esPersonal && !ticket.getSolicitante().getId().equals(yo.getId())) {\n            throw new AccessDeniedException(\"No puede ver tickets de otras personas\");\n        }\n        List\u003cComentarioDTO> comentarios = ticket.getComentarios().stream()\n                .filter(c -> esPersonal || !c.isInterno())\n                .map(ComentarioDTO::from)\n                .toList();\n        return TicketDetalleDTO.from(ticket, comentarios);\n    }\n\n    public List\u003cConteoEstadoDTO> conteoPorEstado() {\n        return tickets.conteoPorEstado();\n    }\n\n    @PreAuthorize(\"hasRole('COORDINADOR')\")\n    public List\u003cIndicadorTecnicoDTO> indicadores(YearMonth mes) {\n        LocalDateTime desde = mes.atDay(1).atStartOfDay();\n        return tickets.indicadoresEntre(desde, desde.plusMonths(1));\n    }\n\n    @PreAuthorize(\"hasRole('COORDINADOR')\")\n    public List\u003cTicketResumenDTO> vencidos() {\n        return tickets.vencidos(EstadoTicket.pendientes(), LocalDateTime.now()).stream()\n                .map(TicketResumenDTO::from)\n                .toList();\n    }\n\n    // ---------- operaciones: cada una es una transacción completa ----------\n\n    @Transactional\n    public TicketResumenDTO crear(NuevoTicket datos, String emailSolicitante) {\n        Usuario solicitante = usuario(emailSolicitante);\n        Categoria categoria = categorias.findById(datos.categoriaId())\n                .filter(Categoria::isActiva)\n                .orElseThrow(() -> new NegocioException(\"categoriaId\", \"La categoría elegida no existe o está inactiva\"));\n\n        String asunto = datos.asunto().trim();\n        if (tickets.existsBySolicitanteIdAndAsuntoIgnoreCaseAndEstadoIn(solicitante.getId(), asunto, EstadoTicket.pendientes())) {\n            throw new NegocioException(\"asunto\", \"Ya tiene un ticket pendiente con ese asunto\");\n        }\n        Ticket ticket = new Ticket(asunto, datos.descripcion().trim(), datos.prioridad(), solicitante, categoria);\n        return TicketResumenDTO.from(tickets.save(ticket));\n    }\n\n    // Un técnico toma un ticket ABIERTO de su especialidad\n    @Transactional\n    @PreAuthorize(\"hasRole('TECNICO')\")\n    public TicketResumenDTO tomar(Long ticketId, String emailTecnico) {\n        Ticket ticket = buscar(ticketId);\n        Usuario tecnico = usuario(emailTecnico);\n        if (tecnico.getRol() != Rol.TECNICO) {\n            throw new NegocioException(\"Solo un técnico puede tomar tickets\");\n        }\n        if (ticket.getEstado() != EstadoTicket.ABIERTO) {\n            throw new NegocioException(\"El ticket \" + ticket.getCodigo() + \" ya no está abierto\");\n        }\n        if (!tecnico.atiende(ticket.getCategoria())) {\n            throw new NegocioException(\"No tiene la especialidad \" + ticket.getCategoria().getNombre());\n        }\n        ticket.setTecnico(tecnico);\n        transicion(ticket, EstadoTicket.EN_CURSO, tecnico, \"Tomado por \" + tecnico.getNombreCompleto());\n        return TicketResumenDTO.from(ticket);   // sin save(): dirty checking hace el UPDATE\n    }\n\n    @Transactional\n    @PreAuthorize(\"hasRole('TECNICO')\")\n    public TicketResumenDTO resolver(Long ticketId, String emailTecnico, String solucion) {\n        Ticket ticket = buscar(ticketId);\n        Usuario tecnico = usuario(emailTecnico);\n        if (ticket.getTecnico() == null || !ticket.getTecnico().getId().equals(tecnico.getId())) {\n            throw new NegocioException(\"Solo el técnico asignado puede resolver el ticket\");\n        }\n        if (solucion == null || solucion.trim().length() \u003c 10) {\n            throw new NegocioException(\"texto\", \"Describa la solución (mínimo 10 caracteres)\");\n        }\n        transicion(ticket, EstadoTicket.RESUELTO, tecnico, \"Solución: \" + solucion.trim());\n        return TicketResumenDTO.from(ticket);\n    }\n\n    // El solicitante confirma que quedó bien\n    @Transactional\n    public TicketResumenDTO cerrar(Long ticketId, String emailSolicitante) {\n        Ticket ticket = delSolicitante(ticketId, emailSolicitante);\n        transicion(ticket, EstadoTicket.CERRADO, ticket.getSolicitante(), \"Confirmado por el solicitante\");\n        return TicketResumenDTO.from(ticket);\n    }\n\n    // El solicitante dice que no quedó bien: vuelve al técnico\n    @Transactional\n    public TicketResumenDTO reabrir(Long ticketId, String emailSolicitante, String motivo) {\n        Ticket ticket = delSolicitante(ticketId, emailSolicitante);\n        if (motivo == null || motivo.isBlank()) {\n            throw new NegocioException(\"texto\", \"Explique por qué reabre el ticket\");\n        }\n        transicion(ticket, EstadoTicket.EN_CURSO, ticket.getSolicitante(), \"Reabierto: \" + motivo.trim());\n        return TicketResumenDTO.from(ticket);\n    }\n\n    @Transactional\n    public TicketResumenDTO cancelar(Long ticketId, String emailSolicitante) {\n        Ticket ticket = delSolicitante(ticketId, emailSolicitante);\n        transicion(ticket, EstadoTicket.CANCELADO, ticket.getSolicitante(), \"Cancelado por el solicitante\");\n        return TicketResumenDTO.from(ticket);\n    }\n\n    // Unidad 2 · comentar. Solo técnicos y coordinación pueden dejar notas internas.\n    @Transactional\n    public void comentar(Long ticketId, String email, String texto, boolean interno) {\n        Ticket ticket = buscar(ticketId);\n        Usuario autor = usuario(email);\n        if (autor.getRol() == Rol.SOLICITANTE && !ticket.getSolicitante().getId().equals(autor.getId())) {\n            throw new AccessDeniedException(\"No puede comentar tickets de otras personas\");\n        }\n        if (ticket.getEstado().esFinal()) {\n            throw new NegocioException(\"texto\", \"El ticket ya está \" + ticket.getEstado().getEtiqueta().toLowerCase());\n        }\n        boolean esInterno = interno && autor.getRol() != Rol.SOLICITANTE;\n        ticket.agregarComentario(new Comentario(texto.trim(), autor, esInterno));\n    }\n\n    // ---------- ayudas ----------\n\n    private void transicion(Ticket ticket, EstadoTicket nuevo, Usuario autor, String nota) {\n        if (!ticket.getEstado().puedePasarA(nuevo)) {\n            throw new NegocioException(\"Un ticket \" + ticket.getEstado() + \" no puede pasar a \" + nuevo);\n        }\n        ticket.cambiarEstado(nuevo, autor, nota);\n    }\n\n    private Ticket delSolicitante(Long ticketId, String email) {\n        Ticket ticket = buscar(ticketId);\n        if (!ticket.getSolicitante().getEmail().equalsIgnoreCase(email)) {\n            throw new NegocioException(\"Solo quien creó el ticket puede hacer esto\");\n        }\n        return ticket;\n    }\n\n    private Ticket buscar(Long id) {\n        return tickets.findById(id).orElseThrow(() -> new NegocioException(\"No existe el ticket \" + id));\n    }\n\n    private Usuario usuario(String email) {\n        return usuarios.findByEmail(email).orElseThrow(() -> new NegocioException(\"No existe el usuario \" + email));\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/service/CategoriaService.java","modo":"reemplazar","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.service;\n\nimport java.util.List;\n\nimport org.springframework.security.access.prepost.PreAuthorize;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport co.edu.sena.adso.soporteya.dto.CategoriaDTO;\nimport co.edu.sena.adso.soporteya.dto.CategoriaForm;\nimport co.edu.sena.adso.soporteya.dto.OpcionDTO;\nimport co.edu.sena.adso.soporteya.model.Categoria;\nimport co.edu.sena.adso.soporteya.repository.CategoriaRepository;\n\n@Service\n@Transactional(readOnly = true)\npublic class CategoriaService {\n\n    private final CategoriaRepository categorias;\n\n    public CategoriaService(CategoriaRepository categorias) {\n        this.categorias = categorias;\n    }\n\n    public List\u003cCategoriaDTO> todas() {\n        return categorias.findAllByOrderByNombreAsc().stream().map(CategoriaDTO::from).toList();\n    }\n\n    // Opciones para los \u003cselect> y las casillas: solo las activas\n    public List\u003cOpcionDTO> opciones() {\n        return categorias.findByActivaTrueOrderByNombreAsc().stream()\n                .map(c -> new OpcionDTO(c.getId(), c.getNombre()))\n                .toList();\n    }\n\n    public CategoriaForm formulario(Long id) {\n        return CategoriaForm.desde(buscar(id));\n    }\n\n    @Transactional\n    @PreAuthorize(\"hasRole('COORDINADOR')\")\n    public CategoriaDTO guardar(CategoriaForm form) {\n        String nombre = form.getNombre().trim();\n        boolean repetida = form.esNuevo()\n                ? categorias.existsByNombreIgnoreCase(nombre)\n                : categorias.existsByNombreIgnoreCaseAndIdNot(nombre, form.getId());\n        if (repetida) {\n            throw new NegocioException(\"nombre\", \"Ya existe la categoría «\" + nombre + \"»\");\n        }\n        Categoria categoria = form.esNuevo() ? new Categoria(nombre, form.getDescripcion()) : buscar(form.getId());\n        categoria.setNombre(nombre);\n        categoria.setDescripcion(form.getDescripcion());\n        return CategoriaDTO.from(categorias.save(categoria));\n    }\n\n    // No se borra: tiene tickets. Se desactiva y deja de aparecer en los formularios.\n    @Transactional\n    @PreAuthorize(\"hasRole('COORDINADOR')\")\n    public CategoriaDTO cambiarEstado(Long id) {\n        Categoria categoria = buscar(id);\n        categoria.setActiva(!categoria.isActiva());\n        return CategoriaDTO.from(categoria);\n    }\n\n    private Categoria buscar(Long id) {\n        return categorias.findById(id).orElseThrow(() -> new NegocioException(\"No existe la categoría \" + id));\n    }\n}"}],"despues":[["code","Los tres niveles en TicketService","@PreAuthorize(\"hasRole('TECNICO')\")            // por método\npublic TicketResumenDTO tomar(…)\n\nif (!esPersonal && !ticket.getSolicitante().getId().equals(yo.getId())) {\n    throw new AccessDeniedException(\"No puede ver tickets de otras personas\");   // por dato\n}"]],"listo":"el proyecto compila con `@EnableMethodSecurity`."},{"t":"Vistas según el rol","min":25,"archivos":[{"ruta":"src/main/resources/templates/fragmentos.html","modo":"reemplazar","nota":"Espacio de nombres `sec`. El menú usa `sec:authorize`; «Salir» es un formulario POST.","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\"\n      xmlns:sec=\"http://www.thymeleaf.org/extras/spring-security\">\n\u003c!-- Piezas comunes de SoporteYa. Cada página las incluye con th:replace. -->\n\n\u003chead th:fragment=\"head(titulo)\">\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle th:text=\"${titulo} + ' · SoporteYa'\">SoporteYa\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css\">\n  \u003clink rel=\"stylesheet\" th:href=\"@{/css/soporteya.css}\">\n\u003c/head>\n\n\u003cbody>\n  \u003c!-- activo: la opción del menú que se resalta. sec:authorize muestra cada opción solo al rol que puede usarla. -->\n  \u003cnav th:fragment=\"menu(activo)\" class=\"navbar navbar-expand-lg navbar-dark navbar-sy\">\n    \u003cdiv class=\"container\">\n      \u003ca class=\"navbar-brand fw-bold\" th:href=\"@{/}\">SoporteYa\u003c/a>\n      \u003cbutton class=\"navbar-toggler\" type=\"button\" data-bs-toggle=\"collapse\" data-bs-target=\"#menu\"\n              aria-controls=\"menu\" aria-expanded=\"false\" aria-label=\"Abrir el menú\">\n        \u003cspan class=\"navbar-toggler-icon\">\u003c/span>\n      \u003c/button>\n      \u003cdiv class=\"collapse navbar-collapse\" id=\"menu\">\n        \u003cul class=\"navbar-nav me-auto\" sec:authorize=\"isAuthenticated()\">\n          \u003cli class=\"nav-item\">\n            \u003ca class=\"nav-link\" th:href=\"@{/tickets}\" th:classappend=\"${activo == 'tickets'} ? 'active'\">Mis tickets\u003c/a>\n          \u003c/li>\n          \u003cli class=\"nav-item\" sec:authorize=\"hasAnyRole('TECNICO', 'COORDINADOR')\">\n            \u003ca class=\"nav-link\" th:href=\"@{/tablero}\" th:classappend=\"${activo == 'tablero'} ? 'active'\">Tablero\u003c/a>\n          \u003c/li>\n          \u003cli class=\"nav-item\" sec:authorize=\"hasRole('COORDINADOR')\">\n            \u003ca class=\"nav-link\" th:href=\"@{/admin/categorias}\" th:classappend=\"${activo == 'categorias'} ? 'active'\">Categorías\u003c/a>\n          \u003c/li>\n          \u003cli class=\"nav-item\" sec:authorize=\"hasRole('COORDINADOR')\">\n            \u003ca class=\"nav-link\" th:href=\"@{/admin/usuarios}\" th:classappend=\"${activo == 'usuarios'} ? 'active'\">Usuarios\u003c/a>\n          \u003c/li>\n          \u003cli class=\"nav-item\" sec:authorize=\"hasRole('COORDINADOR')\">\n            \u003ca class=\"nav-link\" th:href=\"@{/admin/indicadores}\" th:classappend=\"${activo == 'indicadores'} ? 'active'\">Indicadores\u003c/a>\n          \u003c/li>\n        \u003c/ul>\n        \u003c!-- Con sesión: nombre, rol y salir. Cerrar sesión es un POST (lleva el código CSRF). -->\n        \u003cdiv class=\"d-flex align-items-center gap-3 ms-auto\" sec:authorize=\"isAuthenticated()\">\n          \u003cspan class=\"navbar-text small text-white\">\n            \u003cb th:text=\"${yo.nombreCompleto}\">Ana Pérez\u003c/b> · \u003cspan th:text=\"${yo.rol.etiqueta}\">Solicitante\u003c/span>\n          \u003c/span>\n          \u003cform th:action=\"@{/logout}\" method=\"post\">\n            \u003cbutton type=\"submit\" class=\"btn btn-sm btn-outline-light\">Salir\u003c/button>\n          \u003c/form>\n        \u003c/div>\n        \u003c!-- Sin sesión -->\n        \u003cdiv class=\"d-flex gap-2 ms-auto\" sec:authorize=\"isAnonymous()\">\n          \u003ca class=\"btn btn-sm btn-light\" th:href=\"@{/login}\">Ingresar\u003c/a>\n          \u003ca class=\"btn btn-sm btn-outline-light\" th:href=\"@{/registro}\">Registrarse\u003c/a>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/nav>\n\n  \u003c!-- Mensajes «flash»: llegan después de un redirect y duran una sola petición -->\n  \u003cdiv th:fragment=\"mensajes\">\n    \u003cdiv class=\"alert alert-success alert-dismissible fade show\" role=\"alert\" th:if=\"${ok}\">\n      \u003cspan th:text=\"${ok}\">Guardado\u003c/span>\n      \u003cbutton type=\"button\" class=\"btn-close\" data-bs-dismiss=\"alert\" aria-label=\"Cerrar\">\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"alert alert-danger\" role=\"alert\" th:if=\"${error}\" th:text=\"${error}\">Error\u003c/div>\n  \u003c/div>\n\n  \u003c!-- Insignias con parámetro: el color sale de la clase CSS estado-… o prioridad-… -->\n  \u003cspan th:fragment=\"estado(e)\" th:class=\"|badge estado-${e.name()}|\" th:text=\"${e.etiqueta}\">Abierto\u003c/span>\n  \u003cspan th:fragment=\"prioridad(p)\" th:class=\"|badge prioridad-${p.name()}|\" th:text=\"${p.etiqueta}\">Alta\u003c/span>\n\n  \u003c!-- Una columna del tablero: título, lista de tickets y si se muestra el botón «Tomar» -->\n  \u003cdiv class=\"col-lg-4\" th:fragment=\"columna(titulo, lista, sePuedeTomar)\">\n    \u003cdiv class=\"columna\">\n      \u003ch2 class=\"h6 d-flex justify-content-between\">\n        \u003cspan th:text=\"${titulo}\">Abiertos\u003c/span>\n        \u003cspan class=\"badge text-bg-secondary\" th:text=\"${#lists.size(lista)}\">3\u003c/span>\n      \u003c/h2>\n      \u003cp class=\"small text-muted\" th:if=\"${#lists.isEmpty(lista)}\">Nada por aquí.\u003c/p>\n      \u003cdiv class=\"card card-body tarjeta-ticket mb-2 py-2\" th:each=\"t : ${lista}\" th:classappend=\"${t.vencido} ? 'vencido'\">\n        \u003cdiv class=\"d-flex justify-content-between small\">\n          \u003ca th:href=\"@{/tickets/{id}(id=${t.id})}\" th:text=\"${t.codigo}\">SY-00001\u003c/a>\n          \u003cspan th:replace=\"~{fragmentos :: prioridad(${t.prioridad})}\">\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"fw-semibold\" th:text=\"${t.asunto}\">Asunto\u003c/div>\n        \u003cdiv class=\"small text-muted\" th:text=\"|${t.categoria} · ${t.solicitante}|\">Hardware · Ana\u003c/div>\n        \u003cdiv class=\"small\" th:classappend=\"${t.vencido} ? 'text-danger fw-semibold' : 'text-muted'\"\n             th:text=\"'Límite: ' + ${#temporals.format(t.fechaLimite, 'd MMM, h:mm a')}\">Límite\u003c/div>\n        \u003cdiv class=\"small\" th:if=\"${t.tecnico}\" th:text=\"'Técnico: ' + ${t.tecnico}\">Técnico\u003c/div>\n        \u003cform th:if=\"${sePuedeTomar and yo.rol.name() == 'TECNICO'}\"\n              th:action=\"@{/tablero/{id}/tomar(id=${t.id})}\" method=\"post\" class=\"mt-2\">\n          \u003cbutton type=\"submit\" class=\"btn btn-sm btn-primary\">Tomar\u003c/button>\n        \u003c/form>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cth:block th:fragment=\"pie\">\n    \u003cfooter class=\"text-center text-muted small py-4 border-top mt-5\">\n      SoporteYa · Mesa de ayuda de TI · Proyecto guía ADSO · SENA\n    \u003c/footer>\n    \u003cscript src=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js\">\u003c/script>\n  \u003c/th:block>\n\u003c/body>\n\u003c/html>"},{"ruta":"src/main/resources/templates/index.html","modo":"reemplazar","nota":"","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\"\n      xmlns:sec=\"http://www.thymeleaf.org/extras/spring-security\">\n\u003chead th:replace=\"~{fragmentos :: head('Mesa de ayuda')}\">\u003c/head>\n\u003cbody>\n  \u003cnav th:replace=\"~{fragmentos :: menu('inicio')}\">\u003c/nav>\n\n  \u003cheader class=\"portada py-5\">\n    \u003cdiv class=\"container\">\n      \u003cp class=\"text-uppercase small mb-2\">Mesa de ayuda de TI\u003c/p>\n      \u003ch1 class=\"display-5 fw-bold\" sec:authorize=\"isAuthenticated()\">Hola, \u003cspan th:text=\"${yo.nombreCompleto}\">Ana\u003c/span>\u003c/h1>\n      \u003ch1 class=\"display-5 fw-bold\" sec:authorize=\"isAnonymous()\">SoporteYa\u003c/h1>\n      \u003cp class=\"lead mb-4\">Reporte la falla, siga su ticket y sepa quién lo está atendiendo.\u003c/p>\n      \u003ca class=\"btn btn-light btn-lg\" th:href=\"@{/tickets/nuevo}\">Reportar una falla\u003c/a>\n      \u003ca class=\"btn btn-outline-light btn-lg\" sec:authorize=\"hasAnyRole('TECNICO', 'COORDINADOR')\" th:href=\"@{/tablero}\">Ir al tablero\u003c/a>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cmain class=\"container my-5\" sec:authorize=\"isAuthenticated()\">\n    \u003ch2 class=\"h5 mb-3\">La mesa de ayuda hoy\u003c/h2>\n    \u003cdiv class=\"row g-3\">\n      \u003cdiv class=\"col-6 col-md\" th:each=\"c : ${conteos}\">\n        \u003cdiv class=\"card card-body text-center h-100\">\n          \u003cdiv class=\"display-6 fw-bold\" th:text=\"${c.cantidad}\">3\u003c/div>\n          \u003cspan th:replace=\"~{fragmentos :: estado(${c.estado})}\">\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\n  \u003cth:block th:replace=\"~{fragmentos :: pie}\">\u003c/th:block>\n\u003c/body>\n\u003c/html>"},{"ruta":"src/main/resources/templates/tickets/detalle.html","modo":"reemplazar","nota":"","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead th:replace=\"~{fragmentos :: head(${t.codigo})}\">\u003c/head>\n\u003cbody>\n  \u003cnav th:replace=\"~{fragmentos :: menu('tickets')}\">\u003c/nav>\n\n  \u003c!-- Variables de ayuda: ¿quién soy frente a este ticket? El servicio ya verificó que puedo verlo. -->\n  \u003cmain class=\"container hoja my-4\"\n        th:with=\"soySolicitante=${yo.email == t.solicitanteEmail},\n                 soyTecnico=${yo.email == t.tecnicoEmail},\n                 soyPersonal=${yo.rol.name() != 'SOLICITANTE'}\">\n    \u003cdiv th:replace=\"~{fragmentos :: mensajes}\">\u003c/div>\n\n    \u003cdiv class=\"d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2\">\n      \u003cdiv>\n        \u003cspan class=\"text-muted\" th:text=\"${t.codigo}\">SY-00001\u003c/span>\n        \u003ch1 class=\"h3\" th:text=\"${t.asunto}\">El computador no enciende\u003c/h1>\n      \u003c/div>\n      \u003cdiv>\n        \u003cspan th:replace=\"~{fragmentos :: estado(${t.estado})}\">\u003c/span>\n        \u003cspan th:replace=\"~{fragmentos :: prioridad(${t.prioridad})}\">\u003c/span>\n        \u003cspan th:if=\"${t.vencido}\" class=\"badge text-bg-danger\">Vencido\u003c/span>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card card-body mb-3\">\n      \u003cp class=\"mb-3\" style=\"white-space: pre-line\" th:text=\"${t.descripcion}\">Descripción\u003c/p>\n      \u003cdl class=\"row small mb-0\">\n        \u003cdt class=\"col-sm-4\">Solicitante\u003c/dt>\u003cdd class=\"col-sm-8\" th:text=\"|${t.solicitante} · ${t.area}|\">Ana\u003c/dd>\n        \u003cdt class=\"col-sm-4\">Categoría\u003c/dt>\u003cdd class=\"col-sm-8\" th:text=\"${t.categoria}\">Hardware\u003c/dd>\n        \u003cdt class=\"col-sm-4\">Técnico\u003c/dt>\u003cdd class=\"col-sm-8\" th:text=\"${t.tecnico} ?: 'Sin asignar'\">Carlos\u003c/dd>\n        \u003cdt class=\"col-sm-4\">Creado\u003c/dt>\u003cdd class=\"col-sm-8\" th:text=\"${#temporals.format(t.fechaCreacion, 'd MMM yyyy, h:mm a')}\">fecha\u003c/dd>\n        \u003cdt class=\"col-sm-4\">Fecha límite\u003c/dt>\u003cdd class=\"col-sm-8\" th:text=\"${#temporals.format(t.fechaLimite, 'd MMM yyyy, h:mm a')}\">fecha\u003c/dd>\n      \u003c/dl>\n    \u003c/div>\n\n    \u003c!-- Acciones del solicitante -->\n    \u003cdiv class=\"d-flex flex-wrap gap-2 mb-3\" th:if=\"${soySolicitante}\">\n      \u003cform th:if=\"${t.estado.name() == 'RESUELTO'}\" th:action=\"@{/tickets/{id}/cerrar(id=${t.id})}\" method=\"post\">\n        \u003cbutton type=\"submit\" class=\"btn btn-success\">Confirmar que quedó resuelto\u003c/button>\n      \u003c/form>\n      \u003cform th:if=\"${t.estado.name() == 'ABIERTO'}\" th:action=\"@{/tickets/{id}/cancelar(id=${t.id})}\" method=\"post\">\n        \u003cbutton type=\"submit\" class=\"btn btn-outline-secondary\">Cancelar el ticket\u003c/button>\n      \u003c/form>\n    \u003c/div>\n\n    \u003c!-- Reabrir: el solicitante dice que no quedó bien -->\n    \u003cform th:if=\"${soySolicitante and t.estado.name() == 'RESUELTO'}\" th:action=\"@{/tickets/{id}/reabrir(id=${t.id})}\"\n          th:object=\"${reapertura}\" method=\"post\" novalidate class=\"card card-body mb-3\">\n      \u003clabel for=\"reaperturaTexto\" class=\"form-label fw-semibold\">¿No quedó bien? Cuéntenos qué pasa\u003c/label>\n      \u003ctextarea id=\"reaperturaTexto\" th:field=\"*{texto}\" rows=\"2\" class=\"form-control\" th:errorclass=\"is-invalid\">\u003c/textarea>\n      \u003cdiv class=\"invalid-feedback\" th:errors=\"*{texto}\">Error\u003c/div>\n      \u003cbutton type=\"submit\" class=\"btn btn-outline-danger mt-2 align-self-start\">Reabrir\u003c/button>\n    \u003c/form>\n\n    \u003c!-- Resolver: solo el técnico asignado -->\n    \u003cform th:if=\"${soyTecnico and t.estado.name() == 'EN_CURSO'}\" th:action=\"@{/tickets/{id}/resolver(id=${t.id})}\"\n          th:object=\"${resolucion}\" method=\"post\" novalidate class=\"card card-body mb-3 border-success\">\n      \u003clabel for=\"resolucionTexto\" class=\"form-label fw-semibold\">Solución aplicada\u003c/label>\n      \u003ctextarea id=\"resolucionTexto\" th:field=\"*{texto}\" rows=\"3\" class=\"form-control\" th:errorclass=\"is-invalid\">\u003c/textarea>\n      \u003cdiv class=\"invalid-feedback\" th:errors=\"*{texto}\">Error\u003c/div>\n      \u003cbutton type=\"submit\" class=\"btn btn-success mt-2 align-self-start\">Marcar como resuelto\u003c/button>\n    \u003c/form>\n\n    \u003ch2 class=\"h5 mt-4\">Seguimiento\u003c/h2>\n    \u003cdiv class=\"vstack gap-2 mb-3\">\n      \u003cdiv class=\"card card-body comentario py-2\" th:each=\"c : ${t.comentarios}\"\n           th:classappend=\"${c.sistema} ? 'sistema' : (${c.interno} ? 'interno' : '')\">\n        \u003cdiv class=\"small text-muted\">\n          \u003cb th:text=\"${c.autor}\">Carlos Ruiz\u003c/b> · \u003cspan th:text=\"${c.rol}\">Técnico\u003c/span> ·\n          \u003cspan th:text=\"${#temporals.format(c.fecha, 'd MMM, h:mm a')}\">fecha\u003c/span>\n          \u003cspan th:if=\"${c.interno}\" class=\"badge text-bg-warning\">Nota interna\u003c/span>\n        \u003c/div>\n        \u003cdiv style=\"white-space: pre-line\" th:text=\"${c.texto}\">Comentario\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- Comentar -->\n    \u003cform th:unless=\"${t.estado.esFinal()}\" th:action=\"@{/tickets/{id}/comentarios(id=${t.id})}\"\n          th:object=\"${comentario}\" method=\"post\" novalidate class=\"card card-body\">\n      \u003clabel for=\"comentarioTexto\" class=\"form-label fw-semibold\">Agregar un comentario\u003c/label>\n      \u003ctextarea id=\"comentarioTexto\" th:field=\"*{texto}\" rows=\"3\" class=\"form-control\" th:errorclass=\"is-invalid\">\u003c/textarea>\n      \u003cdiv class=\"invalid-feedback\" th:errors=\"*{texto}\">Error\u003c/div>\n      \u003cdiv class=\"form-check mt-2\" th:if=\"${soyPersonal}\">\n        \u003cinput type=\"checkbox\" th:field=\"*{interno}\" class=\"form-check-input\">\n        \u003clabel class=\"form-check-label\" th:for=\"${#ids.prev('interno')}\">Nota interna (no la ve el solicitante)\u003c/label>\n      \u003c/div>\n      \u003cbutton type=\"submit\" class=\"btn btn-primary mt-2 align-self-start\">Comentar\u003c/button>\n    \u003c/form>\n  \u003c/main>\n\n  \u003cth:block th:replace=\"~{fragmentos :: pie}\">\u003c/th:block>\n\u003c/body>\n\u003c/html>"},{"ruta":"src/main/resources/templates/admin/usuario-form.html","modo":"reemplazar","nota":"","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead th:replace=\"~{fragmentos :: head('Usuario')}\">\u003c/head>\n\u003cbody>\n  \u003cnav th:replace=\"~{fragmentos :: menu('usuarios')}\">\u003c/nav>\n\n  \u003cmain class=\"container hoja my-4\">\n    \u003ch1 class=\"h3 mb-4\" th:text=\"${usuario.esNuevo()} ? 'Nuevo usuario' : 'Editar usuario'\">Nuevo usuario\u003c/h1>\n\n    \u003cform th:action=\"@{/admin/usuarios}\" th:object=\"${usuario}\" method=\"post\" novalidate class=\"card card-body shadow-sm\">\n      \u003cinput type=\"hidden\" th:field=\"*{id}\">\n\n      \u003cdiv class=\"row\">\n        \u003cdiv class=\"col-md-6 mb-3\">\n          \u003clabel for=\"nombreCompleto\" class=\"form-label\">Nombre completo\u003c/label>\n          \u003cinput type=\"text\" th:field=\"*{nombreCompleto}\" class=\"form-control\" th:errorclass=\"is-invalid\">\n          \u003cdiv class=\"invalid-feedback\" th:errors=\"*{nombreCompleto}\">Error\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"col-md-6 mb-3\">\n          \u003clabel for=\"email\" class=\"form-label\">Correo\u003c/label>\n          \u003cinput type=\"email\" th:field=\"*{email}\" class=\"form-control\" th:errorclass=\"is-invalid\">\n          \u003cdiv class=\"invalid-feedback\" th:errors=\"*{email}\">Error\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"row\">\n        \u003cdiv class=\"col-md-6 mb-3\">\n          \u003clabel for=\"rol\" class=\"form-label\">Rol\u003c/label>\n          \u003cselect th:field=\"*{rol}\" class=\"form-select\" th:errorclass=\"is-invalid\">\n            \u003coption th:each=\"r : ${roles}\" th:value=\"${r}\" th:text=\"${r.etiqueta}\">Solicitante\u003c/option>\n          \u003c/select>\n          \u003cdiv class=\"invalid-feedback\" th:errors=\"*{rol}\">Error\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"col-md-6 mb-3\">\n          \u003clabel for=\"areaId\" class=\"form-label\">Área\u003c/label>\n          \u003cselect th:field=\"*{areaId}\" class=\"form-select\" th:errorclass=\"is-invalid\">\n            \u003coption value=\"\">Elija el área…\u003c/option>\n            \u003coption th:each=\"a : ${areas}\" th:value=\"${a.id}\" th:text=\"${a.texto}\">Contabilidad\u003c/option>\n          \u003c/select>\n          \u003cdiv class=\"invalid-feedback\" th:errors=\"*{areaId}\">Error\u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"mb-3\">\n        \u003clabel for=\"password\" class=\"form-label\">Contraseña \u003cspan class=\"text-muted small\" th:text=\"${usuario.esNuevo()} ? '(inicial)' : '(déjela vacía para no cambiarla)'\">\u003c/span>\u003c/label>\n        \u003cinput type=\"password\" th:field=\"*{password}\" class=\"form-control\" th:errorclass=\"is-invalid\" autocomplete=\"new-password\">\n        \u003cdiv class=\"invalid-feedback\" th:errors=\"*{password}\">Error\u003c/div>\n      \u003c/div>\n\n      \u003c!-- Muchos a muchos: una casilla por categoría. th:field marca las que ya tiene. -->\n      \u003cfieldset class=\"mb-3\">\n        \u003clegend class=\"form-label fs-6\">Especialidades \u003cspan class=\"text-muted small\">(solo técnicos)\u003c/span>\u003c/legend>\n        \u003cdiv class=\"form-check form-check-inline\" th:each=\"c : ${categorias}\">\n          \u003cinput type=\"checkbox\" class=\"form-check-input\" th:field=\"*{especialidades}\" th:value=\"${c.id}\">\n          \u003clabel class=\"form-check-label\" th:for=\"${#ids.prev('especialidades')}\" th:text=\"${c.texto}\">Hardware\u003c/label>\n        \u003c/div>\n        \u003cdiv class=\"text-danger small\" th:if=\"${#fields.hasErrors('especialidades')}\" th:errors=\"*{especialidades}\">Error\u003c/div>\n      \u003c/fieldset>\n\n      \u003cdiv class=\"d-flex gap-2\">\n        \u003cbutton type=\"submit\" class=\"btn btn-primary\">Guardar\u003c/button>\n        \u003ca class=\"btn btn-outline-secondary\" th:href=\"@{/admin/usuarios}\">Cancelar\u003c/a>\n      \u003c/div>\n    \u003c/form>\n  \u003c/main>\n\n  \u003cth:block th:replace=\"~{fragmentos :: pie}\">\u003c/th:block>\n\u003c/body>\n\u003c/html>"}],"listo":"cada rol ve un menú distinto."},{"t":"Usuarios con contraseña y comprobación en psql","min":20,"archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/config/DatosIniciales.java","modo":"reemplazar","nota":"Todos los usuarios de prueba con la contraseña `Soporte2026`, guardada como hash.","lang":"java","codigo":"package co.edu.sena.adso.soporteya.config;\n\nimport java.util.List;\n\nimport org.springframework.boot.CommandLineRunner;\nimport org.springframework.core.annotation.Order;\nimport org.springframework.security.crypto.password.PasswordEncoder;\nimport org.springframework.stereotype.Component;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport co.edu.sena.adso.soporteya.model.Area;\nimport co.edu.sena.adso.soporteya.model.Categoria;\nimport co.edu.sena.adso.soporteya.model.EstadoTicket;\nimport co.edu.sena.adso.soporteya.model.Prioridad;\nimport co.edu.sena.adso.soporteya.model.Rol;\nimport co.edu.sena.adso.soporteya.model.Ticket;\nimport co.edu.sena.adso.soporteya.model.Usuario;\nimport co.edu.sena.adso.soporteya.repository.AreaRepository;\nimport co.edu.sena.adso.soporteya.repository.CategoriaRepository;\nimport co.edu.sena.adso.soporteya.repository.TicketRepository;\nimport co.edu.sena.adso.soporteya.repository.UsuarioRepository;\n\n// Datos de prueba realistas. Solo se cargan si la base de datos está vacía.\n@Component\n@Order(1)\npublic class DatosIniciales implements CommandLineRunner {\n\n    private final AreaRepository areas;\n    private final CategoriaRepository categorias;\n    private final UsuarioRepository usuarios;\n    private final TicketRepository tickets;\n    private final PasswordEncoder encoder;\n\n    public DatosIniciales(AreaRepository areas, CategoriaRepository categorias,\n                          UsuarioRepository usuarios, TicketRepository tickets, PasswordEncoder encoder) {\n        this.areas = areas;\n        this.categorias = categorias;\n        this.usuarios = usuarios;\n        this.tickets = tickets;\n        this.encoder = encoder;\n    }\n\n    @Override\n    @Transactional\n    public void run(String... args) {\n        if (usuarios.count() > 0) {\n            return;\n        }\n        Area contabilidad = new Area(\"Contabilidad\");\n        Area talento = new Area(\"Talento Humano\");\n        Area comercial = new Area(\"Comercial\");\n        Area tecnologia = new Area(\"Tecnología\");\n        areas.saveAll(List.of(contabilidad, talento, comercial, tecnologia));\n\n        Categoria hardware = new Categoria(\"Hardware\", \"Computadores, pantallas, teclados y otros equipos\");\n        Categoria software = new Categoria(\"Software\", \"Programas, instalaciones y actualizaciones\");\n        Categoria red = new Categoria(\"Red e internet\", \"Conexión, wifi, cableado y VPN\");\n        Categoria impresoras = new Categoria(\"Impresoras\", \"Impresión, escáner y tóner\");\n        Categoria accesos = new Categoria(\"Accesos y contraseñas\", \"Usuarios bloqueados, permisos y correo\");\n        categorias.saveAll(List.of(hardware, software, red, impresoras, accesos));\n\n        Usuario laura = new Usuario(\"Laura Gómez\", \"laura.gomez@soporteya.co\", Rol.COORDINADOR, tecnologia);\n        Usuario carlos = new Usuario(\"Carlos Ruiz\", \"carlos.ruiz@soporteya.co\", Rol.TECNICO, tecnologia);\n        carlos.getEspecialidades().addAll(List.of(hardware, impresoras));\n        Usuario diana = new Usuario(\"Diana Torres\", \"diana.torres@soporteya.co\", Rol.TECNICO, tecnologia);\n        diana.getEspecialidades().addAll(List.of(software, accesos));\n        Usuario mateo = new Usuario(\"Mateo Díaz\", \"mateo.diaz@soporteya.co\", Rol.TECNICO, tecnologia);\n        mateo.getEspecialidades().addAll(List.of(red, hardware));\n        Usuario ana = new Usuario(\"Ana Pérez\", \"ana.perez@soporteya.co\", Rol.SOLICITANTE, contabilidad);\n        Usuario jorge = new Usuario(\"Jorge Herrera\", \"jorge.herrera@soporteya.co\", Rol.SOLICITANTE, comercial);\n        Usuario paola = new Usuario(\"Paola Martínez\", \"paola.martinez@soporteya.co\", Rol.SOLICITANTE, talento);\n        // Unidad 3 · contraseña de prueba para todos, guardada como hash BCrypt\n        String hash = encoder.encode(\"Soporte2026\");\n        List\u003cUsuario> todos = List.of(laura, carlos, diana, mateo, ana, jorge, paola);\n        todos.forEach(u -> u.setPassword(hash));\n        usuarios.saveAll(todos);\n\n        Ticket t1 = new Ticket(\"El computador no enciende\",\n                \"Desde esta mañana el equipo de escritorio no prende. La luz del botón no se enciende.\",\n                Prioridad.ALTA, ana, hardware);\n        Ticket t2 = new Ticket(\"No puedo entrar al sistema contable\",\n                \"Dice que mi usuario está bloqueado. Tengo que cerrar el mes hoy.\",\n                Prioridad.CRITICA, ana, accesos);\n        t2.setTecnico(diana);\n        t2.cambiarEstado(EstadoTicket.EN_CURSO, diana, \"Tomado por Diana Torres\");\n        Ticket t3 = new Ticket(\"La impresora del segundo piso imprime manchado\",\n                \"Las hojas salen con rayas negras a un lado.\", Prioridad.BAJA, paola, impresoras);\n        Ticket t4 = new Ticket(\"Internet lento en la oficina comercial\",\n                \"Las videollamadas con clientes se cortan desde ayer.\", Prioridad.MEDIA, jorge, red);\n        t4.setTecnico(mateo);\n        t4.cambiarEstado(EstadoTicket.EN_CURSO, mateo, \"Tomado por Mateo Díaz\");\n        t4.cambiarEstado(EstadoTicket.RESUELTO, mateo, \"Solución: se reinició el router y se cambió el canal del wifi\");\n        Ticket t5 = new Ticket(\"Instalar el antivirus en el portátil nuevo\",\n                \"Me entregaron un portátil y no tiene antivirus.\", Prioridad.MEDIA, jorge, software);\n        t5.setTecnico(diana);\n        t5.cambiarEstado(EstadoTicket.EN_CURSO, diana, \"Tomado por Diana Torres\");\n        t5.cambiarEstado(EstadoTicket.RESUELTO, diana, \"Solución: antivirus instalado y actualizado\");\n        t5.cambiarEstado(EstadoTicket.CERRADO, jorge, \"Confirmado por el solicitante\");\n        Ticket t6 = new Ticket(\"El correo no sincroniza en el celular\",\n                \"En el computador llegan los correos, pero en el celular no.\", Prioridad.BAJA, paola, software);\n        tickets.saveAll(List.of(t1, t2, t3, t4, t5, t6));   // cascade: guarda también los comentarios\n    }\n}"}],"cmd":[["Terminal · los datos iniciales cambian: recree la base","sudo -u postgres psql -c \"DROP DATABASE soporteya;\" -c \"CREATE DATABASE soporteya OWNER adso;\"\nDB_PASSWORD=su_clave ./mvnw spring-boot:run"],["psql","SELECT email, rol, left(password, 20) || '…' AS hash FROM usuario;"]],"despues":["Ninguna fila debe mostrar `Soporte2026`: solo hashes que empiezan por `$2a$10$`, todos distintos aunque la contraseña sea la misma."],"listo":"la columna `password` solo tiene hashes BCrypt."},{"t":"Opcional · Ingresar con Google","min":40,"opcional":true,"intro":"Google confirma quién es la persona y SoporteYa decide qué rol tiene. Requiere crear credenciales OAuth en Google Cloud (**APIs y servicios → Credenciales → ID de cliente de OAuth → Aplicación web**) con el URI de redirección `http://localhost:8080/login/oauth2/code/google`.","cmd":[["pom.xml","\u003cdependency>\n    \u003cgroupId>org.springframework.boot\u003c/groupId>\n    \u003cartifactId>spring-boot-starter-security-oauth2-client\u003c/artifactId>\n\u003c/dependency>"],["application.properties","spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}\nspring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}\nspring.security.oauth2.client.registration.google.scope=openid,profile,email"],["cuenta/login.html · debajo del formulario","\u003ca class=\"btn btn-outline-dark w-100 mt-2\" th:href=\"@{/oauth2/authorization/google}\">Ingresar con Google\u003c/a>"]],"archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/service/GoogleUsuarioService.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.service;\n\nimport java.util.Set;\n\nimport org.springframework.beans.factory.annotation.Value;\nimport org.springframework.security.core.GrantedAuthority;\nimport org.springframework.security.core.authority.SimpleGrantedAuthority;\nimport org.springframework.security.oauth2.client.oidc.userinfo.OidcUserRequest;\nimport org.springframework.security.oauth2.client.oidc.userinfo.OidcUserService;\nimport org.springframework.security.oauth2.core.OAuth2AuthenticationException;\nimport org.springframework.security.oauth2.core.OAuth2Error;\nimport org.springframework.security.oauth2.core.oidc.user.DefaultOidcUser;\nimport org.springframework.security.oauth2.core.oidc.user.OidcUser;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport co.edu.sena.adso.soporteya.model.Rol;\nimport co.edu.sena.adso.soporteya.model.Usuario;\nimport co.edu.sena.adso.soporteya.repository.AreaRepository;\nimport co.edu.sena.adso.soporteya.repository.UsuarioRepository;\n\n// Opcional · Google confirma quién es la persona; SoporteYa decide qué rol tiene.\n// La primera vez que alguien entra con Google se crea como SOLICITANTE (sin contraseña local).\n@Service\npublic class GoogleUsuarioService extends OidcUserService {\n\n    private final UsuarioRepository usuarios;\n    private final AreaRepository areas;\n    private final String dominio;\n\n    public GoogleUsuarioService(UsuarioRepository usuarios, AreaRepository areas,\n                                @Value(\"${soporteya.dominio-correo}\") String dominio) {\n        this.usuarios = usuarios;\n        this.areas = areas;\n        this.dominio = dominio;\n    }\n\n    @Override\n    @Transactional\n    public OidcUser loadUser(OidcUserRequest solicitud) throws OAuth2AuthenticationException {\n        OidcUser google = super.loadUser(solicitud);\n        String email = google.getEmail().toLowerCase();\n        if (!email.endsWith(\"@\" + dominio)) {\n            throw new OAuth2AuthenticationException(new OAuth2Error(\"dominio_no_permitido\"),\n                    \"Solo cuentas @\" + dominio);\n        }\n        Usuario usuario = usuarios.findByEmail(email).orElseGet(() -> usuarios.save(\n                new Usuario(google.getFullName(), email, Rol.SOLICITANTE, areas.findAllByOrderByNombreAsc().get(0))));\n        if (!usuario.isActivo()) {\n            throw new OAuth2AuthenticationException(new OAuth2Error(\"usuario_inactivo\"), \"La cuenta está desactivada\");\n        }\n        Set\u003cGrantedAuthority> roles = Set.of(new SimpleGrantedAuthority(\"ROLE_\" + usuario.getRol().name()));\n        // \"email\" como nombre: así Principal.getName() devuelve el correo, igual que con el formulario\n        return new DefaultOidcUser(roles, google.getIdToken(), google.getUserInfo(), \"email\");\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/config/SeguridadConfig.java","modo":"reemplazar","nota":"Agrega `.oauth2Login(…)` a la cadena.","lang":"java","codigo":"package co.edu.sena.adso.soporteya.config;\n\nimport org.springframework.context.annotation.Bean;\nimport org.springframework.context.annotation.Configuration;\nimport org.springframework.security.config.annotation.method.configuration.EnableMethodSecurity;\nimport org.springframework.security.config.annotation.web.builders.HttpSecurity;\nimport org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder;\nimport org.springframework.security.crypto.password.PasswordEncoder;\nimport org.springframework.security.web.SecurityFilterChain;\n\nimport co.edu.sena.adso.soporteya.service.GoogleUsuarioService;\n\n@Configuration\n@EnableMethodSecurity   // activa @PreAuthorize en los servicios\npublic class SeguridadConfig {\n\n    // Las contraseñas se guardan como hash BCrypt: no se pueden «descifrar»\n    @Bean\n    public PasswordEncoder passwordEncoder() {\n        return new BCryptPasswordEncoder();\n    }\n\n    @Bean\n    public SecurityFilterChain web(HttpSecurity http, GoogleUsuarioService google) throws Exception {\n        http\n            .authorizeHttpRequests(acceso -> acceso\n                // Públicas: portada, login, registro y archivos estáticos\n                .requestMatchers(\"/\", \"/login\", \"/registro\", \"/css/**\", \"/js/**\", \"/error\").permitAll()\n                // Por rol: la regla más específica va primero\n                .requestMatchers(\"/admin/**\").hasRole(\"COORDINADOR\")\n                .requestMatchers(\"/tablero/**\").hasAnyRole(\"TECNICO\", \"COORDINADOR\")\n                // Todo lo demás: basta con haber iniciado sesión\n                .anyRequest().authenticated())\n            .formLogin(login -> login\n                .loginPage(\"/login\")              // nuestra página, no la de Spring\n                .usernameParameter(\"email\")       // el campo del formulario se llama email\n                .defaultSuccessUrl(\"/\", false)\n                .permitAll())\n            // Opcional · «Ingresar con Google»\n            .oauth2Login(oauth -> oauth\n                .loginPage(\"/login\")\n                .userInfoEndpoint(info -> info.oidcUserService(google)))\n            .logout(salida -> salida\n                .logoutSuccessUrl(\"/login?salio\")\n                .permitAll())\n            .exceptionHandling(errores -> errores\n                .accessDeniedPage(\"/acceso-denegado\"));\n        return http.build();\n    }\n}"}],"despues":[["nota","ojo","Sin las dos variables `GOOGLE_*`, la aplicación no arranca con estos cambios. Si no va a usar Google, no haga este paso. En la Unidad 6 debe agregar el URI de redirección de la URL pública."]],"listo":"un correo de la empresa entra con Google y aparece como Solicitante."}],"verificar":[["Sin sesión, abra `/tickets`","Lo lleva a `/login`"],["Ana con una contraseña equivocada","«Correo o contraseña incorrectos»"],["Ana abre `/tablero` o `/admin/usuarios` escribiendo la dirección","Página 403 «No tiene permiso»"],["Ana abre `/tickets/4` (el ticket de Jorge)","403: control de acceso horizontal"],["Carlos deja una nota interna en el ticket SY-00001 de Ana","Carlos la ve; Ana, en su propio ticket, no"],["Registro con `pedro@gmail.com`","«Use su correo de la empresa (@soporteya.co)»"],["Laura desactiva a Jorge; Jorge intenta entrar","No puede iniciar sesión"],["«Salir» y luego atrás en el navegador","Al recargar, vuelve a pedir login"]],"quiz":[{"p":"¿Por qué se guarda un **hash** de la contraseña y no la contraseña cifrada?","op":["Porque ocupa menos espacio","Porque un hash no se puede revertir: ni quien tenga la base de datos conoce las contraseñas","Porque PostgreSQL no acepta texto cifrado","Porque es más rápido"],"ok":1,"exp":"Lo cifrado se descifra con una clave que también podría robarse. El hash de BCrypt es de un solo sentido, con sal y lento a propósito."},{"p":"Ana cambia la dirección `/tickets/4` por `/tickets/5` y ve el ticket de otra persona. ¿Qué riesgo de OWASP es?","op":["Inyección","Control de acceso roto (A01)","Fallas criptográficas","Mala configuración"],"ok":1,"exp":"Es el riesgo número uno. Se evita verificando en el servidor que el dato pertenece al usuario."},{"p":"El botón «Usuarios» está oculto con `sec:authorize=\"hasRole('COORDINADOR')\"`. ¿Ya está protegida la página?","op":["Sí, si no ve el botón no puede entrar","No: alguien puede escribir la dirección; la protegen la cadena de filtros y `@PreAuthorize`","Sí, porque Thymeleaf bloquea la ruta","Depende del navegador"],"ok":1,"exp":"Ocultar mejora la experiencia, pero la seguridad siempre la da el servidor."},{"p":"¿Por qué «Salir» es un formulario POST y no un enlace?","op":["Por estética","Para que una página maliciosa no pueda cerrarle la sesión ni hacer acciones a su nombre: el POST lleva el código CSRF","Porque los enlaces no funcionan con Spring","Para que sea más rápido"],"ok":1,"exp":"Toda acción que cambia el estado va por POST con el código CSRF que Thymeleaf agrega en `th:action`."}],"ahora":["El responsable del módulo de usuarios configuró la seguridad del equipo: usuarios y roles en PostgreSQL con BCrypt, login y logout.","Las rutas de mi módulo están protegidas en la cadena de filtros según el rol.","Las operaciones sensibles de mi servicio tienen `@PreAuthorize`.","Si mi módulo tiene datos de un dueño, el servicio verifica que pertenecen al usuario (control horizontal).","Las vistas ocultan con `sec:authorize` lo que el rol no puede hacer.","Participé en la revisión cruzada de seguridad y registré los hallazgos como issues."],"errores":[["Después del login vuelve al login sin error","`usernameParameter(\"email\")` no coincide con el `name` del campo","El campo debe llamarse `email` y la contraseña `password`"],["`There is no PasswordEncoder mapped for the id \"null\"`","Hay contraseñas sin hash en la base (datos viejos)","Recree la base para que `DatosIniciales` guarde hashes"],["403 al enviar cualquier formulario","El formulario usa `action` en lugar de `th:action` y no lleva el código CSRF","Use `th:action=\"@{…}\"`"],["`sec:authorize` no oculta nada","Falta la dependencia `thymeleaf-extras-springsecurity6` o el `xmlns:sec`","Agréguela y declare el espacio de nombres en `\u003chtml>`"],["`hasRole('COORDINADOR')` siempre falla","Los roles se guardaron con el prefijo `ROLE_` dos veces","Use `.roles(…)` sin prefijo; `hasRole` agrega `ROLE_`"],["`Could not resolve placeholder 'soporteya.dominio-correo'`","Falta la propiedad","Agréguela en `application.properties`"]]},{"id":"u4","num":"4","titulo":"JavaScript y API con token","sesiones":"Sesiones 13 y 14 · 4 y 7 de diciembre","rap":"593104 · Crear componentes front-end · 593108 · Codificar el software","resumen":"El tablero se actualiza solo y los técnicos toman tickets sin recargar la página. Además, SoporteYa abre una segunda puerta: una API con tokens JWT que usa la pantalla de la oficina de TI, otra aplicación en otro sitio.","objetivos":["Consumir JSON con `fetch` y `async/await`, manejar errores y actualizar el DOM sin abrir huecos de XSS.","Enviar el código CSRF en las peticiones POST que hace JavaScript con la sesión del navegador.","Proteger una API con tokens JWT: emitirlos, verificarlos y llevar los roles dentro del token.","Explicar la política del mismo origen y configurar CORS para una aplicación externa."],"teoria":[{"t":"¿Quién arma la página?","b":[["tabla",["","En el servidor (Unidades 2 y 3)","En el navegador (esta unidad)"],[["Quién arma el HTML","Thymeleaf, antes de enviarlo","JavaScript, con datos JSON"],["Para ver datos nuevos","Recargar la página","Pedir solo los datos y cambiar lo necesario"],["Ventajas","Simple, funciona sin JavaScript, bueno para formularios","Pantallas vivas: tableros, contadores, avisos"],["En SoporteYa","Casi todas las páginas","El tablero, el contador del menú y la pantalla de TI"]]],"No es una cosa o la otra. SoporteYa usa **mejora progresiva**: el tablero llega armado por Thymeleaf (funciona sin JavaScript) y luego JavaScript lo mantiene al día."]},{"t":"fetch, promesas y async/await","b":["`fetch` pide algo al servidor y devuelve una **promesa**: un valor que llegará más tarde. Con `await` el código espera la respuesta sin congelar la página.",["code","soporteya.js","async function get(url) {\n  const respuesta = await fetch(url, { headers: { Accept: 'application/json' } });\n  if (respuesta.redirected || !respuesta.ok) {\n    throw new Error(respuesta.redirected ? 'Su sesión expiró' : `Error ${respuesta.status}`);\n  }\n  return respuesta.json();\n}"],["nota","ojo","`fetch` **no falla** con un 404 o un 409: solo falla si no hay red. Siempre revise `respuesta.ok` o `respuesta.status`."]]},{"t":"Pintar sin abrir la puerta al XSS","b":["Un solicitante podría escribir como asunto `\u003cimg src=x onerror=alert(1)>`. Si el JavaScript lo inserta con `innerHTML`, el navegador lo ejecuta en la pantalla del técnico: eso es **XSS** (inyección de scripts).",["code","Peligroso frente a seguro","tarjeta.innerHTML = `\u003cb>${t.asunto}\u003c/b>`;   // ✖ ejecuta lo que traiga el asunto\n\nconst b = document.createElement('b');\nb.textContent = t.asunto;                    // ✔ lo muestra como texto\ntarjeta.append(b);"],"Thymeleaf ya lo hacía por usted con `th:text`. En JavaScript la responsabilidad es suya: **`textContent` para datos, nunca `innerHTML`**."]},{"t":"CSRF desde JavaScript","b":["Las peticiones de nuestro JavaScript viajan con la cookie de sesión, así que un POST necesita el código CSRF igual que un formulario. Thymeleaf lo deja en dos etiquetas `\u003cmeta>` y el JavaScript lo pone en la cabecera:",["code","fragmentos.html · head","\u003cmeta name=\"_csrf\" th:content=\"${_csrf.token}\">\n\u003cmeta name=\"_csrf_header\" th:content=\"${_csrf.headerName}\">"],["code","soporteya.js","fetch(url, { method: 'POST', headers: { [nombre.content]: token.content } })"]]},{"t":"Dos puertas: sesión y token","b":[["tabla",["","Puerta 1 · `/api/v1/**`","Puerta 2 · páginas y `/api/web/**`"],[["Para","Otras aplicaciones: la pantalla de TI, un tablero gerencial","Nuestras páginas y su JavaScript"],["Cómo se identifica","Cabecera `Authorization: Bearer eyJ…`","Cookie de sesión del login"],["Sesión","No (sin estado, `STATELESS`)","Sí"],["CSRF","Desactivado: no hay cookie que el navegador agregue solo","Activado"],["Configuración","`SecurityFilterChain` con `@Order(1)` y `securityMatcher(\"/api/v1/**\")`","`SecurityFilterChain` con `@Order(2)`"]]],"Las dos puertas llaman a **los mismos servicios**. Los `@PreAuthorize` de la Unidad 3 siguen funcionando porque el token lleva los roles."]},{"t":"JWT: un pase firmado","b":["Un JWT tiene tres partes separadas por puntos: **cabecera**, **contenido** y **firma**. Las dos primeras solo están codificadas en Base64: **cualquiera puede leerlas**. La firma, hecha con una clave secreta del servidor, garantiza que nadie las modificó.",["code","Contenido de un token de SoporteYa","{\n  \"iss\": \"soporteya\",\n  \"sub\": \"laura.gomez@soporteya.co\",\n  \"roles\": [\"COORDINADOR\"],\n  \"iat\": 1765195200,\n  \"exp\": 1765198800\n}"],["ul",["Nunca ponga contraseñas ni datos sensibles en el contenido.","Siempre con expiración (`exp`): aquí, una hora. Un token robado sirve hasta que vence.","La clave secreta llega por variable de entorno (`JWT_SECRETO`) y tiene al menos 32 caracteres.","En el navegador, guárdelo en memoria (una variable). En `localStorage` lo puede leer cualquier script de la página."]]]},{"t":"Política del mismo origen y CORS","b":["El **origen** es protocolo + dominio + puerto. `http://localhost:8080` y `http://localhost:5500` son orígenes distintos. Por seguridad, el navegador **no deja** que el JavaScript de un origen lea respuestas de otro, salvo que el servidor lo autorice con **CORS**.",["code","SeguridadConfig.java","reglas.setAllowedOrigins(origenes);            // quién puede llamar\nreglas.setAllowedMethods(List.of(\"GET\", \"POST\"));\nreglas.setAllowedHeaders(List.of(\"Authorization\", \"Content-Type\"));\nfuente.registerCorsConfiguration(\"/api/v1/**\", reglas);"],["nota","pista","Si ve en la consola del navegador «blocked by CORS policy», el servidor sí respondió, pero el navegador no le dejó leer la respuesta a su página. Revise que el origen esté en la lista."]]}],"pasos":[{"t":"JSON para nuestras páginas","min":20,"archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/service/TicketService.java","modo":"reemplazar","nota":"Nuevo `contarMisPendientes` y `@PreAuthorize` en `pendientes`.","lang":"java","codigo":"package co.edu.sena.adso.soporteya.service;\n\nimport java.time.LocalDateTime;\nimport java.time.YearMonth;\nimport java.util.List;\nimport java.util.Set;\n\nimport org.springframework.data.domain.Page;\nimport org.springframework.data.domain.PageRequest;\nimport org.springframework.security.access.AccessDeniedException;\nimport org.springframework.security.access.prepost.PreAuthorize;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport co.edu.sena.adso.soporteya.dto.ComentarioDTO;\nimport co.edu.sena.adso.soporteya.dto.ConteoEstadoDTO;\nimport co.edu.sena.adso.soporteya.dto.IndicadorTecnicoDTO;\nimport co.edu.sena.adso.soporteya.dto.NuevoTicket;\nimport co.edu.sena.adso.soporteya.dto.TableroDTO;\nimport co.edu.sena.adso.soporteya.dto.TicketDetalleDTO;\nimport co.edu.sena.adso.soporteya.dto.TicketResumenDTO;\nimport co.edu.sena.adso.soporteya.model.Categoria;\nimport co.edu.sena.adso.soporteya.model.Comentario;\nimport co.edu.sena.adso.soporteya.model.EstadoTicket;\nimport co.edu.sena.adso.soporteya.model.Rol;\nimport co.edu.sena.adso.soporteya.model.Ticket;\nimport co.edu.sena.adso.soporteya.model.Usuario;\nimport co.edu.sena.adso.soporteya.repository.CategoriaRepository;\nimport co.edu.sena.adso.soporteya.repository.TicketRepository;\nimport co.edu.sena.adso.soporteya.repository.UsuarioRepository;\n\n@Service\n@Transactional(readOnly = true)\npublic class TicketService {\n\n    private static final int TAMANO_PAGINA = 10;\n\n    private final TicketRepository tickets;\n    private final UsuarioRepository usuarios;\n    private final CategoriaRepository categorias;\n\n    public TicketService(TicketRepository tickets, UsuarioRepository usuarios, CategoriaRepository categorias) {\n        this.tickets = tickets;\n        this.usuarios = usuarios;\n        this.categorias = categorias;\n    }\n\n    // ---------- consultas ----------\n\n    public Page\u003cTicketResumenDTO> misTickets(String email, int pagina) {\n        return tickets.findBySolicitanteEmailOrderByFechaCreacionDesc(email, PageRequest.of(pagina, TAMANO_PAGINA))\n                .map(TicketResumenDTO::from);\n    }\n\n    @PreAuthorize(\"hasAnyRole('TECNICO', 'COORDINADOR')\")\n    public List\u003cTicketResumenDTO> pendientes() {\n        return tickets.findByEstadoInOrderByFechaLimiteAsc(EstadoTicket.pendientes()).stream()\n                .map(TicketResumenDTO::from)\n                .toList();\n    }\n\n    // Unidad 4 · cuántos tickets pendientes tiene el usuario (para el contador del menú)\n    public long contarMisPendientes(String email) {\n        return tickets.countBySolicitanteEmailAndEstadoIn(email, EstadoTicket.pendientes());\n    }\n\n    // Unidad 2 · las tres columnas del tablero\n    @PreAuthorize(\"hasAnyRole('TECNICO', 'COORDINADOR')\")\n    public TableroDTO tablero() {\n        List\u003cTicketResumenDTO> todos = tickets.findByEstadoInOrderByFechaLimiteAsc(\n                        Set.of(EstadoTicket.ABIERTO, EstadoTicket.EN_CURSO, EstadoTicket.RESUELTO)).stream()\n                .map(TicketResumenDTO::from)\n                .toList();\n        return new TableroDTO(\n                todos.stream().filter(t -> t.estado() == EstadoTicket.ABIERTO).toList(),\n                todos.stream().filter(t -> t.estado() == EstadoTicket.EN_CURSO).toList(),\n                todos.stream().filter(t -> t.estado() == EstadoTicket.RESUELTO).toList());\n    }\n\n    // Unidad 3 · control de acceso HORIZONTAL: un solicitante solo ve SUS tickets,\n    // y nunca las notas internas. Técnicos y coordinación ven todo.\n    public TicketDetalleDTO detalle(Long id, String email) {\n        Ticket ticket = buscar(id);\n        Usuario yo = usuario(email);\n        boolean esPersonal = yo.getRol() != Rol.SOLICITANTE;\n        if (!esPersonal && !ticket.getSolicitante().getId().equals(yo.getId())) {\n            throw new AccessDeniedException(\"No puede ver tickets de otras personas\");\n        }\n        List\u003cComentarioDTO> comentarios = ticket.getComentarios().stream()\n                .filter(c -> esPersonal || !c.isInterno())\n                .map(ComentarioDTO::from)\n                .toList();\n        return TicketDetalleDTO.from(ticket, comentarios);\n    }\n\n    public List\u003cConteoEstadoDTO> conteoPorEstado() {\n        return tickets.conteoPorEstado();\n    }\n\n    @PreAuthorize(\"hasRole('COORDINADOR')\")\n    public List\u003cIndicadorTecnicoDTO> indicadores(YearMonth mes) {\n        LocalDateTime desde = mes.atDay(1).atStartOfDay();\n        return tickets.indicadoresEntre(desde, desde.plusMonths(1));\n    }\n\n    @PreAuthorize(\"hasRole('COORDINADOR')\")\n    public List\u003cTicketResumenDTO> vencidos() {\n        return tickets.vencidos(EstadoTicket.pendientes(), LocalDateTime.now()).stream()\n                .map(TicketResumenDTO::from)\n                .toList();\n    }\n\n    // ---------- operaciones: cada una es una transacción completa ----------\n\n    @Transactional\n    public TicketResumenDTO crear(NuevoTicket datos, String emailSolicitante) {\n        Usuario solicitante = usuario(emailSolicitante);\n        Categoria categoria = categorias.findById(datos.categoriaId())\n                .filter(Categoria::isActiva)\n                .orElseThrow(() -> new NegocioException(\"categoriaId\", \"La categoría elegida no existe o está inactiva\"));\n\n        String asunto = datos.asunto().trim();\n        if (tickets.existsBySolicitanteIdAndAsuntoIgnoreCaseAndEstadoIn(solicitante.getId(), asunto, EstadoTicket.pendientes())) {\n            throw new NegocioException(\"asunto\", \"Ya tiene un ticket pendiente con ese asunto\");\n        }\n        Ticket ticket = new Ticket(asunto, datos.descripcion().trim(), datos.prioridad(), solicitante, categoria);\n        return TicketResumenDTO.from(tickets.save(ticket));\n    }\n\n    // Un técnico toma un ticket ABIERTO de su especialidad\n    @Transactional\n    @PreAuthorize(\"hasRole('TECNICO')\")\n    public TicketResumenDTO tomar(Long ticketId, String emailTecnico) {\n        Ticket ticket = buscar(ticketId);\n        Usuario tecnico = usuario(emailTecnico);\n        if (tecnico.getRol() != Rol.TECNICO) {\n            throw new NegocioException(\"Solo un técnico puede tomar tickets\");\n        }\n        if (ticket.getEstado() != EstadoTicket.ABIERTO) {\n            throw new NegocioException(\"El ticket \" + ticket.getCodigo() + \" ya no está abierto\");\n        }\n        if (!tecnico.atiende(ticket.getCategoria())) {\n            throw new NegocioException(\"No tiene la especialidad \" + ticket.getCategoria().getNombre());\n        }\n        ticket.setTecnico(tecnico);\n        transicion(ticket, EstadoTicket.EN_CURSO, tecnico, \"Tomado por \" + tecnico.getNombreCompleto());\n        return TicketResumenDTO.from(ticket);   // sin save(): dirty checking hace el UPDATE\n    }\n\n    @Transactional\n    @PreAuthorize(\"hasRole('TECNICO')\")\n    public TicketResumenDTO resolver(Long ticketId, String emailTecnico, String solucion) {\n        Ticket ticket = buscar(ticketId);\n        Usuario tecnico = usuario(emailTecnico);\n        if (ticket.getTecnico() == null || !ticket.getTecnico().getId().equals(tecnico.getId())) {\n            throw new NegocioException(\"Solo el técnico asignado puede resolver el ticket\");\n        }\n        if (solucion == null || solucion.trim().length() \u003c 10) {\n            throw new NegocioException(\"texto\", \"Describa la solución (mínimo 10 caracteres)\");\n        }\n        transicion(ticket, EstadoTicket.RESUELTO, tecnico, \"Solución: \" + solucion.trim());\n        return TicketResumenDTO.from(ticket);\n    }\n\n    // El solicitante confirma que quedó bien\n    @Transactional\n    public TicketResumenDTO cerrar(Long ticketId, String emailSolicitante) {\n        Ticket ticket = delSolicitante(ticketId, emailSolicitante);\n        transicion(ticket, EstadoTicket.CERRADO, ticket.getSolicitante(), \"Confirmado por el solicitante\");\n        return TicketResumenDTO.from(ticket);\n    }\n\n    // El solicitante dice que no quedó bien: vuelve al técnico\n    @Transactional\n    public TicketResumenDTO reabrir(Long ticketId, String emailSolicitante, String motivo) {\n        Ticket ticket = delSolicitante(ticketId, emailSolicitante);\n        if (motivo == null || motivo.isBlank()) {\n            throw new NegocioException(\"texto\", \"Explique por qué reabre el ticket\");\n        }\n        transicion(ticket, EstadoTicket.EN_CURSO, ticket.getSolicitante(), \"Reabierto: \" + motivo.trim());\n        return TicketResumenDTO.from(ticket);\n    }\n\n    @Transactional\n    public TicketResumenDTO cancelar(Long ticketId, String emailSolicitante) {\n        Ticket ticket = delSolicitante(ticketId, emailSolicitante);\n        transicion(ticket, EstadoTicket.CANCELADO, ticket.getSolicitante(), \"Cancelado por el solicitante\");\n        return TicketResumenDTO.from(ticket);\n    }\n\n    // Unidad 2 · comentar. Solo técnicos y coordinación pueden dejar notas internas.\n    @Transactional\n    public void comentar(Long ticketId, String email, String texto, boolean interno) {\n        Ticket ticket = buscar(ticketId);\n        Usuario autor = usuario(email);\n        if (autor.getRol() == Rol.SOLICITANTE && !ticket.getSolicitante().getId().equals(autor.getId())) {\n            throw new AccessDeniedException(\"No puede comentar tickets de otras personas\");\n        }\n        if (ticket.getEstado().esFinal()) {\n            throw new NegocioException(\"texto\", \"El ticket ya está \" + ticket.getEstado().getEtiqueta().toLowerCase());\n        }\n        boolean esInterno = interno && autor.getRol() != Rol.SOLICITANTE;\n        ticket.agregarComentario(new Comentario(texto.trim(), autor, esInterno));\n    }\n\n    // ---------- ayudas ----------\n\n    private void transicion(Ticket ticket, EstadoTicket nuevo, Usuario autor, String nota) {\n        if (!ticket.getEstado().puedePasarA(nuevo)) {\n            throw new NegocioException(\"Un ticket \" + ticket.getEstado() + \" no puede pasar a \" + nuevo);\n        }\n        ticket.cambiarEstado(nuevo, autor, nota);\n    }\n\n    private Ticket delSolicitante(Long ticketId, String email) {\n        Ticket ticket = buscar(ticketId);\n        if (!ticket.getSolicitante().getEmail().equalsIgnoreCase(email)) {\n            throw new NegocioException(\"Solo quien creó el ticket puede hacer esto\");\n        }\n        return ticket;\n    }\n\n    private Ticket buscar(Long id) {\n        return tickets.findById(id).orElseThrow(() -> new NegocioException(\"No existe el ticket \" + id));\n    }\n\n    private Usuario usuario(String email) {\n        return usuarios.findByEmail(email).orElseThrow(() -> new NegocioException(\"No existe el usuario \" + email));\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/controller/ManejadorErrores.java","modo":"nuevo","nota":"Las excepciones de los `@RestController` salen como JSON con el formato ProblemDetail.","lang":"java","codigo":"package co.edu.sena.adso.soporteya.controller;\n\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.ProblemDetail;\nimport org.springframework.orm.ObjectOptimisticLockingFailureException;\nimport org.springframework.web.bind.annotation.ExceptionHandler;\nimport org.springframework.web.bind.annotation.RestController;\nimport org.springframework.web.bind.annotation.RestControllerAdvice;\n\nimport co.edu.sena.adso.soporteya.service.NegocioException;\n\n// Errores de la API como JSON (ProblemDetail, RFC 9457). Solo para los @RestController.\n@RestControllerAdvice(annotations = RestController.class)\npublic class ManejadorErrores {\n\n    @ExceptionHandler(NegocioException.class)\n    public ProblemDetail negocio(NegocioException e) {\n        ProblemDetail problema = ProblemDetail.forStatusAndDetail(HttpStatus.CONFLICT, e.getMessage());\n        problema.setTitle(\"Regla de negocio\");\n        return problema;\n    }\n\n    @ExceptionHandler(ObjectOptimisticLockingFailureException.class)\n    public ProblemDetail concurrencia(ObjectOptimisticLockingFailureException e) {\n        ProblemDetail problema = ProblemDetail.forStatusAndDetail(HttpStatus.CONFLICT,\n                \"Otro técnico tomó ese ticket al mismo tiempo. Elija otro.\");\n        problema.setTitle(\"Cambio simultáneo\");\n        return problema;\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/controller/WebApiController.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.controller;\n\nimport java.security.Principal;\nimport java.util.Map;\n\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\nimport co.edu.sena.adso.soporteya.dto.TableroDTO;\nimport co.edu.sena.adso.soporteya.dto.TicketResumenDTO;\nimport co.edu.sena.adso.soporteya.service.TicketService;\n\n// JSON para el JavaScript de NUESTRAS páginas. Usa la sesión del navegador y exige el código CSRF en los POST.\n@RestController\n@RequestMapping(\"/api/web\")\npublic class WebApiController {\n\n    private final TicketService tickets;\n\n    public WebApiController(TicketService tickets) {\n        this.tickets = tickets;\n    }\n\n    // GET /api/web/tablero → las tres columnas en JSON\n    @GetMapping(\"/tablero\")\n    public TableroDTO tablero() {\n        return tickets.tablero();\n    }\n\n    // POST /api/web/tablero/5/tomar → el ticket tomado, o 409 con el motivo\n    @PostMapping(\"/tablero/{id}/tomar\")\n    public TicketResumenDTO tomar(@PathVariable(\"id\") Long id, Principal yo) {\n        return tickets.tomar(id, yo.getName());\n    }\n\n    // GET /api/web/mis-pendientes → {\"pendientes\": 2}\n    @GetMapping(\"/mis-pendientes\")\n    public Map\u003cString, Long> misPendientes(Principal yo) {\n        return Map.of(\"pendientes\", tickets.contarMisPendientes(yo.getName()));\n    }\n}"}],"despues":["Con sesión de Carlos, abra `http://localhost:8080/api/web/tablero` en el navegador: debe ver el JSON con las tres listas."],"listo":"`/api/web/tablero` y `/api/web/mis-pendientes` responden JSON."},{"t":"JavaScript común: contador y avisos","min":25,"archivos":[{"ruta":"src/main/resources/templates/fragmentos.html","modo":"reemplazar","nota":"Las etiquetas `\u003cmeta>` del CSRF, el contador junto a «Mis tickets» y el script común en el pie.","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\"\n      xmlns:sec=\"http://www.thymeleaf.org/extras/spring-security\">\n\u003c!-- Piezas comunes de SoporteYa. Cada página las incluye con th:replace. -->\n\n\u003chead th:fragment=\"head(titulo)\">\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle th:text=\"${titulo} + ' · SoporteYa'\">SoporteYa\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css\">\n  \u003clink rel=\"stylesheet\" th:href=\"@{/css/soporteya.css}\">\n  \u003c!-- Unidad 4 · el código CSRF queda disponible para el JavaScript que hace POST con fetch -->\n  \u003cmeta name=\"_csrf\" th:if=\"${_csrf}\" th:content=\"${_csrf.token}\">\n  \u003cmeta name=\"_csrf_header\" th:if=\"${_csrf}\" th:content=\"${_csrf.headerName}\">\n\u003c/head>\n\n\u003cbody>\n  \u003c!-- activo: la opción del menú que se resalta. sec:authorize muestra cada opción solo al rol que puede usarla. -->\n  \u003cnav th:fragment=\"menu(activo)\" class=\"navbar navbar-expand-lg navbar-dark navbar-sy\">\n    \u003cdiv class=\"container\">\n      \u003ca class=\"navbar-brand fw-bold\" th:href=\"@{/}\">SoporteYa\u003c/a>\n      \u003cbutton class=\"navbar-toggler\" type=\"button\" data-bs-toggle=\"collapse\" data-bs-target=\"#menu\"\n              aria-controls=\"menu\" aria-expanded=\"false\" aria-label=\"Abrir el menú\">\n        \u003cspan class=\"navbar-toggler-icon\">\u003c/span>\n      \u003c/button>\n      \u003cdiv class=\"collapse navbar-collapse\" id=\"menu\">\n        \u003cul class=\"navbar-nav me-auto\" sec:authorize=\"isAuthenticated()\">\n          \u003cli class=\"nav-item\">\n            \u003ca class=\"nav-link\" th:href=\"@{/tickets}\" th:classappend=\"${activo == 'tickets'} ? 'active'\">Mis tickets\n              \u003c!-- Unidad 4 · lo llena soporteya.js con fetch -->\n              \u003cspan id=\"contadorPendientes\" class=\"badge rounded-pill text-bg-warning\" hidden>\u003c/span>\u003c/a>\n          \u003c/li>\n          \u003cli class=\"nav-item\" sec:authorize=\"hasAnyRole('TECNICO', 'COORDINADOR')\">\n            \u003ca class=\"nav-link\" th:href=\"@{/tablero}\" th:classappend=\"${activo == 'tablero'} ? 'active'\">Tablero\u003c/a>\n          \u003c/li>\n          \u003cli class=\"nav-item\" sec:authorize=\"hasRole('COORDINADOR')\">\n            \u003ca class=\"nav-link\" th:href=\"@{/admin/categorias}\" th:classappend=\"${activo == 'categorias'} ? 'active'\">Categorías\u003c/a>\n          \u003c/li>\n          \u003cli class=\"nav-item\" sec:authorize=\"hasRole('COORDINADOR')\">\n            \u003ca class=\"nav-link\" th:href=\"@{/admin/usuarios}\" th:classappend=\"${activo == 'usuarios'} ? 'active'\">Usuarios\u003c/a>\n          \u003c/li>\n          \u003cli class=\"nav-item\" sec:authorize=\"hasRole('COORDINADOR')\">\n            \u003ca class=\"nav-link\" th:href=\"@{/admin/indicadores}\" th:classappend=\"${activo == 'indicadores'} ? 'active'\">Indicadores\u003c/a>\n          \u003c/li>\n        \u003c/ul>\n        \u003c!-- Con sesión: nombre, rol y salir. Cerrar sesión es un POST (lleva el código CSRF). -->\n        \u003cdiv class=\"d-flex align-items-center gap-3 ms-auto\" sec:authorize=\"isAuthenticated()\">\n          \u003cspan class=\"navbar-text small text-white\">\n            \u003cb th:text=\"${yo.nombreCompleto}\">Ana Pérez\u003c/b> · \u003cspan th:text=\"${yo.rol.etiqueta}\">Solicitante\u003c/span>\n          \u003c/span>\n          \u003cform th:action=\"@{/logout}\" method=\"post\">\n            \u003cbutton type=\"submit\" class=\"btn btn-sm btn-outline-light\">Salir\u003c/button>\n          \u003c/form>\n        \u003c/div>\n        \u003c!-- Sin sesión -->\n        \u003cdiv class=\"d-flex gap-2 ms-auto\" sec:authorize=\"isAnonymous()\">\n          \u003ca class=\"btn btn-sm btn-light\" th:href=\"@{/login}\">Ingresar\u003c/a>\n          \u003ca class=\"btn btn-sm btn-outline-light\" th:href=\"@{/registro}\">Registrarse\u003c/a>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/nav>\n\n  \u003c!-- Mensajes «flash»: llegan después de un redirect y duran una sola petición -->\n  \u003cdiv th:fragment=\"mensajes\">\n    \u003cdiv class=\"alert alert-success alert-dismissible fade show\" role=\"alert\" th:if=\"${ok}\">\n      \u003cspan th:text=\"${ok}\">Guardado\u003c/span>\n      \u003cbutton type=\"button\" class=\"btn-close\" data-bs-dismiss=\"alert\" aria-label=\"Cerrar\">\u003c/button>\n
