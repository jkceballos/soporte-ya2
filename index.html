nico toma un ticket ABIERTO de su especialidad\n    @Transactional\n    public TicketResumenDTO tomar(Long ticketId, String emailTecnico) {\n        Ticket ticket = buscar(ticketId);\n        Usuario tecnico = usuario(emailTecnico);\n        if (tecnico.getRol() != Rol.TECNICO) {\n            throw new NegocioException(\"Solo un técnico puede tomar tickets\");\n        }\n        if (ticket.getEstado() != EstadoTicket.ABIERTO) {\n            throw new NegocioException(\"El ticket \" + ticket.getCodigo() + \" ya no está abierto\");\n        }\n        if (!tecnico.atiende(ticket.getCategoria())) {\n            throw new NegocioException(\"No tiene la especialidad \" + ticket.getCategoria().getNombre());\n        }\n        ticket.setTecnico(tecnico);\n        transicion(ticket, EstadoTicket.EN_CURSO, tecnico, \"Tomado por \" + tecnico.getNombreCompleto());\n        return TicketResumenDTO.from(ticket);   // sin save(): dirty checking hace el UPDATE\n    }\n\n    @Transactional\n    public TicketResumenDTO resolver(Long ticketId, String emailTecnico, String solucion) {\n        Ticket ticket = buscar(ticketId);\n        Usuario tecnico = usuario(emailTecnico);\n        if (ticket.getTecnico() == null || !ticket.getTecnico().getId().equals(tecnico.getId())) {\n            throw new NegocioException(\"Solo el técnico asignado puede resolver el ticket\");\n        }\n        if (solucion == null || solucion.trim().length() \u003c 10) {\n            throw new NegocioException(\"texto\", \"Describa la solución (mínimo 10 caracteres)\");\n        }\n        transicion(ticket, EstadoTicket.RESUELTO, tecnico, \"Solución: \" + solucion.trim());\n        return TicketResumenDTO.from(ticket);\n    }\n\n    // El solicitante confirma que quedó bien\n    @Transactional\n    public TicketResumenDTO cerrar(Long ticketId, String emailSolicitante) {\n        Ticket ticket = delSolicitante(ticketId, emailSolicitante);\n        transicion(ticket, EstadoTicket.CERRADO, ticket.getSolicitante(), \"Confirmado por el solicitante\");\n        return TicketResumenDTO.from(ticket);\n    }\n\n    // El solicitante dice que no quedó bien: vuelve al técnico\n    @Transactional\n    public TicketResumenDTO reabrir(Long ticketId, String emailSolicitante, String motivo) {\n        Ticket ticket = delSolicitante(ticketId, emailSolicitante);\n        if (motivo == null || motivo.isBlank()) {\n            throw new NegocioException(\"texto\", \"Explique por qué reabre el ticket\");\n        }\n        transicion(ticket, EstadoTicket.EN_CURSO, ticket.getSolicitante(), \"Reabierto: \" + motivo.trim());\n        return TicketResumenDTO.from(ticket);\n    }\n\n    @Transactional\n    public TicketResumenDTO cancelar(Long ticketId, String emailSolicitante) {\n        Ticket ticket = delSolicitante(ticketId, emailSolicitante);\n        transicion(ticket, EstadoTicket.CANCELADO, ticket.getSolicitante(), \"Cancelado por el solicitante\");\n        return TicketResumenDTO.from(ticket);\n    }\n\n    // ---------- ayudas ----------\n\n    private void transicion(Ticket ticket, EstadoTicket nuevo, Usuario autor, String nota) {\n        if (!ticket.getEstado().puedePasarA(nuevo)) {\n            throw new NegocioException(\"Un ticket \" + ticket.getEstado() + \" no puede pasar a \" + nuevo);\n        }\n        ticket.cambiarEstado(nuevo, autor, nota);\n    }\n\n    private Ticket delSolicitante(Long ticketId, String email) {\n        Ticket ticket = buscar(ticketId);\n        if (!ticket.getSolicitante().getEmail().equalsIgnoreCase(email)) {\n            throw new NegocioException(\"Solo quien creó el ticket puede hacer esto\");\n        }\n        return ticket;\n    }\n\n    private Ticket buscar(Long id) {\n        return tickets.findById(id).orElseThrow(() -> new NegocioException(\"No existe el ticket \" + id));\n    }\n\n    private Usuario usuario(String email) {\n        return usuarios.findByEmail(email).orElseThrow(() -> new NegocioException(\"No existe el usuario \" + email));\n    }\n}"}],"despues":[["tabla",["Regla","Dónde"],[["No repetir un ticket pendiente con el mismo asunto","`crear`"],["Solo un técnico, con la especialidad, toma un ticket ABIERTO","`tomar`"],["Solo el técnico asignado resuelve, y describe la solución","`resolver`"],["Solo quien creó el ticket lo cierra, lo reabre o lo cancela","`cerrar`, `reabrir`, `cancelar`"],["Cada cambio de estado respeta el ciclo de vida","`transicion` → `EstadoTicket.puedePasarA`"]]]],"listo":"TicketService compila."},{"t":"Datos iniciales y la demostración en consola","min":25,"archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/config/DatosIniciales.java","modo":"nuevo","nota":"Siete usuarios, cinco categorías y seis tickets en distintos estados. Solo carga si la base está vacía.","lang":"java","codigo":"package co.edu.sena.adso.soporteya.config;\n\nimport java.util.List;\n\nimport org.springframework.boot.CommandLineRunner;\nimport org.springframework.core.annotation.Order;\nimport org.springframework.stereotype.Component;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport co.edu.sena.adso.soporteya.model.Area;\nimport co.edu.sena.adso.soporteya.model.Categoria;\nimport co.edu.sena.adso.soporteya.model.EstadoTicket;\nimport co.edu.sena.adso.soporteya.model.Prioridad;\nimport co.edu.sena.adso.soporteya.model.Rol;\nimport co.edu.sena.adso.soporteya.model.Ticket;\nimport co.edu.sena.adso.soporteya.model.Usuario;\nimport co.edu.sena.adso.soporteya.repository.AreaRepository;\nimport co.edu.sena.adso.soporteya.repository.CategoriaRepository;\nimport co.edu.sena.adso.soporteya.repository.TicketRepository;\nimport co.edu.sena.adso.soporteya.repository.UsuarioRepository;\n\n// Datos de prueba realistas. Solo se cargan si la base de datos está vacía.\n@Component\n@Order(1)\npublic class DatosIniciales implements CommandLineRunner {\n\n    private final AreaRepository areas;\n    private final CategoriaRepository categorias;\n    private final UsuarioRepository usuarios;\n    private final TicketRepository tickets;\n\n    public DatosIniciales(AreaRepository areas, CategoriaRepository categorias,\n                          UsuarioRepository usuarios, TicketRepository tickets) {\n        this.areas = areas;\n        this.categorias = categorias;\n        this.usuarios = usuarios;\n        this.tickets = tickets;\n    }\n\n    @Override\n    @Transactional\n    public void run(String... args) {\n        if (usuarios.count() > 0) {\n            return;\n        }\n        Area contabilidad = new Area(\"Contabilidad\");\n        Area talento = new Area(\"Talento Humano\");\n        Area comercial = new Area(\"Comercial\");\n        Area tecnologia = new Area(\"Tecnología\");\n        areas.saveAll(List.of(contabilidad, talento, comercial, tecnologia));\n\n        Categoria hardware = new Categoria(\"Hardware\", \"Computadores, pantallas, teclados y otros equipos\");\n        Categoria software = new Categoria(\"Software\", \"Programas, instalaciones y actualizaciones\");\n        Categoria red = new Categoria(\"Red e internet\", \"Conexión, wifi, cableado y VPN\");\n        Categoria impresoras = new Categoria(\"Impresoras\", \"Impresión, escáner y tóner\");\n        Categoria accesos = new Categoria(\"Accesos y contraseñas\", \"Usuarios bloqueados, permisos y correo\");\n        categorias.saveAll(List.of(hardware, software, red, impresoras, accesos));\n\n        Usuario laura = new Usuario(\"Laura Gómez\", \"laura.gomez@soporteya.co\", Rol.COORDINADOR, tecnologia);\n        Usuario carlos = new Usuario(\"Carlos Ruiz\", \"carlos.ruiz@soporteya.co\", Rol.TECNICO, tecnologia);\n        carlos.getEspecialidades().addAll(List.of(hardware, impresoras));\n        Usuario diana = new Usuario(\"Diana Torres\", \"diana.torres@soporteya.co\", Rol.TECNICO, tecnologia);\n        diana.getEspecialidades().addAll(List.of(software, accesos));\n        Usuario mateo = new Usuario(\"Mateo Díaz\", \"mateo.diaz@soporteya.co\", Rol.TECNICO, tecnologia);\n        mateo.getEspecialidades().addAll(List.of(red, hardware));\n        Usuario ana = new Usuario(\"Ana Pérez\", \"ana.perez@soporteya.co\", Rol.SOLICITANTE, contabilidad);\n        Usuario jorge = new Usuario(\"Jorge Herrera\", \"jorge.herrera@soporteya.co\", Rol.SOLICITANTE, comercial);\n        Usuario paola = new Usuario(\"Paola Martínez\", \"paola.martinez@soporteya.co\", Rol.SOLICITANTE, talento);\n        usuarios.saveAll(List.of(laura, carlos, diana, mateo, ana, jorge, paola));\n\n        Ticket t1 = new Ticket(\"El computador no enciende\",\n                \"Desde esta mañana el equipo de escritorio no prende. La luz del botón no se enciende.\",\n                Prioridad.ALTA, ana, hardware);\n        Ticket t2 = new Ticket(\"No puedo entrar al sistema contable\",\n                \"Dice que mi usuario está bloqueado. Tengo que cerrar el mes hoy.\",\n                Prioridad.CRITICA, ana, accesos);\n        t2.setTecnico(diana);\n        t2.cambiarEstado(EstadoTicket.EN_CURSO, diana, \"Tomado por Diana Torres\");\n        Ticket t3 = new Ticket(\"La impresora del segundo piso imprime manchado\",\n                \"Las hojas salen con rayas negras a un lado.\", Prioridad.BAJA, paola, impresoras);\n        Ticket t4 = new Ticket(\"Internet lento en la oficina comercial\",\n                \"Las videollamadas con clientes se cortan desde ayer.\", Prioridad.MEDIA, jorge, red);\n        t4.setTecnico(mateo);\n        t4.cambiarEstado(EstadoTicket.EN_CURSO, mateo, \"Tomado por Mateo Díaz\");\n        t4.cambiarEstado(EstadoTicket.RESUELTO, mateo, \"Solución: se reinició el router y se cambió el canal del wifi\");\n        Ticket t5 = new Ticket(\"Instalar el antivirus en el portátil nuevo\",\n                \"Me entregaron un portátil y no tiene antivirus.\", Prioridad.MEDIA, jorge, software);\n        t5.setTecnico(diana);\n        t5.cambiarEstado(EstadoTicket.EN_CURSO, diana, \"Tomado por Diana Torres\");\n        t5.cambiarEstado(EstadoTicket.RESUELTO, diana, \"Solución: antivirus instalado y actualizado\");\n        t5.cambiarEstado(EstadoTicket.CERRADO, jorge, \"Confirmado por el solicitante\");\n        Ticket t6 = new Ticket(\"El correo no sincroniza en el celular\",\n                \"En el computador llegan los correos, pero en el celular no.\", Prioridad.BAJA, paola, software);\n        tickets.saveAll(List.of(t1, t2, t3, t4, t5, t6));   // cascade: guarda también los comentarios\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/config/DemoConsola.java","modo":"nuevo","nota":"Solo corre con el perfil `demo`. Recorre las reglas del servicio y muestra el resultado.","lang":"java","codigo":"package co.edu.sena.adso.soporteya.config;\n\nimport java.time.YearMonth;\n\nimport org.springframework.boot.CommandLineRunner;\nimport org.springframework.context.annotation.Profile;\nimport org.springframework.core.annotation.Order;\nimport org.springframework.stereotype.Component;\n\nimport co.edu.sena.adso.soporteya.dto.NuevoTicket;\nimport co.edu.sena.adso.soporteya.model.Prioridad;\nimport co.edu.sena.adso.soporteya.service.NegocioException;\nimport co.edu.sena.adso.soporteya.service.TicketService;\n\n// Recorre las reglas de la Unidad 1 en la consola. Solo corre con el perfil «demo»:\n//   ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo\n// Cambia los datos: para repetirla, vuelva a crear la base de datos.\n@Component\n@Profile(\"demo\")\n@Order(2)\npublic class DemoConsola implements CommandLineRunner {\n\n    private final TicketService servicio;\n\n    public DemoConsola(TicketService servicio) {\n        this.servicio = servicio;\n    }\n\n    @Override\n    public void run(String... args) {\n        titulo(\"1. Tickets por estado (proyección con @Query)\");\n        servicio.conteoPorEstado().forEach(c -> System.out.println(c.estado() + \": \" + c.cantidad()));\n\n        titulo(\"2. Tablero: pendientes, los más urgentes primero (@EntityGraph)\");\n        servicio.pendientes().forEach(t -> System.out.printf(\"%s · %-8s · %-9s · %s%n\",\n                t.codigo(), t.prioridad(), t.estado(), t.asunto()));\n\n        titulo(\"3. Jorge crea un ticket\");\n        var nuevo = servicio.crear(new NuevoTicket(\"La pantalla parpadea\",\n                \"El monitor parpadea cada pocos minutos.\", Prioridad.MEDIA, 1L), \"jorge.herrera@soporteya.co\");\n        System.out.println(\"Creado \" + nuevo.codigo() + \" con fecha límite \" + nuevo.fechaLimite());\n\n        titulo(\"4. Reglas de negocio que deben fallar\");\n        intentar(\"Jorge repite el asunto\", () -> servicio.crear(new NuevoTicket(\"la pantalla parpadea\",\n                \"Otra vez.\", Prioridad.BAJA, 1L), \"jorge.herrera@soporteya.co\"));\n        intentar(\"Diana toma un ticket de Impresoras\", () -> servicio.tomar(3L, \"diana.torres@soporteya.co\"));\n        intentar(\"Ana (solicitante) toma un ticket\", () -> servicio.tomar(1L, \"ana.perez@soporteya.co\"));\n        intentar(\"Paola cierra un ticket de Ana\", () -> servicio.cerrar(2L, \"paola.martinez@soporteya.co\"));\n\n        titulo(\"5. Ciclo completo del ticket SY-00001\");\n        servicio.tomar(1L, \"carlos.ruiz@soporteya.co\");\n        System.out.println(\"Carlos lo toma → EN_CURSO\");\n        intentar(\"Mateo intenta tomarlo también\", () -> servicio.tomar(1L, \"mateo.diaz@soporteya.co\"));\n        servicio.resolver(1L, \"carlos.ruiz@soporteya.co\", \"Se cambió la fuente de poder del equipo\");\n        System.out.println(\"Carlos lo resuelve → RESUELTO\");\n        servicio.cerrar(1L, \"ana.perez@soporteya.co\");\n        System.out.println(\"Ana confirma → CERRADO\");\n\n        titulo(\"6. Indicadores del mes por técnico\");\n        servicio.indicadores(YearMonth.now()).forEach(i -> System.out.printf(\"%s: %d resueltos, %d%% a tiempo%n\",\n                i.tecnico(), i.resueltos(), i.cumplimiento()));\n\n        titulo(\"7. Mis tickets de Ana (página 1)\");\n        var pagina = servicio.misTickets(\"ana.perez@soporteya.co\", 0);\n        pagina.forEach(t -> System.out.println(t.codigo() + \" · \" + t.estado() + \" · \" + t.asunto()));\n        System.out.println(\"Total: \" + pagina.getTotalElements());\n    }\n\n    private void intentar(String caso, Runnable accion) {\n        try {\n            accion.run();\n            System.out.println(\"✗ \" + caso + \": ¡no falló!\");\n        } catch (NegocioException e) {\n            System.out.println(\"✓ \" + caso + \" → \" + e.getMessage());\n        }\n    }\n\n    private void titulo(String texto) {\n        System.out.println();\n        System.out.println(\"===== \" + texto + \" =====\");\n    }\n}"}],"cmd":[["Terminal · recree la base y ejecute con el perfil demo","sudo -u postgres psql -c \"DROP DATABASE IF EXISTS soporteya;\" -c \"CREATE DATABASE soporteya OWNER adso;\"\nDB_PASSWORD=su_clave ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo"]],"despues":[["code","Lo que debe ver (resumido)","===== 1. Tickets por estado (proyección con @Query) =====\nABIERTO: 3\nCERRADO: 1\nEN_CURSO: 1\nRESUELTO: 1\n\n===== 4. Reglas de negocio que deben fallar =====\n✓ Jorge repite el asunto → Ya tiene un ticket pendiente con ese asunto\n✓ Diana toma un ticket de Impresoras → No tiene la especialidad Impresoras\n✓ Ana (solicitante) toma un ticket → Solo un técnico puede tomar tickets\n✓ Paola cierra un ticket de Ana → Solo quien creó el ticket puede hacer esto\n\n===== 5. Ciclo completo del ticket SY-00001 =====\nCarlos lo toma → EN_CURSO\n✓ Mateo intenta tomarlo también → El ticket SY-00001 ya no está abierto\nCarlos lo resuelve → RESUELTO\nAna confirma → CERRADO"],["code","psql -h localhost -U adso -d soporteya","\\dt\n\\d usuario_categoria\nSELECT id, estado, version, asunto FROM ticket ORDER BY id;\nSELECT t.id, c.texto FROM comentario c JOIN ticket t ON t.id = c.ticket_id ORDER BY c.fecha;"],["nota","pista","La demo cambia los datos. Para repetirla, vuelva a crear la base. El ticket SY-00001 debe quedar con `version` 3: tomar, resolver y cerrar fueron tres actualizaciones."]],"listo":"la consola muestra las siete secciones y todos los casos que deben fallar tienen ✓."}],"verificar":[["Siete tablas más `usuario_categoria`","`\\dt` en psql"],["Las reglas de negocio fallan con un mensaje claro","Sección 4 de la demo, todo con ✓"],["El historial guarda cada cambio de estado","Comentarios que empiezan con «Estado:»"],["El tablero no hace N+1","En la consola, una sola consulta `select … from ticket … left join categoria …` para la sección 2"]],"quiz":[{"p":"En la relación Ticket–Comentario, ¿quién es el **lado dueño**?","op":["Ticket, porque tiene la lista","Comentario, porque su tabla tiene la columna `ticket_id`","Los dos","Ninguno: la maneja una tabla intermedia"],"ok":1,"exp":"El lado dueño es el que tiene la llave foránea. La lista de Ticket lleva `mappedBy` y no crea columnas."},{"p":"¿Por qué Ticket–Comentario usa `cascade = ALL` y Ticket–Categoría no?","op":["Porque la categoría es más importante","Porque un comentario no existe sin su ticket, pero una categoría sí existe sin tickets","Porque `cascade` solo funciona con listas","Es un error: ambas deberían usarlo"],"ok":1,"exp":"Cascada es para composición. Borrar un ticket nunca debe borrar la categoría «Hardware»."},{"p":"Un método `@Transactional` lanza `NegocioException` después de cambiar el estado del ticket. ¿Qué queda en la base de datos?","op":["El estado nuevo","El estado anterior: la transacción se deshace","Un estado intermedio","Depende de si se llamó `save()`"],"ok":1,"exp":"Una RuntimeException que sale del método provoca ROLLBACK de todos los cambios de esa transacción."},{"p":"¿Qué evita `@Version` en `Ticket`?","op":["Que se creen tickets duplicados","Que dos técnicos tomen el mismo ticket al mismo tiempo y uno pise al otro","Que se borre un ticket","Que se lean datos viejos"],"ok":1,"exp":"Es bloqueo optimista: el segundo UPDATE no encuentra la versión que leyó y falla."}],"ahora":["Las entidades de mi módulo tienen sus relaciones con `@ManyToOne(fetch = LAZY)` y `mappedBy` en el lado inverso.","Si mi módulo tiene un estado, es un `enum` con `EnumType.STRING`, y si tiene transiciones, el enum las valida.","Mi repositorio tiene al menos una consulta derivada y una `@Query` (con `join fetch` o proyección).","Mi servicio tiene al menos una regla de negocio en un método `@Transactional` que lanza una excepción propia.","Mis datos iniciales están en una clase propia de mi módulo y no se duplican.","Mi PR «feat: persistencia del módulo … (U1)» está revisado y fusionado."],"errores":[["`LazyInitializationException: could not initialize proxy - no Session`","Se usó una relación LAZY fuera de la transacción (por ejemplo, en la vista)","Arme el DTO dentro del servicio o traiga la relación con `@EntityGraph`"],["Aparece una tabla `ticket_comentarios` que nadie pidió","Falta `mappedBy` en el `@OneToMany`","`@OneToMany(mappedBy = \"ticket\")`"],["`No property 'solicitanteMail' found for type 'Ticket'`","Nombre de método con un atributo que no existe","Los nombres deben coincidir con los atributos: `SolicitanteEmail`"],["`not-null property references a null or transient value: Comentario.ticket`","Se agregó el comentario a la lista sin asignarle el ticket","Use `ticket.agregarComentario(…)`"],["`Cannot instantiate class … IndicadorTecnicoDTO`","El `select new` no coincide con el constructor del record","Mismo orden y tipos: `count` y `sum` devuelven `Long`"],["La demo no hace nada","No activó el perfil","`-Dspring-boot.run.profiles=demo`"]]},{"id":"u2","num":"2","titulo":"Vistas profesionales","sesiones":"Sesiones 6 a 8 · 25 al 27 de noviembre · demo del MVP","rap":"593108 · Codificar el software · 593104 · Crear componentes front-end","resumen":"SoporteYa se vuelve una aplicación web que la gente puede usar: reportar fallas, ver el tablero, tomar y resolver tickets, comentar y administrar categorías y usuarios. Con formularios que no dejan pasar datos malos y un diseño común en todas las páginas.","objetivos":["Construir formularios con objetos propios, Bean Validation y mensajes en español.","Separar las reglas de formato (anotaciones) de las de negocio (servicio) y mostrar ambas en el formulario.","Escribir el diseño una sola vez con fragmentos de Thymeleaf, algunos con parámetros.","Elegir relaciones con listas desplegables y casillas, y aplicar Post/Redirect/Get con mensajes flash."],"teoria":[{"t":"El viaje de un formulario","b":[["pasos",["**GET** muestra el formulario con un objeto vacío (o con los datos a editar)","**POST** llega con `@Valid`: Spring llena el objeto y revisa sus anotaciones","Si hay errores de **formato**, se devuelve la **misma vista**: el usuario no pierde lo escrito","El **servicio** aplica las reglas de **negocio**; si una falla, lanza `NegocioException` con el campo","Si todo sale bien: **redirect** a otra página con un mensaje flash"]],["nota","clave","**Post/Redirect/Get.** Si después de guardar se devuelve una vista, el navegador recuerda el POST y al recargar (F5) lo envía otra vez: ticket duplicado. Con `return \"redirect:/tickets/\" + id`, la última petición es un GET inofensivo."]]},{"t":"Un objeto para el formulario, no la entidad","b":[["code","TicketForm.java","@NotBlank(message = \"Escriba el asunto\")\n@Size(min = 5, max = 120, message = \"El asunto debe tener entre 5 y 120 caracteres\")\nprivate String asunto;\n\n@NotNull(message = \"Elija la categoría\")\nprivate Long categoriaId;        // la relación llega como un id"],["ul",["El formulario solo tiene lo que la pantalla pide. Nadie puede enviar `estado=CERRADO` porque ese campo no existe.","Es una **clase con getters y setters**: Thymeleaf los usa para llenar el objeto y para volver a mostrar lo escrito.","Los números son `Integer`/`Long`, no `int`: un campo vacío llega como `null` y `@NotNull` lo detecta."]],["tabla",["Anotación","Revisa que…"],[["`@NotBlank`","el texto no esté vacío ni sea solo espacios"],["`@NotNull`","haya un valor (números, fechas, enums, ids)"],["`@Size(min, max)`","la longitud esté en el rango (texto y listas)"],["`@Email`","tenga forma de correo"],["`@Pattern(regexp)`","cumpla una expresión regular"],["`@Min` / `@Max`","el número esté en el rango"],["`@Future` / `@Past`","la fecha sea futura o pasada"],["`@AssertTrue`","una casilla esté marcada"]]]]},{"t":"Formato y negocio: dos clases de reglas","b":[["tabla",["","Formato","Negocio"],[["Se revisa…","mirando solo el dato","consultando otros datos o una política"],["Ejemplo","El asunto tiene entre 5 y 120 caracteres","No hay otro ticket pendiente con el mismo asunto"],["Dónde","Anotaciones en el objeto del formulario","Código en el servicio que lanza `NegocioException`"],["Quién la cumple también","—","La API de la Unidad 4, que usa el mismo servicio"]]],"Para el usuario no hay diferencia: los dos errores aparecen junto al campo. El controlador convierte la excepción de negocio en un error del formulario:",["code","Formularios.java","if (e.getCampo() != null) {\n    resultado.rejectValue(e.getCampo(), \"negocio\", e.getMessage());   // junto al campo\n} else {\n    resultado.reject(\"negocio\", e.getMessage());                       // arriba del formulario\n}"]]},{"t":"Thymeleaf para formularios con Bootstrap","b":[["code","nuevo.html","\u003cform th:action=\"@{/tickets}\" th:object=\"${ticket}\" method=\"post\" novalidate>\n  \u003cinput type=\"text\" th:field=\"*{asunto}\" class=\"form-control\"\n         th:errorclass=\"is-invalid\">\n  \u003cdiv class=\"invalid-feedback\" th:errors=\"*{asunto}\">\u003c/div>\n\u003c/form>"],["tabla",["Atributo","Qué hace"],[["`th:object`","El objeto del formulario; dentro, `*{campo}` se refiere a sus atributos"],["`th:field`","Genera `id`, `name` y `value`, y vuelve a llenar el campo si hubo errores"],["`th:errorclass`","Agrega `is-invalid` (rojo en Bootstrap) solo si el campo tiene error"],["`th:errors`","Escribe el mensaje del error; Bootstrap lo muestra en `invalid-feedback`"],["`novalidate`","Apaga la validación del navegador para ver la del servidor, que es la que no se puede saltar"]]]]},{"t":"Relaciones en la pantalla","b":[["tabla",["Relación","Control","Qué viaja"],[["Muchos a uno (Ticket → Categoría)","`\u003cselect th:field=\"*{categoriaId}\">`","Un `Long`: el id elegido"],["Muchos a muchos (Usuario ↔ especialidades)","Una casilla por categoría con `th:field=\"*{especialidades}\"`","Un `Set\u003cLong>` con las marcadas"],["Enum (prioridad, rol)","`\u003cselect th:field=\"*{prioridad}\">` con `${prioridades}`","El nombre: `ALTA`"]]],"Las opciones de las listas se ponen en el modelo con un **método `@ModelAttribute`** del controlador: se ejecuta antes de cada petición, así la lista no queda vacía cuando el formulario vuelve con errores.",["code","UsuarioAdminController.java","@ModelAttribute(\"categorias\")\npublic List\u003cOpcionDTO> categorias() {\n    return categorias.opciones();\n}"]]},{"t":"Diseño común con fragmentos","b":["Un archivo `fragmentos.html` guarda las piezas que repiten todas las páginas; cada página las incluye con `th:replace`. Los fragmentos pueden recibir **parámetros**.",["tabla",["Fragmento","Para qué"],[["`head(titulo)`","Metadatos, Bootstrap y el título de cada página"],["`menu(activo)`","La barra de navegación, con la opción actual resaltada y las opciones según el rol"],["`mensajes`","Los mensajes flash `ok` y `error`"],["`estado(e)` y `prioridad(p)`","Insignias de color; el color sale de la clase CSS `estado-ABIERTO`, `prioridad-ALTA`…"],["`columna(titulo, lista, sePuedeTomar)`","Una columna del tablero, usada tres veces con datos distintos"],["`pie`","Pie de página y el JavaScript de Bootstrap"]]],["nota","pista","**`@ControllerAdvice`** agrega datos a *todas* las vistas. SoporteYa lo usa para poner en el modelo a «yo», el usuario actual, que el menú necesita en cada página."]]},{"t":"«Actuar como»: una sesión de mentiras","b":["Para probar los roles antes de tener login, esta unidad agrega un selector «Actuar como» en el menú que guarda el correo elegido en la sesión (`SesionDemo`).",["nota","ojo","Cualquiera puede elegir ser la coordinadora y ver todo. Eso es exactamente lo que **no** puede pasar en un sistema real, y es el problema que resuelve la Unidad 3: allí estas clases se borran y Spring Security dice quién es el usuario."]]}],"pasos":[{"t":"Validación, mensajes e idioma","min":10,"intro":"La dependencia Validation ya está desde la Unidad 0. Agregue el archivo de mensajes y fije el idioma para que las fechas salgan en español.","archivos":[{"ruta":"src/main/resources/application.properties","modo":"reemplazar","nota":"","lang":"props","codigo":"spring.application.name=soporteya\nspring.thymeleaf.cache=false\n\n# PostgreSQL. La contraseña NO se escribe aquí: llega por la variable DB_PASSWORD\nspring.datasource.url=jdbc:postgresql://localhost:5432/soporteya\nspring.datasource.username=adso\nspring.datasource.password=${DB_PASSWORD}\n\nspring.jpa.hibernate.ddl-auto=update\nspring.jpa.show-sql=true\nspring.jpa.open-in-view=false\n\n# Unidad 2 · idioma fijo: fechas y mensajes en español de Colombia\nspring.web.locale=es_CO\nspring.web.locale-resolver=fixed"},{"ruta":"src/main/resources/messages.properties","modo":"nuevo","nota":"","lang":"props","codigo":"# Mensajes cuando el texto del formulario no se puede convertir al tipo del atributo\ntypeMismatch.java.lang.Integer=Escriba un número entero\ntypeMismatch.java.lang.Long=Elija una opción de la lista\ntypeMismatch=El valor no tiene el formato correcto"}],"listo":"la aplicación arranca igual que antes."},{"t":"El diseño común","min":25,"archivos":[{"ruta":"src/main/resources/static/css/soporteya.css","modo":"reemplazar","nota":"","lang":"css","codigo":"/* SoporteYa · colores de la marca */\n:root {\n  --sy-azul: #1d3557;\n  --sy-turquesa: #2a9d8f;\n  --sy-ambar: #e9c46a;\n  --sy-rojo: #e76f51;\n}\n\n.portada {\n  background: linear-gradient(135deg, var(--sy-azul), var(--sy-turquesa));\n  color: #fff;\n}\n\n/* Unidad 2 · diseño común */\nbody {\n  display: flex;\n  flex-direction: column;\n  min-height: 100vh;\n  background: #f5f7fa;\n}\n\nmain {\n  flex: 1;\n}\n\n.navbar-sy {\n  background: var(--sy-azul);\n}\n\n.navbar-sy .nav-link.active {\n  border-bottom: 3px solid var(--sy-ambar);\n}\n\n.hoja {\n  max-width: 820px;\n}\n\n/* Un color por estado y por prioridad: se usan con el fragmento «estado» y «prioridad» */\n.estado-ABIERTO { background: #3a86ff; }\n.estado-EN_CURSO { background: var(--sy-ambar); color: #3d2e00; }\n.estado-RESUELTO { background: var(--sy-turquesa); }\n.estado-CERRADO { background: #6c757d; }\n.estado-CANCELADO { background: #adb5bd; color: #212529; }\n.prioridad-BAJA { background: #e9ecef; color: #495057; }\n.prioridad-MEDIA { background: #cfe2ff; color: #084298; }\n.prioridad-ALTA { background: #ffe5d0; color: #9a3412; }\n.prioridad-CRITICA { background: var(--sy-rojo); }\n\n.columna {\n  background: #eef1f5;\n  border-radius: .75rem;\n  padding: .75rem;\n  min-height: 12rem;\n}\n\n.tarjeta-ticket.vencido {\n  border-left: 5px solid var(--sy-rojo);\n}\n\n.comentario.interno {\n  background: #fff8e1;\n  border-left: 4px solid var(--sy-ambar);\n}\n\n.comentario.sistema {\n  background: transparent;\n  border: 0;\n  color: #6c757d;\n  font-size: .9rem;\n}"},{"ruta":"src/main/resources/templates/fragmentos.html","modo":"nuevo","nota":"","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003c!-- Piezas comunes de SoporteYa. Cada página las incluye con th:replace. -->\n\n\u003chead th:fragment=\"head(titulo)\">\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle th:text=\"${titulo} + ' · SoporteYa'\">SoporteYa\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css\">\n  \u003clink rel=\"stylesheet\" th:href=\"@{/css/soporteya.css}\">\n\u003c/head>\n\n\u003cbody>\n  \u003c!-- activo: la opción del menú que se resalta. El menú cambia según el rol de «yo». -->\n  \u003cnav th:fragment=\"menu(activo)\" class=\"navbar navbar-expand-lg navbar-dark navbar-sy\">\n    \u003cdiv class=\"container\">\n      \u003ca class=\"navbar-brand fw-bold\" th:href=\"@{/}\">SoporteYa\u003c/a>\n      \u003cbutton class=\"navbar-toggler\" type=\"button\" data-bs-toggle=\"collapse\" data-bs-target=\"#menu\"\n              aria-controls=\"menu\" aria-expanded=\"false\" aria-label=\"Abrir el menú\">\n        \u003cspan class=\"navbar-toggler-icon\">\u003c/span>\n      \u003c/button>\n      \u003cdiv class=\"collapse navbar-collapse\" id=\"menu\">\n        \u003cul class=\"navbar-nav me-auto\">\n          \u003cli class=\"nav-item\">\n            \u003ca class=\"nav-link\" th:href=\"@{/tickets}\" th:classappend=\"${activo == 'tickets'} ? 'active'\">Mis tickets\u003c/a>\n          \u003c/li>\n          \u003cli class=\"nav-item\" th:if=\"${yo.rol.name() != 'SOLICITANTE'}\">\n            \u003ca class=\"nav-link\" th:href=\"@{/tablero}\" th:classappend=\"${activo == 'tablero'} ? 'active'\">Tablero\u003c/a>\n          \u003c/li>\n          \u003cli class=\"nav-item\" th:if=\"${yo.rol.name() == 'COORDINADOR'}\">\n            \u003ca class=\"nav-link\" th:href=\"@{/admin/categorias}\" th:classappend=\"${activo == 'categorias'} ? 'active'\">Categorías\u003c/a>\n          \u003c/li>\n          \u003cli class=\"nav-item\" th:if=\"${yo.rol.name() == 'COORDINADOR'}\">\n            \u003ca class=\"nav-link\" th:href=\"@{/admin/usuarios}\" th:classappend=\"${activo == 'usuarios'} ? 'active'\">Usuarios\u003c/a>\n          \u003c/li>\n          \u003cli class=\"nav-item\" th:if=\"${yo.rol.name() == 'COORDINADOR'}\">\n            \u003ca class=\"nav-link\" th:href=\"@{/admin/indicadores}\" th:classappend=\"${activo == 'indicadores'} ? 'active'\">Indicadores\u003c/a>\n          \u003c/li>\n        \u003c/ul>\n        \u003c!-- SOLO UNIDAD 2: «actuar como» reemplaza al login. En la Unidad 3 se cambia por el usuario real. -->\n        \u003cform th:action=\"@{/demo/actuar-como}\" method=\"post\" class=\"d-flex gap-2 align-items-center\">\n          \u003clabel for=\"actuarComo\" class=\"text-white-50 small text-nowrap\">Actuar como\u003c/label>\n          \u003cselect id=\"actuarComo\" name=\"email\" class=\"form-select form-select-sm\">\n            \u003coption th:each=\"u : ${usuariosDemo}\" th:value=\"${u.email}\" th:selected=\"${u.email == yo.email}\"\n                    th:text=\"|${u.nombreCompleto} · ${u.rol.etiqueta}|\">Ana Pérez · Solicitante\u003c/option>\n          \u003c/select>\n          \u003cbutton type=\"submit\" class=\"btn btn-sm btn-outline-light\">Cambiar\u003c/button>\n        \u003c/form>\n      \u003c/div>\n    \u003c/div>\n  \u003c/nav>\n\n  \u003c!-- Mensajes «flash»: llegan después de un redirect y duran una sola petición -->\n  \u003cdiv th:fragment=\"mensajes\">\n    \u003cdiv class=\"alert alert-success alert-dismissible fade show\" role=\"alert\" th:if=\"${ok}\">\n      \u003cspan th:text=\"${ok}\">Guardado\u003c/span>\n      \u003cbutton type=\"button\" class=\"btn-close\" data-bs-dismiss=\"alert\" aria-label=\"Cerrar\">\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"alert alert-danger\" role=\"alert\" th:if=\"${error}\" th:text=\"${error}\">Error\u003c/div>\n  \u003c/div>\n\n  \u003c!-- Insignias con parámetro: el color sale de la clase CSS estado-… o prioridad-… -->\n  \u003cspan th:fragment=\"estado(e)\" th:class=\"|badge estado-${e.name()}|\" th:text=\"${e.etiqueta}\">Abierto\u003c/span>\n  \u003cspan th:fragment=\"prioridad(p)\" th:class=\"|badge prioridad-${p.name()}|\" th:text=\"${p.etiqueta}\">Alta\u003c/span>\n\n  \u003c!-- Una columna del tablero: título, lista de tickets y si se muestra el botón «Tomar» -->\n  \u003cdiv class=\"col-lg-4\" th:fragment=\"columna(titulo, lista, sePuedeTomar)\">\n    \u003cdiv class=\"columna\">\n      \u003ch2 class=\"h6 d-flex justify-content-between\">\n        \u003cspan th:text=\"${titulo}\">Abiertos\u003c/span>\n        \u003cspan class=\"badge text-bg-secondary\" th:text=\"${#lists.size(lista)}\">3\u003c/span>\n      \u003c/h2>\n      \u003cp class=\"small text-muted\" th:if=\"${#lists.isEmpty(lista)}\">Nada por aquí.\u003c/p>\n      \u003cdiv class=\"card card-body tarjeta-ticket mb-2 py-2\" th:each=\"t : ${lista}\" th:classappend=\"${t.vencido} ? 'vencido'\">\n        \u003cdiv class=\"d-flex justify-content-between small\">\n          \u003ca th:href=\"@{/tickets/{id}(id=${t.id})}\" th:text=\"${t.codigo}\">SY-00001\u003c/a>\n          \u003cspan th:replace=\"~{fragmentos :: prioridad(${t.prioridad})}\">\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"fw-semibold\" th:text=\"${t.asunto}\">Asunto\u003c/div>\n        \u003cdiv class=\"small text-muted\" th:text=\"|${t.categoria} · ${t.solicitante}|\">Hardware · Ana\u003c/div>\n        \u003cdiv class=\"small\" th:classappend=\"${t.vencido} ? 'text-danger fw-semibold' : 'text-muted'\"\n             th:text=\"'Límite: ' + ${#temporals.format(t.fechaLimite, 'd MMM, h:mm a')}\">Límite\u003c/div>\n        \u003cdiv class=\"small\" th:if=\"${t.tecnico}\" th:text=\"'Técnico: ' + ${t.tecnico}\">Técnico\u003c/div>\n        \u003cform th:if=\"${sePuedeTomar and yo.rol.name() == 'TECNICO'}\"\n              th:action=\"@{/tablero/{id}/tomar(id=${t.id})}\" method=\"post\" class=\"mt-2\">\n          \u003cbutton type=\"submit\" class=\"btn btn-sm btn-primary\">Tomar\u003c/button>\n        \u003c/form>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cth:block th:fragment=\"pie\">\n    \u003cfooter class=\"text-center text-muted small py-4 border-top mt-5\">\n      SoporteYa · Mesa de ayuda de TI · Proyecto guía ADSO · SENA\n    \u003c/footer>\n    \u003cscript src=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js\">\u003c/script>\n  \u003c/th:block>\n\u003c/body>\n\u003c/html>"},{"ruta":"src/main/resources/templates/index.html","modo":"reemplazar","nota":"","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead th:replace=\"~{fragmentos :: head('Mesa de ayuda')}\">\u003c/head>\n\u003cbody>\n  \u003cnav th:replace=\"~{fragmentos :: menu('inicio')}\">\u003c/nav>\n\n  \u003cheader class=\"portada py-5\">\n    \u003cdiv class=\"container\">\n      \u003cp class=\"text-uppercase small mb-2\">Mesa de ayuda de TI\u003c/p>\n      \u003ch1 class=\"display-5 fw-bold\">Hola, \u003cspan th:text=\"${yo.nombreCompleto}\">Ana\u003c/span>\u003c/h1>\n      \u003cp class=\"lead mb-4\">Reporte la falla, siga su ticket y sepa quién lo está atendiendo.\u003c/p>\n      \u003ca class=\"btn btn-light btn-lg\" th:href=\"@{/tickets/nuevo}\">Reportar una falla\u003c/a>\n      \u003ca class=\"btn btn-outline-light btn-lg\" th:if=\"${yo.rol.name() != 'SOLICITANTE'}\" th:href=\"@{/tablero}\">Ir al tablero\u003c/a>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cmain class=\"container my-5\">\n    \u003ch2 class=\"h5 mb-3\">La mesa de ayuda hoy\u003c/h2>\n    \u003cdiv class=\"row g-3\">\n      \u003cdiv class=\"col-6 col-md\" th:each=\"c : ${conteos}\">\n        \u003cdiv class=\"card card-body text-center h-100\">\n          \u003cdiv class=\"display-6 fw-bold\" th:text=\"${c.cantidad}\">3\u003c/div>\n          \u003cspan th:replace=\"~{fragmentos :: estado(${c.estado})}\">\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\n  \u003cth:block th:replace=\"~{fragmentos :: pie}\">\u003c/th:block>\n\u003c/body>\n\u003c/html>"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/controller/InicioController.java","modo":"reemplazar","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.controller;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\nimport org.springframework.web.bind.annotation.GetMapping;\n\nimport co.edu.sena.adso.soporteya.service.TicketService;\n\n@Controller\npublic class InicioController {\n\n    private final TicketService tickets;\n\n    public InicioController(TicketService tickets) {\n        this.tickets = tickets;\n    }\n\n    @GetMapping(\"/\")\n    public String inicio(Model model) {\n        model.addAttribute(\"conteos\", tickets.conteoPorEstado());\n        return \"index\";\n    }\n}"}],"antes":["`index.html` y el menú usan `yo` y `conteos`: créelos después del paso 3 o la portada fallará al arrancar. Puede hacer los pasos 2 y 3 seguidos."],"listo":"la portada saluda al usuario y muestra los tickets por estado con insignias de color."},{"t":"El usuario actual (temporal)","min":15,"archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/config/SesionDemo.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.config;\n\nimport org.springframework.stereotype.Component;\n\nimport jakarta.servlet.http.HttpSession;\n\n// SOLO PARA LA UNIDAD 2. Todavía no hay login, así que el menú deja elegir\n// «quién soy» y lo guardamos en la sesión. Cualquiera puede hacerse pasar por otro:\n// ese es justamente el problema que resuelve la Unidad 3. Allí esta clase se borra.\n@Component\npublic class SesionDemo {\n\n    private static final String CLAVE = \"emailDemo\";\n    private static final String POR_DEFECTO = \"ana.perez@soporteya.co\";\n\n    public String email(HttpSession sesion) {\n        Object email = sesion.getAttribute(CLAVE);\n        return email == null ? POR_DEFECTO : email.toString();\n    }\n\n    public void cambiar(HttpSession sesion, String email) {\n        sesion.setAttribute(CLAVE, email);\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/controller/DemoController.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.controller;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestParam;\n\nimport jakarta.servlet.http.HttpSession;\n\nimport co.edu.sena.adso.soporteya.config.SesionDemo;\n\n// SOLO UNIDAD 2: cambia el usuario simulado. Se borra en la Unidad 3.\n@Controller\npublic class DemoController {\n\n    private final SesionDemo demo;\n\n    public DemoController(SesionDemo demo) {\n        this.demo = demo;\n    }\n\n    @PostMapping(\"/demo/actuar-como\")\n    public String actuarComo(@RequestParam(\"email\") String email, HttpSession sesion) {\n        demo.cambiar(sesion, email);\n        return \"redirect:/\";\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/controller/VistaComun.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.controller;\n\nimport java.util.List;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.web.bind.annotation.ControllerAdvice;\nimport org.springframework.web.bind.annotation.ModelAttribute;\n\nimport jakarta.servlet.http.HttpSession;\n\nimport co.edu.sena.adso.soporteya.config.SesionDemo;\nimport co.edu.sena.adso.soporteya.dto.UsuarioDTO;\nimport co.edu.sena.adso.soporteya.service.UsuarioService;\n\n// Agrega a TODAS las vistas quién es el usuario actual («yo»), para el menú y los permisos\n@ControllerAdvice(annotations = Controller.class)\npublic class VistaComun {\n\n    private final UsuarioService usuarios;\n    private final SesionDemo demo;\n\n    public VistaComun(UsuarioService usuarios, SesionDemo demo) {\n        this.usuarios = usuarios;\n        this.demo = demo;\n    }\n\n    @ModelAttribute(\"yo\")\n    public UsuarioDTO yo(HttpSession sesion) {\n        return usuarios.porEmail(demo.email(sesion));\n    }\n\n    // Solo Unidad 2: la lista del selector «Actuar como»\n    @ModelAttribute(\"usuariosDemo\")\n    public List\u003cUsuarioDTO> usuariosDemo() {\n        return usuarios.todos();\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/dto/UsuarioDTO.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.dto;\n\nimport java.util.stream.Collectors;\n\nimport co.edu.sena.adso.soporteya.model.Categoria;\nimport co.edu.sena.adso.soporteya.model.Rol;\nimport co.edu.sena.adso.soporteya.model.Usuario;\n\npublic record UsuarioDTO(Long id, String nombreCompleto, String email, Rol rol, String area,\n                         String especialidades, boolean activo) {\n\n    public static UsuarioDTO from(Usuario u) {\n        String esp = u.getEspecialidades().stream().map(Categoria::getNombre).sorted()\n                .collect(Collectors.joining(\", \"));\n        return new UsuarioDTO(u.getId(), u.getNombreCompleto(), u.getEmail(), u.getRol(),\n                u.getArea() == null ? \"—\" : u.getArea().getNombre(), esp, u.isActivo());\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/service/UsuarioService.java","modo":"nuevo","nota":"Incluye también la gestión de usuarios del paso 7.","lang":"java","codigo":"package co.edu.sena.adso.soporteya.service;\n\nimport java.util.HashSet;\nimport java.util.List;\n\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport co.edu.sena.adso.soporteya.dto.OpcionDTO;\nimport co.edu.sena.adso.soporteya.dto.UsuarioDTO;\nimport co.edu.sena.adso.soporteya.dto.UsuarioForm;\nimport co.edu.sena.adso.soporteya.model.Area;\nimport co.edu.sena.adso.soporteya.model.Categoria;\nimport co.edu.sena.adso.soporteya.model.Rol;\nimport co.edu.sena.adso.soporteya.model.Usuario;\nimport co.edu.sena.adso.soporteya.repository.AreaRepository;\nimport co.edu.sena.adso.soporteya.repository.CategoriaRepository;\nimport co.edu.sena.adso.soporteya.repository.UsuarioRepository;\n\n@Service\n@Transactional(readOnly = true)\npublic class UsuarioService {\n\n    private final UsuarioRepository usuarios;\n    private final AreaRepository areas;\n    private final CategoriaRepository categorias;\n\n    public UsuarioService(UsuarioRepository usuarios, AreaRepository areas, CategoriaRepository categorias) {\n        this.usuarios = usuarios;\n        this.areas = areas;\n        this.categorias = categorias;\n    }\n\n    public UsuarioDTO porEmail(String email) {\n        return usuarios.findByEmail(email).map(UsuarioDTO::from)\n                .orElseThrow(() -> new NegocioException(\"No existe el usuario \" + email));\n    }\n\n    public List\u003cUsuarioDTO> todos() {\n        return usuarios.findAllByOrderByRolAscNombreCompletoAsc().stream().map(UsuarioDTO::from).toList();\n    }\n\n    public List\u003cOpcionDTO> areas() {\n        return areas.findAllByOrderByNombreAsc().stream().map(a -> new OpcionDTO(a.getId(), a.getNombre())).toList();\n    }\n\n    public UsuarioForm formulario(Long id) {\n        return UsuarioForm.desde(buscar(id));\n    }\n\n    @Transactional\n    public UsuarioDTO guardar(UsuarioForm form) {\n        String email = form.getEmail().trim().toLowerCase();\n        Usuario usuario = form.esNuevo() ? null : buscar(form.getId());\n        boolean emailCambio = usuario == null || !usuario.getEmail().equalsIgnoreCase(email);\n        if (emailCambio && usuarios.existsByEmailIgnoreCase(email)) {\n            throw new NegocioException(\"email\", \"Ya hay un usuario con el correo \" + email);\n        }\n        // Regla: un técnico necesita al menos una especialidad\n        if (form.getRol() == Rol.TECNICO && form.getEspecialidades().isEmpty()) {\n            throw new NegocioException(\"especialidades\", \"Marque al menos una especialidad para el técnico\");\n        }\n        Area area = areas.findById(form.getAreaId())\n                .orElseThrow(() -> new NegocioException(\"areaId\", \"El área elegida no existe\"));\n\n        if (usuario == null) {\n            usuario = new Usuario(form.getNombreCompleto().trim(), email, form.getRol(), area);\n        } else {\n            usuario.setNombreCompleto(form.getNombreCompleto().trim());\n            usuario.setEmail(email);\n            usuario.setRol(form.getRol());\n            usuario.setArea(area);\n        }\n        // Muchos a muchos: se reemplaza el conjunto por las categorías marcadas\n        usuario.getEspecialidades().clear();\n        if (form.getRol() == Rol.TECNICO) {\n            usuario.getEspecialidades().addAll(new HashSet\u003cCategoria>(categorias.findAllById(form.getEspecialidades())));\n        }\n        return UsuarioDTO.from(usuarios.save(usuario));\n    }\n\n    @Transactional\n    public UsuarioDTO cambiarEstado(Long id) {\n        Usuario usuario = buscar(id);\n        usuario.setActivo(!usuario.isActivo());\n        return UsuarioDTO.from(usuario);\n    }\n\n    private Usuario buscar(Long id) {\n        return usuarios.findById(id).orElseThrow(() -> new NegocioException(\"No existe el usuario \" + id));\n    }\n}"}],"antes":["`UsuarioService` usa `UsuarioForm` y `OpcionDTO`. Créelos en este momento (están en el paso 4)."],"listo":"el selector «Actuar como» cambia el nombre que saluda en la portada."},{"t":"Los objetos de formulario y los DTO de las vistas","min":25,"archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/dto/OpcionDTO.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.dto;\n\n// Una opción de un \u003cselect> o de una casilla: el valor que se envía (id) y el texto que se ve\npublic record OpcionDTO(Long id, String texto) {\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/dto/TicketForm.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.dto;\n\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.NotNull;\nimport jakarta.validation.constraints.Size;\n\nimport co.edu.sena.adso.soporteya.model.Prioridad;\n\n// Formulario «Nuevo ticket». Reglas de FORMATO; las de negocio están en TicketService.\npublic class TicketForm {\n\n    @NotBlank(message = \"Escriba el asunto\")\n    @Size(min = 5, max = 120, message = \"El asunto debe tener entre 5 y 120 caracteres\")\n    private String asunto;\n\n    @NotBlank(message = \"Describa la falla\")\n    @Size(min = 20, max = 2000, message = \"Describa la falla con al menos 20 caracteres\")\n    private String descripcion;\n\n    @NotNull(message = \"Elija la prioridad\")\n    private Prioridad prioridad = Prioridad.MEDIA;\n\n    @NotNull(message = \"Elija la categoría\")\n    private Long categoriaId;\n\n    public NuevoTicket aNuevoTicket() {\n        return new NuevoTicket(asunto, descripcion, prioridad, categoriaId);\n    }\n\n    public String getAsunto() {\n        return asunto;\n    }\n\n    public void setAsunto(String asunto) {\n        this.asunto = asunto;\n    }\n\n    public String getDescripcion() {\n        return descripcion;\n    }\n\n    public void setDescripcion(String descripcion) {\n        this.descripcion = descripcion;\n    }\n\n    public Prioridad getPrioridad() {\n        return prioridad;\n    }\n\n    public void setPrioridad(Prioridad prioridad) {\n        this.prioridad = prioridad;\n    }\n\n    public Long getCategoriaId() {\n        return categoriaId;\n    }\n\n    public void setCategoriaId(Long categoriaId) {\n        this.categoriaId = categoriaId;\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/dto/TextoForm.java","modo":"nuevo","nota":"Un mismo formulario para comentar, resolver y reabrir.","lang":"java","codigo":"package co.edu.sena.adso.soporteya.dto;\n\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.Size;\n\n// Un formulario de un solo texto: comentario, solución o motivo para reabrir\npublic class TextoForm {\n\n    @NotBlank(message = \"Escriba el texto\")\n    @Size(max = 2000, message = \"Máximo 2000 caracteres\")\n    private String texto;\n\n    // Solo para comentarios de técnicos y coordinación\n    private boolean interno;\n\n    public String getTexto() {\n        return texto;\n    }\n\n    public void setTexto(String texto) {\n        this.texto = texto;\n    }\n\n    public boolean isInterno() {\n        return interno;\n    }\n\n    public void setInterno(boolean interno) {\n        this.interno = interno;\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/dto/CategoriaForm.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.dto;\n\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.Size;\n\nimport co.edu.sena.adso.soporteya.model.Categoria;\n\npublic class CategoriaForm {\n\n    private Long id;\n\n    @NotBlank(message = \"Escriba el nombre\")\n    @Size(max = 60, message = \"Máximo 60 caracteres\")\n    private String nombre;\n\n    @Size(max = 250, message = \"Máximo 250 caracteres\")\n    private String descripcion;\n\n    public static CategoriaForm desde(Categoria c) {\n        CategoriaForm f = new CategoriaForm();\n        f.id = c.getId();\n        f.nombre = c.getNombre();\n        f.descripcion = c.getDescripcion();\n        return f;\n    }\n\n    public boolean esNuevo() {\n        return id == null;\n    }\n\n    public Long getId() {\n        return id;\n    }\n\n    public void setId(Long id) {\n        this.id = id;\n    }\n\n    public String getNombre() {\n        return nombre;\n    }\n\n    public void setNombre(String nombre) {\n        this.nombre = nombre;\n    }\n\n    public String getDescripcion() {\n        return descripcion;\n    }\n\n    public void setDescripcion(String descripcion) {\n        this.descripcion = descripcion;\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/dto/UsuarioForm.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.dto;\n\nimport java.util.HashSet;\nimport java.util.Set;\n\nimport jakarta.validation.constraints.Email;\nimport jakarta.validation.constraints.NotBlank;\nimport jakarta.validation.constraints.NotNull;\nimport jakarta.validation.constraints.Size;\n\nimport co.edu.sena.adso.soporteya.model.Categoria;\nimport co.edu.sena.adso.soporteya.model.Rol;\nimport co.edu.sena.adso.soporteya.model.Usuario;\n\n// Formulario de usuarios. La relación muchos a muchos llega como un conjunto de ids de las casillas marcadas.\npublic class UsuarioForm {\n\n    private Long id;\n\n    @NotBlank(message = \"Escriba el nombre completo\")\n    @Size(max = 120, message = \"Máximo 120 caracteres\")\n    private String nombreCompleto;\n\n    @NotBlank(message = \"Escriba el correo\")\n    @Email(message = \"Escriba un correo válido\")\n    private String email;\n\n    @NotNull(message = \"Elija el rol\")\n    private Rol rol = Rol.SOLICITANTE;\n\n    @NotNull(message = \"Elija el área\")\n    private Long areaId;\n\n    private Set\u003cLong> especialidades = new HashSet\u003c>();\n\n    public static UsuarioForm desde(Usuario u) {\n        UsuarioForm f = new UsuarioForm();\n        f.id = u.getId();\n        f.nombreCompleto = u.getNombreCompleto();\n        f.email = u.getEmail();\n        f.rol = u.getRol();\n        f.areaId = u.getArea() == null ? null : u.getArea().getId();\n        u.getEspecialidades().stream().map(Categoria::getId).forEach(f.especialidades::add);\n        return f;\n    }\n\n    public boolean esNuevo() {\n        return id == null;\n    }\n\n    public Long getId() {\n        return id;\n    }\n\n    public void setId(Long id) {\n        this.id = id;\n    }\n\n    public String getNombreCompleto() {\n        return nombreCompleto;\n    }\n\n    public void setNombreCompleto(String nombreCompleto) {\n        this.nombreCompleto = nombreCompleto;\n    }\n\n    public String getEmail() {\n        return email;\n    }\n\n    public void setEmail(String email) {\n        this.email = email;\n    }\n\n    public Rol getRol() {\n        return rol;\n    }\n\n    public void setRol(Rol rol) {\n        this.rol = rol;\n    }\n\n    public Long getAreaId() {\n        return areaId;\n    }\n\n    public void setAreaId(Long areaId) {\n        this.areaId = areaId;\n    }\n\n    public Set\u003cLong> getEspecialidades() {\n        return especialidades;\n    }\n\n    public void setEspecialidades(Set\u003cLong> especialidades) {\n        this.especialidades = especialidades;\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/dto/CategoriaDTO.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.dto;\n\nimport co.edu.sena.adso.soporteya.model.Categoria;\n\npublic record CategoriaDTO(Long id, String nombre, String descripcion, boolean activa) {\n\n    public static CategoriaDTO from(Categoria c) {\n        return new CategoriaDTO(c.getId(), c.getNombre(), c.getDescripcion(), c.isActiva());\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/dto/ComentarioDTO.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.dto;\n\nimport java.time.LocalDateTime;\n\nimport co.edu.sena.adso.soporteya.model.Comentario;\n\npublic record ComentarioDTO(String autor, String rol, String texto, LocalDateTime fecha, boolean interno, boolean sistema) {\n\n    public static ComentarioDTO from(Comentario c) {\n        return new ComentarioDTO(c.getAutor().getNombreCompleto(), c.getAutor().getRol().getEtiqueta(), c.getTexto(),\n                c.getFecha(), c.isInterno(), c.getTexto().startsWith(\"Estado: \"));\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/dto/TicketDetalleDTO.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.dto;\n\nimport java.time.LocalDateTime;\nimport java.util.List;\n\nimport co.edu.sena.adso.soporteya.model.EstadoTicket;\nimport co.edu.sena.adso.soporteya.model.Prioridad;\nimport co.edu.sena.adso.soporteya.model.Ticket;\n\n// Todo lo que muestra la página de un ticket, incluidos sus comentarios\npublic record TicketDetalleDTO(Long id, String codigo, String asunto, String descripcion, EstadoTicket estado,\n                               Prioridad prioridad, String categoria, String solicitante, String solicitanteEmail,\n                               String area, String tecnico, String tecnicoEmail, LocalDateTime fechaCreacion,\n                               LocalDateTime fechaLimite, LocalDateTime fechaResolucion, boolean vencido,\n                               List\u003cComentarioDTO> comentarios) {\n\n    public static TicketDetalleDTO from(Ticket t, List\u003cComentarioDTO> comentarios) {\n        var s = t.getSolicitante();\n        var tec = t.getTecnico();\n        return new TicketDetalleDTO(t.getId(), t.getCodigo(), t.getAsunto(), t.getDescripcion(), t.getEstado(),\n                t.getPrioridad(), t.getCategoria().getNombre(), s.getNombreCompleto(), s.getEmail(),\n                s.getArea() == null ? \"—\" : s.getArea().getNombre(),\n                tec == null ? null : tec.getNombreCompleto(), tec == null ? null : tec.getEmail(),\n                t.getFechaCreacion(), t.getFechaLimite(), t.getFechaResolucion(), t.isVencido(), comentarios);\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/dto/TableroDTO.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.dto;\n\nimport java.util.List;\n\n// Las tres columnas del tablero de la mesa de ayuda\npublic record TableroDTO(List\u003cTicketResumenDTO> abiertos, List\u003cTicketResumenDTO> enCurso,\n                         List\u003cTicketResumenDTO> resueltos) {\n}"}],"listo":"el paquete `dto` compila."},{"t":"Los servicios crecen","min":20,"intro":"`TicketService` gana tres métodos (`tablero`, `detalle` y `comentar`) y aparece `CategoriaService`. Las reglas de la Unidad 1 no cambian.","archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/service/TicketService.java","modo":"reemplazar","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.service;\n\nimport java.time.LocalDateTime;\nimport java.time.YearMonth;\nimport java.util.List;\nimport java.util.Set;\n\nimport org.springframework.data.domain.Page;\nimport org.springframework.data.domain.PageRequest;\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport co.edu.sena.adso.soporteya.dto.ComentarioDTO;\nimport co.edu.sena.adso.soporteya.dto.ConteoEstadoDTO;\nimport co.edu.sena.adso.soporteya.dto.IndicadorTecnicoDTO;\nimport co.edu.sena.adso.soporteya.dto.NuevoTicket;\nimport co.edu.sena.adso.soporteya.dto.TableroDTO;\nimport co.edu.sena.adso.soporteya.dto.TicketDetalleDTO;\nimport co.edu.sena.adso.soporteya.dto.TicketResumenDTO;\nimport co.edu.sena.adso.soporteya.model.Categoria;\nimport co.edu.sena.adso.soporteya.model.Comentario;\nimport co.edu.sena.adso.soporteya.model.EstadoTicket;\nimport co.edu.sena.adso.soporteya.model.Rol;\nimport co.edu.sena.adso.soporteya.model.Ticket;\nimport co.edu.sena.adso.soporteya.model.Usuario;\nimport co.edu.sena.adso.soporteya.repository.CategoriaRepository;\nimport co.edu.sena.adso.soporteya.repository.TicketRepository;\nimport co.edu.sena.adso.soporteya.repository.UsuarioRepository;\n\n@Service\n@Transactional(readOnly = true)\npublic class TicketService {\n\n    private static final int TAMANO_PAGINA = 10;\n\n    private final TicketRepository tickets;\n    private final UsuarioRepository usuarios;\n    private final CategoriaRepository categorias;\n\n    public TicketService(TicketRepository tickets, UsuarioRepository usuarios, CategoriaRepository categorias) {\n        this.tickets = tickets;\n        this.usuarios = usuarios;\n        this.categorias = categorias;\n    }\n\n    // ---------- consultas ----------\n\n    public Page\u003cTicketResumenDTO> misTickets(String email, int pagina) {\n        return tickets.findBySolicitanteEmailOrderByFechaCreacionDesc(email, PageRequest.of(pagina, TAMANO_PAGINA))\n                .map(TicketResumenDTO::from);\n    }\n\n    public List\u003cTicketResumenDTO> pendientes() {\n        return tickets.findByEstadoInOrderByFechaLimiteAsc(EstadoTicket.pendientes()).stream()\n                .map(TicketResumenDTO::from)\n                .toList();\n    }\n\n    // Unidad 2 · las tres columnas del tablero\n    public TableroDTO tablero() {\n        List\u003cTicketResumenDTO> todos = tickets.findByEstadoInOrderByFechaLimiteAsc(\n                        Set.of(EstadoTicket.ABIERTO, EstadoTicket.EN_CURSO, EstadoTicket.RESUELTO)).stream()\n                .map(TicketResumenDTO::from)\n                .toList();\n        return new TableroDTO(\n                todos.stream().filter(t -> t.estado() == EstadoTicket.ABIERTO).toList(),\n                todos.stream().filter(t -> t.estado() == EstadoTicket.EN_CURSO).toList(),\n                todos.stream().filter(t -> t.estado() == EstadoTicket.RESUELTO).toList());\n    }\n\n    // Unidad 2 · la página de un ticket con sus comentarios\n    public TicketDetalleDTO detalle(Long id) {\n        Ticket ticket = buscar(id);\n        List\u003cComentarioDTO> comentarios = ticket.getComentarios().stream().map(ComentarioDTO::from).toList();\n        return TicketDetalleDTO.from(ticket, comentarios);\n    }\n\n    public List\u003cConteoEstadoDTO> conteoPorEstado() {\n        return tickets.conteoPorEstado();\n    }\n\n    public List\u003cIndicadorTecnicoDTO> indicadores(YearMonth mes) {\n        LocalDateTime desde = mes.atDay(1).atStartOfDay();\n        return tickets.indicadoresEntre(desde, desde.plusMonths(1));\n    }\n\n    public List\u003cTicketResumenDTO> vencidos() {\n        return tickets.vencidos(EstadoTicket.pendientes(), LocalDateTime.now()).stream()\n                .map(TicketResumenDTO::from)\n                .toList();\n    }\n\n    // ---------- operaciones: cada una es una transacción completa ----------\n\n    @Transactional\n    public TicketResumenDTO crear(NuevoTicket datos, String emailSolicitante) {\n        Usuario solicitante = usuario(emailSolicitante);\n        Categoria categoria = categorias.findById(datos.categoriaId())\n                .filter(Categoria::isActiva)\n                .orElseThrow(() -> new NegocioException(\"categoriaId\", \"La categoría elegida no existe o está inactiva\"));\n\n        String asunto = datos.asunto().trim();\n        if (tickets.existsBySolicitanteIdAndAsuntoIgnoreCaseAndEstadoIn(solicitante.getId(), asunto, EstadoTicket.pendientes())) {\n            throw new NegocioException(\"asunto\", \"Ya tiene un ticket pendiente con ese asunto\");\n        }\n        Ticket ticket = new Ticket(asunto, datos.descripcion().trim(), datos.prioridad(), solicitante, categoria);\n        return TicketResumenDTO.from(tickets.save(ticket));\n    }\n\n    // Un técnico toma un ticket ABIERTO de su especialidad\n    @Transactional\n    public TicketResumenDTO tomar(Long ticketId, String emailTecnico) {\n        Ticket ticket = buscar(ticketId);\n        Usuario tecnico = usuario(emailTecnico);\n        if (tecnico.getRol() != Rol.TECNICO) {\n            throw new NegocioException(\"Solo un técnico puede tomar tickets\");\n        }\n        if (ticket.getEstado() != EstadoTicket.ABIERTO) {\n            throw new NegocioException(\"El ticket \" + ticket.getCodigo() + \" ya no está abierto\");\n        }\n        if (!tecnico.atiende(ticket.getCategoria())) {\n            throw new NegocioException(\"No tiene la especialidad \" + ticket.getCategoria().getNombre());\n        }\n        ticket.setTecnico(tecnico);\n        transicion(ticket, EstadoTicket.EN_CURSO, tecnico, \"Tomado por \" + tecnico.getNombreCompleto());\n        return TicketResumenDTO.from(ticket);   // sin save(): dirty checking hace el UPDATE\n    }\n\n    @Transactional\n    public TicketResumenDTO resolver(Long ticketId, String emailTecnico, String solucion) {\n        Ticket ticket = buscar(ticketId);\n        Usuario tecnico = usuario(emailTecnico);\n        if (ticket.getTecnico() == null || !ticket.getTecnico().getId().equals(tecnico.getId())) {\n            throw new NegocioException(\"Solo el técnico asignado puede resolver el ticket\");\n        }\n        if (solucion == null || solucion.trim().length() \u003c 10) {\n            throw new NegocioException(\"texto\", \"Describa la solución (mínimo 10 caracteres)\");\n        }\n        transicion(ticket, EstadoTicket.RESUELTO, tecnico, \"Solución: \" + solucion.trim());\n        return TicketResumenDTO.from(ticket);\n    }\n\n    // El solicitante confirma que quedó bien\n    @Transactional\n    public TicketResumenDTO cerrar(Long ticketId, String emailSolicitante) {\n        Ticket ticket = delSolicitante(ticketId, emailSolicitante);\n        transicion(ticket, EstadoTicket.CERRADO, ticket.getSolicitante(), \"Confirmado por el solicitante\");\n        return TicketResumenDTO.from(ticket);\n    }\n\n    // El solicitante dice que no quedó bien: vuelve al técnico\n    @Transactional\n    public TicketResumenDTO reabrir(Long ticketId, String emailSolicitante, String motivo) {\n        Ticket ticket = delSolicitante(ticketId, emailSolicitante);\n        if (motivo == null || motivo.isBlank()) {\n            throw new NegocioException(\"texto\", \"Explique por qué reabre el ticket\");\n        }\n        transicion(ticket, EstadoTicket.EN_CURSO, ticket.getSolicitante(), \"Reabierto: \" + motivo.trim());\n        return TicketResumenDTO.from(ticket);\n    }\n\n    @Transactional\n    public TicketResumenDTO cancelar(Long ticketId, String emailSolicitante) {\n        Ticket ticket = delSolicitante(ticketId, emailSolicitante);\n        transicion(ticket, EstadoTicket.CANCELADO, ticket.getSolicitante(), \"Cancelado por el solicitante\");\n        return TicketResumenDTO.from(ticket);\n    }\n\n    // Unidad 2 · comentar. Solo técnicos y coordinación pueden dejar notas internas.\n    @Transactional\n    public void comentar(Long ticketId, String email, String texto, boolean interno) {\n        Ticket ticket = buscar(ticketId);\n        Usuario autor = usuario(email);\n        if (ticket.getEstado().esFinal()) {\n            throw new NegocioException(\"texto\", \"El ticket ya está \" + ticket.getEstado().getEtiqueta().toLowerCase());\n        }\n        boolean esInterno = interno && autor.getRol() != Rol.SOLICITANTE;\n        ticket.agregarComentario(new Comentario(texto.trim(), autor, esInterno));\n    }\n\n    // ---------- ayudas ----------\n\n    private void transicion(Ticket ticket, EstadoTicket nuevo, Usuario autor, String nota) {\n        if (!ticket.getEstado().puedePasarA(nuevo)) {\n            throw new NegocioException(\"Un ticket \" + ticket.getEstado() + \" no puede pasar a \" + nuevo);\n        }\n        ticket.cambiarEstado(nuevo, autor, nota);\n    }\n\n    private Ticket delSolicitante(Long ticketId, String email) {\n        Ticket ticket = buscar(ticketId);\n        if (!ticket.getSolicitante().getEmail().equalsIgnoreCase(email)) {\n            throw new NegocioException(\"Solo quien creó el ticket puede hacer esto\");\n        }\n        return ticket;\n    }\n\n    private Ticket buscar(Long id) {\n        return tickets.findById(id).orElseThrow(() -> new NegocioException(\"No existe el ticket \" + id));\n    }\n\n    private Usuario usuario(String email) {\n        return usuarios.findByEmail(email).orElseThrow(() -> new NegocioException(\"No existe el usuario \" + email));\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/service/CategoriaService.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.service;\n\nimport java.util.List;\n\nimport org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\nimport co.edu.sena.adso.soporteya.dto.CategoriaDTO;\nimport co.edu.sena.adso.soporteya.dto.CategoriaForm;\nimport co.edu.sena.adso.soporteya.dto.OpcionDTO;\nimport co.edu.sena.adso.soporteya.model.Categoria;\nimport co.edu.sena.adso.soporteya.repository.CategoriaRepository;\n\n@Service\n@Transactional(readOnly = true)\npublic class CategoriaService {\n\n    private final CategoriaRepository categorias;\n\n    public CategoriaService(CategoriaRepository categorias) {\n        this.categorias = categorias;\n    }\n\n    public List\u003cCategoriaDTO> todas() {\n        return categorias.findAllByOrderByNombreAsc().stream().map(CategoriaDTO::from).toList();\n    }\n\n    // Opciones para los \u003cselect> y las casillas: solo las activas\n    public List\u003cOpcionDTO> opciones() {\n        return categorias.findByActivaTrueOrderByNombreAsc().stream()\n                .map(c -> new OpcionDTO(c.getId(), c.getNombre()))\n                .toList();\n    }\n\n    public CategoriaForm formulario(Long id) {\n        return CategoriaForm.desde(buscar(id));\n    }\n\n    @Transactional\n    public CategoriaDTO guardar(CategoriaForm form) {\n        String nombre = form.getNombre().trim();\n        boolean repetida = form.esNuevo()\n                ? categorias.existsByNombreIgnoreCase(nombre)\n                : categorias.existsByNombreIgnoreCaseAndIdNot(nombre, form.getId());\n        if (repetida) {\n            throw new NegocioException(\"nombre\", \"Ya existe la categoría «\" + nombre + \"»\");\n        }\n        Categoria categoria = form.esNuevo() ? new Categoria(nombre, form.getDescripcion()) : buscar(form.getId());\n        categoria.setNombre(nombre);\n        categoria.setDescripcion(form.getDescripcion());\n        return CategoriaDTO.from(categorias.save(categoria));\n    }\n\n    // No se borra: tiene tickets. Se desactiva y deja de aparecer en los formularios.\n    @Transactional\n    public CategoriaDTO cambiarEstado(Long id) {\n        Categoria categoria = buscar(id);\n        categoria.setActiva(!categoria.isActiva());\n        return CategoriaDTO.from(categoria);\n    }\n\n    private Categoria buscar(Long id) {\n        return categorias.findById(id).orElseThrow(() -> new NegocioException(\"No existe la categoría \" + id));\n    }\n}"}],"listo":"el proyecto compila."},{"t":"Mis tickets: lista, nuevo y detalle","min":50,"archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/controller/Formularios.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.controller;\n\nimport org.springframework.validation.BindingResult;\n\nimport co.edu.sena.adso.soporteya.service.NegocioException;\n\n// Muestra un error de negocio dentro del formulario, igual que uno de formato\nfinal class Formularios {\n\n    private Formularios() {\n    }\n\n    static void rechazar(BindingResult resultado, NegocioException e) {\n        if (e.getCampo() != null) {\n            resultado.rejectValue(e.getCampo(), \"negocio\", e.getMessage());   // junto al campo\n        } else {\n            resultado.reject(\"negocio\", e.getMessage());                       // arriba del formulario\n        }\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/controller/TicketController.java","modo":"nuevo","nota":"La página de detalle tiene tres formularios. Con errores, se conserva el que falló y se crean los otros vacíos (`prepararDetalle`).","lang":"java","codigo":"package co.edu.sena.adso.soporteya.controller;\n\nimport java.util.List;\n\nimport org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\nimport org.springframework.validation.BindingResult;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.ModelAttribute;\nimport org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RequestParam;\nimport org.springframework.web.servlet.mvc.support.RedirectAttributes;\n\nimport jakarta.servlet.http.HttpSession;\nimport jakarta.validation.Valid;\n\nimport co.edu.sena.adso.soporteya.config.SesionDemo;\nimport co.edu.sena.adso.soporteya.dto.OpcionDTO;\nimport co.edu.sena.adso.soporteya.dto.TextoForm;\nimport co.edu.sena.adso.soporteya.dto.TicketForm;\nimport co.edu.sena.adso.soporteya.dto.TicketResumenDTO;\nimport co.edu.sena.adso.soporteya.model.Prioridad;\nimport co.edu.sena.adso.soporteya.service.CategoriaService;\nimport co.edu.sena.adso.soporteya.service.NegocioException;\nimport co.edu.sena.adso.soporteya.service.TicketService;\n\n@Controller\n@RequestMapping(\"/tickets\")\npublic class TicketController {\n\n    private final TicketService tickets;\n    private final CategoriaService categorias;\n    private final SesionDemo demo;\n\n    public TicketController(TicketService tickets, CategoriaService categorias, SesionDemo demo) {\n        this.tickets = tickets;\n        this.categorias = categorias;\n        this.demo = demo;\n    }\n\n    @ModelAttribute(\"categorias\")\n    public List\u003cOpcionDTO> categorias() {\n        return categorias.opciones();\n    }\n\n    @ModelAttribute(\"prioridades\")\n    public Prioridad[] prioridades() {\n        return Prioridad.values();\n    }\n\n    // Mis tickets, por páginas\n    @GetMapping\n    public String misTickets(@RequestParam(name = \"pagina\", defaultValue = \"0\") int pagina,\n                             HttpSession sesion, Model model) {\n        model.addAttribute(\"pagina\", tickets.misTickets(demo.email(sesion), pagina));\n        return \"tickets/lista\";\n    }\n\n    @GetMapping(\"/nuevo\")\n    public String nuevo(Model model) {\n        model.addAttribute(\"ticket\", new TicketForm());\n        return \"tickets/nuevo\";\n    }\n\n    @PostMapping\n    public String crear(@Valid @ModelAttribute(\"ticket\") TicketForm ticket, BindingResult resultado,\n                        HttpSession sesion, RedirectAttributes flash) {\n        if (resultado.hasErrors()) {\n            return \"tickets/nuevo\";\n        }\n        try {\n            TicketResumenDTO creado = tickets.crear(ticket.aNuevoTicket(), demo.email(sesion));\n            flash.addFlashAttribute(\"ok\", \"Ticket \" + creado.codigo() + \" creado. Fecha límite de atención: \"\n                    + creado.fechaLimite().toLocalDate());\n            return \"redirect:/tickets/\" + creado.id();\n        } catch (NegocioException e) {\n            Formularios.rechazar(resultado, e);\n            return \"tickets/nuevo\";\n        }\n    }\n\n    @GetMapping(\"/{id}\")\n    public String detalle(@PathVariable(\"id\") Long id, Model model) {\n        prepararDetalle(id, model);\n        return \"tickets/detalle\";\n    }\n\n    @PostMapping(\"/{id}/comentarios\")\n    public String comentar(@PathVariable(\"id\") Long id, @Valid @ModelAttribute(\"comentario\") TextoForm form,\n                           BindingResult resultado, HttpSession sesion, Model model, RedirectAttributes flash) {\n        if (!resultado.hasErrors()) {\n            try {\n                tickets.comentar(id, demo.email(sesion), form.getTexto(), form.isInterno());\n                flash.addFlashAttribute(\"ok\", \"Comentario agregado\");\n                return \"redirect:/tickets/\" + id;\n            } catch (NegocioException e) {\n                Formularios.rechazar(resultado, e);\n            }\n        }\n        prepararDetalle(id, model);\n        return \"tickets/detalle\";\n    }\n\n    @PostMapping(\"/{id}/resolver\")\n    public String resolver(@PathVariable(\"id\") Long id, @Valid @ModelAttribute(\"resolucion\") TextoForm form,\n                           BindingResult resultado, HttpSession sesion, Model model, RedirectAttributes flash) {\n        if (!resultado.hasErrors()) {\n            try {\n                tickets.resolver(id, demo.email(sesion), form.getTexto());\n                flash.addFlashAttribute(\"ok\", \"Ticket resuelto. Queda pendiente la confirmación del solicitante.\");\n                return \"redirect:/tickets/\" + id;\n            } catch (NegocioException e) {\n                Formularios.rechazar(resultado, e);\n            }\n        }\n        prepararDetalle(id, model);\n        return \"tickets/detalle\";\n    }\n\n    @PostMapping(\"/{id}/reabrir\")\n    public String reabrir(@PathVariable(\"id\") Long id, @Valid @ModelAttribute(\"reapertura\") TextoForm form,\n                          BindingResult resultado, HttpSession sesion, Model model, RedirectAttributes flash) {\n        if (!resultado.hasErrors()) {\n            try {\n                tickets.reabrir(id, demo.email(sesion), form.getTexto());\n                flash.addFlashAttribute(\"ok\", \"Ticket reabierto: vuelve al técnico\");\n                return \"redirect:/tickets/\" + id;\n            } catch (NegocioException e) {\n                Formularios.rechazar(resultado, e);\n            }\n        }\n        prepararDetalle(id, model);\n        return \"tickets/detalle\";\n    }\n\n    @PostMapping(\"/{id}/cerrar\")\n    public String cerrar(@PathVariable(\"id\") Long id, HttpSession sesion, RedirectAttributes flash) {\n        try {\n            tickets.cerrar(id, demo.email(sesion));\n            flash.addFlashAttribute(\"ok\", \"Gracias por confirmar. El ticket quedó cerrado.\");\n        } catch (NegocioException e) {\n            flash.addFlashAttribute(\"error\", e.getMessage());\n        }\n        return \"redirect:/tickets/\" + id;\n    }\n\n    @PostMapping(\"/{id}/cancelar\")\n    public String cancelar(@PathVariable(\"id\") Long id, HttpSession sesion, RedirectAttributes flash) {\n        try {\n            tickets.cancelar(id, demo.email(sesion));\n            flash.addFlashAttribute(\"ok\", \"Ticket cancelado\");\n        } catch (NegocioException e) {\n            flash.addFlashAttribute(\"error\", e.getMessage());\n        }\n        return \"redirect:/tickets/\" + id;\n    }\n\n    // La página tiene tres formularios; con errores, se conserva el que falló y se crean los demás vacíos\n    private void prepararDetalle(Long id, Model model) {\n        model.addAttribute(\"t\", tickets.detalle(id));\n        for (String nombre : List.of(\"comentario\", \"resolucion\", \"reapertura\")) {\n            if (!model.containsAttribute(nombre)) {\n                model.addAttribute(nombre, new TextoForm());\n            }\n        }\n    }\n}"},{"ruta":"src/main/resources/templates/tickets/lista.html","modo":"nuevo","nota":"","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\">\n\u003chead th:replace=\"~{fragmentos :: head('Mis tickets')}\">\u003c/head>\n\u003cbody>\n  \u003cnav th:replace=\"~{fragmentos :: menu('tickets')}\">\u003c/nav>\n\n  \u003cmain class=\"container my-4\">\n    \u003cdiv th:replace=\"~{fragmentos :: mensajes}\">\u003c/div>\n\n    \u003cdiv class=\"d-flex justify-content-between align-items-center mb-3\">\n      \u003ch1 class=\"h3 mb-0\">Mis tickets\u003c/h1>\n      \u003ca class=\"btn btn-primary\" th:href=\"@{/tickets/nuevo}\">Nuevo ticket\u003c/a>\n    \u003c/div>\n\n    \u003cp th:if=\"${pagina.totalElements == 0}\" class=\"text-muted\">Todavía no ha reportado fallas.\u003c/p>\n\n    \u003cdiv class=\"list-group\" th:unless=\"${pagina.totalElements == 0}\">\n      \u003ca class=\"list-group-item list-group-item-action\" th:each=\"t : ${pagina.content}\"\n         th:href=\"@{/tickets/{id}(id=${t.id})}\">\n        \u003cdiv class=\"d-flex flex-wrap justify-content-between gap-2\">\n          \u003cdiv>\n            \u003cspan class=\"text-muted small\" th:text=\"${t.codigo}\">SY-00001\u003c/span>\n            \u003cdiv class=\"fw-semibold\" th:text=\"${t.asunto}\">El computador no enciende\u003c/div>\n            \u003csmall class=\"text-muted\" th:text=\"|${t.categoria} · ${t.tecnico ?: 'Sin técnico asignado'}|\">Hardware\u003c/small>\n          \u003c/div>\n          \u003cdiv class=\"text-end\">\n            \u003cspan th:replace=\"~{fragmentos :: estado(${t.estado})}\">\u003c/span>\n            \u003cspan th:replace=\"~{fragmentos :: prioridad(${t.prioridad})}\">\u003c/span>\n            \u003cdiv class=\"small mt-1\" th:classappend=\"${t.vencido} ? 'text-danger fw-semibold' : 'text-muted'\"\n                 th:text=\"'Límite: ' + ${#tempor
