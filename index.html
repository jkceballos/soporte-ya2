\u003c/div>\n    \u003cdiv class=\"alert alert-danger\" role=\"alert\" th:if=\"${error}\" th:text=\"${error}\">Error\u003c/div>\n  \u003c/div>\n\n  \u003c!-- Insignias con parámetro: el color sale de la clase CSS estado-… o prioridad-… -->\n  \u003cspan th:fragment=\"estado(e)\" th:class=\"|badge estado-${e.name()}|\" th:text=\"${e.etiqueta}\">Abierto\u003c/span>\n  \u003cspan th:fragment=\"prioridad(p)\" th:class=\"|badge prioridad-${p.name()}|\" th:text=\"${p.etiqueta}\">Alta\u003c/span>\n\n  \u003c!-- Una columna del tablero: título, lista de tickets y si se muestra el botón «Tomar» -->\n  \u003cdiv class=\"col-lg-4\" th:fragment=\"columna(titulo, lista, sePuedeTomar)\">\n    \u003cdiv class=\"columna\">\n      \u003ch2 class=\"h6 d-flex justify-content-between\">\n        \u003cspan th:text=\"${titulo}\">Abiertos\u003c/span>\n        \u003cspan class=\"badge text-bg-secondary\" th:text=\"${#lists.size(lista)}\">3\u003c/span>\n      \u003c/h2>\n      \u003cp class=\"small text-muted\" th:if=\"${#lists.isEmpty(lista)}\">Nada por aquí.\u003c/p>\n      \u003cdiv class=\"card card-body tarjeta-ticket mb-2 py-2\" th:each=\"t : ${lista}\" th:classappend=\"${t.vencido} ? 'vencido'\">\n        \u003cdiv class=\"d-flex justify-content-between small\">\n          \u003ca th:href=\"@{/tickets/{id}(id=${t.id})}\" th:text=\"${t.codigo}\">SY-00001\u003c/a>\n          \u003cspan th:replace=\"~{fragmentos :: prioridad(${t.prioridad})}\">\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"fw-semibold\" th:text=\"${t.asunto}\">Asunto\u003c/div>\n        \u003cdiv class=\"small text-muted\" th:text=\"|${t.categoria} · ${t.solicitante}|\">Hardware · Ana\u003c/div>\n        \u003cdiv class=\"small\" th:classappend=\"${t.vencido} ? 'text-danger fw-semibold' : 'text-muted'\"\n             th:text=\"'Límite: ' + ${#temporals.format(t.fechaLimite, 'd MMM, h:mm a')}\">Límite\u003c/div>\n        \u003cdiv class=\"small\" th:if=\"${t.tecnico}\" th:text=\"'Técnico: ' + ${t.tecnico}\">Técnico\u003c/div>\n        \u003cform th:if=\"${sePuedeTomar and yo.rol.name() == 'TECNICO'}\"\n              th:action=\"@{/tablero/{id}/tomar(id=${t.id})}\" method=\"post\" class=\"mt-2\">\n          \u003cbutton type=\"submit\" class=\"btn btn-sm btn-primary\">Tomar\u003c/button>\n        \u003c/form>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cth:block th:fragment=\"pie\">\n    \u003cfooter class=\"text-center text-muted small py-4 border-top mt-5\">\n      SoporteYa · Mesa de ayuda de TI · Proyecto guía ADSO · SENA\n    \u003c/footer>\n    \u003cscript src=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js\">\u003c/script>\n    \u003c!-- Unidad 4 · funciones comunes de JavaScript, solo con sesión iniciada -->\n    \u003cdiv id=\"avisos\" class=\"toast-container position-fixed bottom-0 end-0 p-3\">\u003c/div>\n    \u003cscript sec:authorize=\"isAuthenticated()\" th:src=\"@{/js/soporteya.js}\">\u003c/script>\n  \u003c/th:block>\n\u003c/body>\n\u003c/html>"},{"ruta":"src/main/resources/static/js/soporteya.js","modo":"nuevo","nota":"","lang":"js","codigo":"// SoporteYa · funciones comunes para el JavaScript de las páginas (Unidad 4)\n'use strict';\n\nconst SY = (() => {\n  // Lee el código CSRF que Thymeleaf dejó en las etiquetas \u003cmeta> del \u003chead>\n  function cabecerasCsrf() {\n    const token = document.querySelector('meta[name=\"_csrf\"]');\n    const nombre = document.querySelector('meta[name=\"_csrf_header\"]');\n    return token && nombre ? { [nombre.content]: token.content } : {};\n  }\n\n  // GET que devuelve JSON. Si la sesión expiró, el servidor redirige al login: lo detectamos.\n  async function get(url) {\n    const respuesta = await fetch(url, { headers: { Accept: 'application/json' } });\n    if (respuesta.redirected || !respuesta.ok) {\n      throw new Error(respuesta.redirected ? 'Su sesión expiró. Vuelva a ingresar.' : `Error ${respuesta.status}`);\n    }\n    return respuesta.json();\n  }\n\n  // POST con el código CSRF. Si el servidor responde un ProblemDetail, lanzamos su mensaje.\n  async function post(url) {\n    const respuesta = await fetch(url, {\n      method: 'POST',\n      headers: { Accept: 'application/json', ...cabecerasCsrf() },\n    });\n    const datos = await respuesta.json().catch(() => ({}));\n    if (!respuesta.ok) {\n      throw new Error(datos.detail || `Error ${respuesta.status}`);\n    }\n    return datos;\n  }\n\n  // Un aviso flotante de Bootstrap (toast). textContent: nunca insertamos HTML que venga de datos.\n  function aviso(mensaje, tipo = 'success') {\n    const caja = document.createElement('div');\n    caja.className = `toast align-items-center text-bg-${tipo} border-0`;\n    caja.setAttribute('role', 'status');\n    const cuerpo = document.createElement('div');\n    cuerpo.className = 'toast-body';\n    cuerpo.textContent = mensaje;\n    caja.append(cuerpo);\n    document.getElementById('avisos').append(caja);\n    const toast = new bootstrap.Toast(caja, { delay: 4000 });\n    caja.addEventListener('hidden.bs.toast', () => caja.remove());\n    toast.show();\n  }\n\n  return { get, post, aviso };\n})();\n\n// Contador de tickets pendientes en el menú\n(async () => {\n  const badge = document.getElementById('contadorPendientes');\n  if (!badge) return;\n  try {\n    const { pendientes } = await SY.get('/api/web/mis-pendientes');\n    badge.textContent = pendientes;\n    badge.hidden = pendientes === 0;\n  } catch (e) {\n    console.warn('No se pudo cargar el contador', e);\n  }\n})();"}],"listo":"el menú de Ana muestra un número con sus tickets pendientes."},{"t":"El tablero en vivo","min":30,"archivos":[{"ruta":"src/main/resources/templates/tablero.html","modo":"reemplazar","nota":"","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\" xmlns:th=\"http://www.thymeleaf.org\"\n      xmlns:sec=\"http://www.thymeleaf.org/extras/spring-security\">\n\u003chead th:replace=\"~{fragmentos :: head('Tablero')}\">\u003c/head>\n\u003cbody>\n  \u003cnav th:replace=\"~{fragmentos :: menu('tablero')}\">\u003c/nav>\n\n  \u003cmain class=\"container-fluid px-lg-5 my-4\">\n    \u003cdiv th:replace=\"~{fragmentos :: mensajes}\">\u003c/div>\n    \u003cdiv class=\"d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3\">\n      \u003ch1 class=\"h3 mb-0\">Tablero de la mesa de ayuda\u003c/h1>\n      \u003c!-- Unidad 4 · lo actualiza tablero.js -->\n      \u003csmall class=\"text-muted\" id=\"estadoTablero\" aria-live=\"polite\">Se actualiza solo cada 20 segundos\u003c/small>\n    \u003c/div>\n\n    \u003c!-- data-tecnico: el JavaScript sabe si debe dibujar el botón «Tomar» -->\n    \u003cdiv class=\"row g-3\" id=\"tablero\" th:data-tecnico=\"${yo.rol.name() == 'TECNICO'}\">\n      \u003c!-- La misma columna tres veces, con distintos datos: el fragmento «columna» de fragmentos.html -->\n      \u003cdiv class=\"col-lg-4\" th:replace=\"~{fragmentos :: columna('Abiertos', ${tablero.abiertos}, true)}\">\u003c/div>\n      \u003cdiv class=\"col-lg-4\" th:replace=\"~{fragmentos :: columna('En curso', ${tablero.enCurso}, false)}\">\u003c/div>\n      \u003cdiv class=\"col-lg-4\" th:replace=\"~{fragmentos :: columna('Resueltos sin confirmar', ${tablero.resueltos}, false)}\">\u003c/div>\n    \u003c/div>\n  \u003c/main>\n\n\n  \u003cth:block th:replace=\"~{fragmentos :: pie}\">\u003c/th:block>\n  \u003cscript th:src=\"@{/js/tablero.js}\">\u003c/script>\n\u003c/body>\n\u003c/html>"},{"ruta":"src/main/resources/static/js/tablero.js","modo":"nuevo","nota":"Pide `/api/web/tablero` cada 20 segundos y redibuja las columnas con `createElement` y `textContent`. «Tomar» hace un POST con el código CSRF y muestra el resultado en un aviso.","lang":"js","codigo":"// SoporteYa · tablero que se actualiza solo y toma tickets sin recargar (Unidad 4)\n'use strict';\n\nconst contenedor = document.getElementById('tablero');\nconst estado = document.getElementById('estadoTablero');\nconst esTecnico = contenedor.dataset.tecnico === 'true';\nconst CADA_MS = 20000;\n\nconst formatoFecha = new Intl.DateTimeFormat('es-CO', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });\nconst ETIQUETA_PRIORIDAD = { BAJA: 'Baja', MEDIA: 'Media', ALTA: 'Alta', CRITICA: 'Crítica' };\n\n// Crea un elemento con clase y texto. Usar textContent evita que un asunto con \u003cscript> se ejecute (XSS).\nfunction el(etiqueta, clase, texto) {\n  const nodo = document.createElement(etiqueta);\n  if (clase) nodo.className = clase;\n  if (texto !== undefined && texto !== null) nodo.textContent = texto;\n  return nodo;\n}\n\nfunction tarjeta(t, sePuedeTomar) {\n  const card = el('div', 'card card-body tarjeta-ticket mb-2 py-2' + (t.vencido ? ' vencido' : ''));\n  const fila = el('div', 'd-flex justify-content-between small');\n  const enlace = el('a', null, t.codigo);\n  enlace.href = `/tickets/${t.id}`;\n  fila.append(enlace, el('span', `badge prioridad-${t.prioridad}`, ETIQUETA_PRIORIDAD[t.prioridad]));\n  card.append(fila, el('div', 'fw-semibold', t.asunto), el('div', 'small text-muted', `${t.categoria} · ${t.solicitante}`));\n  card.append(el('div', 'small ' + (t.vencido ? 'text-danger fw-semibold' : 'text-muted'),\n      'Límite: ' + formatoFecha.format(new Date(t.fechaLimite))));\n  if (t.tecnico) card.append(el('div', 'small', 'Técnico: ' + t.tecnico));\n  if (sePuedeTomar && esTecnico) {\n    const boton = el('button', 'btn btn-sm btn-primary mt-2 align-self-start', 'Tomar');\n    boton.type = 'button';\n    boton.addEventListener('click', () => tomar(t.id, boton));\n    card.append(boton);\n  }\n  return card;\n}\n\nfunction columna(titulo, lista, sePuedeTomar) {\n  const col = el('div', 'col-lg-4');\n  const caja = el('div', 'columna');\n  const h2 = el('h2', 'h6 d-flex justify-content-between');\n  h2.append(el('span', null, titulo), el('span', 'badge text-bg-secondary', lista.length));\n  caja.append(h2);\n  if (lista.length === 0) caja.append(el('p', 'small text-muted', 'Nada por aquí.'));\n  lista.forEach(t => caja.append(tarjeta(t, sePuedeTomar)));\n  col.append(caja);\n  return col;\n}\n\nasync function actualizar() {\n  try {\n    const datos = await SY.get('/api/web/tablero');\n    contenedor.replaceChildren(\n      columna('Abiertos', datos.abiertos, true),\n      columna('En curso', datos.enCurso, false),\n      columna('Resueltos sin confirmar', datos.resueltos, false));\n    estado.textContent = 'Actualizado a las ' + new Date().toLocaleTimeString('es-CO');\n  } catch (e) {\n    estado.textContent = e.message;\n  }\n}\n\nasync function tomar(id, boton) {\n  boton.disabled = true;\n  boton.textContent = 'Tomando…';\n  try {\n    const ticket = await SY.post(`/api/web/tablero/${id}/tomar`);\n    SY.aviso(`Usted tomó el ticket ${ticket.codigo}`);\n  } catch (e) {\n    SY.aviso(e.message, 'danger');      // 409: ya lo tomó otro, no es de su especialidad…\n  }\n  await actualizar();\n}\n\nactualizar();\nsetInterval(actualizar, CADA_MS);"}],"despues":[["nota","clave","Pruebe con dos ventanas: Carlos en el tablero y Ana en otra ventana privada. Ana crea un ticket de Hardware. A los 20 segundos, sin recargar, aparece en la columna «Abiertos» de Carlos. Para probar el XSS, cree un ticket con el asunto `\u003cimg src=x onerror=alert(1)>`: debe verse como texto, sin ninguna alerta."]],"listo":"el tablero se actualiza solo y «Tomar» funciona sin recargar."},{"t":"La clave de los tokens","min":15,"cmd":[["pom.xml · dentro de \u003cdependencies>","\u003cdependency>\n    \u003cgroupId>org.springframework.boot\u003c/groupId>\n    \u003cartifactId>spring-boot-starter-security-oauth2-resource-server\u003c/artifactId>\n\u003c/dependency>"]],"archivos":[{"ruta":"src/main/resources/application.properties","modo":"reemplazar","nota":"","lang":"props","codigo":"spring.application.name=soporteya\nspring.thymeleaf.cache=false\n\n# PostgreSQL. La contraseña NO se escribe aquí: llega por la variable DB_PASSWORD\nspring.datasource.url=jdbc:postgresql://localhost:5432/soporteya\nspring.datasource.username=adso\nspring.datasource.password=${DB_PASSWORD}\n\nspring.jpa.hibernate.ddl-auto=update\nspring.jpa.show-sql=true\nspring.jpa.open-in-view=false\n\n# Unidad 2 · idioma fijo: fechas y mensajes en español de Colombia\nspring.web.locale=es_CO\nspring.web.locale-resolver=fixed\n\n# Unidad 3 · solo los correos de la empresa pueden registrarse\nsoporteya.dominio-correo=soporteya.co\n# La sesión expira tras 30 minutos sin actividad\nserver.servlet.session.timeout=30m\n\n# Unidad 4 · firma de los JWT: llega por variable de entorno (mínimo 32 caracteres)\nsoporteya.jwt.secreto=${JWT_SECRETO}\n# Páginas de otros sitios que pueden llamar a /api/v1 (CORS), separadas por comas\nsoporteya.cors.origenes=http://localhost:5500,http://127.0.0.1:5500"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/config/JwtConfig.java","modo":"nuevo","nota":"Una clave secreta firma (encoder) y verifica (decoder). Algoritmo HS256.","lang":"java","codigo":"package co.edu.sena.adso.soporteya.config;\n\nimport java.nio.charset.StandardCharsets;\n\nimport javax.crypto.SecretKey;\nimport javax.crypto.spec.SecretKeySpec;\n\nimport org.springframework.beans.factory.annotation.Value;\nimport org.springframework.context.annotation.Bean;\nimport org.springframework.context.annotation.Configuration;\nimport org.springframework.security.oauth2.jwt.JwtDecoder;\nimport org.springframework.security.oauth2.jwt.JwtEncoder;\nimport org.springframework.security.oauth2.jwt.NimbusJwtDecoder;\nimport org.springframework.security.oauth2.jwt.NimbusJwtEncoder;\n\nimport com.nimbusds.jose.jwk.source.ImmutableSecret;\n\n// Una sola clave secreta firma (encoder) y verifica (decoder) los tokens: algoritmo HS256\n@Configuration\npublic class JwtConfig {\n\n    private final SecretKey clave;\n\n    public JwtConfig(@Value(\"${soporteya.jwt.secreto}\") String secreto) {\n        if (secreto.length() \u003c 32) {\n            throw new IllegalStateException(\"JWT_SECRETO debe tener al menos 32 caracteres\");\n        }\n        this.clave = new SecretKeySpec(secreto.getBytes(StandardCharsets.UTF_8), \"HmacSHA256\");\n    }\n\n    @Bean\n    public JwtEncoder jwtEncoder() {\n        return new NimbusJwtEncoder(new ImmutableSecret\u003c>(clave));\n    }\n\n    @Bean\n    public JwtDecoder jwtDecoder() {\n        return NimbusJwtDecoder.withSecretKey(clave).build();\n    }\n}"}],"listo":"el proyecto compila con la nueva dependencia."},{"t":"Las dos puertas de seguridad","min":25,"archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/config/SeguridadConfig.java","modo":"reemplazar","nota":"Dos cadenas con `@Order`, el `AuthenticationManager` compartido, el convertidor que lee los roles del token y las reglas CORS.","lang":"java","codigo":"package co.edu.sena.adso.soporteya.config;\n\nimport java.util.List;\n\nimport org.springframework.beans.factory.annotation.Value;\nimport org.springframework.context.annotation.Bean;\nimport org.springframework.context.annotation.Configuration;\nimport org.springframework.core.annotation.Order;\nimport org.springframework.http.HttpMethod;\nimport org.springframework.security.authentication.AuthenticationManager;\nimport org.springframework.security.authentication.ProviderManager;\nimport org.springframework.security.authentication.dao.DaoAuthenticationProvider;\nimport org.springframework.security.config.Customizer;\nimport org.springframework.security.config.annotation.method.configuration.EnableMethodSecurity;\nimport org.springframework.security.config.annotation.web.builders.HttpSecurity;\nimport org.springframework.security.config.http.SessionCreationPolicy;\nimport org.springframework.security.core.userdetails.UserDetailsService;\nimport org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder;\nimport org.springframework.security.crypto.password.PasswordEncoder;\nimport org.springframework.security.oauth2.server.resource.authentication.JwtAuthenticationConverter;\nimport org.springframework.security.oauth2.server.resource.authentication.JwtGrantedAuthoritiesConverter;\nimport org.springframework.security.web.SecurityFilterChain;\nimport org.springframework.web.cors.CorsConfiguration;\nimport org.springframework.web.cors.CorsConfigurationSource;\nimport org.springframework.web.cors.UrlBasedCorsConfigurationSource;\n\n@Configuration\n@EnableMethodSecurity\npublic class SeguridadConfig {\n\n    @Bean\n    public PasswordEncoder passwordEncoder() {\n        return new BCryptPasswordEncoder();\n    }\n\n    // Unidad 4 · el mismo «verificador» de usuario y contraseña, para el formulario y para pedir un token\n    @Bean\n    public AuthenticationManager authenticationManager(UserDetailsService usuarios, PasswordEncoder encoder) {\n        DaoAuthenticationProvider proveedor = new DaoAuthenticationProvider(usuarios);\n        proveedor.setPasswordEncoder(encoder);\n        return new ProviderManager(proveedor);\n    }\n\n    // Puerta 1 · /api/v1/** para otras aplicaciones: sin sesión, sin CSRF, con token JWT\n    @Bean\n    @Order(1)\n    public SecurityFilterChain api(HttpSecurity http) throws Exception {\n        http\n            .securityMatcher(\"/api/v1/**\")\n            .authorizeHttpRequests(acceso -> acceso\n                .requestMatchers(HttpMethod.POST, \"/api/v1/token\").permitAll()\n                .anyRequest().authenticated())\n            .csrf(csrf -> csrf.disable())                 // no hay cookies de sesión que robar\n            .sessionManagement(s -> s.sessionCreationPolicy(SessionCreationPolicy.STATELESS))\n            .cors(Customizer.withDefaults())              // usa el CorsConfigurationSource de abajo\n            .oauth2ResourceServer(recurso -> recurso\n                .jwt(jwt -> jwt.jwtAuthenticationConverter(rolesDelToken())));\n        return http.build();\n    }\n\n    // Puerta 2 · las páginas web: sesión, formulario de login y CSRF (igual que en la Unidad 3)\n    @Bean\n    @Order(2)\n    public SecurityFilterChain web(HttpSecurity http) throws Exception {\n        http\n            .authorizeHttpRequests(acceso -> acceso\n                .requestMatchers(\"/\", \"/login\", \"/registro\", \"/css/**\", \"/js/**\", \"/error\").permitAll()\n                .requestMatchers(\"/admin/**\").hasRole(\"COORDINADOR\")\n                .requestMatchers(\"/tablero/**\", \"/api/web/tablero/**\").hasAnyRole(\"TECNICO\", \"COORDINADOR\")\n                .anyRequest().authenticated())\n            .formLogin(login -> login\n                .loginPage(\"/login\")\n                .usernameParameter(\"email\")\n                .defaultSuccessUrl(\"/\", false)\n                .permitAll())\n            .logout(salida -> salida\n                .logoutSuccessUrl(\"/login?salio\")\n                .permitAll())\n            .exceptionHandling(errores -> errores\n                .accessDeniedPage(\"/acceso-denegado\"));\n        return http.build();\n    }\n\n    // El token trae \"roles\": [\"COORDINADOR\"]. Así los @PreAuthorize(\"hasRole(…)\") de los servicios\n    // funcionan igual con sesión que con token.\n    private JwtAuthenticationConverter rolesDelToken() {\n        JwtGrantedAuthoritiesConverter roles = new JwtGrantedAuthoritiesConverter();\n        roles.setAuthoritiesClaimName(\"roles\");\n        roles.setAuthorityPrefix(\"ROLE_\");\n        JwtAuthenticationConverter convertidor = new JwtAuthenticationConverter();\n        convertidor.setJwtGrantedAuthoritiesConverter(roles);\n        return convertidor;\n    }\n\n    // CORS: qué páginas de OTROS sitios pueden llamar a la API desde el navegador\n    @Bean\n    public CorsConfigurationSource corsConfigurationSource(@Value(\"${soporteya.cors.origenes}\") List\u003cString> origenes) {\n        CorsConfiguration reglas = new CorsConfiguration();\n        reglas.setAllowedOrigins(origenes);\n        reglas.setAllowedMethods(List.of(\"GET\", \"POST\"));\n        reglas.setAllowedHeaders(List.of(\"Authorization\", \"Content-Type\"));\n        UrlBasedCorsConfigurationSource fuente = new UrlBasedCorsConfigurationSource();\n        fuente.registerCorsConfiguration(\"/api/v1/**\", reglas);\n        return fuente;\n    }\n}"}],"listo":"la aplicación arranca con las dos cadenas."},{"t":"Emitir tokens y publicar la API","min":25,"archivos":[{"ruta":"src/main/java/co/edu/sena/adso/soporteya/dto/Credenciales.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.dto;\n\n// Lo que llega en el cuerpo de POST /api/v1/token\npublic record Credenciales(String email, String password) {\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/dto/TokenDTO.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.dto;\n\npublic record TokenDTO(String token, String tipo, long expiraEnSegundos) {\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/service/TokenService.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.service;\n\nimport java.time.Duration;\nimport java.time.Instant;\nimport java.util.List;\n\nimport org.springframework.security.core.Authentication;\nimport org.springframework.security.core.GrantedAuthority;\nimport org.springframework.security.oauth2.jose.jws.MacAlgorithm;\nimport org.springframework.security.oauth2.jwt.JwsHeader;\nimport org.springframework.security.oauth2.jwt.JwtClaimsSet;\nimport org.springframework.security.oauth2.jwt.JwtEncoder;\nimport org.springframework.security.oauth2.jwt.JwtEncoderParameters;\nimport org.springframework.stereotype.Service;\n\nimport co.edu.sena.adso.soporteya.dto.TokenDTO;\n\n// Emite un JWT para un usuario ya autenticado\n@Service\npublic class TokenService {\n\n    private static final Duration DURACION = Duration.ofHours(1);\n\n    private final JwtEncoder encoder;\n\n    public TokenService(JwtEncoder encoder) {\n        this.encoder = encoder;\n    }\n\n    public TokenDTO emitir(Authentication autenticacion) {\n        Instant ahora = Instant.now();\n        List\u003cString> roles = autenticacion.getAuthorities().stream()\n                .map(GrantedAuthority::getAuthority)\n                .filter(a -> a.startsWith(\"ROLE_\"))\n                .map(a -> a.substring(\"ROLE_\".length()))\n                .toList();\n        // El contenido (claims) viaja legible en el token: nunca ponga contraseñas ni datos sensibles\n        JwtClaimsSet contenido = JwtClaimsSet.builder()\n                .issuer(\"soporteya\")\n                .issuedAt(ahora)\n                .expiresAt(ahora.plus(DURACION))\n                .subject(autenticacion.getName())\n                .claim(\"roles\", roles)\n                .build();\n        JwsHeader cabecera = JwsHeader.with(MacAlgorithm.HS256).build();\n        String token = encoder.encode(JwtEncoderParameters.from(cabecera, contenido)).getTokenValue();\n        return new TokenDTO(token, \"Bearer\", DURACION.toSeconds());\n    }\n}"},{"ruta":"src/main/java/co/edu/sena/adso/soporteya/controller/ApiV1Controller.java","modo":"nuevo","nota":"","lang":"java","codigo":"package co.edu.sena.adso.soporteya.controller;\n\nimport java.time.YearMonth;\nimport java.util.List;\n\nimport org.springframework.http.HttpStatus;\nimport org.springframework.http.ProblemDetail;\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.security.authentication.AuthenticationManager;\nimport org.springframework.security.authentication.UsernamePasswordAuthenticationToken;\nimport org.springframework.security.core.Authentication;\nimport org.springframework.security.core.AuthenticationException;\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RequestParam;\nimport org.springframework.web.bind.annotation.RestController;\n\nimport co.edu.sena.adso.soporteya.dto.Credenciales;\nimport co.edu.sena.adso.soporteya.dto.IndicadorTecnicoDTO;\nimport co.edu.sena.adso.soporteya.dto.TicketResumenDTO;\nimport co.edu.sena.adso.soporteya.service.TicketService;\nimport co.edu.sena.adso.soporteya.service.TokenService;\n\n// API pública versionada para otras aplicaciones (la pantalla de la oficina de TI, un tablero gerencial…)\n@RestController\n@RequestMapping(\"/api/v1\")\npublic class ApiV1Controller {\n\n    private final AuthenticationManager autenticador;\n    private final TokenService tokens;\n    private final TicketService tickets;\n\n    public ApiV1Controller(AuthenticationManager autenticador, TokenService tokens, TicketService tickets) {\n        this.autenticador = autenticador;\n        this.tokens = tokens;\n        this.tickets = tickets;\n    }\n\n    // POST /api/v1/token  {\"email\": \"…\", \"password\": \"…\"}  →  {\"token\": \"eyJ…\", \"tipo\": \"Bearer\", …}\n    @PostMapping(\"/token\")\n    public ResponseEntity\u003c?> token(@RequestBody Credenciales credenciales) {\n        try {\n            Authentication autenticado = autenticador.authenticate(\n                    UsernamePasswordAuthenticationToken.unauthenticated(credenciales.email(), credenciales.password()));\n            return ResponseEntity.ok(tokens.emitir(autenticado));\n        } catch (AuthenticationException e) {\n            ProblemDetail problema = ProblemDetail.forStatusAndDetail(HttpStatus.UNAUTHORIZED, \"Correo o contraseña incorrectos\");\n            return ResponseEntity.status(HttpStatus.UNAUTHORIZED).body(problema);\n        }\n    }\n\n    // GET /api/v1/pendientes  (Authorization: Bearer …) · técnicos y coordinación\n    @GetMapping(\"/pendientes\")\n    public List\u003cTicketResumenDTO> pendientes() {\n        return tickets.pendientes();\n    }\n\n    // GET /api/v1/indicadores?mes=2026-12 · solo coordinación\n    @GetMapping(\"/indicadores\")\n    public List\u003cIndicadorTecnicoDTO> indicadores(@RequestParam(name = \"mes\", required = false) YearMonth mes) {\n        return tickets.indicadores(mes == null ? YearMonth.now() : mes);\n    }\n}"}],"cmd":[["Terminal · arranque con la clave","export DB_PASSWORD=su_clave\nexport JWT_SECRETO=$(openssl rand -base64 48)\n./mvnw spring-boot:run"],["Otra terminal · pruebe la API con curl","# 1. Pedir un token como coordinadora\nTOKEN=$(curl -s -X POST http://localhost:8080/api/v1/token \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"email\":\"laura.gomez@soporteya.co\",\"password\":\"Soporte2026\"}' | jq -r .token)\necho $TOKEN\n\n# 2. Usarlo\ncurl -s http://localhost:8080/api/v1/pendientes -H \"Authorization: Bearer $TOKEN\" | jq\ncurl -s http://localhost:8080/api/v1/indicadores -H \"Authorization: Bearer $TOKEN\" | jq\n\n# 3. Sin token: 401\ncurl -i http://localhost:8080/api/v1/pendientes"]],"despues":["Repita el paso 1 con `carlos.ruiz@soporteya.co`: con su token, `/pendientes` responde, pero `/indicadores` devuelve **403** porque `TicketService.indicadores` exige COORDINADOR. Pegue un token en [jwt.io](https://jwt.io) para ver su contenido (sin la clave, la firma no se puede verificar ni falsificar).",["nota","pista","Si no tiene `jq`: `sudo apt install jq`."]],"listo":"curl recibe un token y lo usa; sin token, 401; con el rol equivocado, 403."},{"t":"La pantalla de la oficina de TI","min":25,"intro":"Una aplicación aparte, fuera de `src/`, que se abre desde otro origen. En VS Code instale la extensión **Live Server**, abra `monitor/index.html` y presione **Go Live** (puerto 5500).","archivos":[{"ruta":"monitor/index.html","modo":"nuevo","nota":"","lang":"html","codigo":"\u003c!DOCTYPE html>\n\u003chtml lang=\"es\">\n\u003chead>\n  \u003cmeta charset=\"UTF-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>Pantalla de la mesa de ayuda\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css\">\n  \u003cstyle>\n    body { background: #1d3557; color: #fff; min-height: 100vh; }\n    .cifra { font-size: 5rem; font-weight: 800; line-height: 1; }\n    .vencido { color: #ffb4a2; }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003c!-- Otra aplicación, en OTRO origen (Live Server, puerto 5500), que usa la API de SoporteYa con un token -->\n  \u003cmain class=\"container py-5\">\n    \u003ch1 class=\"h3 mb-4\">Mesa de ayuda · pantalla de la oficina de TI\u003c/h1>\n\n    \u003cform id=\"ingreso\" class=\"row g-2 mb-4\" style=\"max-width: 720px\">\n      \u003cdiv class=\"col-md-5\">\u003cinput id=\"email\" type=\"email\" class=\"form-control\" placeholder=\"Correo\" value=\"laura.gomez@soporteya.co\" required>\u003c/div>\n      \u003cdiv class=\"col-md-4\">\u003cinput id=\"password\" type=\"password\" class=\"form-control\" placeholder=\"Contraseña\" required>\u003c/div>\n      \u003cdiv class=\"col-md-3\">\u003cbutton class=\"btn btn-warning w-100\">Conectar\u003c/button>\u003c/div>\n    \u003c/form>\n    \u003cp id=\"mensaje\" class=\"text-warning\" aria-live=\"polite\">\u003c/p>\n\n    \u003csection id=\"panel\" hidden>\n      \u003cdiv class=\"row text-center mb-4\">\n        \u003cdiv class=\"col\">\u003cdiv class=\"cifra\" id=\"abiertos\">0\u003c/div>abiertos\u003c/div>\n        \u003cdiv class=\"col\">\u003cdiv class=\"cifra\" id=\"enCurso\">0\u003c/div>en curso\u003c/div>\n        \u003cdiv class=\"col\">\u003cdiv class=\"cifra vencido\" id=\"vencidos\">0\u003c/div>vencidos\u003c/div>\n      \u003c/div>\n      \u003col id=\"lista\" class=\"list-group list-group-numbered\">\u003c/ol>\n    \u003c/section>\n  \u003c/main>\n  \u003cscript src=\"monitor.js\">\u003c/script>\n\u003c/body>\n\u003c/html>"},{"ruta":"monitor/monitor.js","modo":"nuevo","nota":"El token se guarda en una variable, no en `localStorage`. Si recarga la página, hay que conectarse de nuevo.","lang":"js","codigo":"// Pantalla externa: pide un token y consulta /api/v1/pendientes cada 15 segundos\n'use strict';\n\nconst API = 'http://localhost:8080/api/v1';\nlet token = null;   // en memoria: si se recarga la página, hay que volver a conectarse\n\nconst $ = id => document.getElementById(id);\n\n$('ingreso').addEventListener('submit', async evento => {\n  evento.preventDefault();\n  $('mensaje').textContent = 'Conectando…';\n  try {\n    const respuesta = await fetch(`${API}/token`, {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ email: $('email').value, password: $('password').value }),\n    });\n    const datos = await respuesta.json();\n    if (!respuesta.ok) throw new Error(datos.detail || 'No se pudo conectar');\n    token = datos.token;\n    $('ingreso').hidden = true;\n    $('panel').hidden = false;\n    $('mensaje').textContent = '';\n    actualizar();\n    setInterval(actualizar, 15000);\n  } catch (e) {\n    // Si sale «Failed to fetch», revise CORS: el origen de esta página debe estar en soporteya.cors.origenes\n    $('mensaje').textContent = e.message;\n  }\n});\n\nasync function actualizar() {\n  const respuesta = await fetch(`${API}/pendientes`, { headers: { Authorization: `Bearer ${token}` } });\n  if (respuesta.status === 401) {\n    $('mensaje').textContent = 'El token expiró. Recargue la página y conéctese de nuevo.';\n    return;\n  }\n  const pendientes = await respuesta.json();\n  $('abiertos').textContent = pendientes.filter(t => t.estado === 'ABIERTO').length;\n  $('enCurso').textContent = pendientes.filter(t => t.estado === 'EN_CURSO').length;\n  $('vencidos').textContent = pendientes.filter(t => t.vencido).length;\n  $('lista').replaceChildren(...pendientes.slice(0, 8).map(t => {\n    const li = document.createElement('li');\n    li.className = 'list-group-item d-flex justify-content-between' + (t.vencido ? ' list-group-item-danger' : '');\n    li.textContent = `${t.codigo} · ${t.asunto}`;\n    const quien = document.createElement('span');\n    quien.className = 'small';\n    quien.textContent = t.tecnico ?? 'Sin técnico';\n    li.append(quien);\n    return li;\n  }));\n}"}],"despues":["Conéctese como Laura. Debe ver los contadores grandes y la lista de pendientes. Ahora quite `http://127.0.0.1:5500` de `soporteya.cors.origenes`, reinicie y abra la pantalla desde `127.0.0.1:5500`: la consola del navegador muestra «blocked by CORS policy»."],"listo":"la pantalla externa muestra los pendientes y se actualiza cada 15 segundos."}],"verificar":[["El tablero se actualiza sin recargar","El texto «Actualizado a las…» cambia cada 20 segundos"],["Carlos toma un ticket con el botón","Aviso verde y el ticket pasa a «En curso» sin recargar"],["Diana intenta tomar uno de Impresoras","Aviso rojo con el mensaje del servidor (409)"],["Un asunto con `\u003cimg src=x onerror=alert(1)>`","Se ve como texto, sin alerta"],["`curl` sin token a `/api/v1/pendientes`","401"],["Token de Carlos a `/api/v1/indicadores`","403"],["Pantalla externa desde un origen no permitido","Error de CORS en la consola del navegador"]],"quiz":[{"p":"`fetch('/api/web/tablero')` recibe un 409. ¿Qué pasa?","op":["La promesa falla y salta al `catch`","La promesa se cumple; hay que revisar `respuesta.ok`","El navegador muestra un error y detiene la página","Se reintenta solo"],"ok":1,"exp":"fetch solo falla si no hay conexión. Los códigos 4xx y 5xx llegan como respuestas normales."},{"p":"¿Cómo se muestra de forma segura un asunto escrito por un usuario?","op":["`div.innerHTML = asunto`","`div.textContent = asunto`","`document.write(asunto)`","`div.outerHTML = asunto`"],"ok":1,"exp":"`textContent` lo trata como texto. `innerHTML` lo interpreta como HTML y puede ejecutar scripts (XSS)."},{"p":"¿Qué se puede leer de un JWT sin conocer la clave secreta?","op":["Nada, está cifrado","La cabecera y el contenido; la firma solo impide modificarlo","Solo la fecha de expiración","Solo el algoritmo"],"ok":1,"exp":"Un JWT firmado no está cifrado. Por eso nunca lleva contraseñas ni datos sensibles."},{"p":"¿Por qué la cadena de `/api/v1/**` desactiva CSRF?","op":["Porque es más rápido","Porque no usa cookies de sesión: el token va en una cabecera que el navegador no agrega solo","Porque las API no se pueden atacar","Por un error de configuración"],"ok":1,"exp":"CSRF abusa de las cookies que el navegador envía solo. Un token en `Authorization` lo pone el código a propósito."}],"ahora":["Mi módulo expone al menos un endpoint REST que devuelve DTO en JSON (nunca entidades).","Una vista de mi módulo consume ese endpoint con `fetch` y actualiza el DOM con `textContent`.","Si mi JavaScript hace POST con la sesión, envía el código CSRF desde las etiquetas `\u003cmeta>`.","Los errores del servidor se muestran al usuario con un mensaje claro, no en la consola.","El responsable de seguridad del equipo publicó al menos un endpoint protegido con JWT y lo probó con curl.","Mi PR «feat: JavaScript y API del módulo … (U4)» está fusionado."],"errores":[["403 en los POST que hace JavaScript","Falta la cabecera con el código CSRF","Lea las `\u003cmeta>` `_csrf` y `_csrf_header` y envíelas"],["`fetch` devuelve la página de login en lugar de JSON","La sesión expiró y Spring redirigió al login","Detecte `respuesta.redirected` y avise al usuario"],["`JWT_SECRETO debe tener al menos 32 caracteres`","La clave es corta o no se exportó","`export JWT_SECRETO=$(openssl rand -base64 48)`"],["401 con un token recién emitido","La aplicación se reinició con otra clave","Pida un token nuevo: los anteriores ya no verifican"],["«blocked by CORS policy»","El origen de la página no está en `soporteya.cors.origenes`","Agréguelo exactamente: protocolo, dominio y puerto"],["403 en `/api/v1/indicadores` con token de coordinadora","El token no trae `roles` o el convertidor no tiene el prefijo `ROLE_`","Revise `TokenService` y `rolesDelToken()`"]]},{"id":"u5","num":"5","titulo":"Configuración y contenedores","sesiones":"Sesiones 15 y 16 · 9 y 10 de diciembre","rap":"593107 · Construir la base de datos · 593108 · Codificar el software","resumen":"SoporteYa queda listo para salir de su computador: la configuración se separa del código, la base de datos se construye con migraciones versionadas y toda la aplicación, con su PostgreSQL, se levanta en cualquier máquina con un solo comando.","objetivos":["Separar la configuración por perfiles (`dev`, `prod`) y llevar los secretos a variables de entorno.","Versionar la base de datos con migraciones de Flyway y validar el modelo con `ddl-auto=validate`.","Construir una imagen Docker en dos etapas y explicar imagen, contenedor y capa.","Orquestar la aplicación y PostgreSQL con Docker Compose: red, volumen, salud y variables."],"teoria":[{"t":"La configuración no es código","b":["El mismo código corre en su máquina virtual, en el contenedor del compañero y en la nube. Lo que cambia entre esos lugares —direcciones, claves, nivel de detalle de los registros— es **configuración**, y vive fuera del código.",["tabla",["Archivo","Cuándo se usa","Qué tiene"],[["`application.properties`","Siempre","Lo común, con `${VARIABLE:valor por defecto}`"],["`application-dev.properties`","Perfil `dev` (por defecto)","Plantillas sin caché, SQL visible, registros detallados"],["`application-prod.properties`","Perfil `prod` (`SPRING_PROFILES_ACTIVE=prod`)","Caché, puerto de la nube, cookies seguras, sin detalles de errores"]]],["code","Una propiedad que lee una variable de entorno","spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/soporteya}\n#                     │       └─ valor si la variable no existe\n#                     └─ nombre de la variable de entorno"],["nota","ojo","Los **secretos no tienen valor por defecto** (`${DB_PASSWORD}`, `${JWT_SECRETO}`): si faltan, la aplicación no arranca. Es mejor fallar al inicio que arrancar con una clave conocida por todos."]]},{"t":"Flyway: la base de datos con historia","b":["Hasta ahora, `ddl-auto=update` dejaba que Hibernate adivinara las tablas. En un equipo eso falla: cada base queda distinta, nadie sabe qué cambió y los datos se pierden al renombrar una columna. **Flyway** ejecuta archivos SQL numerados, en orden y una sola vez.",["code","src/main/resources/db/migration","V1__esquema.sql        tablas, llaves e índices\nV2__datos.sql          datos de prueba\nV3__prioridad_sla.sql  el próximo cambio (ejemplo)"],["ul",["Flyway guarda en la tabla `flyway_schema_history` qué versiones ya aplicó y un *checksum* de cada archivo.","**Una migración aplicada no se edita nunca.** Si cambia, el checksum no coincide y la aplicación no arranca. Los cambios van en una versión nueva.","Con `ddl-auto=validate`, Hibernate ya no crea nada: solo **comprueba** que las tablas coincidan con las entidades. Si falta una columna, avisa al arrancar."]],["nota","pista","En un equipo de cuatro, acuerden la numeración antes de escribir: por ejemplo `V10__` a `V19__` para el módulo de Ana, `V20__` a `V29__` para el de Luis. Así dos PR no traen dos `V3`."]]},{"t":"Contenedores","b":[["tabla",["","Máquina virtual","Contenedor"],[["Qué virtualiza","Un computador completo, con su sistema operativo","Solo el proceso y lo que necesita; comparte el núcleo del anfitrión"],["Tamaño y arranque","Gigas, minutos","Megas, segundos"],["Para qué","Un ambiente de trabajo completo (su VM Ubuntu)","Empaquetar y correr una aplicación igual en todas partes"]]],["tabla",["Concepto","Qué es","En SoporteYa"],[["Imagen","Una plantilla de solo lectura, construida por capas","`soporteya-app`: JRE 21 + el `.jar`"],["Contenedor","Una imagen en ejecución","La aplicación corriendo en el puerto 8080"],["Registro","Donde se publican imágenes","Docker Hub, de donde baja `postgres:17`"],["Volumen","Datos que sobreviven al contenedor","Los datos de PostgreSQL"]]]]},{"t":"Un Dockerfile en dos etapas","b":[["ul",["**Etapa 1** (`eclipse-temurin:21-jdk`): tiene Maven y el compilador. Construye el `.jar`.","**Etapa 2** (`eclipse-temurin:21-jre`): solo el entorno de ejecución y el `.jar`. La imagen final no lleva el compilador ni el código fuente: es más pequeña y tiene menos que atacar.","Cada instrucción es una **capa** que Docker guarda en caché. Copiar primero `pom.xml` y descargar dependencias hace que, si solo cambia el código, no se vuelva a descargar internet.","El contenedor corre con un usuario sin privilegios (`USER soporteya`), no como root."]]]},{"t":"Docker Compose: todo con un comando","b":[["svg","compose"],["ul",["Los servicios de un mismo Compose comparten una red: la aplicación llega a la base con el nombre **`db`**, no con `localhost`.","`depends_on` con `condition: service_healthy` espera a que PostgreSQL responda a `pg_isready` antes de arrancar la aplicación.","Las claves se leen de un archivo `.env` que **no** se sube al repositorio; se sube un `.env.example` sin valores reales.","`docker compose down` detiene y borra los contenedores, pero el volumen conserva los datos. `down -v` borra también el volumen."]]]}],"pasos":[{"t":"Flyway en el proyecto","min":5,"cmd":[["pom.xml · dentro de \u003cdependencies>","\u003cdependency>\n    \u003cgroupId>org.springframework.boot\u003c/groupId>\n    \u003cartifactId>spring-boot-starter-flyway\u003c/artifactId>\n\u003c/dependency>\n\u003cdependency>\n    \u003cgroupId>org.flywaydb\u003c/groupId>\n    \u003cartifactId>flyway-database-postgresql\u003c/artifactId>\n\u003c/dependency>"]],"despues":[["nota","ojo","En Spring Boot 4, `flyway-core` solo no basta: sin `spring-boot-starter-flyway`, Spring no ejecuta las migraciones y no da ningún error."]],"listo":"el proyecto compila con Flyway.","archivos":[]},{"t":"Configuración por perfiles","min":20,"archivos":[{"ruta":"src/main/resources/application.properties","modo":"reemplazar","nota":"Fíjese en `ddl-auto=validate` y en que ya no hay ningún secreto escrito.","lang":"props","codigo":"# ============================================================\n# SoporteYa · configuración común a todos los perfiles\n# Los valores secretos o que cambian por ambiente llegan por variables de entorno: ${NOMBRE:valor por defecto}\n# ============================================================\nspring.application.name=soporteya\n\n# Si nadie dice otra cosa, se usa el perfil «dev». En el servidor: SPRING_PROFILES_ACTIVE=prod\nspring.profiles.default=dev\n\n# Base de datos\nspring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/soporteya}\nspring.datasource.username=${DB_USER:adso}\nspring.datasource.password=${DB_PASSWORD}\n\n# Unidad 5 · Flyway crea y actualiza las tablas. Hibernate solo VALIDA que coincidan con las entidades.\nspring.jpa.hibernate.ddl-auto=validate\nspring.jpa.open-in-view=false\nspring.flyway.locations=classpath:db/migration\n\n# Idioma\nspring.web.locale=es_CO\nspring.web.locale-resolver=fixed\n\n# Reglas del negocio\nsoporteya.dominio-correo=${DOMINIO_CORREO:soporteya.co}\nserver.servlet.session.timeout=30m\n\n# Seguridad de la API\nsoporteya.jwt.secreto=${JWT_SECRETO}\nsoporteya.cors.origenes=${CORS_ORIGENES:http://localhost:5500,http://127.0.0.1:5500}"},{"ruta":"src/main/resources/application-dev.properties","modo":"nuevo","nota":"","lang":"props","codigo":"# Perfil de desarrollo: ver el SQL y recargar plantillas sin reiniciar\nspring.thymeleaf.cache=false\nspring.jpa.show-sql=true\nlogging.level.co.edu.sena.adso.soporteya=DEBUG"},{"ruta":"src/main/resources/application-prod.properties","modo":"nuevo","nota":"","lang":"props","codigo":"# Perfil de producción: más rápido, menos ruido en los registros y cookies seguras\nspring.thymeleaf.cache=true\nspring.jpa.show-sql=false\nlogging.level.root=INFO\n\n# La plataforma de la nube dice en qué puerto escuchar (variable PORT)\nserver.port=${PORT:8080}\n# Detrás del proxy HTTPS de la nube: respetar los encabezados X-Forwarded-*\nserver.forward-headers-strategy=framework\nserver.servlet.session.cookie.secure=true\nserver.error.include-stacktrace=never"}],"listo":"los tres archivos están en `resources`."},{"t":"Las migraciones","min":35,"intro":"Borre `config/DatosIniciales.java`: desde ahora los datos de prueba son una migración. Cree la carpeta `db/migration`.","archivos":[{"ruta":"src/main/resources/db/migration/V1__esquema.sql","modo":"nuevo","nota":"Compare cada tabla con su entidad: `nombreCompleto` → `nombre_completo`, `LocalDateTime` → `timestamp(6)`, enum → `varchar(20)` con `check`.","lang":"sql","codigo":"-- SoporteYa · V1 · esquema inicial\n-- Debe coincidir con las entidades: Hibernate lo valida al arrancar (ddl-auto=validate).\n-- Una migración YA aplicada no se edita nunca: los cambios van en una nueva (V3, V4…).\n\ncreate table area (\n    id      bigint generated by default as identity primary key,\n    nombre  varchar(80) not null unique\n);\n\ncreate table categoria (\n    id          bigint generated by default as identity primary key,\n    nombre      varchar(60) not null unique,\n    descripcion varchar(250),\n    activa      boolean not null default true\n);\n\ncreate table usuario (\n    id              bigint generated by default as identity primary key,\n    nombre_completo varchar(120) not null,\n    email           varchar(120) not null unique,\n    password        varchar(100),\n    rol             varchar(20) not null check (rol in ('SOLICITANTE', 'TECNICO', 'COORDINADOR')),\n    activo          boolean not null default true,\n    area_id         bigint references area (id)\n);\n\n-- Muchos a muchos: especialidades de cada técnico\ncreate table usuario_categoria (\n    usuario_id   bigint not null references usuario (id),\n    categoria_id bigint not null references categoria (id),\n    primary key (usuario_id, categoria_id)\n);\n\ncreate table ticket (\n    id               bigint generated by default as identity primary key,\n    asunto           varchar(120) not null,\n    descripcion      varchar(2000) not null,\n    prioridad        varchar(20) not null check (prioridad in ('BAJA', 'MEDIA', 'ALTA', 'CRITICA')),\n    estado           varchar(20) not null check (estado in ('ABIERTO', 'EN_CURSO', 'RESUELTO', 'CERRADO', 'CANCELADO')),\n    fecha_creacion   timestamp(6) not null,\n    fecha_limite     timestamp(6) not null,\n    fecha_resolucion timestamp(6),\n    solicitante_id   bigint not null references usuario (id),\n    tecnico_id       bigint references usuario (id),\n    categoria_id     bigint not null references categoria (id),\n    version          bigint\n);\n\ncreate table comentario (\n    id        bigint generated by default as identity primary key,\n    texto     varchar(2000) not null,\n    fecha     timestamp(6) not null,\n    interno   boolean not null default false,\n    autor_id  bigint not null references usuario (id),\n    ticket_id bigint not null references ticket (id)\n);\n\n-- Índices para las consultas más frecuentes\ncreate index idx_ticket_estado on ticket (estado);\ncreate index idx_ticket_solicitante on ticket (solicitante_id);\ncreate index idx_comentario_ticket on comentario (ticket_id);"},{"ruta":"src/main/resources/db/migration/V2__datos.sql","modo":"nuevo","nota":"Las fechas son relativas a `now()`, así siempre hay tickets recientes y alguno vencido.","lang":"sql","codigo":"-- SoporteYa · V2 · datos de prueba\n-- Contraseña de todos los usuarios: Soporte2026 (guardada como hash BCrypt, nunca en texto plano)\n\ninsert into area (nombre) values ('Contabilidad'), ('Talento Humano'), ('Comercial'), ('Tecnología');\n\ninsert into categoria (nombre, descripcion) values\n    ('Hardware', 'Computadores, pantallas, teclados y otros equipos'),\n    ('Software', 'Programas, instalaciones y actualizaciones'),\n    ('Red e internet', 'Conexión, wifi, cableado y VPN'),\n    ('Impresoras', 'Impresión, escáner y tóner'),\n    ('Accesos y contraseñas', 'Usuarios bloqueados, permisos y correo');\n\ninsert into usuario (nombre_completo, email, password, rol, area_id)\nselect v.nombre, v.email, '$2a$10$xnr1kIDQJXIZEU06EKYrzeE/GT3gRVZP6RQ/L/Je1b9w.9xc0kxtG', v.rol, a.id\nfrom (values\n    ('Laura Gómez',    'laura.gomez@soporteya.co',    'COORDINADOR', 'Tecnología'),\n    ('Carlos Ruiz',    'carlos.ruiz@soporteya.co',    'TECNICO',     'Tecnología'),\n    ('Diana Torres',   'diana.torres@soporteya.co',   'TECNICO',     'Tecnología'),\n    ('Mateo Díaz',     'mateo.diaz@soporteya.co',     'TECNICO',     'Tecnología'),\n    ('Ana Pérez',      'ana.perez@soporteya.co',      'SOLICITANTE', 'Contabilidad'),\n    ('Jorge Herrera',  'jorge.herrera@soporteya.co',  'SOLICITANTE', 'Comercial'),\n    ('Paola Martínez', 'paola.martinez@soporteya.co', 'SOLICITANTE', 'Talento Humano')\n) as v (nombre, email, rol, area)\njoin area a on a.nombre = v.area;\n\ninsert into usuario_categoria (usuario_id, categoria_id)\nselect u.id, c.id\nfrom (values\n    ('carlos.ruiz@soporteya.co', 'Hardware'), ('carlos.ruiz@soporteya.co', 'Impresoras'),\n    ('diana.torres@soporteya.co', 'Software'), ('diana.torres@soporteya.co', 'Accesos y contraseñas'),\n    ('mateo.diaz@soporteya.co', 'Red e internet'), ('mateo.diaz@soporteya.co', 'Hardware')\n) as v (email, categoria)\njoin usuario u on u.email = v.email\njoin categoria c on c.nombre = v.categoria;\n\n-- Tickets en distintos estados. Las horas son relativas al momento en que corre la migración.\n-- La fecha límite = creación + horas de la prioridad (BAJA 72, MEDIA 24, ALTA 8, CRITICA 4).\ninsert into ticket (asunto, descripcion, prioridad, estado, fecha_creacion, fecha_limite, fecha_resolucion,\n                    solicitante_id, tecnico_id, categoria_id, version)\nselect v.asunto, v.descripcion, v.prioridad, v.estado,\n       now() - make_interval(hours => v.hace),\n       now() - make_interval(hours => v.hace) + make_interval(hours => v.limite),\n       case when v.resuelto_en is null then null else now() - make_interval(hours => v.hace) + make_interval(hours => v.resuelto_en) end,\n       s.id, t.id, c.id, 0\nfrom (values\n    (1, 'El computador no enciende', 'Desde esta mañana el equipo de escritorio no prende. La luz del botón no se enciende.',\n        'ALTA', 'ABIERTO', 2, 8, null, 'ana.perez@soporteya.co', null, 'Hardware'),\n    (2, 'No puedo entrar al sistema contable', 'Dice que mi usuario está bloqueado. Tengo que cerrar el mes hoy.',\n        'CRITICA', 'EN_CURSO', 1, 4, null, 'ana.perez@soporteya.co', 'diana.torres@soporteya.co', 'Accesos y contraseñas'),\n    (3, 'La impresora del segundo piso imprime manchado', 'Las hojas salen con rayas negras a un lado.',\n        'BAJA', 'ABIERTO', 30, 72, null, 'paola.martinez@soporteya.co', null, 'Impresoras'),\n    (4, 'Internet lento en la oficina comercial', 'Las videollamadas con clientes se cortan desde ayer.',\n        'MEDIA', 'RESUELTO', 20, 24, 6, 'jorge.herrera@soporteya.co', 'mateo.diaz@soporteya.co', 'Red e internet'),\n    (5, 'Instalar el antivirus en el portátil nuevo', 'Me entregaron un portátil y no tiene antivirus.',\n        'MEDIA', 'CERRADO', 40, 24, 5, 'jorge.herrera@soporteya.co', 'diana.torres@soporteya.co', 'Software'),\n    (6, 'El correo no sincroniza en el celular', 'En el computador llegan los correos, pero en el celular no.',\n        'BAJA', 'ABIERTO', 5, 72, null, 'paola.martinez@soporteya.co', null, 'Software'),\n    (7, 'La pantalla se ve amarilla', 'El monitor muestra todo con un tono amarillo desde que lo movieron.',\n        'MEDIA', 'CERRADO', 50, 24, 30, 'paola.martinez@soporteya.co', 'carlos.ruiz@soporteya.co', 'Hardware'),\n    (8, 'No funciona la VPN desde la casa', 'Al conectarme desde la casa sale error de autenticación.',\n        'ALTA', 'EN_CURSO', 12, 8, null, 'jorge.herrera@soporteya.co', 'mateo.diaz@soporteya.co', 'Red e internet')\n) as v (n, asunto, descripcion, prioridad, estado, hace, limite, resuelto_en, solicitante, tecnico, categoria)\njoin usuario s on s.email = v.solicitante\nleft join usuario t on t.email = v.tecnico\njoin categoria c on c.nombre = v.categoria\norder by v.n;   -- los id quedan en este orden: SY-00001, SY-00002…\n\n-- El historial de cada ticket con técnico (lo que antes hacía Ticket.cambiarEstado)\ninsert into comentario (texto, fecha, interno, autor_id, ticket_id)\nselect 'Estado: ABIERTO → EN_CURSO. Tomado por ' || u.nombre_completo, t.fecha_creacion + interval '20 minutes', false, u.id, t.id\nfrom ticket t join usuario u on u.id = t.tecnico_id;\n\ninsert into comentario (texto, fecha, interno, autor_id, ticket_id)\nselect 'Estado: EN_CURSO → RESUELTO. Solución aplicada y probada con el usuario', t.fecha_resolucion, false, u.id, t.id\nfrom ticket t join usuario u on u.id = t.tecnico_id\nwhere t.fecha_resolucion is not null;\n\ninsert into comentario (texto, fecha, interno, autor_id, ticket_id)\nselect 'Estado: RESUELTO → CERRADO. Confirmado por el solicitante', t.fecha_resolucion + interval '1 hour', false, t.solicitante_id, t.id\nfrom ticket t\nwhere t.estado = 'CERRADO';\n\ninsert into comentario (texto, fecha, interno, autor_id, ticket_id)\nselect 'Revisar si el bloqueo viene del directorio activo o del sistema contable', t.fecha_creacion + interval '30 minutes', true, t.tecnico_id, t.id\nfrom ticket t\nwhere t.asunto = 'No puedo entrar al sistema contable';"}],"cmd":[["Terminal · base nueva y arranque","sudo -u postgres psql -c \"DROP DATABASE IF EXISTS soporteya;\" -c \"CREATE DATABASE soporteya OWNER adso;\"\nexport DB_PASSWORD=su_clave JWT_SECRETO=$(openssl rand -base64 48)\n./mvnw spring-boot:run"],["psql","SELECT version, description, success FROM flyway_schema_history;\nSELECT id, estado, asunto FROM ticket ORDER BY id;"]],"despues":["En la consola busque `Successfully applied 2 migrations`. Detenga la aplicación, arránquela otra vez y busque `Schema \"public\" is up to date`: Flyway no repite lo que ya aplicó.",["nota","pista","Pruebe el validador: cambie en `Ticket.java` el nombre de `asunto` por `titulo` y arranque. Hibernate se niega: *missing column [titulo]*. Devuelva el cambio."]],"listo":"`flyway_schema_history` muestra las versiones 1 y 2 con éxito."},{"t":"Docker en la máquina virtual","min":15,"cmd":[["Terminal · Ubuntu","sudo apt update\nsudo apt install -y docker.io docker-compose-v2\nsudo usermod -aG docker $USER\n# cierre la sesión de Ubuntu y vuelva a entrar para que el grupo aplique\ndocker run --rm hello-world"]],"listo":"`docker run hello-world` muestra «Hello from Docker!».","archivos":[]},{"t":"La imagen de SoporteYa","min":25,"archivos":[{"ruta":"Dockerfile","modo":"nuevo","nota":"","lang":"docker","codigo":"# ---------- Etapa 1: compilar con el JDK y Maven ----------\nFROM eclipse-temurin:21-jdk AS compilacion\nWORKDIR /app\n\n# Primero solo lo necesario para descargar dependencias: Docker reutiliza esta capa\n# mientras el pom.xml no cambie, y las siguientes compilaciones son mucho más rápidas.\nCOPY .mvn/ .mvn/\nCOPY mvnw pom.xml ./\nRUN chmod +x mvnw && ./mvnw -q dependency:go-offline\n\nCOPY src/ src/\nRUN ./mvnw -q -DskipTests package\n\n# ---------- Etapa 2: ejecutar solo con el JRE (imagen más pequeña) ----------\nFROM eclipse-temurin:21-jre\nWORKDIR /app\n\n# No correr como root dentro del contenedor\nRUN useradd --system --uid 1001 soporteya\nCOPY --from=compilacion /app/target/*.jar app.jar\nUSER soporteya\n\nENV SPRING_PROFILES_ACTIVE=prod\nEXPOSE 8080\n# MaxRAMPercentage: la JVM se ajusta a la memoria del contenedor (512 MB en planes gratuitos)\nENTRYPOINT [\"java\", \"-XX:MaxRAMPercentage=75\", \"-jar\", \"app.jar\"]"},{"ruta":".dockerignore","modo":"nuevo","nota":"Lo que no se copia a la imagen: compilados, Git, secretos.","lang":"props","codigo":"target/\n.git/\n.github/\n.idea/\n.vscode/\nmonitor/\n*.md\n.env"}],"cmd":[["Terminal","git update-index --chmod=+x mvnw      # que mvnw sea ejecutable también en Git\ndocker build -t soporteya-app .\ndocker images soporteya-app"]],"despues":["La primera construcción tarda varios minutos (descarga dependencias). Cambie una línea de un controlador y vuelva a construir: las capas de dependencias salen de la caché (`CACHED`) y tarda mucho menos."],"listo":"`docker images` muestra `soporteya-app`."},{"t":"Todo con Docker Compose","min":30,"archivos":[{"ruta":"docker-compose.yml","modo":"nuevo","nota":"","lang":"yaml","codigo":"# Levanta SoporteYa completo con un solo comando:  docker compose up --build\n# Las claves se leen del archivo .env (copie .env.example y cámbielas)\nservices:\n  db:\n    image: postgres:17\n    environment:\n      POSTGRES_DB: soporteya\n      POSTGRES_USER: adso\n      POSTGRES_PASSWORD: ${DB_PASSWORD}\n    volumes:\n      - datos:/var/lib/postgresql/data      # los datos sobreviven a «docker compose down»\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U adso -d soporteya\"]\n      interval: 5s\n      timeout: 3s\n      retries: 10\n\n  app:\n    build: .\n    depends_on:\n      db:\n        condition: service_healthy          # espera a que PostgreSQL acepte conexiones\n    environment:\n      SPRING_PROFILES_ACTIVE: prod\n      DB_URL: jdbc:postgresql://db:5432/soporteya   # «db» es el nombre del servicio, no localhost\n      DB_USER: adso\n      DB_PASSWORD: ${DB_PASSWORD}\n      JWT_SECRETO: ${JWT_SECRETO}\n    ports:\n      - \"8080:8080\"\n\nvolumes:\n  datos:"},{"ruta":".env.example","modo":"nuevo","nota":"","lang":"props","codigo":"# Copie este archivo como .env y cambie los valores. El archivo .env NUNCA se sube al repositorio.\nDB_PASSWORD=cambie-esta-clave\n# Genere uno con: openssl rand -base64 48\nJWT_SECRETO=cambie-este-secreto-por-uno-de-al-menos-32-caracteres"},{"ruta":"README.md","modo":"reemplazar","nota":"","lang":"md","codigo":"# SoporteYa · Mesa de ayuda de TI\n\nProyecto guía del programa ADSO (SENA, ficha 3230489). Los funcionarios de una empresa reportan fallas de tecnología y los técnicos las atienden con tiempos de respuesta medidos.\n\n## Cómo ejecutarlo\n\n### Con Docker (recomendado)\n\n```bash\ncp .env.example .env        # y cambie las claves\ndocker compose up --build\n```\n\n### En la máquina virtual, sin Docker\n\n```bash\nsudo -u postgres psql -c \"CREATE DATABASE soporteya OWNER adso;\"\nexport DB_PASSWORD=su_clave\nexport JWT_SECRETO=$(openssl rand -base64 48)\n./mvnw spring-boot:run\n```\n\nAbra http://localhost:8080 · usuarios de prueba con la contraseña `Soporte2026`:\n\n| Correo | Rol |\n|---|---|\n| laura.gomez@soporteya.co | Coordinadora |\n| carlos.ruiz@soporteya.co | Técnico (Hardware, Impresoras) |\n| diana.torres@soporteya.co | Técnica (Software, Accesos) |\n| mateo.diaz@soporteya.co | Técnico (Red, Hardware) |\n| ana.perez@soporteya.co | Solicitante |\n\n## Equipo\n\n| Integrante | Rol en Scrum | Módulo |\n|---|---|---|\n| (nombre) | Dueño del producto | Tickets |\n| (nombre) | Scrum Master | Tablero técnico |\n| (nombre) | Desarrollo | Administración |"}],"cmd":[["Terminal","cp .env.example .env          # y cambie las dos claves\ndocker compose up --build -d\ndocker compose ps\ndocker compose logs -f app    # Ctrl+C para dejar de mirar"],["Al terminar","docker compose down           # los datos quedan en el volumen\n# docker compose down -v      # también borra los datos"]],"despues":["Detenga antes la aplicación de la terminal: las dos usan el puerto 8080. Abra `http://localhost:8080` e ingrese como Laura: es la misma aplicación, ahora con el perfil `prod`, corriendo en contenedores."],"listo":"`docker compose ps` muestra `db` *healthy* y `app` en ejecución, y la aplicación responde."}],"verificar":[["La aplicación no arranca sin `DB_PASSWORD`","Error al inicio, no una clave por defecto"],["Flyway aplicó V1 y V2","`flyway_schema_history` con `success = true`"],["Hibernate valida el esquema","Un atributo sin columna impide el arranque"],["La imagen usa el JRE y un usuario sin privilegios","`docker run --rm soporteya-app whoami` → soporteya"],["`docker compose up` levanta todo","La app espera a que `db` esté *healthy*"],["Los datos sobreviven a `down`","Cree un ticket, `down`, `up`: el ticket sigue ahí"],["`.env` no está en Git","`git status` no lo muestra"]],"quiz":[{"p":"Una migración `V2__datos.sql` ya se aplicó y usted encuentra un error en un nombre. ¿Qué hace?","op":["Corrige V2 y reinicia","Crea `V3__corrige_nombre.sql` con un UPDATE","Borra la tabla flyway_schema_history","Cambia a ddl-auto=update"],"ok":1,"exp":"Las migraciones aplicadas no se editan: su checksum cambiaría y Flyway se niega a arrancar. Los cambios siempre van en una versión nueva."},{"p":"Dentro de Docker Compose, ¿qué dirección usa la aplicación para llegar a PostgreSQL?","op":["`localhost:5432`","`db:5432`, el nombre del servicio","La IP de la máquina virtual","`127.0.0.1:5432`"],"ok":1,"exp":"Cada contenedor tiene su propio localhost. Los servicios se encuentran por su nombre en la red interna del Compose."},{"p":"¿Por qué el Dockerfile tiene dos etapas?","op":["Porque Docker lo exige","Para que la imagen final lleve solo el JRE y el .jar, sin compilador ni código fuente","Para correr dos aplicaciones","Para usar dos bases de datos"],"ok":1,"exp":"La primera etapa compila; la segunda solo ejecuta. La imagen final es más pequeña y más segura."},{"p":"¿Qué hace `${JWT_SECRETO}` sin valor por defecto?","op":["Usa una cadena vacía","Si la variable no existe, la aplicación no arranca","Genera un secreto al azar","Lo lee del README"],"ok":1,"exp":"Es a propósito: un secreto que falta debe detener el arranque, no reemplazarse por un valor conocido."}],"ahora":["El equipo acordó la numeración de migraciones por módulo y la escribió en el README.","Las tablas de mi módulo están en mi propia migración y la aplicación arranca con `ddl-auto=validate`.","Ninguna clave del proyecto está escrita en el repositorio: todas llegan por variables de entorno.","El proyecto tiene perfiles `dev` y `prod`, `Dockerfile`, `.dockerignore`, `docker-compose.yml` y `.env.example`.","El proyecto completo del equipo levanta con `docker compose up --build` y mi módulo funciona ahí.","Mi PR «feat: migraciones del módulo … (U5)» está fusionado."],"errores":[["`Schema-validation: missing table [ticket]`","Flyway no corrió: falta `spring-boot-starter-flyway`","Agregue el starter (Spring Boot 4 lo exige)"],["`Migration checksum mismatch for migration version 2`","Se editó una migración ya aplicada","Devuelva el archivo a como estaba y haga el cambio en una V nueva (en desarrollo puede recrear la base)"],["`Found more than one migration with version 3`","Dos integrantes crearon `V3__…`","Renumere la suya según el acuerdo del equipo"],["`./mvnw: Permission denied` en `docker build`","`mvnw` no es ejecutable en Git","`git update-index --chmod=+x mvnw` y commit"],["`Connection to localhost:5432 refused` dentro del contenedor","La URL apunta a localhost","`DB_URL=jdbc:postgresql://db:5432/soporteya`"],["`Bind for 0.0.0.0:8080 failed: port is already allocated`","La aplicación sigue corriendo en la terminal","Deténgala o cambie el puerto a `\"8081:8080\"`"],["`permission denied while trying to connect to the Docker daemon`","Su usuario no está en el grupo docker","`sudo usermod -aG docker $USER` y vuelva a iniciar sesión"]]},{"id":"u6","num":"6","titulo":"Despliegue en la nube","sesiones":"Sesión 17 · 11 de diciembre","rap":"593108 · Codificar el software de acuerdo con el diseño establecido","resumen":"SoporteYa sale a internet: una URL pública con HTTPS que se abre desde el celular, una base de datos administrada por la plataforma y los mismos secretos en variables de entorno. Y antes de abrir la puerta, una revisión de lo que no puede quedar expuesto.","objetivos":["Distinguir los entornos de desarrollo, pruebas y producción, y los tipos de servicio en la nube.","Publicar una aplicación desde su Dockerfile en una plataforma como servicio con PostgreSQL administrado.","Configurar variables, revisar registros y entender HTTPS detrás de un proxy.","Revisar la seguridad antes de publicar: secretos, usuarios de prueba y mensajes de error."],"teoria":[{"t":"Entornos","b":[["tabla",["Entorno","Para qué","En SoporteYa"],[["Desarrollo","Programar y probar rápido","Su máquina virtual, perfil `dev`"],["Pruebas","Probar como si fuera real, sin usuarios reales","Docker Compose con perfil `prod`"],["Producción","Lo que usan las personas","La URL pública en la nube, perfil `prod`"]]],"Gracias a la Unidad 5, el **mismo** código y la **misma** imagen pasan por los tres. Solo cambian las variables de entorno."]},{"t":"Formas de usar la nube","b":[["tabla",["Modelo","Usted administra","La plataforma administra","Ejemplo"],[["IaaS (infraestructura)","Sistema operativo, Java, base de datos, copias de seguridad","El hardware y la red","Una máquina virtual en Azure o AWS"],["PaaS (plataforma)","Su código o su contenedor y sus variables","Servidores, HTTPS, despliegue, registros","Render, Railway, Azure App Service"],["Base de datos administrada","Sus tablas y datos","Instalación, actualizaciones, conexión segura","Render Postgres"]]],"Usamos **Render** porque despliega directo desde el `Dockerfile` del repositorio y tiene un plan gratuito para aplicaciones web y PostgreSQL.",["nota","ojo","**Límites del plan gratuito de Render** (verifíquelos en render.com/docs/free, cambian con el tiempo): el servicio web se duerme tras 15 minutos sin visitas y tarda cerca de un minuto en despertar; hay 750 horas al mes; la base gratuita tiene 1 GB y **vence 30 días después de creada**. Alcanza para la sustentación, no para un negocio real."]]},{"t":"HTTPS y el proxy","b":["En la nube, el navegador habla HTTPS con el **proxy** de la plataforma, y el proxy le pasa la petición a su contenedor por HTTP interno. Sin ajustes, Spring cree que la petición llegó por HTTP y arma mal las redirecciones (por ejemplo, después del login).",["code","application-prod.properties","server.port=${PORT:8080}                       # el puerto que asigna la plataforma\nserver.forward-headers-strategy=framework      # respetar X-Forwarded-Proto: https\nserver.servlet.session.cookie.secure=true      # la cookie de sesión solo viaja por HTTPS"]]},{"t":"Antes de abrir la puerta","b":[["tabla",["Revise","Por qué"],[["Ningún secreto en el repositorio ni en el historial de Git","Un repositorio público se lee completo, incluidos los commits viejos"],["`JWT_SECRETO` nuevo y distinto del de desarrollo","Con la clave de desarrollo, cualquiera de su equipo podría fabricar tokens válidos"],["Los usuarios de prueba no tienen `Soporte2026`","La V2 creó usuarios con una contraseña que está en esta guía: cámbiela o desactívelos"],["`server.error.include-stacktrace=never`","Los detalles internos de un error ayudan a quien ataca"],["Perfil `prod` activo","Sin él, la aplicación muestra el SQL en los registros y no cachea plantillas"]]]]}],"pasos":[{"t":"El repositorio listo para la nube","min":10,"intro":"Render construye desde la rama `main` del repositorio en GitHub. Verifique que tenga el `Dockerfile` de la Unidad 5, que `mvnw` sea ejecutable y que no haya ningún `.env` subido.","cmd":[["Terminal","git ls-files | grep -E \"^\\.env$\" || echo \"bien: .env no está en Git\"\ngit ls-files -s mvnw            # debe empezar por 100755\ndocker build -t soporteya-app .  # si construye aquí, construye en Render"]],"listo":"la imagen construye en su máquina y `main` tiene todo lo de la Unidad 5.","archivos":[]},{"t":"La base de datos en Render","min":10,"intro":"Cree una cuenta en render.com (puede entrar con GitHub). **New → Postgres**: nombre `soporteya-db`, base `soporteya`, usuario `adso`, la región más cercana y plan **Free**.","despues":["Cuando esté disponible, abra **Connections** y copie el **Internal Database URL**. Tiene esta forma, y de ella sacará los datos para Spring:",["code","De la URL de Render a la de Spring","postgresql://adso:CLAVE@dpg-xxxx-a/soporteya          ← lo que entrega Render\n           └──┘ └───┘ └────────┘ └───────┘\n          usuario clave   host      base\n\njdbc:postgresql://dpg-xxxx-a:5432/soporteya            ← DB_URL para Spring"]],"listo":"tiene a mano host, base, usuario y clave de la base de Render.","archivos":[]},{"t":"El servicio web","min":15,"intro":"**New → Web Service**, conecte el repositorio de GitHub. Render detecta el `Dockerfile`; elija la misma región de la base y el plan **Free**. Antes de crear, agregue las variables de entorno:","antes":[],"despues":[["tabla",["Variable","Valor"],[["`SPRING_PROFILES_ACTIVE`","`prod`"],["`DB_URL`","`jdbc:postgresql://HOST:5432/soporteya` (el host interno)"],["`DB_USER`","`adso`"],["`DB_PASSWORD`","la clave de la base de Render"],["`JWT_SECRETO`","uno nuevo: `openssl rand -base64 48`"],["`CORS_ORIGENES`","la URL de la pantalla de TI, si la publica (opcional)"]]],["nota","pista","Render asigna la variable `PORT` solo. `server.port=${PORT:8080}` la usa."]],"listo":"el servicio está creado y empezó su primer despliegue.","archivos":[]},{"t":"El primer despliegue y los registros","min":15,"intro":"En la pestaña **Logs** se ve todo: la construcción de la imagen, el arranque de Spring y las migraciones de Flyway sobre la base nueva.","despues":[["code","Lo que debe ver en los registros (resumido)","==> Building with Dockerfile\n…\nThe following 1 profile is active: \"prod\"\nMigrating schema \"public\" to version \"1 - esquema\"\nMigrating schema \"public\" to version \"2 - datos\"\nSuccessfully applied 2 migrations\nTomcat started on port 10000 (http)\n==> Your service is live 🎉"],"Abra la URL `https://soporteya-xxxx.onrender.com`. Fíjese en el candado: HTTPS sin configurar certificados."],"listo":"la URL pública muestra la portada de SoporteYa con HTTPS.","archivos":[]},{"t":"Asegurar los usuarios de prueba","min":10,"intro":"Ingrese como `laura.gomez@soporteya.co` con `Soporte2026` y **de inmediato** cambie su contraseña en **Usuarios → Editar**. Luego desactive a los demás usuarios de prueba o cámbieles la contraseña.","despues":[["nota","ojo","En un sistema real, los datos de prueba no van a producción. Una alternativa profesional es poner `V2__datos.sql` en otra carpeta (`db/datos-prueba`) que solo el perfil `dev` agrega a `spring.flyway.locations`, y crear en producción solo el primer coordinador."]],"listo":"ninguna cuenta de la URL pública entra con `Soporte2026`.","archivos":[]},{"t":"Probar desde el celular y actualizar","min":15,"intro":"Abra la URL en su celular, con datos móviles: regístrese con un correo `@soporteya.co`, cree un ticket y véalo desde el computador como técnico.","cmd":[["Terminal · cada push a main vuelve a desplegar","git switch -c fix/mensaje-portada\n# … un cambio pequeño en index.html …\ngit commit -am \"fix: texto de la portada\"\ngit push -u origin fix/mensaje-portada\n# PR, revisión y merge: Render despliega solo"]],"despues":["Si usó **Ingresar con Google** (Unidad 3), agregue en Google Cloud el URI de redirección de producción: `https://soporteya-xxxx.onrender.com/login/oauth2/code/google`, y las variables `GOOGLE_CLIENT_ID` y `GOOGLE_CLIENT_SECRET` en Render."],"listo":"el celular abre la URL, y un cambio fusionado en `main` aparece publicado sin hacer nada más.","archivos":[]}],"verificar":[["La URL abre con HTTPS desde el celular","Candado en la barra de direcciones"],["Los registros muestran el perfil `prod` y las dos migraciones","Pestaña Logs de Render"],["Después del login, la dirección sigue en `https://`","Si salta a `http://`, falta `forward-headers-strategy`"],["Ningún usuario entra con `Soporte2026`","Pruebe con Laura y con Ana"],["Un error no muestra detalles internos","Abra `/tickets/999999`: página de error sin traza"],["Un merge a `main` se publica solo","Nuevo despliegue en la pestaña Events"]],"quiz":[{"p":"¿Qué administra usted en una PaaS como Render?","op":["El hardware y el sistema operativo","Su contenedor o su código y sus variables de entorno","Los certificados HTTPS","Las copias de seguridad del servidor"],"ok":1,"exp":"La plataforma se encarga de servidores, red, HTTPS y despliegue; usted entrega la aplicación y su configuración."},{"p":"Después de iniciar sesión en la nube, la página salta de `https://` a `http://`. ¿Qué falta?","op":["Un certificado nuevo","`server.forward-headers-strategy=framework`, para respetar la cabecera del p ,"Lo que diga el líder del equipo","Capturas de pantalla"],"ok":1,"exp":"El historial de Git y los PR muestran quién escribió qué, cuándo y quién lo revisó."}],"ahora":["Todos los módulos están integrados en `main` y el proyecto arranca con `docker compose up`.","La URL pública funciona y la probé desde el celular.","Preparé una explicación de mi módulo para cada pregunta de la tabla.","Mi bitácora tiene los enlaces a mis PR de las Unidades 0 a 6.","Participé en la retrospectiva final del equipo."],"errores":[]}],"inicio":{"roles":[["Solicitante","Cualquier funcionario de la empresa. Reporta fallas, sigue sus tickets, comenta, confirma la solución o reabre.","Ana Pérez · Contabilidad"],["Técnico","Toma los tickets abiertos de sus especialidades, los resuelve y deja notas internas.","Carlos Ruiz · Hardware e Impresoras"],["Coordinador","Administra categorías y usuarios, ve el tablero completo y mide el cumplimiento de tiempos.","Laura Gómez · Tecnología"]],"momentos":[["Teoría","Lo que necesita saber, con ejemplos de SoporteYa."],["Construyamos","Los pasos con el código completo de cada archivo. SoporteYa crece con el tema de la unidad."],["Verifique","Cómo saber que quedó bien, caso por caso."],["Autoevaluación","Cuatro preguntas para comprobar que entendió."],["Ahora usted","Lo mismo, aplicado a su módulo del proyecto formativo."]],"usuarios":[["laura.gomez@soporteya.co","Coordinadora","—"],["carlos.ruiz@soporteya.co","Técnico","Hardware, Impresoras"],["diana.torres@soporteya.co","Técnica","Software, Accesos y contraseñas"],["mateo.diaz@soporteya.co","Técnico","Red e internet, Hardware"],["ana.perez@soporteya.co","Solicitante","Contabilidad"],["jorge.herrera@soporteya.co","Solicitante","Comercial"],["paola.martinez@soporteya.co","Solicitante","Talento Humano"]],"requisitos":["Máquina virtual Ubuntu con JDK 21, Maven Wrapper y VS Code (Extension Pack for Java)","PostgreSQL con el usuario `adso`","Git y una cuenta de GitHub","Desde la Unidad 5: Docker. En la Unidad 6: una cuenta en Render"]}};
const CAPS = D.capitulos;
const KEY = 'soporteya-guia-v1';
let S = { pasos: {}, ahora: {}, quiz: {} };
try { const g = localStorage.getItem(KEY); if (g) S = Object.assign(S, JSON.parse(g)); } catch (e) {}
const guardar = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const $ = (s, el = document) => el.querySelector(s);

// ---------- texto ----------
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function md(t) {
  return esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(«])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
}

// ---------- resaltado de código ----------
const PALABRAS = {
  java: 'abstract boolean break case catch class continue default do double else enum extends final finally float for if implements import instanceof int interface long new null package private protected public record return static super switch this throw throws try var void while true false',
  js: 'async await break case catch class const continue default else export false for function if import let new null return switch this throw true try typeof undefined var while of in',
  sql: 'select from where join left on and or as insert into values create table primary key references not null unique default check in index group by order case when then else end is generated identity bigint varchar boolean timestamp integer text update set delete drop database owner if exists interval with',
};
const SETS = Object.fromEntries(Object.entries(PALABRAS).map(([k, v]) => [k, new Set(v.split(' '))]));
const REGLAS = {
  java: /(?<c>\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(?<s>"""[\s\S]*?"""|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(?<a>@[A-Za-z][\w.]*)|(?<w>\b[A-Za-z_$][\w$]*\b)|(?<n>\b\d+(?:\.\d+)?\b)/g,
  js: /(?<c>\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(?<s>"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|(?<w>\b[A-Za-z_$][\w$]*\b)|(?<n>\b\d+(?:\.\d+)?\b)/g,
  html: /(?<c><!--[\s\S]*?-->)|(?<t><\/?[A-Za-z][\w:-]*|\/?>)|(?<at>[\w:-]+(?==))|(?<s>"[^"]*")/g,
  sql: /(?<c>--[^\n]*)|(?<s>'(?:[^']|'')*')|(?<w>\b[A-Za-z_]\w*\b)|(?<n>\b\d+\b)/g,
  props: /(?<c>^[ \t]*#[^\n]*)|(?<v>\$\{[^}\n]*\})|(?<k>^[\w.\-]+(?==))/gm,
  yaml: /(?<c>#[^\n]*)|(?<v>\$\{[^}\n]*\})|(?<s>"[^"\n]*")|(?<k>^[ \t-]*[\w.\-]+(?=:))/gm,
  docker: /(?<c>^#[^\n]*)|(?<k>^(?:FROM|WORKDIR|COPY|RUN|USER|ENV|EXPOSE|ENTRYPOINT)\b|\bAS\b)|(?<s>"[^"\n]*")/gm,
  css: /(?<c>\/\*[\s\S]*?\*\/)|(?<v>var\(--[\w-]+\)|--[\w-]+)|(?<k>[\w-]+(?=\s*:))/g,
  bash: /(?<c>(?:^|\s)#[^\n]*)|(?<s>"[^"\n]*"|'[^'\n]*')|(?<v>\$\(?[\w]+\)?)|(?<k>^(?:sudo|git|docker|curl|export|cp|echo|psql|TOKEN)\b)/gm,
};
function resaltar(codigo, lang) {
  const re = REGLAS[lang];
  if (!re) return esc(codigo);
  let html = '', ultimo = 0;
  re.lastIndex = 0;
  for (const m of codigo.matchAll(re)) {
    html += esc(codigo.slice(ultimo, m.index));
    const g = m.groups, txt = esc(m[0]);
    let clase = null;
    if (g.c) clase = 'tk-c';
    else if (g.s) clase = 'tk-s';
    else if (g.a) clase = 'tk-a';
    else if (g.v) clase = 'tk-v';
    else if (g.n) clase = 'tk-n';
    else if (g.k) clase = 'tk-k';
    else if (g.t) clase = 'tk-t';
    else if (g.at) clase = /^(th|sec):/.test(m[0]) ? 'tk-th' : 'tk-a';
    else if (g.w) {
      const set = SETS[lang];
      if (set && set.has(lang === 'sql' ? m[0].toLowerCase() : m[0])) clase = 'tk-k';
      else if (lang !== 'sql' && /^[A-Z]/.test(m[0])) clase = 'tk-t';
    }
    html += clase ? `<span class="${clase}">${txt}</span>` : txt;
    ultimo = m.index + m[0].length;
  }
  return html + esc(codigo.slice(ultimo));
}
function adivinar(etiqueta, texto) {
  const e = etiqueta.toLowerCase();
  if (/\.java\b/.test(e)) return 'java';
  if (/\.html|pom\.xml|<dependency>/.test(e) || /^\s*</.test(texto)) return 'html';
  if (/\.js\b|soporteya\.js|monitor/.test(e)) return 'js';
  if (/psql|\.sql/.test(e) || /^\s*(select|insert|create)\b/i.test(texto)) return 'sql';
  if (/properties/.test(e)) return 'props';
  if (/terminal|curl/.test(e)) return 'bash';
  if (/\.yml/.test(e)) return 'yaml';
  return 'txt';
}

const COPIAS = {};
let idCopia = 0;
function bloqueCodigo(etiqueta, texto, lang) {
  const id = 'k' + (idCopia++);
  COPIAS[id] = texto;
  return `<div class="codigo"><div class="codigo-cab"><span>${esc(etiqueta)}</span><button type="button" class="copiar" data-copiar="${id}">Copiar</button></div><pre id="${id}">${resaltar(texto, lang || adivinar(etiqueta, texto))}</pre></div>`;
}
function copiar(boton) {
  const texto = COPIAS[boton.dataset.copiar];
  const antes = boton.textContent;
  const ok = () => { boton.textContent = 'Copiado'; setTimeout(() => (boton.textContent = antes), 1500); };
  const seleccionar = () => {
    const pre = document.getElementById(boton.dataset.copiar);
    const r = document.createRange(); r.selectNodeContents(pre);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    boton.textContent = 'Seleccionado: cópielo';
  };
  try { navigator.clipboard.writeText(texto).then(ok, seleccionar); } catch (e) { seleccionar(); }
}

const ETIQUETAS_NOTA = { clave: 'Clave', ojo: 'Cuidado', pista: 'Pista' };
function bloques(lista) {
  return (lista || []).map(b => {
    if (typeof b === 'string') return `<p>${md(b)}</p>`;
    const [tipo, ...r] = b;
    if (tipo === 'ul') return `<ul>${r[0].map(x => `<li>${md(x)}</li>`).join('')}</ul>`;
    if (tipo === 'pasos') return `<ol>${r[0].map(x => `<li>${md(x)}</li>`).join('')}</ol>`;
    if (tipo === 'tabla') return `<div class="tbl"><table><thead><tr>${r[0].map(c => `<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${r[1].map(f => `<tr>${f.map(c => `<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    if (tipo === 'code') return bloqueCodigo(r[0], r[1]);
    if (tipo === 'nota') return `<div class="nota ${r[0]}"><span class="et">${ETIQUETAS_NOTA[r[0]]}</span>${md(r[1])}</div>`;
    if (tipo === 'svg') return SVG[r[0]]();
    return '';
  }).join('');
}
const MODOS = { nuevo: 'Nuevo', reemplazar: 'Reemplace' };
function archivo(a) {
  const lineas = a.codigo.split('\n').length;

  const ids = [...cap.pasos.map((_, i) => `${cap.id}-p${i}`), ...cap.ahora.map((_, i) => `${cap.id}-a${i}`)];
  const hechos = ids.filter(id => S.pasos[id] || S.ahora[id]).length;
  return { hechos, total: ids.length, pct: ids.length ? Math.round(hechos * 100 / ids.length) : 0 };
}

  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.copiar) { copiar(b); return; }
  if (b.dataset.ir) { document.getElementById('s-' + b.dataset.ir).scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); return; }
  if (b.id === 'abrirIndice') { $('#indice').classList.contains('abierto') ? cerrarIndice() : abrirIndice(); return; }
  if (b.id === 'reintentar') { const id = location.hash.slice(1); delete S.quiz[id]; guardar(); const y = scrollY; ir(); scrollTo(0, y); return; }
  if (b.id === 'borrarAvance') { b.outerHTML = '<span>¿Seguro? <button type="button" class="reintentar" id="borrarSi">Sí, borrar</button> <button type="button" class="reintentar" id="borrarNo">No</button></span>'; return; }
  if (b.id === 'borrarSi') { S = { pasos: {}, ahora: {}, quiz: {} }; try { localStorage.removeItem(KEY); } catch (err) {} ir(); return; }
  if (b.id === 'borrarNo') { pintarIndice(); return; }
  if (b.dataset.op !== undefined) {
    const id = location.hash.slice(1);
    const qi = +b.closest('.pregunta').dataset.q;
    S.quiz[id] = S.quiz[id] || {};

});

  if (t.dataset.paso) {
    S.pasos[t.dataset.paso] = t.checked; guardar();
    const d = t.closest('.paso'); d.classList.toggle('hecho', t.checked);
    d.querySelector('.num').textContent = t.checked ? '✓' : [...d.parentNode.children].indexOf(d) + 1;
    pintarAvance();
  }
  if (t.dataset.ahora) { S.ahora[t.dataset.ahora] = t.checked; guardar(); pintarAvance(); }
});
addEventListener('hashchange', () => { ir(); scrollTo(0, 0); });
ir();
</script>
